{ id: "cca1-039", n: 39, set: 1, scenario: 2, domain: 2, task: "2.4",
  topic: "MCP Server Integration", difficulty: "hard", type: "mc", ans: [0],
  q: `Your team wants to add a GitHub MCP server for PR lookups and CI status checks. Each of the six developers has their own GitHub personal access token. You want consistent tooling across the team without committing credentials to version control. What's the most effective configuration approach?`,
  opts: [
    `Add the server to a project-scoped .mcp.json with environment variable expansion (\${GITHUB_TOKEN}) for authentication, and document the required environment variable in your project README.`,
    `Have each developer configure the server in user scope with claude mcp add --scope user.`,
    `Configure the server in project scope with a placeholder token value, then instruct developers to override it in their local scope configuration.`,
    `Create an MCP server wrapper that reads tokens from a .env file and proxies requests to the GitHub API, then add this wrapper to your project .mcp.json.`,
  ],
  q_vi: `Nhóm bạn muốn thêm một GitHub MCP server để tra cứu PR và kiểm tra trạng thái CI. Mỗi người trong sáu developer có personal access token GitHub riêng. Bạn muốn tooling nhất quán trong cả nhóm mà không commit credential vào version control. Cách cấu hình nào hiệu quả nhất?`,
  opts_vi: [
    `Thêm server vào .mcp.json phạm vi project với mở rộng biến môi trường (\${GITHUB_TOKEN}) để xác thực, và ghi rõ biến môi trường cần thiết trong README của project.`,
    `Để mỗi developer tự cấu hình server ở user scope bằng claude mcp add --scope user.`,
    `Cấu hình server ở project scope với một giá trị token placeholder, sau đó hướng dẫn developer override nó trong cấu hình local scope của họ.`,
    `Tạo một MCP server wrapper đọc token từ file .env và proxy request tới GitHub API, sau đó thêm wrapper này vào .mcp.json của project.`,
  ],
  why: [
    `Dùng .mcp.json phạm vi project với mở rộng biến môi trường (\${GITHUB_TOKEN}) là cách idiomatic — cung cấp một nguồn chân lý duy nhất được version-control, đồng thời cho phép mỗi developer cấp credential riêng qua biến môi trường. Ghi rõ biến trong README giúp onboarding mà không bao giờ commit secret.`,
    `Để mỗi developer tự cấu hình ở user scope thất bại yêu cầu nhất quán, vì sáu cấu hình riêng chắc chắn sẽ phân kỳ theo thời gian mà không có nguồn chân lý chung. Tăng ma sát onboarding.`,
    `Commit giá trị token placeholder vào cấu hình project-scoped là anti-pattern: có thể bị nhầm là credential thật, và dựa vào cơ chế override mong manh mà developer có thể quên hoặc cấu hình sai.`,
    `Xây wrapper tùy biến để proxy GitHub API và đọc token từ .env là over-engineered, vì mở rộng biến môi trường gốc trong .mcp.json đã giải quyết sạch sẽ. Thêm gánh nặng bảo trì và điểm lỗi tiềm ẩn.`,
  ],
  concept: `.mcp.json phạm vi project kèm mở rộng biến môi trường (\${GITHUB_TOKEN}) là mẫu chuẩn (idiomatic) để chia sẻ cấu hình MCP — một nguồn chân lý duy nhất cho nhóm, đồng thời mỗi developer cấp credential riêng qua biến môi trường.`,
  takeaway: `Chia sẻ MCP cho nhóm mà không lộ credential → .mcp.json project-scoped + mở rộng biến môi trường \${VAR}, ghi biến vào README.`,
  terms: [
    [".mcp.json", "file cấu hình MCP server"],
    ["environment variable expansion", "mở rộng biến môi trường ${VAR}"],
    ["project scope", "phạm vi project, chia sẻ qua repo"],
    ["anti-pattern", "mẫu thiết kế nên tránh"],
  ] },

{ id: "cca1-040", n: 40, set: 1, scenario: 2, domain: 3, task: "3.4",
  topic: "Plan Mode vs Direct Execution", difficulty: "easy", type: "mc", ans: [0],
  q: `You need to add Slack as a notification channel. The codebase has clear patterns for email, SMS, and push channels. However, the Slack API offers fundamentally different approaches—incoming webhooks (simple, one-way), bot tokens (delivery confirmation), or Slack Apps (bidirectional, requires workspace approval). Your ticket says "add Slack support" without specifying which method or whether advanced features will be needed. How should you approach this task?`,
  opts: [
    `Enter plan mode to explore the integration options and their architectural implications, then present a recommendation before implementing.`,
    `Start direct execution using incoming webhooks to match the existing one-way notification pattern.`,
    `Start direct execution using the bot token approach to enable delivery confirmation capabilities.`,
    `Start direct execution to scaffold the Slack channel class following existing patterns, deferring the integration method decision until later.`,
  ],
  q_vi: `Bạn cần thêm Slack như một kênh thông báo. Codebase có pattern rõ ràng cho kênh email, SMS và push. Tuy nhiên, Slack API cung cấp các cách tiếp cận khác nhau về cơ bản — incoming webhook (đơn giản, một chiều), bot token (xác nhận gửi), hoặc Slack App (hai chiều, cần workspace phê duyệt). Ticket của bạn chỉ ghi "add Slack support" mà không chỉ rõ phương thức nào hoặc liệu có cần tính năng nâng cao hay không. Bạn nên tiếp cận tác vụ này như thế nào?`,
  opts_vi: [
    `Vào plan mode để khám phá các lựa chọn tích hợp và hệ quả kiến trúc của chúng, sau đó đưa ra khuyến nghị trước khi triển khai.`,
    `Bắt đầu direct execution dùng incoming webhook để khớp với pattern thông báo một chiều hiện có.`,
    `Bắt đầu direct execution dùng cách tiếp cận bot token để bật khả năng xác nhận gửi.`,
    `Bắt đầu direct execution để scaffold class Slack channel theo pattern hiện có, hoãn quyết định về phương thức tích hợp đến sau.`,
  ],
  why: [
    `Tích hợp Slack có nhiều cách hợp lệ với hệ quả kiến trúc khác nhau đáng kể, và yêu cầu thì mơ hồ. Dùng plan mode để khám phá trade-off giữa webhook, bot token và Slack App cho phép đưa ra khuyến nghị có cơ sở và thống nhất với nhóm trước khi cam kết.`,
    `Incoming webhook khớp pattern một chiều hiện có, nhưng cam kết sớm một phương thức mà chưa đánh giá liệu tính năng nâng cao như delivery tracking có cần. Yêu cầu mơ hồ đòi hỏi khám phá mọi lựa chọn trước.`,
    `Bot token cho phép xác nhận gửi, nhưng nhảy thẳng vào giả định delivery tracking là yêu cầu trong khi ticket không nói rõ. Chọn phương thức phức tạp hơn mà không đánh giá trade-off có nguy cơ over-engineering.`,
    `Giả định sai rằng có thể scaffold có ý nghĩa trước khi chọn phương thức, trong khi luồng xác thực, xử lý phản hồi và pattern lỗi khác nhau đáng kể. Hoãn quyết định sẽ dẫn đến làm lại.`,
  ],
  concept: `Khi có nhiều cách triển khai hợp lệ với hệ quả kiến trúc khác nhau VÀ yêu cầu mơ hồ, plan mode là phù hợp để khám phá trade-off và thống nhất với nhóm trước khi triển khai.`,
  takeaway: `Nhiều phương thức hợp lệ + yêu cầu mơ hồ + hệ quả kiến trúc khác nhau → plan mode để đánh giá trade-off trước, đừng cam kết sớm.`,
  terms: [
    ["incoming webhook", "gửi thông báo một chiều, đơn giản"],
    ["bot token", "token cho phép xác nhận gửi & điều khiển lập trình"],
    ["Slack App", "tích hợp hai chiều, cần workspace duyệt"],
    ["over-engineering", "làm phức tạp quá mức so với nhu cầu"],
  ] },

{ id: "cca1-041", n: 41, set: 1, scenario: 2, domain: 3, task: "3.5",
  topic: "Iterative Refinement", difficulty: "medium", type: "mc", ans: [0],
  q: `You've asked Claude Code to implement a function that transforms API responses into a normalized internal format. After two iterations, the output structure still doesn't match—some fields are nested differently and timestamps aren't formatted correctly. You've been describing requirements in prose, but Claude interprets them differently each time. What's the most effective approach for the next iteration?`,
  opts: [
    `Provide 2-3 concrete input-output examples showing the expected transformation for representative API responses.`,
    `Rewrite your requirements with greater technical precision, specifying exact field mappings, nesting rules, and timestamp format strings.`,
    `Write a JSON schema defining the expected output structure and validate Claude's output against it after each iteration.`,
    `Ask Claude to explain its current interpretation of the requirements so you can identify where understanding diverges.`,
  ],
  q_vi: `Bạn đã yêu cầu Claude Code triển khai một hàm biến đổi API response thành định dạng nội bộ đã chuẩn hóa (normalized). Sau hai lần lặp, cấu trúc output vẫn không khớp — một số field bị lồng khác nhau và timestamp không được định dạng đúng. Bạn đã mô tả yêu cầu bằng văn xuôi, nhưng Claude diễn giải khác nhau mỗi lần. Cách tiếp cận nào hiệu quả nhất cho lần lặp tiếp theo?`,
  opts_vi: [
    `Cung cấp 2-3 ví dụ input-output cụ thể cho thấy phép biến đổi mong muốn với các API response tiêu biểu.`,
    `Viết lại yêu cầu với độ chính xác kỹ thuật cao hơn, chỉ rõ ánh xạ field chính xác, quy tắc lồng, và chuỗi định dạng timestamp.`,
    `Viết một JSON schema định nghĩa cấu trúc output mong muốn và xác thực output của Claude theo schema đó sau mỗi lần lặp.`,
    `Yêu cầu Claude giải thích cách hiểu hiện tại của nó về yêu cầu, để bạn xác định chỗ nào hiểu sai lệch.`,
  ],
  why: [
    `Cung cấp ví dụ input-output cụ thể loại bỏ sự mơ hồ vốn có của mô tả văn xuôi bằng cách cho Claude thấy chính xác phép biến đổi mong muốn. Giải quyết trực tiếp gốc rễ — hiểu sai yêu cầu dạng văn xuôi — bằng mục tiêu cụ thể, rõ ràng cho việc lồng field và định dạng timestamp.`,
    `Mô tả văn xuôi chính xác hơn có thể giúp chút ít, nhưng vẫn dùng đúng phương thức giao tiếp đã thất bại hai lần. Văn xuôi dù chính xác đến đâu vẫn phụ thuộc cách diễn giải, trong khi ví dụ cụ thể loại bỏ hoàn toàn mơ hồ.`,
    `JSON schema xác thực cấu trúc output nhưng không giúp Claude hiểu logic biến đổi cần để tạo kết quả đúng. Giải quyết việc kiểm chứng (verification) chứ không phải sự thấu hiểu (comprehension).`,
    `Hỏi Claude giải thích cách hiểu là bước chẩn đoán hữu ích để lộ ra nơi hiểu lệch, nhưng không trực tiếp giải quyết. Sau khi xác định, bạn vẫn cần phương thức khác — như ví dụ cụ thể — để truyền đạt phép biến đổi đúng.`,
  ],
  concept: `Ví dụ input-output cụ thể là cách hiệu quả nhất vì chúng vượt qua sự mơ hồ ngôn ngữ — cho thấy chính xác phép biến đổi mong muốn, giải quyết trực tiếp gốc rễ là mô tả bằng văn xuôi bị hiểu sai.`,
  takeaway: `Khi mô tả văn xuôi bị hiểu sai nhiều lần, hãy chuyển sang ví dụ input-output cụ thể — chúng loại bỏ mơ hồ ngôn ngữ tốt hơn mọi cách diễn đạt.`,
  terms: [
    ["iterative refinement", "tinh chỉnh lặp qua nhiều vòng"],
    ["input-output example", "ví dụ cặp đầu vào–đầu ra cụ thể"],
    ["prose description", "mô tả bằng văn xuôi (dễ mơ hồ)"],
    ["JSON schema", "định nghĩa cấu trúc để xác thực (chỉ verify, không dạy logic)"],
  ] },

{ id: "cca1-043", n: 43, set: 1, scenario: 2, domain: 3, task: "3.2",
  topic: "Custom Slash Commands", difficulty: "hard", type: "mc", ans: [0],
  q: `Your team has a /migration skill that generates database migration files, accepting a migration name via $ARGUMENTS. In production, you're seeing three issues: (1) developers often invoke without arguments, resulting in poorly-named files, (2) the skill sometimes incorporates schema details from unrelated earlier conversations, and (3) a developer accidentally triggered destructive test cleanup when the skill had broad tool access. Which configuration approach addresses all three issues?`,
  opts: [
    `Add argument-hint frontmatter to prompt for required parameters, use context: fork to isolate execution, and restrict allowed-tools to file write operations.`,

  ],
  q_vi: `Nhóm bạn có một skill /migration sinh ra file database migration, nhận tên migration qua $ARGUMENTS. Trong thực tế, bạn gặp ba vấn đề: (1) developer thường gọi mà không kèm argument, dẫn đến file đặt tên kém, (2) skill đôi khi lồng chi tiết schema từ các hội thoại trước đó không liên quan, và (3) một developer vô tình kích hoạt việc dọn dẹp test mang tính phá hủy khi skill có quyền truy cập tool quá rộng. Cách cấu hình nào giải quyết cả ba vấn đề?`,
  opts_vi: [
    `Thêm argument-hint frontmatter để nhắc tham số bắt buộc, dùng context: fork để cô lập thực thi, và giới hạn allowed-tools chỉ còn thao tác ghi file.`,
    `Tách thành hai skill riêng /migration-create và /migration-apply, thêm chỉ dẫn trong từng SKILL.md để yêu cầu tên migration nếu chưa cung cấp, và dùng phạm vi allowed-tools khác nhau cho từng skill.`,
    `Đưa chỉ dẫn xác thực vào SKILL.md của skill, hướng dẫn Claude kiểm tra $ARGUMENTS chứa tên hợp lệ, thêm prompt yêu cầu bỏ qua ngữ cảnh hội thoại trước, và liệt kê các thao tác bị cấm mà Claude nên tránh.`,

  why: [

    `Trả về ngữ cảnh lỗi có cấu trúc (loại lỗi, truy vấn đã thử, kết quả một phần, hướng thay thế) cung cấp cho coordinator mọi thông tin cần thiết để ra quyết định phục hồi thông minh. Bảo toàn tối đa ngữ cảnh cho quyết định có cơ sở.`,
    `Retry với backoff có thể hữu ích, nhưng chỉ trả về 'search unavailable' chung chung che giấu ngữ cảnh quý giá, ngăn coordinator ra quyết định phục hồi như sửa truy vấn hoặc thử hướng khác.`,
    `Bắt timeout và trả về tập rỗng đánh dấu thành công triệt tiêu lỗi hoàn toàn, khiến coordinator không biết đã xảy ra lỗi. Nguy cơ tạo kết quả thiếu sót mà không ai biết.`,
    `Lan truyền ngoại lệ trực tiếp rồi chấm dứt toàn workflow là phản ứng quá mức, vì coordinator có thể phục hồi qua chiến lược thay thế. Hy sinh tính kiên cường khi coi một lỗi subagent là lỗi chí mạng.`,
  ],
  concept: `Nguyên tắc lan truyền lỗi (error propagation): bảo toàn tối đa ngữ cảnh lỗi để cấp điều phối có thể ra quyết định phục hồi thông minh.`,
  takeaway: `Lỗi nên được lan truyền lên cấp điều phối kèm ngữ cảnh đầy đủ để cho phép phục hồi thông minh, thay vì bị che giấu, làm giả thành công, hay làm sập toàn hệ thống.`,
  terms: [
    ["error propagation", "lan truyền lỗi lên cấp ra quyết định"],
    ["structured error context", "ngữ cảnh lỗi có cấu trúc (loại lỗi, truy vấn, kết quả một phần)"],
    ["exponential backoff", "thử lại với khoảng chờ tăng theo cấp số nhân"],
    ["partial results", "kết quả một phần đã thu được trước khi lỗi"],
    ["graceful recovery", "phục hồi mềm dẻo dựa trên thông tin lỗi"],
  ] },

{ id: "cca1-018", n: 18, set: 1, scenario: 3, domain: 2, task: "2.3",
  topic: "Tool Distribution", difficulty: "hard", type: "mc", ans: [0],
  q: `The synthesis agent frequently needs to verify claims. Currently it returns control to the coordinator, which invokes the web search agent, then re-invokes synthesis. This adds 2-3 round trips per task and increases latency by 40%. Your evaluation shows 85% of verifications are simple fact-checks (dates, names, statistics) while 15% require deeper investigation. What's the most effective approach to reduce overhead while maintaining reliability?`,
  opts: [
    `Give the synthesis agent a scoped verify_fact tool for simple lookups, while complex verifications continue delegating to the web search agent through the coordinator.`,
    `Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end of its pass.`,
    `Give the synthesis agent access to all web search tools so it can handle any verification need directly.`,
    `Have the web search agent proactively cache extra context around each source during initial research, anticipating what the synthesis agent might need.`,
  ],
  q_vi: `Synthesis agent thường xuyên cần xác minh các nhận định (claims). Hiện tại nó trả quyền điều khiển về coordinator, coordinator gọi web search agent, rồi gọi lại synthesis. Điều này thêm 2-3 round trip cho mỗi nhiệm vụ và làm tăng độ trễ 40%. Đánh giá của bạn cho thấy 85% việc xác minh là các fact-check đơn giản (ngày tháng, tên riêng, số liệu thống kê) trong khi 15% cần điều tra sâu hơn. Cách tiếp cận nào hiệu quả nhất để giảm chi phí phát sinh mà vẫn duy trì độ tin cậy?`,
  opts_vi: [
    `Cấp cho synthesis agent một công cụ verify_fact có phạm vi hẹp cho các tra cứu đơn giản, trong khi các xác minh phức tạp vẫn tiếp tục được ủy thác cho web search agent thông qua coordinator.`,
    `Để synthesis agent tích lũy toàn bộ nhu cầu xác minh rồi trả về theo lô (batch) cho coordinator vào cuối lượt xử lý của nó.`,
    `Cấp cho synthesis agent quyền truy cập toàn bộ công cụ web search để nó có thể tự xử lý trực tiếp mọi nhu cầu xác minh.`,
    `Để web search agent chủ động cache thêm ngữ cảnh xung quanh mỗi nguồn trong quá trình nghiên cứu ban đầu, dự đoán trước những gì synthesis agent có thể cần.`,
  ],
  why: [
    `Cấp công cụ xác minh có phạm vi hẹp (verify_fact) xử lý trực tiếp 85% tra cứu đơn giản, loại bỏ hầu hết round-trip, đồng thời giữ đường ủy thác qua coordinator cho 15% phức tạp. Áp dụng đặc quyền tối thiểu, giữ synthesis agent tập trung.`,
    `Gộp tất cả nhu cầu xác minh đến cuối lượt tạo phụ thuộc chặn (blocking dependencies), vì các bước tổng hợp sau có thể phụ thuộc vào sự thật cần xác minh trước đó. Không xử lý được phụ thuộc tuần tự.`,
    `Cấp toàn quyền mọi công cụ tìm kiếm vi phạm tách biệt mối quan tâm và over-provisioning, có nguy cơ giảm hiệu năng tổng hợp chính. Tăng độ phức tạp và rủi ro lạm dụng.`,
    `Cache chủ động dựa vào dự đoán suy đoán những gì cần xác minh, về bản chất không đáng tin và lãng phí tài nguyên tải về thông tin có thể không dùng đến.`,
  ],
  concept: `Nguyên tắc đặc quyền tối thiểu (principle of least privilege) trong phân phối công cụ: chỉ cấp đúng công cụ cần cho phần lớn trường hợp phổ biến, giữ nguyên tách biệt mối quan tâm.`,
  takeaway: `Hãy cấp công cụ có phạm vi hẹp đủ phục vụ trường hợp phổ biến (đặc quyền tối thiểu) thay vì cấp phát dư thừa hoặc dùng giải pháp suy đoán.`,
  terms: [
    ["principle of least privilege", "nguyên tắc đặc quyền tối thiểu"],
    ["scoped tool", "công cụ có phạm vi giới hạn (verify_fact)"],
    ["round-trip", "vòng trao đổi qua lại giữa tác tử và coordinator"],
    ["separation of concerns", "tách biệt mối quan tâm/trách nhiệm"],
    ["over-provisioning", "cấp phát năng lực dư thừa"],
  ] },

{ id: "cca1-019", n: 19, set: 1, scenario: 3, domain: 1, task: "1.2",
  topic: "Multi-Agent Orchestration", difficulty: "medium", type: "mc", ans: [0],
  q: `Combined outputs from the web search agent (85K tokens including page content) and the document analysis agent (70K tokens including reasoning chains) total 155K tokens, but the synthesis agent performs optimally with inputs under 50K tokens. What's the most effective solution?`,
  opts: [
    `Modify upstream agents to return structured data (key facts, citations, relevance scores) instead of verbose content and reasoning`,
    `Add an intermediate summarization agent that condenses findings before passing to synthesis`,
    `Have the synthesis agent process findings in sequential batches, maintaining running state between calls`,
    `Store findings in a vector database and give the synthesis agent retrieval tools to query during its work`,
  ],
  q_vi: `Đầu ra kết hợp từ web search agent (85K token bao gồm nội dung trang) và document analysis agent (70K token bao gồm chuỗi suy luận) tổng cộng 155K token, nhưng synthesis agent hoạt động tối ưu nhất với đầu vào dưới 50K token. Giải pháp nào hiệu quả nhất?`,
  opts_vi: [
    `Sửa các tác tử thượng nguồn để trả về dữ liệu có cấu trúc (sự thật then chốt, trích dẫn, điểm liên quan) thay vì nội dung và chuỗi suy luận dài dòng.`,
    `Thêm một tác tử tóm tắt trung gian để cô đọng các phát hiện trước khi chuyển sang synthesis.`,
    `Để synthesis agent xử lý các phát hiện theo từng lô tuần tự, duy trì trạng thái chạy (running state) giữa các lần gọi.`,
    `Lưu các phát hiện vào một vector database và cấp cho synthesis agent các công cụ truy xuất để truy vấn trong quá trình làm việc.`,
  ],
  why: [
    `Sửa các tác tử thượng nguồn để trả về dữ liệu có cấu trúc (sự thật then chốt, trích dẫn, điểm liên quan) giải quyết nguyên nhân gốc bằng cách giảm token ngay tại nguồn mà vẫn bảo toàn thông tin thiết yếu. Loại bỏ nội dung dài dòng và chuỗi suy luận làm phình token.`,
    `Thêm tác tử tóm tắt trung gian gây thêm độ trễ, chi phí và rủi ro mất thông tin, trong khi bản thân nó vẫn phải xử lý đủ 155K token. Chữa triệu chứng.`,
    `Xử lý theo lô tuần tự làm giảm chất lượng vì tác tử không thể thấy tất cả phát hiện cùng lúc để nhận diện mẫu hình, mâu thuẫn và liên kết chéo. Duy trì trạng thái chạy cũng tăng độ phức tạp.`,
    `Vector database với truy xuất là over-engineered, vì tổng hợp đòi hỏi bao phủ toàn diện mọi phát hiện chứ không phải truy xuất chọn lọc theo truy vấn. Nguy cơ bỏ sót thông tin quan trọng.`,
  ],
  concept: `Giải quyết tận gốc vấn đề token: kiểm soát đầu ra ở nguồn (thượng nguồn) thay vì xử lý triệu chứng ở hạ nguồn.`,
  takeaway: `Giảm token ngay tại nguồn bằng đầu ra có cấu trúc là cách hiệu quả nhất; tổng hợp cần thấy toàn bộ đầu vào cùng lúc, không phù hợp với truy xuất chọn lọc hay xử lý theo lô.`,
  terms: [
    ["structured data", "dữ liệu có cấu trúc (key facts, citations, relevance scores)"],
    ["upstream agent", "tác tử thượng nguồn (cung cấp đầu vào cho tổng hợp)"],
    ["reasoning chain", "chuỗi suy luận làm phình token"],
    ["vector database / RAG", "truy xuất chọn lọc, không hợp cho tổng hợp toàn diện"],
    ["comprehensive coverage", "bao phủ toàn diện mọi đầu vào đã biết"],
  ] },

{ id: "cca1-020", n: 20, set: 1, scenario: 3, domain: 1, task: "1.2",
  topic: "Multi-Agent Orchestration", difficulty: "easy", type: "mc", ans: [0],
  q: `A colleague suggests having the document analysis agent send its output directly to the synthesis agent instead of routing through the coordinator. What is the main advantage of keeping the coordinator as the central hub for all subagent communication?`,
  opts: [
    `The coordinator can observe all interactions, handle errors consistently, and decide what information each subagent should receive`,
    `Subagents operate with isolated memory, and direct communication would require complex serialization that only the coordinator can perform`,
    `The coordinator batches multiple subagent requests together, reducing the total number of API calls and overall latency`,
    `Routing through the coordinator enables automatic retry logic that direct agent-to-agent calls cannot support`,
  ],
  q_vi: `Một đồng nghiệp đề xuất để document analysis agent gửi đầu ra trực tiếp cho synthesis agent thay vì định tuyến qua coordinator. Lợi thế chính của việc giữ coordinator làm trung tâm (hub) cho mọi giao tiếp giữa các subagent là gì?`,
  opts_vi: [
    `Coordinator có thể quan sát mọi tương tác, xử lý lỗi một cách nhất quán, và quyết định thông tin nào mỗi subagent nên nhận được.`,
    `Các subagent hoạt động với bộ nhớ tách biệt, và giao tiếp trực tiếp sẽ đòi hỏi tuần tự hóa (serialization) phức tạp mà chỉ coordinator mới có thể thực hiện.`,
    `Coordinator gộp nhiều yêu cầu từ các subagent lại với nhau, giảm tổng số lệnh gọi API và độ trễ tổng thể.`,
    `Định tuyến qua coordinator cho phép logic retry tự động mà các lệnh gọi trực tiếp giữa các tác tử không thể hỗ trợ.`,
  ],
  why: [
    `Mô hình coordinator cung cấp khả năng quan sát tập trung mọi tương tác, xử lý lỗi nhất quán trên toàn hệ thống, và kiểm soát chi tiết thông tin mỗi tác tử con nhận được — chính là những lợi thế chính của giao tiếp hub-and-spoke.`,
    `Tuần tự hóa (serialization) không phải độc quyền của coordinator — bất kỳ thành phần nào cũng có thể tuần tự hóa và truyền dữ liệu, nên giao tiếp trực tiếp không gặp rào cản đặc biệt nào.`,
    `Định tuyến mọi giao tiếp qua coordinator thực ra thêm chi phí và một chặng phụ thay vì giảm. Gộp lô không phải lý do chính của mô hình coordinator.`,
    `Logic retry tự động có thể triển khai ở bất kỳ cấp nào, không riêng coordinator. Phương án này tạo ra phép nhị phân giả khi ngụ ý lệnh gọi trực tiếp vốn dĩ không thể hỗ trợ retry.`,
  ],
  concept: `Lợi ích cốt lõi của mô hình hub-and-spoke (coordinator làm trung tâm): khả năng quan sát tập trung, xử lý lỗi nhất quán và kiểm soát luồng thông tin.`,
  takeaway: `Lợi ích chính của coordinator trung tâm là quan sát tập trung, xử lý lỗi nhất quán và kiểm soát luồng thông tin — không phải tuần tự hóa, gộp lô hay retry.`,
  terms: [
    ["hub-and-spoke", "mô hình giao tiếp trung tâm (coordinator là hub)"],
    ["centralized visibility", "khả năng quan sát tập trung mọi tương tác"],
    ["serialization", "tuần tự hóa dữ liệu (không độc quyền của coordinator)"],
    ["false dichotomy", "phép nhị phân giả (ngụ ý chỉ một cách mới làm được)"],
    ["information flow control", "kiểm soát thông tin mỗi tác tử con nhận được"],
  ] },

{ id: "cca1-021", n: 21, set: 1, scenario: 3, domain: 1, task: "1.2",
  topic: "Multi-Agent Orchestration", difficulty: "medium", type: "mc", ans: [2],
  q: `The document analysis agent discovers two credible sources with directly conflicting statistics: one government report states 40% growth while an industry analysis states 12% growth. Both appear legitimate and the discrepancy could significantly affect conclusions. What's the most effective way for the document analysis agent to handle this?`,
  opts: [
    `Halt analysis and escalate to the coordinator immediately, asking it to determine which source is authoritative before continuing.`,
    `Apply source credibility heuristics to select the most likely accurate figure, complete the analysis using that value, and include a footnote mentioning the discrepancy.`,
    `Complete the document analysis with both figures included, explicitly annotate the conflict with source attribution, and let the coordinator decide how to reconcile before passing to synthesis.`,
    `Include both figures in the analysis output without flagging them as conflicting, allowing the synthesis agent to determine which to use.`,
  ],
  q_vi: `Document analysis agent phát hiện hai nguồn đáng tin cậy có số liệu thống kê mâu thuẫn trực tiếp: một báo cáo của chính phủ nêu mức tăng trưởng 40% trong khi một phân tích ngành nêu mức tăng trưởng 12%. Cả hai đều có vẻ hợp pháp và sự khác biệt này có thể ảnh hưởng đáng kể tới các kết luận. Cách hiệu quả nhất để document analysis agent xử lý tình huống này là gì?`,
  opts_vi: [
    `Dừng phân tích và leo thang ngay lập tức lên coordinator, yêu cầu coordinator xác định nguồn nào đáng tin cậy hơn trước khi tiếp tục.`,
    `Áp dụng các heuristic đánh giá độ tin cậy nguồn để chọn ra con số có khả năng chính xác nhất, hoàn thành phân tích bằng giá trị đó, và thêm một chú thích (footnote) đề cập đến sự khác biệt.`,
    `Hoàn thành phân tích tài liệu với cả hai con số được đưa vào, chú thích rõ ràng mâu thuẫn kèm ghi nguồn, và để coordinator quyết định cách hòa giải trước khi chuyển sang synthesis.`,
    `Đưa cả hai con số vào đầu ra phân tích mà không đánh dấu chúng là mâu thuẫn, để synthesis agent tự quyết định con số nào nên dùng.`,
  ],
  why: [
    `Dừng phân tích và leo thang ngay tạo ra sự chặn workflow không cần thiết, ngăn tác tử hoàn thành nhiệm vụ cốt lõi. Nên xử lý xong tất cả tài liệu và đánh dấu mâu thuẫn thay vì ngừng làm việc.`,
    `Áp heuristic để chọn một con số là vượt quá vai trò của nó, vì nó thiếu ngữ cảnh rộng hơn cần thiết. Nguy cơ làm mất thông tin khi đẩy sự khác biệt xuống một chú thích.`,
    `Tôn trọng tách biệt mối quan tâm: hoàn thành nhiệm vụ chính mà không bị chặn, bảo toàn cả hai điểm dữ liệu mâu thuẫn kèm ghi rõ nguồn, và chuyển quyết định hòa giải cho coordinator — nơi có ngữ cảnh rộng hơn.`,
    `Đưa cả hai con số mà không đánh dấu mâu thuẫn có nguy cơ bị các tác tử hạ nguồn bỏ qua, và chuyển quyết định cho synthesis agent một cách không thích đáng thay vì coordinator.`,
  ],
  concept: `Nguyên tắc tách biệt mối quan tâm: tác tử phân tích tài liệu hoàn thành nhiệm vụ cốt lõi mà không chặn, bảo toàn thông tin, và để quyết định hòa giải cho coordinator có ngữ cảnh rộng hơn.`,
  takeaway: `Khi gặp dữ liệu mâu thuẫn, tác tử nên hoàn thành nhiệm vụ, bảo toàn và chú thích rõ mâu thuẫn kèm nguồn, rồi để coordinator (ngữ cảnh rộng nhất) quyết định hòa giải.`,
  terms: [
    ["separation of concerns", "tách biệt mối quan tâm/trách nhiệm"],
    ["conflict annotation", "chú thích mâu thuẫn kèm ghi nguồn"],
    ["source attribution", "gán/ghi rõ nguồn cho dữ liệu"],
    ["reconciliation", "hòa giải/giải quyết mâu thuẫn dữ liệu"],
    ["credibility heuristics", "heuristic đánh giá độ tin cậy nguồn"],
  ] },

{ id: "cca1-022", n: 22, set: 1, scenario: 3, domain: 5, task: "5.3",
  topic: "Error Propagation", difficulty: "easy", type: "mc", ans: [0],
  q: `The document analysis subagent encounters a corrupted PDF file it cannot parse. When designing the system's error handling, what is the most effective way to handle this failure?`,
  opts: [
    `Return the error with context to the coordinator agent, letting it decide how to proceed.`,
    `Silently skip the corrupted document and continue processing other files to avoid interrupting the workflow.`,
    `Throw an exception that terminates the entire research workflow.`,
    `Automatically retry parsing the document three times with exponential backoff before reporting failure.`,
  ],
  q_vi: `Document analysis subagent gặp một file PDF bị hỏng mà nó không thể phân tích cú pháp (parse). Khi thiết kế cách xử lý lỗi của hệ thống, cách hiệu quả nhất để xử lý lỗi này là gì?`,
  opts_vi: [
    `Trả về lỗi kèm ngữ cảnh cho coordinator agent, để nó quyết định cách tiến hành tiếp theo.`,
    `Âm thầm bỏ qua tài liệu bị hỏng và tiếp tục xử lý các file khác để tránh làm gián đoạn workflow.`,
    `Ném ra một ngoại lệ khiến toàn bộ workflow nghiên cứu bị chấm dứt.`,
    `Tự động thử lại việc phân tích tài liệu ba lần với exponential backoff trước khi báo cáo lỗi.`,
  ],
  why: [
    `Trả về lỗi kèm ngữ cảnh cho coordinator cho phép nó ra quyết định có cơ sở — như bỏ qua file, thử phương pháp khác, hoặc thông báo người dùng — đồng thời duy trì khả năng quan sát lỗi.`,
    `Lặng lẽ bỏ qua tài liệu hỏng che giấu thông tin quan trọng khỏi coordinator và người dùng, có thể làm suy giảm tính đầy đủ và độ chính xác mà không ai biết.`,
    `Chấm dứt toàn workflow chỉ vì một file hỏng là phản ứng quá mức, hy sinh toàn bộ tiến độ và ngăn xử lý các tài liệu hợp lệ còn lại.`,
    `Retry với backoff phù hợp với lỗi tạm thời như timeout mạng, nhưng hỏng file là tình trạng vĩnh viễn không tự khắc phục, khiến lặp lại lãng phí và vô hiệu.`,
  ],
  concept: `Cách xử lý lỗi vĩnh viễn (file hỏng): lan truyền lỗi kèm ngữ cảnh lên coordinator để nó ra quyết định, thay vì che giấu, làm sập, hay thử lại vô ích.`,
  takeaway: `Với lỗi vĩnh viễn như file hỏng, hãy lan truyền lỗi kèm ngữ cảnh lên coordinator — không che giấu, không làm sập, và không retry (retry chỉ hợp lỗi tạm thời).`,
  terms: [
    ["error with context", "lỗi kèm ngữ cảnh để ra quyết định"],
    ["silent failure", "lỗi âm thầm (che giấu khoảng trống dữ liệu)"],
    ["permanent failure", "lỗi vĩnh viễn (file hỏng) vs transient (tạm thời)"],
    ["exponential backoff", "thử lại với khoảng chờ tăng dần (chỉ hợp lỗi tạm thời)"],
    ["disproportionate response", "phản ứng quá mức (làm sập cả workflow)"],
  ] },

{ id: "cca1-023", n: 23, set: 1, scenario: 3, domain: 1, task: "1.2",
  topic: "Multi-Agent Orchestration", difficulty: "easy", type: "mc", ans: [1],
  q: `The web search and document analysis agents have both completed their tasks and returned findings to the coordinator. What is the appropriate next step for producing an integrated research output?`,
  opts: [
    `The coordinator concatenates the raw outputs from both agents and returns them as the final result`,
    `The coordinator passes both sets of findings to the synthesis agent for unified integration`,
    `Each agent directly sends its findings to the report generation agent, bypassing the coordinator`,
    `The document analysis agent requests the web search results and merges them internally`,
  ],
  q_vi: `Cả web search agent và document analysis agent đều đã hoàn thành nhiệm vụ và trả về các phát hiện cho coordinator. Bước tiếp theo phù hợp để tạo ra một đầu ra nghiên cứu tích hợp là gì?`,
  opts_vi: [
    `Coordinator nối (concatenate) các đầu ra thô từ cả hai tác tử và trả về đó như kết quả cuối cùng.`,
    `Coordinator chuyển cả hai bộ phát hiện cho synthesis agent để tích hợp thống nhất.`,
    `Mỗi tác tử gửi trực tiếp các phát hiện của mình cho report generation agent, bỏ qua coordinator.`,
    `Document analysis agent yêu cầu kết quả của web search rồi tự hợp nhất nội bộ.`,
  ],
  why: [
    `Chỉ nối (concatenate) đầu ra thô không phải tích hợp có ý nghĩa, vì tạo ra kết quả rời rạc thiếu tổng hợp thống nhất. Coordinator nên tận dụng synthesis agent chuyên biệt.`,
    `Mô hình orchestrator-workers đòi hỏi coordinator duy trì kiểm soát tập trung bằng cách thu thập kết quả và định tuyến tới thành phần kế tiếp — synthesis agent, vốn được thiết kế để hợp nhất các phát hiện thành đầu ra mạch lạc.`,
    `Để các tác tử giao tiếp trực tiếp với report agent bỏ qua coordinator, vi phạm nguyên tắc kiểm soát tập trung và tước đi khả năng giám sát workflow.`,
    `Để một worker yêu cầu kết quả từ tác tử khác rồi hợp nhất nội bộ đưa vào giao tiếp ngang hàng (peer-to-peer) phá vỡ mô hình điều phối tập trung.`,
  ],
  concept: `Mô hình orchestrator-workers: coordinator giữ kiểm soát tập trung và định tuyến kết quả tới đúng thành phần chuyên biệt (tác tử tổng hợp) để tích hợp.`,
  takeaway: `Coordinator thu thập kết quả từ workers rồi định tuyến tới synthesis agent chuyên biệt; tránh nối thô, bỏ qua coordinator, hay giao tiếp ngang hàng.`,
  terms: [
    ["orchestrator-workers pattern", "mô hình điều phối viên và tác tử công nhân"],
    ["unified integration", "tích hợp thống nhất thành đầu ra mạch lạc"],
    ["concatenation", "nối đầu ra thô (không phải tích hợp)"],
    ["peer-to-peer communication", "giao tiếp ngang hàng (phá vỡ kiểm soát tập trung)"],
    ["centralized control", "kiểm soát tập trung của coordinator"],
  ] },

{ id: "cca1-024", n: 24, set: 1, scenario: 3, domain: 5, task: "5.3",
  topic: "Error Propagation", difficulty: "hard", type: "mc", ans: [0],
  q: `The web search subagent returns results for only 3 of 5 requested source categories (competitor websites and industry reports succeeded, but news archives and social media feeds timed out). The document analysis subagent processed all provided documents. The synthesis subagent must now produce a summary from this mixed-quality input. What's the most effective error propagation strategy?`,
  opts: [
    `Structure the synthesis output with coverage annotations indicating which findings are well-supported versus which topic areas have gaps due to unavailable sources.`,
    `Have the synthesis subagent request the coordinator retry the timed-out sources with extended timeouts before proceeding.`,
    `Proceed with synthesis using only the successful sources, generating output without indicating which data was unavailable.`,
    `Have the synthesis subagent return an error to the coordinator indicating incomplete upstream data, triggering a full retry or task failure.`,
  ],
  q_vi: `Web search subagent chỉ trả về kết quả cho 3 trong số 5 danh mục nguồn được yêu cầu (website đối thủ và báo cáo ngành thành công, nhưng kho lưu trữ tin tức và các luồng mạng xã hội bị timeout). Document analysis subagent đã xử lý xong toàn bộ tài liệu được cung cấp. Synthesis subagent giờ phải tạo ra một bản tóm tắt từ đầu vào có chất lượng không đồng đều này. Chiến lược lan truyền lỗi nào hiệu quả nhất?`,
  opts_vi: [
    `Cấu trúc đầu ra của synthesis kèm các chú thích về độ bao phủ, chỉ rõ phát hiện nào được hỗ trợ tốt so với những lĩnh vực chủ đề nào có lỗ hổng do nguồn không khả dụng.`,
    `Để synthesis subagent yêu cầu coordinator thử lại các nguồn bị timeout với thời gian chờ dài hơn trước khi tiếp tục.`,
    `Tiến hành synthesis chỉ dùng các nguồn thành công, tạo ra đầu ra mà không chỉ ra dữ liệu nào không khả dụng.`,
    `Để synthesis subagent trả về lỗi cho coordinator báo hiệu dữ liệu thượng nguồn không đầy đủ, kích hoạt việc thử lại toàn bộ hoặc coi nhiệm vụ thất bại.`,
  ],
  why: [
    `Cấu trúc đầu ra kèm chú thích về độ bao phủ thể hiện suy giảm mềm dẻo có minh bạch, cho phép hạ nguồn và người dùng cuối hiểu phát hiện nào được hỗ trợ tốt và vùng nào có khoảng trống. Bảo toàn giá trị công việc đã hoàn thành.`,
    `Để synthesis chỉ đạo coordinator thử lại vi phạm tách biệt mối quan tâm, vì subagent không nên ra lệnh logic retry cho coordinator. Giả định retry sẽ thành công và trì hoãn không cần thiết.`,
    `Tiến hành mà không chỉ ra nguồn nào không khả dụng che giấu thông tin quan trọng, có thể tạo báo cáo gây hiểu nhầm. Người dùng không biết một số vùng thiếu bao phủ.`,
    `Coi thành công một phần là thất bại toàn bộ sẽ lãng phí toàn bộ công việc đã hoàn thành thành công. Kết quả một phần kèm cảnh báo vẫn hữu ích cho các bên liên quan.`,
  ],
  concept: `Nguyên tắc suy giảm mềm dẻo có minh bạch (graceful degradation with transparency): tiếp tục với dữ liệu sẵn có nhưng lan truyền thông tin về độ không chắc chắn xuống hạ nguồn.`,
  takeaway: `Khi có thành công một phần, hãy tiếp tục với dữ liệu sẵn có nhưng chú thích rõ độ bao phủ/khoảng trống — không che giấu, không coi một phần là thất bại toàn bộ.`,
  terms: [
    ["graceful degradation", "suy giảm mềm dẻo (tiếp tục với dữ liệu sẵn có)"],
    ["coverage annotations", "chú thích về độ bao phủ và khoảng trống"],
    ["transparency", "minh bạch về độ không chắc chắn cho hạ nguồn"],
    ["partial success", "thành công một phần (không nên coi là thất bại toàn bộ)"],
    ["confidence levels", "mức độ tin cậy của phát hiện"],
  ] },

{ id: "cca1-025", n: 25, set: 1, scenario: 3, domain: 1, task: "1.2",
  topic: "Multi-Agent Orchestration", difficulty: "medium", type: "mc", ans: [0],
  q: `When researching a broad topic, the web search agent and document analysis agent are both investigating the same subtopics, resulting in significant overlap. Token usage has nearly doubled without proportionally increasing breadth or depth. What's the most effective way to address this?`,
  opts: [
    `Have the coordinator explicitly partition the research space before delegation, assigning distinct subtopics or source types to each agent`,
    `Implement a shared state mechanism where agents log their current focus area, allowing other agents to dynamically avoid duplicating work in progress`,
    `Allow both agents to complete their parallel work, then have the coordinator deduplicate overlapping findings before passing to synthesis`,
    `Convert to sequential execution where document analysis runs only after web search completes, using the web search findings as context`,
  ],
  q_vi: `Khi nghiên cứu một chủ đề rộng, web search agent và document analysis agent cùng điều tra các chủ đề con giống nhau, dẫn đến sự chồng lấp đáng kể. Mức tiêu thụ token đã gần như tăng gấp đôi mà không làm tăng tương ứng độ rộng hay độ sâu. Cách hiệu quả nhất để giải quyết vấn đề này là gì?`,
  opts_vi: [
    `Để coordinator phân hoạch tường minh không gian nghiên cứu trước khi ủy thác, giao các chủ đề con hoặc loại nguồn riêng biệt cho mỗi tác tử.`,
    `Triển khai một cơ chế trạng thái dùng chung, trong đó các tác tử ghi lại vùng tập trung hiện tại của mình, cho phép các tác tử khác chủ động tránh trùng lặp công việc đang thực hiện.`,
    `Cho phép cả hai tác tử hoàn thành công việc song song của mình, sau đó để coordinator khử trùng lặp các phát hiện chồng lấp trước khi chuyển sang synthesis.`,
    `Chuyển sang thực thi tuần tự, trong đó document analysis chỉ chạy sau khi web search hoàn tất, sử dụng các phát hiện của web search làm ngữ cảnh.`,
  ],
  why: [
    `Để coordinator phân hoạch tường minh không gian nghiên cứu trước khi ủy thác giải quyết nguyên nhân gốc — ranh giới nhiệm vụ không rõ — trước khi bất kỳ công việc nào bắt đầu. Bảo toàn lợi ích song song đồng thời ngăn nỗ lực trùng lặp.`,
    `Cơ chế trạng thái dùng chung đưa vào độ phức tạp không cần thiết, nguy cơ race condition, và vẫn cho phép một phần trùng lặp trước khi các tác tử phát hiện vùng của nhau. Phân hoạch chủ động đơn giản hơn.`,
    `Khử trùng lặp sau khi cả hai hoàn thành không giải quyết vấn đề token lãng phí, vì cả hai vẫn thực hiện nghiên cứu dư thừa song song. Chỉ dọn dẹp đầu ra mà không giảm tiêu thụ tài nguyên.`,
    `Chuyển sang tuần tự hy sinh không cần thiết lợi ích hiệu năng của song song khi cùng mục tiêu khử trùng lặp có thể đạt được qua phân hoạch từ đầu. Cũng tăng tổng thời gian thực thi.`,
  ],
  concept: `Phân hoạch nhiệm vụ chủ động ở cấp coordinator: giải quyết nguyên nhân gốc (ranh giới không rõ) trước khi làm việc, vừa giữ song song vừa tránh lãng phí token.`,
  takeaway: `Phân hoạch không gian nghiên cứu ngay từ đầu ở cấp coordinator giải quyết tận gốc trùng lặp mà vẫn giữ song song — tốt hơn khử trùng lặp sau, trạng thái dùng chung, hay tuần tự hóa.`,
  terms: [
    ["task partitioning", "phân hoạch nhiệm vụ trước khi ủy thác"],
    ["research space", "không gian nghiên cứu (subtopics/source types)"],
    ["parallelism", "tính song song cần được bảo toàn"],
    ["shared state / race condition", "trạng thái dùng chung và xung đột tranh chấp"],
    ["deduplication", "khử trùng lặp (sau khi làm vẫn lãng phí token)"],
  ] },

{ id: "cca1-026", n: 26, set: 1, scenario: 3, domain: 5, task: "5.3",
  topic: "Error Propagation", difficulty: "medium", type: "mc", ans: [2],
  q: `The web search subagent queries three source categories: academic databases returned 15 relevant papers, industry reports returned "0 results found," and patent databases returned "Connection timeout." When designing error propagation to the coordinator, what approach enables the best recovery decisions?`,
  opts: [
    `Report both the timeout and "0 results" as failures requiring coordinator intervention.`,
    `Have the subagent retry transient failures internally and only report persistent errors.`,
    `Distinguish access failures (timeout) needing retry decisions from valid empty results ("0 results") representing successful queries.`,
    `Aggregate outcomes into a single success rate metric (e.g., "67% source coverage") with detailed logs available on request.`,
  ],
  q_vi: `Web search subagent truy vấn ba danh mục nguồn: cơ sở dữ liệu học thuật trả về 15 bài báo liên quan, báo cáo ngành trả về "0 results found" (không tìm thấy kết quả), và cơ sở dữ liệu bằng sáng chế trả về "Connection timeout". Khi thiết kế cách lan truyền lỗi tới coordinator, cách tiếp cận nào cho phép ra quyết định phục hồi tốt nhất?`,
  opts_vi: [
    `Báo cáo cả timeout lẫn "0 results" đều là lỗi cần coordinator can thiệp.`,
    `Để subagent tự thử lại các lỗi tạm thời nội bộ và chỉ báo cáo những lỗi kéo dài (persistent).`,
    `Phân biệt lỗi truy cập (timeout) cần quyết định thử lại, với kết quả rỗng hợp lệ ("0 results") thể hiện một truy vấn thành công.`,
    `Gộp các kết cục thành một chỉ số tỷ lệ thành công duy nhất (ví dụ: "67% source coverage") kèm log chi tiết có sẵn khi cần.`,
  ],
  why: [
    `Coi cả timeout lẫn '0 results' là lỗi cần can thiệp là sai, vì '0 results' thể hiện truy vấn thành công chỉ là không tìm thấy dữ liệu, không phải lỗi. Gây retry không cần thiết và lãng phí tài nguyên.`,
    `Để subagent thử lại lỗi tạm thời nội bộ mà không báo cáo che giấu ngữ cảnh quan trọng, hạn chế khả năng coordinator quản lý ngân sách tài nguyên và ra quyết định về chiến lược retry.`,
    `Timeout (lỗi truy cập) và '0 results' (kết quả rỗng hợp lệ) là hai kết cục khác nhau về ngữ nghĩa, đòi hỏi phản ứng khác nhau. Phân biệt cho phép coordinator thử lại patent DB bị timeout trong khi chấp nhận kết quả rỗng của báo cáo ngành như phát hiện hợp lệ.`,
    `Gộp thành một chỉ số như '67% source coverage' phá hủy chi tiết cần cho quyết định phục hồi, vì che mờ liệu 33% thiếu là do lỗi truy cập hay kết quả rỗng hợp pháp.`,
  ],
  concept: `Phân biệt ngữ nghĩa giữa lỗi truy cập (timeout — truy vấn không hoàn tất) và kết quả rỗng hợp lệ ("0 results" — truy vấn thành công nhưng không tìm thấy gì) để cho phép quyết định phục hồi đúng đắn.`,
  takeaway: `Hãy phân biệt rõ lỗi truy cập (cần retry) với kết quả rỗng hợp lệ (chấp nhận như phát hiện) — đừng gộp tất cả thành lỗi hay thành một chỉ số che mờ thông tin.`,
  terms: [
    ["access failure", "lỗi truy cập (timeout, truy vấn không hoàn tất)"],
    ["valid empty result", "kết quả rỗng hợp lệ ('0 results', truy vấn thành công)"],
    ["semantic distinction", "phân biệt về ngữ nghĩa giữa các kết cục"],
    ["resource budget", "ngân sách tài nguyên coordinator cần quản lý"],
    ["aggregation", "gộp chỉ số (phá hủy chi tiết khả dụng)"],
  ] },

{ id: "cca1-027", n: 27, set: 1, scenario: 3, domain: 2, task: "2.3",
  topic: "Tool Distribution", difficulty: "medium", type: "mc", ans: [0],
  q: `Requests to "analyze the quarterly report I uploaded" are routed to the web search agent 45% of the time instead of the document analysis agent. The web search agent has an analyze_content tool described as "analyzes content and extracts key information," while the document analysis agent has an analyze_document tool described as "analyzes documents and extracts key information." How should you address this misrouting?`,
  opts: [
    `Rename the web search tool to extract_web_results and update its description to "processes and returns information retrieved from web searches and URLs."`,
    `Add a pre-routing classifier that determines whether the user is referencing uploaded files or web content before the coordinator makes delegation decisions.`,
    `Expand the document analysis tool's description to include example use cases like "Use for uploaded PDFs, Word documents, and spreadsheets" while leaving the web search tool unchanged.`,
    `Add few-shot examples to the coordinator's prompt showing correct routing.`,
  ],
  q_vi: `Các yêu cầu "analyze the quarterly report I uploaded" (phân tích báo cáo quý tôi đã tải lên) bị định tuyến tới web search agent tới 45% số lần thay vì document analysis agent. Web search agent có công cụ analyze_content được mô tả là "analyzes content and extracts key information" (phân tích nội dung và trích xuất thông tin then chốt), trong khi document analysis agent có công cụ analyze_document được mô tả là "analyzes documents and extracts key information" (phân tích tài liệu và trích xuất thông tin then chốt). Bạn nên giải quyết việc định tuyến sai này như thế nào?`,
  opts_vi: [
    `Đổi tên công cụ của web search thành extract_web_results và cập nhật mô tả thành "processes and returns information retrieved from web searches and URLs" (xử lý và trả về thông tin thu được từ tìm kiếm web và URL).`,
    `Thêm một bộ phân loại tiền định tuyến (pre-routing classifier) xác định người dùng đang tham chiếu tới file đã tải lên hay nội dung web, trước khi coordinator ra quyết định ủy thác.`,
    `Mở rộng mô tả của công cụ document analysis để bao gồm các ví dụ sử dụng như "Use for uploaded PDFs, Word documents, and spreadsheets" (dùng cho PDF, tài liệu Word và bảng tính đã tải lên), trong khi giữ nguyên công cụ web search.`,
    `Thêm các ví dụ few-shot vào prompt của coordinator để minh họa cách định tuyến đúng.`,
  ],
  why: [
    `Đổi tên thành extract_web_results và cập nhật mô tả tham chiếu rõ tới tìm kiếm web và URL trực tiếp giải quyết nguyên nhân gốc bằng cách loại bỏ chồng lấp ngữ nghĩa giữa tên và mô tả. Làm mục đích mỗi công cụ rõ ràng.`,

{ id: "cca1-030", n: 30, set: 1, scenario: 3, domain: 5, task: "5.1",
  topic: "Long Context Position Effects", difficulty: "medium", type: "mc", ans: [0],
  q: `When aggregated results total ~75K tokens, the synthesis agent reliably cites information from the first 15K tokens and the final 10K tokens, but frequently omits critical findings in the middle 50K tokens—even when those directly address the research question. How should you restructure the aggregated input?`,
  opts: [
    `Place a key findings summary at the beginning of the aggregated input and organize detailed results with explicit section headers for easier navigation.`,
    `Implement rotation that alternates which subagent's results appear first across different research tasks.`,
    `Summarize all subagent outputs to under 20K tokens total before aggregation.`,
    `Stream subagent results to the synthesis agent incrementally, processing web search results first to completion before introducing document analysis findings.`,
  ],
  q_vi: `Khi các kết quả tổng hợp có tổng cộng khoảng 75K token, synthesis agent luôn trích dẫn thông tin từ 15K token đầu và 10K token cuối một cách đáng tin cậy, nhưng thường bỏ sót các phát hiện quan trọng ở 50K token ở giữa — ngay cả khi những phát hiện đó trực tiếp trả lời câu hỏi nghiên cứu. Bạn nên tái cấu trúc đầu vào tổng hợp như thế nào?`,
  opts_vi: [
    `Đặt một bản tóm tắt phát hiện then chốt ở đầu đầu vào tổng hợp và tổ chức kết quả chi tiết với các tiêu đề mục (section headers) rõ ràng để dễ điều hướng.`,
    `Triển khai luân phiên (rotation) thay đổi kết quả của subagent nào xuất hiện đầu tiên qua các nhiệm vụ nghiên cứu khác nhau.`,
    `Tóm tắt toàn bộ đầu ra của các subagent xuống dưới tổng cộng 20K token trước khi tổng hợp.`,
    `Truyền (stream) kết quả của subagent tới synthesis agent theo từng phần tăng dần, xử lý kết quả web search cho tới khi hoàn tất trước khi đưa vào các phát hiện của document analysis.`,
  ],
  why: [
    `Đặt tóm tắt phát hiện then chốt ở đầu tận dụng hiệu ứng ưu tiên đầu (primacy effect), đảm bảo thông tin quan trọng chiếm vị trí được chú ý đáng tin nhất. Thêm tiêu đề mục (section headers) giúp mô hình điều hướng và chú ý tới phần giữa, trực tiếp giảm 'lost in the middle'.`,
    `Xoay vòng kết quả nào xuất hiện đầu chỉ phân phối lại phát hiện nào bị bỏ sót qua các nhiệm vụ chứ không giải quyết vấn đề cốt lõi. Xử lý công bằng giữa nguồn thay vì đảm bảo chất lượng.`,
    `Tóm tắt mạnh tay xuống dưới 20K token có nguy cơ loại bỏ các phát hiện chi tiết quan trọng. Sự mất thông tin do tóm tắt có thể còn tệ hơn vấn đề ban đầu.`,
    `Truyền kết quả tuần tự và xử lý từng cái ngăn synthesis agent thực hiện phân tích chéo nguồn toàn diện. Phân mảnh nhiệm vụ thay vì giải quyết vấn đề phân phối sự chú ý.`,
  ],
  concept: `Hiện tượng 'lost in the middle' trong ngữ cảnh dài: thông tin ở đầu và cuối được ghi nhớ tốt hơn phần giữa, và cách bố trí lại đầu vào để giảm thiểu hiệu ứng này.`,
  takeaway: `Để chống 'lost in the middle', hãy đặt tóm tắt then chốt ở vị trí ưu tiên đầu và dùng tiêu đề mục để điều hướng — không xoay vòng (chỉ công bằng), không nén quá mức (mất thông tin), không xử lý tuần tự (mất tổng hợp toàn diện).`,
  terms: [
    ["lost in the middle", "hiện tượng thông tin giữa ngữ cảnh dài bị bỏ sót"],
    ["primacy effect", "hiệu ứng ưu tiên đầu (đầu ngữ cảnh được nhớ tốt)"],
    ["recency effect", "hiệu ứng cuối (cuối ngữ cảnh được nhớ tốt)"],
    ["section headers", "tiêu đề mục giúp mô hình điều hướng"],
    ["holistic synthesis", "tổng hợp toàn diện (cần thấy mọi đầu vào cùng lúc)"],
  ] },

);

{ id: "cca1-063", n: 63, set: 1, scenario: 4, domain: 2, task: "2.5",
  topic: "Built-in Tools", difficulty: "medium", type: "mc", ans: [0],
  q: `Your agent tries to use Edit to change a line of code, but the operation fails because the anchor text it's matching on appears multiple times in the file, so Edit can't identify a unique location. What's the most reliable way to complete the modification?`,
  opts: [
    `Use Read to load the full file, then Write to save the modified version with the change applied.`,
    `Retry Edit repeatedly until it happens to match the intended occurrence.`,
    `Use Grep to count the occurrences, then instruct Edit to modify the Nth one by index.`,
    `Delete the file with Bash and recreate it from scratch with Write.`,
  ],
  q_vi: `Agent của bạn thử dùng Edit để sửa một dòng code, nhưng thao tác thất bại vì đoạn văn bản neo (anchor text) mà nó khớp xuất hiện nhiều lần trong file, khiến Edit không xác định được vị trí duy nhất. Cách nào đáng tin cậy nhất để hoàn tất việc sửa đổi?`,
  opts_vi: [
    `Dùng Read để nạp toàn bộ file, sau đó dùng Write để lưu lại phiên bản đã sửa.`,
    `Thử lại Edit nhiều lần cho đến khi nó tình cờ khớp đúng chỗ cần sửa.`,
    `Dùng Grep để đếm số lần xuất hiện, rồi yêu cầu Edit sửa lần xuất hiện thứ N theo chỉ số.`,
    `Xóa file bằng Bash rồi tạo lại từ đầu bằng Write.`,

  why: [

    `Thử lại Edit nhiều lần không giải quyết được vấn đề gốc là đoạn neo không duy nhất — Edit vẫn không thể phân biệt chỗ nào cần sửa và sẽ tiếp tục thất bại hoặc sửa nhầm.`,
    `Edit không hỗ trợ định vị theo chỉ số 'occurrence thứ N'; nó hoạt động bằng khớp văn bản duy nhất. Cách này dựa trên cơ chế không tồn tại.`,
    `Xóa rồi tạo lại toàn bộ file là rủi ro và thừa thãi — dễ mất nội dung ngoài ý muốn. Read+Write đạt cùng kết quả an toàn hơn nhiều mà không phá hủy file.`,

  takeaway: `Edit cần đoạn neo duy nhất; khi trùng lặp khiến nó thất bại, fallback chuẩn là Read toàn file rồi Write lại — đừng thử mù hay dựa vào cơ chế index không có thật.`,
  terms: [

{ id: "cca1-064", n: 64, set: 1, scenario: 4, domain: 5, task: "5.4",
  topic: "Codebase Exploration", difficulty: "medium", type: "mc", ans: [0],
  q: `An engineer asks your agent to explain how the refund flow works in a large, unfamiliar codebase. What's the most effective and context-efficient exploration strategy?`,

    `Read every file in the repository upfront so the agent has the entire codebase in context before answering.`,
    `Ask the engineer to paste all relevant files into the prompt so no tool calls are needed.`,
    `Use Glob to list all files, then summarize the directory structure as the explanation.`,
  ],
  q_vi: `Một kỹ sư nhờ agent của bạn giải thích luồng refund hoạt động thế nào trong một codebase lớn và xa lạ. Chiến lược khám phá nào hiệu quả nhất và tiết kiệm ngữ cảnh nhất?`,
  opts_vi: [
    `Dùng Grep để tìm điểm vào (vd handler 'refund'), rồi dùng Read đi theo import để lần theo luồng dần dần.`,
    `Đọc mọi file trong repository ngay từ đầu để agent có toàn bộ codebase trong ngữ cảnh trước khi trả lời.`,
    `Nhờ kỹ sư dán mọi file liên quan vào prompt để không cần gọi công cụ nào.`,
    `Dùng Glob để liệt kê mọi file, rồi tóm tắt cấu trúc thư mục làm lời giải thích.`,
  ],
  why: [
    `Bắt đầu bằng Grep để tìm điểm vào (handler 'refund'), rồi Read đi theo import và lần theo luồng dần dần là cách xây dựng hiểu biết codebase hiệu quả và tiết kiệm ngữ cảnh. Chỉ nạp phần liên quan, tránh làm đầy context window với file không cần thiết.`,
    `Nạp toàn bộ file lên trước sẽ vét cạn context window một cách lãng phí và gây 'lost in the middle', khiến agent bỏ sót thông tin. Phần lớn file không liên quan tới luồng refund.`,
    `Bắt engineer tự dán mọi file liên quan phủ nhận chính giá trị của agent — engineer đang hỏi vì họ CHƯA biết file nào liên quan. Agent nên tự khám phá bằng Grep/Read.`,
    `Liệt kê file và tóm tắt cấu trúc thư mục không giải thích được LUỒNG refund hoạt động thế nào. Nó cho biết file nằm đâu chứ không cho biết logic chạy ra sao.`,

  concept: `Với codebase lớn, cách hiệu quả và tiết kiệm ngữ cảnh là XÂY DỰNG hiểu biết DẦN DẦN: dùng Grep tìm điểm vào, rồi Read đi theo import để lần theo luồng — thay vì nạp toàn bộ file lên trước (làm cạn context window).`,
  takeaway: `Khám phá codebase lớn theo lối tăng dần: Grep tìm điểm vào → Read đi theo import lần luồng. Đừng nạp toàn bộ file lên trước (cạn ngữ cảnh, lost-in-the-middle).`,
  terms: [

{ id: "cca1-065", n: 65, set: 1, scenario: 4, domain: 3, task: "3.4",
  topic: "Plan Mode vs Direct Execution", difficulty: "easy", type: "mc", ans: [0],
  q: `An engineer needs to migrate the project from one HTTP client library to another—a change touching 45+ files with several viable approaches and different error-handling implications. Should the agent use plan mode or direct execution?`,
  opts: [
    `Plan mode — explore the codebase, weigh approaches, and design an implementation plan before making changes.`,
    `Direct execution — start editing files immediately and let the right approach emerge as issues appear.`,
    `Direct execution with a single, highly detailed upfront instruction specifying every file change.`,
    `Direct execution first, switching to plan mode only if unexpected complexity shows up mid-migration.`,
  ],
  q_vi: `Một kỹ sư cần migrate dự án từ thư viện HTTP client này sang thư viện khác — một thay đổi động chạm tới 45+ file, có nhiều cách tiếp cận khả thi và các hệ quả khác nhau về error handling. Agent nên dùng plan mode hay direct execution?`,
  opts_vi: [
    `Plan mode — khám phá codebase, cân nhắc các cách tiếp cận, và thiết kế một kế hoạch triển khai trước khi thực hiện thay đổi.`,
    `Direct execution — bắt đầu sửa file ngay và để cách tiếp cận đúng tự lộ ra khi vấn đề xuất hiện.`,
    `Direct execution với một chỉ dẫn upfront duy nhất, rất chi tiết, chỉ định sẵn từng thay đổi ở từng file.`,
    `Direct execution trước, chỉ chuyển sang plan mode nếu độ phức tạp bất ngờ xuất hiện giữa chừng migration.`,
  ],
  why: [
    `Plan mode phù hợp chính xác cho tác vụ quy mô lớn, nhiều cách tiếp cận và có quyết định kiến trúc như migration 45+ file. Nó cho phép khám phá codebase và thiết kế an toàn TRƯỚC khi sửa, ngăn phải làm lại tốn kém.`,
    `Sửa file ngay và để hướng đi 'tự lộ ra' rất rủi ro với migration lớn — phụ thuộc chéo phát hiện muộn dẫn đến rework tốn kém và trạng thái codebase nửa vời.`,
    `Một chỉ dẫn chi tiết upfront giả định bạn đã biết cấu trúc đúng mà chưa khám phá code. Với migration nhiều hướng khả thi, việc thăm dò trước là cần thiết chứ không thể chỉ định sẵn mọi thứ.`,
    `Đề bài đã nêu rõ độ phức tạp (45+ file, nhiều cách, ảnh hưởng error handling) NGAY TỪ ĐẦU — không phải thứ 'có thể phát sinh sau'. Trì hoãn plan mode chỉ làm mất lợi ích thiết kế trước.`,
  ],
  concept: `Plan mode được thiết kế cho tác vụ phức tạp: thay đổi quy mô lớn, nhiều cách tiếp cận hợp lệ, có quyết định kiến trúc, sửa nhiều file. Migration 45+ file với nhiều hướng khả thi đúng là trường hợp cần plan mode để khám phá và thiết kế trước khi commit thay đổi.`,
  takeaway: `Plan mode cho tác vụ quy mô lớn/nhiều hướng/có quyết định kiến trúc (migration 45+ file). Độ phức tạp đã biết trước thì lập kế hoạch NGAY, đừng chờ nó 'lộ ra'.`,
  terms: [
    ["plan mode", "chế độ lập kế hoạch: khám phá & thiết kế trước khi sửa"],
    ["direct execution", "thực thi trực tiếp, sửa ngay"],
    ["architectural decision", "quyết định kiến trúc, nhiều phương án đánh đổi"],
    ["costly rework", "làm lại tốn kém do phát hiện phụ thuộc muộn"],
  ] },

{ id: "cca1-066", n: 66, set: 1, scenario: 4, domain: 3, task: "3.4",
  topic: "Plan Mode vs Direct Execution", difficulty: "easy", type: "mc", ans: [1],
  q: `A developer reports a bug with a clear stack trace pointing to a single function that's missing a null check on one input. The fix is well-scoped: add a validation conditional in one place. What's the appropriate mode?`,
  opts: [
    `Plan mode — always plan before touching code to be safe.`,
    `Direct execution — the change is simple, well-scoped, and single-file, so proceed directly.`,
    `Plan mode, then fork a session to compare three ways of writing the null check.`,
    `Direct execution but only after reading every file that imports the function.`,
  ],
  q_vi: `Một lập trình viên báo một lỗi với stack trace rõ ràng, trỏ tới một hàm duy nhất đang thiếu null check cho một input. Bản sửa có phạm vi rõ: thêm một điều kiện validate ở một chỗ. Chế độ nào phù hợp?`,
  opts_vi: [
    `Plan mode — luôn lập kế hoạch trước khi đụng vào code để đảm bảo an toàn.`,
    `Direct execution — thay đổi đơn giản, phạm vi rõ, chỉ một file, nên thực thi trực tiếp.`,
    `Plan mode, sau đó fork một session để so sánh ba cách viết null check.`,
    `Direct execution nhưng chỉ sau khi đọc mọi file import hàm đó.`,
  ],
  why: [
    `'Luôn plan mode cho an toàn' là quá mức với một sửa lỗi một dòng, một file, phạm vi rõ. Plan mode dành cho tác vụ phức tạp/kiến trúc, không phải mọi thay đổi.`,
    `Sửa lỗi rõ ràng, một file, phạm vi hẹp (thêm null check) đúng là trường hợp direct execution. Không có quyết định kiến trúc hay nhiều hướng khả thi cần thăm dò, nên thực thi trực tiếp là nhanh và phù hợp.`,
    `Plan mode + fork session để so ba cách viết một null check là over-engineered cho thay đổi tầm thường. Chi phí điều phối vượt xa giá trị cho một điều kiện đơn giản.`,
    `Đọc mọi file import hàm đó là thừa cho một null check cục bộ không đổi chữ ký hàm. Việc thăm dò rộng chỉ cần khi thay đổi có ảnh hưởng chéo, không phải ở đây.`,
  ],
  concept: `Direct execution phù hợp cho thay đổi đơn giản, phạm vi rõ ràng (vd thêm một điều kiện validate vào một hàm). Dùng plan mode cho việc nhỏ, rõ ràng là thừa thãi và làm chậm không cần thiết.`,
  takeaway: `Direct execution cho thay đổi nhỏ, một file, phạm vi rõ (vd thêm null check). Đừng dùng plan mode 'cho chắc' với việc tầm thường.`,
  terms: [
    ["well-scoped change", "thay đổi phạm vi rõ ràng, hẹp"],
    ["stack trace", "dấu vết lỗi chỉ ra vị trí sự cố"],
    ["null check", "kiểm tra giá trị null trước khi dùng"],
    ["over-engineering", "phức tạp hóa quá mức cần thiết"],
  ] },

    `Tăng max_tokens không giải quyết vấn đề tích tụ ngữ cảnh — nó chỉ giới hạn độ dài phản hồi mỗi lượt, không phải tổng ngữ cảnh, và cuối cùng vẫn cạn khi output dồn lại.`,

  terms: [

  topic: "Iterative Refinement", difficulty: "medium", type: "mc", ans: [0],

    `Dùng interview pattern: để agent hỏi lại bạn các câu làm rõ trước khi viết code, nhằm lộ ra các cân nhắc thiết kế.`,
    `Yêu cầu agent triển khai theo phỏng đoán tốt nhất của nó ngay, rồi review và sửa những gì nó bỏ sót.`,
    `Cung cấp một bản đặc tả prose dài hơn, chi tiết hơn và hy vọng nó bao quát mọi cân nhắc.`,
    `Cho hai agent độc lập cùng triển khai song song rồi ghép lấy phần tốt hơn.`,
  ],
  why: [
    `Interview pattern để agent hỏi lại các câu làm rõ trước khi code, giúp lộ ra các cân nhắc thiết kế (chiến lược invalidation, failure mode) mà bạn có thể chưa nghĩ tới. Rất hiệu quả khi làm trong lĩnh vực chưa quen, nơi 'unknown unknowns' là rủi ro lớn nhất.`,
    `Để agent đoán và triển khai ngay rồi sửa sau bỏ lỡ chính cơ hội bề mặt hóa cân nhắc TRƯỚC khi code. Bạn có thể không nhận ra thiếu gì cho đến khi lỗi xảy ra ở production.`,
    `Spec prose dài hơn vẫn giới hạn bởi chính điều bạn chưa nghĩ tới — bạn không thể đặc tả những cân nhắc mình chưa biết là mình cần. Đối thoại hỏi-đáp mới moi ra được chúng.`,
    `Hai agent triển khai song song rồi ghép là tốn kém và không trực tiếp bề mặt hóa cân nhắc thiết kế bị bỏ sót — cả hai có thể cùng bỏ qua một điểm mù giống nhau.`,
  ],
  concept: `Interview pattern — để Claude ĐẶT CÂU HỎI làm rõ trước khi triển khai — giúp bề mặt hóa các cân nhắc thiết kế (invalidation, failure mode) mà lập trình viên có thể chưa lường tới, đặc biệt trong lĩnh vực xa lạ.`,
  takeaway: `Trong lĩnh vực xa lạ, dùng interview pattern (để Claude hỏi lại) để lộ ra cân nhắc thiết kế bị bỏ sót TRƯỚC khi code — spec dài hơn không moi ra được 'điều bạn chưa biết mình cần'.`,
  terms: [
    ["interview pattern", "mẫu để Claude hỏi lại làm rõ trước khi triển khai"],
    ["cache invalidation", "làm mất hiệu lực cache đúng lúc — bài toán khó"],
    ["failure mode", "kịch bản hỏng cần lường trước"],
    ["unknown unknowns", "những điều bạn không biết là mình chưa biết"],
  ] },

{ id: "cca1-069", n: 69, set: 1, scenario: 4, domain: 3, task: "3.5",
  topic: "Iterative Refinement", difficulty: "medium", type: "mc", ans: [0],
  q: `You ask the agent to write a function that transforms messy address strings into a normalized format. Your prose description keeps getting interpreted inconsistently—sometimes it uppercases state codes, sometimes not; sometimes it strips apartment numbers, sometimes not. What's the most effective way to communicate the expected transformation?`,
  opts: [
    `Provide 2-3 concrete input/output examples showing exactly how sample messy addresses should be normalized.`,
    `Rewrite the prose description to be longer and more detailed, covering every rule explicitly.`,
    `Ask the agent to infer the rules from the existing address database schema.`,
    `Lower the temperature so the transformation becomes deterministic.`,
  ],
  q_vi: `Bạn nhờ agent viết một hàm biến đổi các chuỗi địa chỉ lộn xộn thành định dạng chuẩn hóa. Mô tả prose của bạn liên tục bị diễn giải thiếu nhất quán — có lúc nó viết hoa mã bang, có lúc không; có lúc nó bỏ số căn hộ, có lúc không. Cách hiệu quả nhất để truyền đạt phép biến đổi mong muốn là gì?`,
  opts_vi: [
    `Cung cấp 2-3 ví dụ input/output cụ thể, cho thấy chính xác các địa chỉ lộn xộn mẫu cần được chuẩn hóa như thế nào.`,
    `Viết lại mô tả prose dài hơn và chi tiết hơn, bao quát rõ ràng từng quy tắc.`,
    `Nhờ agent suy ra các quy tắc từ schema database địa chỉ hiện có.`,
    `Giảm temperature để phép biến đổi trở nên xác định (deterministic).`,
  ],
  why: [
    `Cung cấp 2-3 cặp ví dụ input/output cụ thể là cách hiệu quả nhất để truyền đạt phép biến đổi khi mô tả prose bị hiểu thiếu nhất quán. Ví dụ cụ thể loại bỏ mơ hồ (viết hoa mã bang? bỏ số căn hộ?) rõ ràng hơn bất kỳ đoạn văn nào.`,
    `Mô tả prose dài hơn vẫn là văn xuôi — dễ bị diễn giải khác nhau ở các ca biên. Đề bài đã cho thấy prose thất bại; thêm chữ không sửa được vấn đề gốc là thiếu điểm neo cụ thể.`,
    `Suy ra quy tắc từ schema database không cho biết QUY TẮC BIẾN ĐỔI (viết hoa, bỏ apartment...). Schema mô tả hình dạng lưu trữ, không mô tả cách chuẩn hóa từ chuỗi bẩn.`,
    `Giảm temperature làm đầu ra ổn định hơn giữa các lần chạy nhưng không dạy mô hình QUY TẮC biến đổi đúng. Nó có thể ổn định ở một cách hiểu SAI.`,
  ],
  concept: `Ví dụ input/output cụ thể là cách hiệu quả nhất để truyền đạt phép biến đổi kỳ vọng khi mô tả prose bị diễn giải thiếu nhất quán. Vài cặp ví dụ khử mơ hồ rõ ràng hơn nhiều so với văn xuôi.`,
  takeaway: `Khi mô tả prose cho phép biến đổi bị hiểu thiếu nhất quán, hãy đưa 2-3 ví dụ input/output cụ thể — chúng khử mơ hồ hiệu quả hơn văn xuôi dài hay chỉnh temperature.`,
  terms: [
    ["input/output examples", "cặp ví dụ đầu vào–đầu ra minh họa phép biến đổi"],
    ["normalization", "chuẩn hóa dữ liệu về một dạng thống nhất"],
    ["prose description", "mô tả bằng văn xuôi, dễ bị hiểu khác nhau"],
    ["edge cases", "ca biên cần làm rõ bằng ví dụ"],
  ] },

{ id: "cca1-070", n: 70, set: 1, scenario: 4, domain: 1, task: "1.6",
  topic: "Task Decomposition", difficulty: "hard", type: "mc", ans: [0],
  q: `An engineer gives your agent an open-ended task: "add comprehensive tests to this large legacy codebase that currently has almost no test coverage." The scope is unclear and dependencies are unknown up front. What decomposition strategy is most appropriate?`,
  opts: [
    `Dynamic adaptive decomposition: first map the structure, identify high-impact untested areas, then build a prioritized plan that adapts as dependencies are discovered.`,
    `A fixed sequential pipeline that tests files in alphabetical order, one after another.`,
    `Generate tests for every file in a single pass to guarantee complete coverage immediately.`,
    `Ask the engineer to specify the exact list of files and test cases before the agent starts.`,
  ],
  q_vi: `Một kỹ sư giao cho agent của bạn một tác vụ mở: "thêm test toàn diện cho codebase legacy lớn này, hiện gần như không có test coverage nào." Phạm vi không rõ ràng và các phụ thuộc chưa biết trước. Chiến lược decomposition nào phù hợp nhất?`,
  opts_vi: [
    `Phân rã thích ứng động: trước tiên map cấu trúc, xác định các vùng chưa test có tác động cao, rồi xây một kế hoạch ưu tiên tự điều chỉnh khi phụ thuộc được phát hiện.`,
    `Một pipeline tuần tự cố định, test các file theo thứ tự alphabet, lần lượt từng file.`,
    `Sinh test cho mọi file trong một lượt duy nhất để đảm bảo độ phủ hoàn chỉnh ngay lập tức.`,
    `Nhờ kỹ sư chỉ định chính xác danh sách file và test case trước khi agent bắt đầu.`,
  ],
  why: [
    `Phân rã thích ứng động phù hợp cho tác vụ mở: map cấu trúc, xác định vùng chưa test có tác động cao, rồi lập kế hoạch ưu tiên điều chỉnh dần khi phụ thuộc lộ ra. Cách này khớp với bản chất 'phụ thuộc chưa biết trước' của việc phủ test cho legacy code.`,
    `Pipeline cố định theo thứ tự alphabet bỏ qua tầm quan trọng và phụ thuộc — nó test những file tầm thường ngang với file lõi quan trọng, lãng phí công sức và không tối ưu độ phủ có giá trị.`,
    `Sinh test cho mọi file trong một lượt gây pha loãng chú ý và chất lượng test kém đồng đều trên codebase lớn. 'Phủ hết' không bằng phủ đúng vùng rủi ro cao trước.`,
    `Bắt engineer liệt kê chính xác file và test case phủ nhận giá trị của agent cho tác vụ MỞ — nếu họ biết chính xác cần gì thì đã không giao việc mở này. Bản thân việc khám phá phạm vi là một phần của tác vụ.`,
  ],
  concept: `Với tác vụ mở, không rõ phạm vi và phụ thuộc chưa biết trước ('thêm test toàn diện cho legacy codebase'), nên dùng phân rã thích ứng ĐỘNG: map cấu trúc trước, xác định vùng tác động cao, rồi lập kế hoạch ưu tiên tự điều chỉnh khi phát hiện phụ thuộc — thay vì pipeline tuần tự cố định.`,
  takeaway: `Tác vụ mở, phụ thuộc chưa biết → phân rã thích ứng động (map cấu trúc → ưu tiên vùng tác động cao → kế hoạch tự điều chỉnh). Prompt chaining cố định chỉ hợp cho quy trình đa khía cạnh có thể đoán trước.`,
  terms: [
    ["dynamic decomposition", "phân rã động, sinh subtask theo phát hiện từng bước"],
    ["fixed pipeline (prompt chaining)", "chuỗi bước cố định, hợp việc đoán trước được"],
    ["high-impact areas", "vùng tác động cao cần ưu tiên"],
    ["legacy codebase", "mã cũ, ít test, khó nắm cấu trúc"],
  ] },

{ id: "cca1-071", n: 71, set: 1, scenario: 4, domain: 1, task: "1.7",
  topic: "Session Management", difficulty: "medium", type: "mc", ans: [0],
  q: `Yesterday the agent finished a long codebase-analysis session. Overnight, several of the analyzed files were substantially changed by other developers. Today you want to continue the work. What's the most reliable approach?`,
  opts: [
    `Start a fresh session with a structured summary of the prior findings, and explicitly inform the agent which files changed so it re-analyzes those.`,
    `Resume the old session as-is and continue, trusting the previous tool results.`,
    `Resume the old session and rely on the agent to automatically detect that files changed.`,
    `Discard all prior work and re-explore the entire codebase from zero.`,
  ],
  q_vi: `Hôm qua agent đã hoàn tất một session phân tích codebase kéo dài. Qua đêm, một số file đã phân tích bị các lập trình viên khác thay đổi đáng kể. Hôm nay bạn muốn tiếp tục công việc. Cách tiếp cận nào đáng tin cậy nhất?`,
  opts_vi: [
    `Bắt đầu một session mới với một bản tóm tắt có cấu trúc về các phát hiện trước đó, và thông báo rõ cho agent biết file nào đã thay đổi để nó re-analyze đúng những file đó.`,
    `Resume session cũ nguyên trạng và tiếp tục, tin tưởng vào các tool result trước đó.`,
    `Resume session cũ và trông cậy vào việc agent tự động phát hiện file đã thay đổi.`,
    `Vứt bỏ toàn bộ công việc trước đó và khám phá lại toàn bộ codebase từ số 0.`,
  ],
  why: [
    `Khởi động phiên mới với tóm tắt có cấu trúc về phát hiện cũ, kèm thông báo rõ file nào đã thay đổi, là cách đáng tin nhất. Nó tránh để agent suy luận trên tool result đã cũ, đồng thời khoanh vùng re-analysis đúng file bị đổi thay vì khám phá lại toàn bộ.`,
    `Resume nguyên trạng và tin vào tool result cũ là nguy hiểm — các file đã đổi khiến kết quả phân tích trước không còn đúng, dẫn agent suy luận trên thông tin lỗi thời.`,
    `Agent KHÔNG tự động phát hiện file bị thay đổi bên ngoài phiên; nó chỉ biết những gì có trong ngữ cảnh. Dựa vào 'tự phát hiện' là kỳ vọng sai về cơ chế.`,
    `Vứt bỏ toàn bộ và khám phá lại từ số 0 là lãng phí — phần lớn phát hiện cũ vẫn hợp lệ. Chỉ cần re-analyze các file đã đổi, không phải cả codebase.`,
  ],
  concept: `Khi kết quả công cụ trước đã cũ (file bị thay đổi), khởi động phiên mới với BẢN TÓM TẮT có cấu trúc đáng tin hơn là resume với tool result cũ. Đồng thời phải thông báo rõ file nào đã đổi để agent re-analyze đúng chỗ.`,
  takeaway: `Kết quả cũ do file thay đổi → khởi động phiên mới với tóm tắt có cấu trúc + báo rõ file nào đổi để re-analyze khoanh vùng. Đừng resume mù, đừng trông chờ agent 'tự phát hiện', đừng làm lại từ đầu.`,
  terms: [
    ["stale tool results", "kết quả công cụ đã cũ, không còn đúng"],
    ["structured summary", "bản tóm tắt có cấu trúc để nạp vào phiên mới"],
    ["session resumption", "tiếp tục phiên cũ (--resume)"],
    ["targeted re-analysis", "phân tích lại có khoanh vùng đúng file đổi"],
  ] },

{ id: "cca1-072", n: 72, set: 1, scenario: 4, domain: 1, task: "1.7",
  topic: "Session Management", difficulty: "medium", type: "mc", ans: [0],
  q: `After the agent has built a shared understanding of a module, you want to explore two competing refactoring approaches independently—without one exploration's changes or reasoning contaminating the other—starting from the same analysis baseline. Which mechanism fits best?`,
  opts: [
    `fork_session — create independent branches from the shared analysis baseline to explore each approach in isolation.`,
    `--resume the same session twice and alternate between the two approaches in one thread.`,
    `Start two completely fresh sessions and re-analyze the module from scratch in each.`,
    `Use context: fork on a skill to run both approaches inside one isolated subagent.`,
  ],
  q_vi: `Sau khi agent đã xây dựng một hiểu biết chung về một module, bạn muốn khám phá độc lập hai cách refactor cạnh tranh nhau — mà không để thay đổi hay lập luận của hướng này làm nhiễm hướng kia — cùng xuất phát từ một baseline phân tích chung. Cơ chế nào phù hợp nhất?`,
  opts_vi: [
    `fork_session — tạo các nhánh độc lập từ baseline phân tích chung để khám phá mỗi cách tiếp cận trong cô lập.`,
    `--resume cùng một session hai lần và luân phiên giữa hai cách tiếp cận trong một luồng duy nhất.`,
    `Bắt đầu hai session hoàn toàn mới và phân tích lại module từ đầu ở mỗi session.`,
    `Dùng context: fork trên một skill để chạy cả hai cách tiếp cận bên trong một subagent cô lập duy nhất.`,
  ],
  why: [
    `fork_session tạo các nhánh độc lập từ baseline phân tích đã chia sẻ, cho phép khám phá mỗi hướng refactor riêng biệt mà không để hướng này làm nhiễm hướng kia. Đúng chính xác cho việc so sánh hai cách tiếp cận từ cùng điểm phân tích.`,
    `Resume cùng một phiên và xen kẽ hai hướng trong một luồng khiến lập luận và thay đổi của hai cách trộn lẫn — chính điều bạn muốn tránh. Không có sự cô lập giữa hai nhánh.`,
    `Hai phiên mới hoàn toàn buộc phải phân tích lại module từ đầu mỗi lần, lãng phí và bỏ mất baseline chung. fork_session giữ lại baseline mà vẫn tách nhánh.`,
    `context: fork cô lập output của MỘT skill khỏi hội thoại chính, không phải để tạo hai nhánh khám phá song song từ một baseline chung. Đây là cơ chế cho mục đích khác.`,
  ],
  concept: `fork_session tạo các nhánh ĐỘC LẬP từ một baseline phân tích chung để khám phá các hướng khác nhau mà không lẫn lộn. Đúng cho việc so sánh hai cách refactor từ cùng điểm xuất phát.`,
  takeaway: `Khám phá nhiều hướng độc lập từ cùng một baseline phân tích → fork_session. Nó giữ điểm xuất phát chung mà vẫn cô lập các nhánh khỏi làm nhiễm nhau.`,
  terms: [
    ["fork_session", "tạo nhánh phiên độc lập từ baseline chung"],
    ["shared baseline", "điểm phân tích chung để nhánh ra"],
    ["divergent approaches", "các hướng tiếp cận khác nhau cần so sánh"],
    ["isolation", "cô lập để nhánh này không nhiễm nhánh kia"],
  ] },

{ id: "cca1-073", n: 73, set: 1, scenario: 4, domain: 5, task: "5.1",
  topic: "Context Management", difficulty: "medium", type: "mc", ans: [0],
  q: `In a long exploration session, you notice the agent starts giving inconsistent answers and referring vaguely to "typical patterns" instead of the specific classes and functions it identified earlier. What technique best counteracts this context degradation?`,
  opts: [
    `Have the agent maintain a scratchpad file recording key findings, and reference it for subsequent questions.`,
    `Ask the agent to be more careful and re-read its own earlier messages before answering.`,
    `Increase the temperature so the agent generates more varied, specific responses.`,
    `Switch to a smaller, faster model to reduce the chance of drift.`,
  ],
  q_vi: `Trong một session khám phá kéo dài, bạn nhận thấy agent bắt đầu đưa ra câu trả lời thiếu nhất quán và viện dẫn mơ hồ tới "các mẫu điển hình" thay vì các lớp và hàm cụ thể mà nó đã xác định trước đó. Kỹ thuật nào chống lại tình trạng context degradation này tốt nhất?`,
  opts_vi: [
    `Để agent duy trì một file scratchpad ghi lại các phát hiện then chốt, và tham chiếu nó cho các câu hỏi sau.`,
    `Yêu cầu agent cẩn thận hơn và tự đọc lại các tin nhắn trước đó của chính nó trước khi trả lời.`,
    `Tăng temperature để agent sinh ra các phản hồi đa dạng và cụ thể hơn.`,
    `Chuyển sang một model nhỏ hơn, nhanh hơn để giảm khả năng trôi (drift).`,
  ],
  why: [
    `Duy trì file scratchpad ghi các phát hiện then chốt (lớp, hàm, luồng đã xác định) và tham chiếu nó cho câu hỏi sau giúp chống context degradation bằng cách bền hóa thông tin ra ngoài ngữ cảnh hội thoại đang trôi. Agent đọc lại sự thật cụ thể thay vì viện dẫn mơ hồ.`,
    `Bảo agent 'cẩn thận hơn' và tự đọc lại tin nhắn cũ không đáng tin — chính ngữ cảnh dài đã gây suy giảm, và thông tin cũ có thể đã bị đẩy ra khỏi cửa sổ hoặc rơi vào vùng 'lost in the middle'.`,
    `Tăng temperature làm phản hồi đa dạng/ngẫu nhiên hơn chứ không khôi phục được các sự thật cụ thể đã mất khỏi ngữ cảnh. Nó có thể làm trầm trọng thêm sự thiếu nhất quán.`,
    `Đổi sang mô hình nhỏ hơn không giải quyết suy giảm ngữ cảnh — vấn đề là thông tin trôi khỏi cửa sổ, không phải năng lực mô hình. Mô hình nhỏ có thể còn dễ trôi hơn.`,

{ id: "cca1-047", n: 47, set: 1, scenario: 5, domain: 4, task: "4.5",
  topic: "Batch Processing", difficulty: "medium", type: "mc", ans: [0],
  q: `Your team wants to reduce API costs for automated analysis. Currently, real-time Claude calls power two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes switching both to the Message Batches API for its 50% cost savings. How should you evaluate this proposal?`,

{ id: "cca1-048", n: 48, set: 1, scenario: 5, domain: 1, task: "1.6",
  topic: "Task Decomposition", difficulty: "medium", type: "mc", ans: [0],
  q: `A pull request modifies 14 files across the stock tracking module. Your single-pass review analyzing all files together produces inconsistent results: detailed feedback for some files but superficial comments for others, obvious bugs missed, and contradictory feedback—flagging a pattern as problematic in one file while approving identical code elsewhere in the same PR. How should you restructure the review?`,

  q_vi: `Một pull request sửa đổi 14 file trong module stock tracking. Review single-pass của bạn — phân tích tất cả file cùng lúc — cho kết quả bất nhất: phản hồi chi tiết cho một số file nhưng nhận xét hời hợt cho các file khác, bỏ sót bug rõ ràng, và phản hồi mâu thuẫn — flag một pattern là có vấn đề ở file này nhưng lại approve đúng đoạn code y hệt ở nơi khác trong cùng PR. Bạn nên tái cấu trúc review như thế nào?`,
  opts_vi: [
    `Chia thành các pass tập trung: phân tích từng file riêng lẻ để tìm vấn đề cục bộ, sau đó chạy một pass riêng tập trung vào integration để xem xét luồng dữ liệu xuyên file.`,

    `Chuyển sang model cấp cao hơn với context window lớn hơn để dành sự chú ý đầy đủ cho cả 14 file trong một pass.`,
