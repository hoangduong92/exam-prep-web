{ id: "cca2-019", n: 19, set: 2, scenario: 1, domain: 2, task: "2.2",
  topic: "Structured Error Responses", difficulty: "easy", type: "mc", ans: [3],
  q: `Your process_refund tool returns {"error": "Operation failed"} for every failure: an order outside the 30-day refund window, a malformed order ID, a backend timeout, and a refund amount above the $500 ceiling your agent is allowed to approve. In production the agent retries all four the same way, then tells the customer "something went wrong". How should the tool report failures instead?`,
  opts: [
    `Keep the single error string, but make its text specific and customer-friendly so the agent can read the reason and relay it.`,
    `Return an HTTP-style numeric status code for each failure so the agent can branch on the number.`,
    `Throw the failure as an exception so the turn ends and the conversation is handed to escalate_to_human.`,
    `Return the result with isError set to true plus structured metadata: an errorCategory such as transient, validation, business or permission, an isRetryable boolean, and a human-readable description.`,
  ],
  q_vi: `Tool process_refund của bạn trả về {"error": "Operation failed"} cho mọi trường hợp thất bại: đơn hàng ngoài cửa sổ hoàn tiền 30 ngày, order ID sai định dạng, backend timeout, và số tiền hoàn vượt mức trần $500 mà agent được phép duyệt. Trong production, agent thử lại cả bốn trường hợp theo cùng một cách, rồi nói với khách hàng "something went wrong". Thay vào đó, tool nên báo cáo thất bại như thế nào?`,
  opts_vi: [
    `Giữ nguyên một chuỗi lỗi duy nhất, nhưng làm nội dung của nó cụ thể và thân thiện với khách hàng để agent có thể đọc lý do rồi truyền đạt lại.`,
    `Trả về một mã trạng thái dạng số kiểu HTTP cho mỗi loại thất bại để agent có thể rẽ nhánh dựa trên con số đó.`,
    `Ném thất bại ra dưới dạng exception để lượt này kết thúc và cuộc hội thoại được chuyển cho escalate_to_human.`,
    `Trả về kết quả với isError đặt thành true kèm metadata có cấu trúc: một errorCategory như transient, validation, business hoặc permission, một boolean isRetryable, và một mô tả cho người đọc.`,
  ],
  why: [
    `Chuỗi lỗi cụ thể tốt hơn "Operation failed" và agent có thể đọc rồi diễn giải lại cho khách, nên đây là nửa đúng. Nhưng quyết định thử lại vẫn là suy đoán từ văn bản tự do: không có gì nói cho agent biết timeout đáng thử lại còn cửa sổ 30 ngày thì thử bao nhiêu lần cũng vậy.`,
    `Mã số kiểu HTTP buộc agent phải tự đoán một bảng tra nghĩa, và mã HTTP không diễn đạt được chuyện một vi phạm quy tắc nghiệp vụ là không thể thử lại. MCP đã có sẵn khuôn chuẩn cho việc này nên không cần tự phát minh quy ước.`,
    `Ném exception kết thúc lượt cho cả bốn trường hợp, kể cả order ID sai định dạng mà agent có thể tự sửa bằng cách tra lại, và cả lỗi mà khách chỉ cần một lời giải thích. Đây là escalate quá mức và làm hụt mục tiêu giải quyết ngay lần đầu 80%.`,
    `Đặt isError kèm metadata có cấu trúc cho agent đúng những gì nó cần để quyết: thử lại với timeout, tự sửa đầu vào khi là lỗi validation, giải thích chính sách khi là lỗi nghiệp vụ, và chuyển cho người khi vượt hạn mức được phép duyệt. Mỗi loại lỗi dẫn tới một hành động khác nhau.`,
  ],
  concept: `Lỗi trả về đồng loạt một dạng làm agent mất khả năng phục hồi. Kết quả tool nên bật isError kèm metadata máy đọc được: phân loại lỗi (transient / validation / business / permission), nói rõ thử lại có ích hay không, và một mô tả cho người đọc.`,
  takeaway: `Bốn nguyên nhân thất bại khác nhau cần bốn hành động khác nhau. Nếu tool trả về cùng một thông báo cho tất cả, agent chỉ còn cách thử lại vô nghĩa.`,
  terms: [
    ["isError", "cờ trong kết quả MCP báo lần gọi tool này thất bại"],
    ["errorCategory", "trường phân loại lỗi: transient, validation, business, permission"],
    ["isRetryable", "boolean nói rõ thử lại có cơ may thành công hay không"],
    ["transient error", "lỗi tạm thời như timeout hay dịch vụ chưa sẵn — thử lại có thể xong"],
    ["business error", "vi phạm quy tắc nghiệp vụ, thử lại bao nhiêu lần cũng thế"],
    ["uniform error response", "mọi lỗi trả về cùng một thông báo chung chung"],
  ] },

{ id: "cca2-020", n: 20, set: 2, scenario: 3, domain: 2, task: "2.2",
  topic: "Local Error Recovery", difficulty: "medium", type: "mr", ans: [1, 2],
  q: `On one run, your document analysis subagent hits two different conditions: the internal document store returns HTTP 503 on its first call, and a later search for "quarterly revenue 2025" completes normally but matches zero passages. You are designing how the subagent reports each condition to the coordinator. Which TWO behaviors should it implement? (Choose TWO.)`,
  opts: [
    `Return the same generic "document store unavailable" error for both conditions, so the coordinator has one uniform failure path to handle.`,
    `Retry the 503 locally a bounded number of times, and report to the coordinator only if it still fails — including what was attempted and any partial results already gathered.`,
    `Report the zero-match search as a successful result stating that the query ran and matched nothing, so the coordinator does not schedule a retry.`,
    `Report the zero-match search with isError true and isRetryable true, so the coordinator can retry it with a broader query.`,
    `Absorb the 503 by returning an empty result set marked successful, and let the synthesis stage notice that data is missing.`,
  ],
  q_vi: `Trong một lần chạy, document analysis subagent của bạn gặp hai tình huống khác nhau: document store nội bộ trả về HTTP 503 ở lần gọi đầu tiên, và một tìm kiếm sau đó cho "quarterly revenue 2025" chạy xong bình thường nhưng không khớp đoạn văn nào. Bạn đang thiết kế cách subagent báo cáo từng tình huống lên coordinator. Nó nên triển khai HAI hành vi nào? (Chọn HAI phương án.)`,
  opts_vi: [
    `Trả về cùng một lỗi chung "document store unavailable" cho cả hai tình huống, để coordinator chỉ cần xử lý một đường lỗi thống nhất.`,
    `Thử lại lỗi 503 tại chỗ một số lần có giới hạn, và chỉ báo lên coordinator nếu vẫn thất bại — kèm những gì đã thử và bất kỳ kết quả một phần nào đã thu được.`,
    `Báo tìm kiếm không khớp kết quả nào như một kết quả thành công, nói rõ truy vấn đã chạy và không khớp gì, để coordinator không lên lịch thử lại.`,
    `Báo tìm kiếm không khớp kết quả nào với isError true và isRetryable true, để coordinator có thể thử lại với một truy vấn rộng hơn.`,
    `Hấp thụ lỗi 503 bằng cách trả về một tập kết quả rỗng được đánh dấu thành công, và để khâu tổng hợp tự nhận ra là dữ liệu đang thiếu.`,
  ],
  why: [
    `Gộp hai điều kiện khác hẳn bản chất vào một thông báo chung xoá đúng thứ coordinator cần để quyết. Một cái là lỗi truy cập có thể tự hết, một cái là truy vấn thành công không có dữ liệu khớp — trộn lại thì mọi đường phục hồi đều biến thành đoán.`,
    `Lỗi transient nên được chữa ngay trong subagent, vì coordinator không thêm được thông tin gì cho một lần thử lại. Chỉ đẩy lên khi tại chỗ hết cách, và đẩy kèm đã thử gì cùng phần kết quả đã lấy được, để coordinator chọn được giữa đổi cách tiếp cận và đi tiếp với dữ liệu một phần.`,
    `Truy vấn chạy xong mà không khớp bản ghi nào là kết quả hợp lệ, không phải thất bại. Báo là thành công kèm nói rõ đã tìm gì giúp coordinator khỏi thử lại vô ích và vẫn ghi được khoảng trống dữ liệu vào báo cáo cuối.`,
    `Đây là bẫy hay gặp: dán nhãn lỗi lên một kết quả rỗng hợp lệ. Coordinator sẽ thử lại một truy vấn vốn đã chạy đúng. Nếu muốn nới truy vấn thì đó là quyết định về chiến lược tìm kiếm, đừng gói nó vào kênh báo lỗi.`,
    `Biến thất bại thành thành công là cách chắc chắn nhất để mất dữ liệu mà không ai biết. Đến lúc khâu tổng hợp thấy thiếu thì đã không còn ngữ cảnh để thử lại, và báo cáo cuối sẽ tự tin về một chủ đề mà hệ thống chưa thực sự đọc được gì.`,
  ],
  concept: `Hai nhánh tách biệt: lỗi transient thì subagent tự chữa tại chỗ và chỉ propagate khi hết cách, kèm những gì đã thử và kết quả một phần; còn access failure phải phân biệt rõ với valid empty result — truy vấn thành công không có kết quả khớp là dữ liệu, không phải lỗi.`,
  takeaway: `Đừng để kết quả rỗng đi vào kênh báo lỗi, và đừng để lỗi đi vào kênh kết quả thành công. Nhầm hướng nào cũng khiến coordinator quyết sai.`,
  terms: [
    ["HTTP 503", "dịch vụ tạm thời không sẵn sàng — một dạng lỗi transient"],
    ["local error recovery", "subagent tự xử lỗi trong phạm vi của nó trước khi báo lên"],
    ["error propagation", "đẩy lỗi lên cấp trên kèm ngữ cảnh để cấp trên quyết được"],
    ["partial results", "phần kết quả đã lấy được trước khi gặp lỗi"],
    ["valid empty result", "truy vấn chạy thành công nhưng không bản ghi nào khớp"],
    ["bounded retry", "thử lại có giới hạn số lần, không thử vô hạn"],
  ] },

{ id: "cca2-021", n: 21, set: 2, scenario: 3, domain: 2, task: "2.3",
  topic: "Scoped Tool Access", difficulty: "medium", type: "mc", ans: [1],
  q: `Your coordinator hands every subagent the union of all 19 MCP tools in the system, "so any agent can help with anything". You now observe the synthesis subagent issuing its own web searches and duplicating research the web search subagent already did, the report generator calling the document parser directly, and tool selection accuracy falling across every role. What is the most effective change?`,
  opts: [
    `Keep the shared tool set and add to each subagent's prompt a list of the tools it must not call.`,
    `Give each subagent only the tools its role needs — roughly four to five each — and route needs outside that set back through the coordinator.`,
    `Keep the shared tool set and set tool_choice: "any" for every subagent, so each one always calls a tool instead of answering from memory.`,
    `Replace the 19 tools with a single dispatch tool that takes a tool name and an argument object, and routes internally to the right implementation.`,
  ],
  q_vi: `Coordinator của bạn cấp cho mọi subagent hợp của toàn bộ 19 MCP tool trong hệ thống, "để agent nào cũng có thể hỗ trợ mọi việc". Giờ bạn quan sát thấy synthesis subagent tự thực hiện web search riêng và làm trùng lặp phần nghiên cứu mà web search subagent đã làm, report generator gọi thẳng document parser, và độ chính xác khi chọn tool giảm ở mọi vai trò. Thay đổi nào hiệu quả nhất?`,
  opts_vi: [
    `Giữ nguyên bộ tool dùng chung và thêm vào prompt của mỗi subagent một danh sách các tool nó không được gọi.`,
    `Chỉ cấp cho mỗi subagent những tool mà vai trò của nó cần — khoảng bốn đến năm tool mỗi vai trò — và đưa các nhu cầu nằm ngoài bộ đó quay lại qua coordinator.`,
    `Giữ nguyên bộ tool dùng chung và đặt tool_choice: "any" cho mọi subagent, để mỗi subagent luôn gọi một tool thay vì trả lời từ trí nhớ.`,
    `Thay thế 19 tool bằng một tool dispatch duy nhất nhận vào tên tool và một object tham số, rồi tự định tuyến bên trong tới đúng implementation.`,
  ],
  why: [
    `Danh sách cấm không làm giảm số lựa chọn model phải cân, vì 19 tool vẫn nằm đó và vẫn gọi được. Bạn lại phải bảo trì một danh sách cấm cho từng vai trò, và nó vẫn chỉ là chỉ dẫn mang tính xác suất.`,
    `Cho một agent quá nhiều tool làm loãng độ tin cậy khi chọn, vì độ phức tạp quyết định tăng theo số lựa chọn. Thu về đúng bộ tool của vai trò loại hẳn khả năng dùng tool ngoài chuyên môn, và nhu cầu ngoài phạm vi thì đi qua coordinator — nếu một nhu cầu lặp lại rất thường xuyên thì mới cấp thêm một tool cross-role thật hẹp.`,
    `Cấu hình này bắt model phải gọi một tool nào đó, nhưng không nói gọi tool nào — mà "tool nào" mới đúng là chỗ đang sai. Nó còn buộc subagent tổng hợp phải gọi tool cả khi việc của nó chỉ là viết ra phần tổng hợp.`,
    `Một tool dispatch làm danh sách trông gọn nhưng lấy đi chính thứ model cần để chọn: mô tả và schema của từng tool. Model phải đoán tên tool nhét vào tham số, không được kiểm tra kiểu, và bạn mất luôn khả năng giới hạn tool theo vai trò.`,
  ],
  concept: `Scoped tool access: mỗi agent chỉ nhận tool cần cho vai trò của nó (cỡ 4-5 thay vì 18-19). Tool nằm ngoài chuyên môn thì agent có xu hướng dùng sai, còn danh sách quá dài thì làm giảm độ tin cậy khi chọn tool.`,
  takeaway: `Cấp tool theo vai trò, không cấp theo kiểu "biết đâu cần". Nhu cầu ngoài phạm vi đi qua coordinator, chỉ mở tool cross-role hẹp cho những nhu cầu thật sự lặp nhiều.`,
  terms: [
    ["scoped tool access", "mỗi agent chỉ thấy tool thuộc vai trò của nó"],
    ["decision complexity", "số lựa chọn model phải cân — càng nhiều càng dễ chọn sai"],
    ["cross-specialization misuse", "agent dùng tool ngoài chuyên môn của nó"],
    [`tool_choice: "any"`, "buộc model phải gọi một tool nào đó, nhưng không chỉ định tool nào"],
    ["dispatch tool", "một tool nhận tên tool khác làm tham số rồi tự định tuyến bên trong"],
    ["cross-role tool", "tool hẹp cấp thêm cho một vai trò khác vì nhu cầu lặp lại nhiều"],
  ] },

{ id: "cca2-022", n: 22, set: 2, scenario: 4, domain: 2, task: "2.3",
  topic: "Forced Tool Choice", difficulty: "hard", type: "mc", ans: [3],
  q: `Your codebase exploration agent works best when it calls index_repo first: the tool returns a module map that makes its later Grep and Read calls targeted rather than exploratory. Your system prompt tells it to, but in roughly one session in five it starts grepping blind and exhausts the context window. Once the map is in hand you want the agent exploring autonomously, picking tools turn by turn. Which configuration gives you the guarantee you need?`,
  opts: [
    `Set tool_choice: "any" on every request in the session, so the agent always calls a tool rather than replying with text.`,
    `Set tool_choice: {"type": "tool", "name": "index_repo"} for the whole session, so the agent can never skip the step.`,
    `Keep the default tool choice behaviour and move the instruction to the top of the system prompt in stronger, more emphatic wording.`,
    `Set tool_choice: {"type": "tool", "name": "index_repo"} on the first request, then switch back to the automatic setting for the follow-up turns.`,
  ],
  q_vi: `Codebase exploration agent của bạn hoạt động tốt nhất khi nó gọi index_repo trước tiên: tool này trả về một module map giúp các lời gọi Grep và Read sau đó nhắm đúng mục tiêu thay vì tìm mò. System prompt của bạn đã chỉ dẫn agent làm vậy, nhưng cứ khoảng một trong năm phiên, nó bắt đầu grep mù và cạn context window. Một khi đã có bản đồ trong tay, bạn muốn agent tự khám phá độc lập, tự chọn tool theo từng lượt. Cấu hình nào cho bạn sự đảm bảo bạn cần?`,
  opts_vi: [
    `Đặt tool_choice: "any" cho mọi request trong phiên, để agent luôn gọi một tool thay vì trả lời bằng văn bản.`,
    `Đặt tool_choice: {"type": "tool", "name": "index_repo"} cho toàn bộ phiên, để agent không bao giờ có thể bỏ qua bước này.`,
    `Giữ nguyên hành vi chọn tool mặc định và đưa chỉ dẫn lên đầu system prompt với lời lẽ mạnh mẽ, nhấn mạnh hơn.`,
    `Đặt tool_choice: {"type": "tool", "name": "index_repo"} cho request đầu tiên, rồi chuyển về chế độ tự động cho các lượt tiếp theo.`,
  ],
  why: [
    `Cấu hình này đảm bảo có gọi tool nhưng không đảm bảo gọi index_repo — mà bỏ qua index_repo mới là chỗ đang hỏng. Nó còn buộc gọi tool ở mọi lượt, kể cả lượt đáng ra chỉ để trả lời kỹ sư bằng văn bản.`,
    `Ép chọn tool đúng cho lượt đầu, nhưng giữ nguyên cho cả session thì agent bị khoá vào index_repo mãi và không bao giờ chạy được sang Grep hay Read. Đây là chỗ dễ mất điểm nhất: tool_choice là tham số của từng request, nên bạn đặt nó theo từng lượt chứ không phải một lần cho cả phiên.`,
    `Prompt viết mạnh hơn vẫn là trông vào sự tuân thủ mang tính xác suất, và tỷ lệ một trên năm phiên đã cho thấy chừng đó không đủ khi hậu quả là cháy context window. Cần một đảm bảo tất định cho bước bắt buộc này.`,
    `Ép tool ở lượt đầu làm index_repo chắc chắn chạy trước, rồi trả về chế độ tự động cho các lượt sau để agent tự khám phá. Đây đúng là mẫu hình chuẩn: dùng forced selection cho bước phải xảy ra trước, còn các bước sau xử lý ở những lượt tiếp theo.`,
  ],
  concept: `tool_choice đặt theo từng request, không phải một lần cho cả phiên. Muốn chắc chắn một tool cụ thể chạy trước thì ép chọn nó ở lượt đầu, rồi chuyển về chế độ tự động để agent tự quyết ở các lượt sau.`,
  takeaway: `Ép tool là công cụ theo lượt. Ép ở lượt đầu để bảo đảm thứ tự, rồi nhả ra — ép cả phiên thì agent không đi tiếp được bước nào.`,
  terms: [
    ["forced tool selection", `tool_choice dạng {"type": "tool", "name": "..."} buộc gọi đúng tool đó`],
    ["per-request setting", "tham số đặt riêng cho từng lời gọi API, không phải cấu hình cả phiên"],
    ["follow-up turn", "lượt gọi tiếp theo trong cùng cuộc hội thoại"],
    ["exploratory search", "tìm mò không có bản đồ, tốn nhiều lượt và nhiều context"],
    ["module map", "bản đồ module, cho biết code nằm ở đâu trước khi đọc chi tiết"],
    ["context exhaustion", "cạn context window vì nhồi vào quá nhiều nội dung không cần"],
  ] },

);

    `Thêm server vào .mcp.json của dự án, commit vào repository, và tham chiếu token dưới dạng \${DEPLOY_METRICS_TOKEN} để nó được mở rộng từ biến môi trường của từng kỹ sư.`,
    `Thêm server vào .mcp.json của dự án với token ghi thẳng vào, rồi đưa .mcp.json vào .gitignore để secret ở lại máy cục bộ.`,
    `Ghi lệnh khởi động server và token của nó vào CLAUDE.md để Claude Code khởi động server khi project instructions được nạp.`,
  ],
  why: [
    `Cấu hình ở ~/.claude.json là user scope — chỉ áp cho máy đó, không đi theo repo. Dán tay theo hướng dẫn wiki nghĩa là mỗi người tự làm, dễ lệch phiên bản, và người mới clone về sẽ không có server nào. Đây đúng là chỗ dành cho server cá nhân hoặc đang thử nghiệm, không phải tooling cả nhóm phụ thuộc.`,
    `Đúng: .mcp.json là project scope, commit vào repo nên ai clone về cũng có ngay. Cú pháp mở rộng biến môi trường \${DEPLOY_METRICS_TOKEN} cho phép chia sẻ cấu hình mà token vẫn nằm ngoài git — mỗi người tự đặt biến môi trường của mình.`,
    `Ghi token trực tiếp rồi đưa file vào .gitignore là tự phá mục đích: file không còn được commit, nên không ai clone về mà có cấu hình. Bạn mất đúng cái lợi của project scope, lại vẫn phải phát tán secret bằng tay.`,
    `CLAUDE.md chứa hướng dẫn và ngữ cảnh cho model, không phải nơi khai báo MCP server. Claude Code không đọc CLAUDE.md để kết nối server, và viết token vào đó chính là commit secret vào repo.`,
  ],
  concept: `MCP server có hai mức phạm vi: .mcp.json ở project scope để chia sẻ tooling cho cả nhóm qua version control, và ~/.claude.json ở user scope cho server cá nhân hoặc đang thử nghiệm. Bí mật trong file project scope được xử lý bằng mở rộng biến môi trường dạng \${VAR}, không phải bằng cách ghi thẳng giá trị rồi tìm cách che file đi.`,
  takeaway: `Tooling cả nhóm cần thì khai trong .mcp.json và commit; token thì để \${BIEN_MOI_TRUONG} tự nở ra từ môi trường của từng người.`,
  terms: [

{ id: "cca2-024", n: 24, set: 2, scenario: 4, domain: 2, task: "2.4",
  topic: "MCP Resources vs Tools", difficulty: "hard", type: "mc", ans: [3],
  q: `Your productivity agent connects to an internal MCP server that wraps the company's engineering documentation: several hundred runbooks and a set of database schemas. Telemetry shows that on most tasks the agent spends six to ten tool calls guessing at document names before it finds the runbook it needs. What change most directly removes that overhead?`,
  opts: [
    `Raise the agent's context window allocation so the failed lookup attempts no longer crowd out the results that matter.`,
    `Rewrite the fetch_document tool description to list, in prose, the runbook names the team consults most often, so the agent can pick one directly.`,
    `Have the MCP server return a structured error listing near-miss document names whenever a lookup misses, so the agent can correct itself on the following call.`,
    `Expose the documentation hierarchy and the schema list as MCP resources, so the agent can see what content exists before it calls any tool.`,
  ],
  q_vi: `Agent năng suất của bạn kết nối tới một MCP server nội bộ bọc quanh tài liệu kỹ thuật của công ty: vài trăm runbook và một tập schema cơ sở dữ liệu. Telemetry cho thấy ở hầu hết task, agent tốn sáu đến mười lượt gọi tool để đoán tên tài liệu trước khi tìm ra đúng runbook cần dùng. Thay đổi nào loại bỏ trực tiếp nhất phần chi phí thừa đó?`,
  opts_vi: [
    `Tăng phân bổ context window cho agent để các lần tra cứu thất bại không còn chiếm chỗ của những kết quả quan trọng.`,
    `Viết lại mô tả tool fetch_document để liệt kê, bằng văn xuôi, tên các runbook nhóm hay tra cứu nhất, để agent có thể chọn thẳng.`,
    `Cho MCP server trả về lỗi có cấu trúc liệt kê các tên tài liệu gần đúng mỗi khi tra cứu trượt, để agent tự sửa ở lượt gọi kế tiếp.`,
    `Phơi cây tài liệu và danh sách schema ra dưới dạng MCP resources, để agent thấy được nội dung nào tồn tại trước khi gọi bất kỳ tool nào.`,
  ],
  why: [
    `Nới context window không chạm tới nguyên nhân: agent phải đoán vì nó không thấy được danh mục nội dung. Chỗ chứa rộng hơn chỉ khiến các lần đoán sai nằm lại lâu hơn, số lượt gọi vô ích không giảm.`,
    `Nhồi danh sách runbook vào mô tả tool là cách chống đỡ tạm: mô tả phình ra, phải sửa tay mỗi lần tài liệu thay đổi, và chỉ phủ được phần hay dùng chứ không phủ hết. Mô tả tool nên nói tool làm được gì, không dùng làm nơi chứa danh mục dữ liệu.`,
    `Lỗi có cấu trúc kèm gợi ý tên gần đúng là thiết kế lỗi tử tế và giúp agent tự sửa, nhưng nó vẫn chấp nhận rằng lượt gọi đầu tiên phải đoán. Bạn chỉ rút ngắn chuỗi thăm dò chứ không bỏ được nó — mỗi lần vẫn tốn ít nhất một lượt sai.`,
    `Đúng: MCP resources tồn tại đúng để phơi danh mục nội dung ra — cây tài liệu, schema cơ sở dữ liệu, danh sách issue. Agent thấy được cái gì có sẵn trước khi gọi tool nào, nên chuỗi gọi thăm dò biến mất thay vì chỉ ngắn lại. Đây là nguyên tắc phân vai trong MCP: resource để phơi nội dung, tool để thực hiện hành động.`,
  ],
  concept: `Trong MCP, tool dùng cho hành động còn resource dùng để phơi danh mục nội dung. Khi agent phải gọi tool nhiều lượt chỉ để biết có những gì tồn tại, dấu hiệu là bạn thiếu resource — không phải thiếu tool, thiếu mô tả, hay thiếu context.`,
  takeaway: `Agent đoán tên tài nguyên là triệu chứng của việc không có danh mục; phơi danh mục bằng MCP resources thì các lượt gọi thăm dò mất hẳn, đừng chỉ làm chúng thất bại dịu hơn.`,
  terms: [
    ["MCP resources", "cơ chế MCP phơi nội dung đọc được (danh mục, schema, tài liệu) cho agent thấy"],
    ["exploratory tool calls", "các lượt gọi tool chỉ để dò xem có dữ liệu gì, không tạo ra kết quả hữu ích"],
    ["content catalog", "danh mục nội dung — bảng kê những gì đang có sẵn"],
    ["structured error response", "phản hồi lỗi có cấu trúc, nói rõ loại lỗi và hướng sửa"],
    ["context window", "cửa sổ ngữ cảnh — lượng token model nhìn thấy trong một lượt"],
  ] },

{ id: "cca2-025", n: 25, set: 2, scenario: 2, domain: 2, task: "2.4",
  topic: "MCP Configuration Practices", difficulty: "medium", type: "mr", ans: [0, 2],
  q: `Your team is standardising how MCP servers are configured for the shared repository. Two integrations are in play: a Jira integration everyone needs for ticket context, and a log-tailing server you wrote last week that still crashes on some inputs. Which TWO actions follow recommended practice? (Choose TWO.)`,
  opts: [
    `Adopt an existing community MCP server for Jira and register it in the repository's project-scoped .mcp.json.`,
    `Write a custom Jira MCP server from scratch so the tool names match your team's internal vocabulary.`,
    `Keep the log-tailing server registered only in your own user-scoped ~/.claude.json until it is stable.`,
    `Register the log-tailing server in the project-scoped .mcp.json, and note in the README that teammates should not use it yet.`,
    `Merge both integrations behind a single MCP server so the agent discovers fewer tools at connection time.`,
  ],
  q_vi: `Nhóm bạn đang chuẩn hoá cách cấu hình MCP server cho repository dùng chung. Có hai tích hợp đang được cân nhắc: một tích hợp Jira mà ai cũng cần để lấy ngữ cảnh ticket, và một log-tailing server bạn viết tuần trước vẫn còn crash với một số input. HAI hành động nào sau đây đúng theo khuyến nghị? (Chọn HAI phương án.)`,
  opts_vi: [
    `Dùng một MCP server cộng đồng đã có sẵn cho Jira và đăng ký nó trong .mcp.json ở project scope của repository.`,
    `Tự viết một MCP server Jira từ đầu để tên tool khớp với từ vựng nội bộ của nhóm.`,
    `Chỉ đăng ký log-tailing server trong ~/.claude.json ở user scope của riêng bạn cho tới khi nó ổn định.`,
    `Đăng ký log-tailing server trong .mcp.json ở project scope, và ghi chú trong README rằng đồng đội chưa nên dùng nó.`,
    `Gộp cả hai tích hợp vào chung một MCP server để agent phát hiện ít tool hơn lúc kết nối.`,
  ],
  why: [
    `Đúng: với tích hợp tiêu chuẩn như Jira, nên dùng MCP server cộng đồng đã có thay vì tự viết — server tự viết để dành cho quy trình riêng của nhóm. Và vì cả nhóm cần nó, chỗ khai báo là .mcp.json ở project scope, commit vào repo.`,
    `Viết lại một tích hợp đã có sẵn là gánh thêm chi phí bảo trì mà không đổi được gì về năng lực. Nếu tên tool khó hiểu, cách rẻ hơn nhiều là làm rõ mô tả tool, không phải dựng lại cả server.`,
    `Đúng: server đang thử nghiệm và còn crash thì nằm ở user scope ~/.claude.json của riêng bạn. Nó không đi vào version control, nên không ai bị kéo theo một server chưa ổn định.`,
    `Đưa server chưa ổn định vào project scope nghĩa là ai clone về cũng kết nối tới nó, và tool của nó xuất hiện trong danh sách agent thấy được. Một dòng cảnh báo trong README không ngăn chuyện đó — agent không đọc README để quyết định gọi tool nào.`,
    `Gộp hai tích hợp không liên quan vào một server làm mờ ranh giới sở hữu và khiến cái đang thử nghiệm kéo cái đang dùng thật xuống theo. Số tool agent thấy cũng không đổi: tool của mọi MCP server đã cấu hình đều được phát hiện lúc kết nối và có sẵn đồng thời.`,
  ],
  concept: `Chọn phạm vi theo đối tượng dùng: tooling cả nhóm cần thì project scope trong .mcp.json, thứ cá nhân hoặc chưa ổn định thì user scope trong ~/.claude.json. Với tích hợp phổ biến, ưu tiên MCP server cộng đồng đã có; server tự viết dành cho quy trình đặc thù của nhóm.`,
  takeaway: `Phạm vi cấu hình phản ánh ai cần dùng, không phản ánh ai viết ra nó — và đừng dựng lại một tích hợp tiêu chuẩn khi cộng đồng đã có server dùng được.`,
  terms: [
    ["community MCP server", "MCP server có sẵn do cộng đồng phát triển cho các tích hợp phổ biến"],
    ["tool discovery", "việc agent nhận danh sách tool từ mọi MCP server đã cấu hình ngay lúc kết nối"],
    ["project-scoped", "khai trong repo nên cả nhóm nhận được qua git"],
    ["user-scoped", "khai ở home directory nên chỉ máy bạn có"],
    ["maintenance burden", "chi phí bảo trì phải gánh về sau"],
  ] },

{ id: "cca2-026", n: 26, set: 2, scenario: 4, domain: 2, task: "2.5",
  topic: "Codebase Tracing Strategy", difficulty: "medium", type: "mc", ans: [0],
  q: `An engineer asks your agent to find every place the legacy pricing function applyDiscount is used. One Grep for "applyDiscount" returns four hits, but the engineer knows there are more: the function is re-exported through barrel files under aliases such as discount and legacyDiscount, and several modules import those aliases instead. What should the agent do next?`,
  opts: [
    `Grep the barrel files for the statements that re-export applyDiscount, collect every exported name and alias, then Grep the codebase for each of those names.`,
    `Glob for **/index.ts to list every barrel file, then Read all of them plus every file that imports from them.`,
    `Read every file in the pricing module and in the modules that depend on it, so nothing is missed by pattern matching.`,
    `Re-run Grep with a looser pattern such as "iscount" so that all alias spellings are captured in a single pass.`,
  ],
  q_vi: `Một kỹ sư nhờ agent của bạn tìm mọi chỗ dùng hàm định giá cũ applyDiscount. Một lượt Grep cho "applyDiscount" trả về bốn kết quả, nhưng kỹ sư biết còn nhiều hơn thế: hàm này bị tái xuất (re-export) qua các barrel file dưới các alias như discount và legacyDiscount, và nhiều module import các alias đó thay vì tên gốc. Agent nên làm gì tiếp theo?`,
  opts_vi: [
    `Grep các barrel file để tìm các câu re-export applyDiscount, thu thập mọi tên và alias đã xuất, rồi Grep toàn bộ codebase cho từng tên đó.`,
    `Glob theo mẫu **/index.ts để liệt kê mọi barrel file, rồi Read tất cả các file đó cùng mọi file import từ chúng.`,
    `Read toàn bộ file trong pricing module và trong các module phụ thuộc vào nó, để không bỏ sót gì do khớp mẫu.`,
    `Chạy lại Grep với một mẫu lỏng hơn như "iscount" để bắt được mọi cách viết alias trong một lượt.`,
  ],
  why: [
    `Đúng: khi một hàm bị tái xuất dưới tên khác, cách làm đúng là xác định trước tập tên đã được xuất — đọc chính các câu re-export trong barrel file — rồi tìm từng tên đó trên toàn codebase. Bạn bám theo chuỗi alias thật thay vì đoán, và mỗi bước vẫn chỉ là một lượt tìm theo nội dung, gọn về context.`,
    `Glob tìm được barrel file nhưng Glob chỉ khớp đường dẫn, không biết bên trong file có gì. Đọc toàn bộ barrel file cùng mọi file import từ chúng nạp lượng lớn nội dung không liên quan vào context, trong khi việc cần làm chỉ là lấy vài dòng re-export.`,
    `Đọc hết cả module là cách tốn context nhất và vẫn không chắc đủ, vì tập "module phụ thuộc" chính là thứ bạn đang phải tìm. Nguyên tắc là dựng hiểu biết về codebase từng bước — tìm điểm vào bằng Grep rồi Read lần theo import — chứ không nạp mọi file lên trước.`,
    `Mẫu tìm lỏng tay là đoán mò: nó bắt luôn discountRate, applyDiscountLegacyV2 và mọi chuỗi chứa "iscount", đồng thời vẫn bỏ sót alias không mang chữ đó. Bạn đổi việc thiếu kết quả thành việc phải sàng nhiễu bằng tay.`,
  ],
  concept: `Truy vết cách dùng một hàm qua các lớp wrapper là bài toán hai pha: pha một tìm tập tên mà hàm được xuất ra, kể cả alias; pha hai tìm từng tên đó trên codebase. Grep tìm theo nội dung file, Glob tìm theo mẫu đường dẫn — nhầm vai hai tool này là nguồn lỗi rất thường gặp.`,
  takeaway: `Đừng tin một lượt Grep duy nhất khi codebase có barrel file: liệt kê tên đã xuất trước, rồi Grep từng tên. Grep cho nội dung, Glob cho tên file.`,
  terms: [
    ["barrel file", "file trung gian (thường index.ts) chỉ gom và tái xuất API của các module khác"],
    ["re-export", "xuất lại thứ đã định nghĩa ở nơi khác, có thể kèm đổi tên"],
    ["alias", "tên khác gán cho cùng một thứ khi xuất hoặc khi nhập"],
    ["Grep", "tool tìm theo nội dung file, dùng biểu thức chính quy"],
    ["Glob", "tool tìm file theo mẫu đường dẫn hoặc tên, ví dụ **/*.test.tsx"],
    ["incremental exploration", "khám phá từng bước — tìm điểm vào rồi lần theo import, không đọc hết từ đầu"],
  ] },

{ id: "cca2-027", n: 27, set: 2, scenario: 4, domain: 2, task: "2.5",
  topic: "Edit Fallback Strategy", difficulty: "medium", type: "mc", ans: [2],
  q: `Your agent is changing one config value in a large generated file. It calls Edit with old_string "timeout: 30", but the call fails: that exact text appears in eleven separate blocks, and only the one inside the httpClient block should change. What is the most reliable next step?`,
  opts: [
    `Retry the Edit with replace_all enabled so every occurrence is updated consistently.`,
    `Use Bash to run a sed command scoped to a line number, since the agent can compute the right line from the earlier search output.`,
    `Read the file, then Write it back with the single intended change, using the full contents the agent now holds.`,
    `Ask the engineer to paste the exact httpClient block so the Edit can be retried with text that is guaranteed unique.`,
  ],
  q_vi: `Agent của bạn đang đổi một giá trị cấu hình trong một file được sinh tự động (generated) và khá lớn. Nó gọi Edit với old_string "timeout: 30", nhưng lượt gọi thất bại: đúng đoạn văn bản đó xuất hiện ở mười một khối riêng biệt, và chỉ khối bên trong httpClient mới được phép đổi. Bước tiếp theo đáng tin cậy nhất là gì?`,
  opts_vi: [
    `Gọi lại Edit với replace_all bật lên để mọi lần xuất hiện được cập nhật đồng loạt.`,
    `Dùng Bash để chạy một lệnh sed giới hạn theo số dòng, vì agent có thể tính ra đúng số dòng từ kết quả tìm kiếm trước đó.`,
    `Read file, rồi Write lại với đúng một thay đổi mong muốn, dùng toàn bộ nội dung mà agent đang nắm trong tay.`,
    `Nhờ kỹ sư dán chính xác khối httpClient để có thể gọi lại Edit với đoạn văn bản chắc chắn duy nhất.`,
  ],
  why: [
    `replace_all sửa cả mười một chỗ, trong khi yêu cầu chỉ đổi khối httpClient. Nó làm lời gọi thành công nhưng cho kết quả sai — đây là bẫy dễ vào nhất, chính vì tool không báo lỗi nữa.`,
    `sed theo số dòng thì mong manh: số dòng chỉ còn đúng cho tới lần sửa file kế tiếp, và agent phải tin rằng con số suy ra từ kết quả tìm trước đó vẫn khớp. Nó cũng là cách đi vòng qua tool sửa file bằng shell, khó kiểm soát và khó xác nhận hơn.`,

{ id: "cca2-028", n: 28, set: 2, scenario: 2, domain: 3, task: "3.1",
  topic: "CLAUDE.md Modular Imports", difficulty: "medium", type: "mc", ans: [3],
  q: `Your monorepo has five packages: web/ (React), api/ (Node services), jobs/ (batch workers), sdk/ (a published client library), and infra/. The root CLAUDE.md has grown to 600 lines because it carries the standards for all five. Each package has its own maintainers who know their area best, and most of the file is irrelevant to a developer working inside one package. A small set of rules — commit message format, the error-logging contract — genuinely applies everywhere. You want each package's conventions owned and updated by its maintainers, with the shared rules living in exactly one place. Which approach fits Claude Code's configuration model?`,
  opts: [
    `Keep the single root CLAUDE.md, but give each package's section its own paths frontmatter field so that section activates only for that package.`,
    `Have each package's maintainers put their standards in their own ~/.claude/CLAUDE.md so they directly own the content they are responsible for.`,
    `Convert every package's standards into a skill per package so maintainers update their own SKILL.md, and delete the root CLAUDE.md.`,
    `Put a CLAUDE.md in each package directory that uses @import to pull in the standards files that package needs, and leave only the truly universal rules in the root CLAUDE.md.`,
  ],
  q_vi: `Monorepo của bạn có năm package: web/ (React), api/ (Node services), jobs/ (batch workers), sdk/ (một thư viện client được publish), và infra/. CLAUDE.md ở gốc đã phình lên 600 dòng vì nó gánh chuẩn cho cả năm package. Mỗi package có maintainer riêng, người hiểu rõ nhất khu vực của mình, và phần lớn nội dung file không liên quan tới một developer đang làm việc trong một package cụ thể. Có một nhóm quy tắc nhỏ — định dạng commit message, hợp đồng ghi log lỗi — thực sự áp dụng ở khắp nơi. Bạn muốn quy ước của từng package do maintainer của package đó sở hữu và cập nhật, còn các quy tắc dùng chung thì chỉ tồn tại đúng một chỗ. Cách tiếp cận nào khớp với model cấu hình của Claude Code?`,
  opts_vi: [
    `Giữ nguyên một CLAUDE.md gốc duy nhất, nhưng gán cho mỗi section của từng package một trường frontmatter paths riêng để section đó chỉ kích hoạt cho package tương ứng.`,
    `Để maintainer của mỗi package đặt chuẩn của mình vào ~/.claude/CLAUDE.md của riêng họ để họ trực tiếp sở hữu nội dung mình phụ trách.`,
    `Chuyển chuẩn của từng package thành một skill riêng cho mỗi package để maintainer cập nhật SKILL.md của mình, và xoá CLAUDE.md gốc.`,
    `Đặt một CLAUDE.md trong từng thư mục package, dùng @import để kéo vào các file chuẩn mà package đó cần, và chỉ giữ lại những quy tắc thật sự phổ quát trong CLAUDE.md gốc.`,
  ],
  why: [
    `Trường paths là frontmatter của một FILE trong .claude/rules/, không phải nhãn gắn được cho từng section bên trong CLAUDE.md. Một file chỉ có một khối frontmatter, nên không có cách bật/tắt riêng từng đoạn của CLAUDE.md. Cách này cũng không trả quyền sở hữu nội dung về cho maintainer từng package.`,
    `File ~/.claude/CLAUDE.md là cấu hình user-level: nằm ngoài repo, không đi qua version control. Chuẩn của package chỉ có hiệu lực trên máy của chính người viết, còn người khác vào sửa package đó thì không nhận được gì.`,
    `Skill được nạp theo nhu cầu — khi bạn gọi hoặc khi Claude thấy tác vụ liên quan — chứ không tự áp dụng vì bạn đang mở file trong package. Xoá CLAUDE.md gốc còn làm mất luôn phần dùng chung (commit format, hợp đồng ghi log lỗi) vốn phải luôn được nạp.`,
    `Đây là cách khớp với model cấu hình của Claude Code: CLAUDE.md ở thư mục package cho ngữ cảnh theo nơi bạn đang làm, @import kéo vào đúng những file chuẩn package đó cần nên nội dung dùng chung chỉ tồn tại một bản, và phần thật sự phổ quát ở lại file gốc. Mỗi maintainer sửa file chuẩn của mình mà không phải chạm vào một file 600 dòng dùng chung.`,
  ],
  concept: `@import cho phép CLAUDE.md tham chiếu file bên ngoài thay vì nhồi hết nội dung vào một chỗ. Ghép với CLAUDE.md cấp thư mục, mỗi package chọn đúng bộ chuẩn liên quan còn phần dùng chung vẫn giữ một nguồn duy nhất.`,
  takeaway: `Monorepo nhiều package thì đặt CLAUDE.md ở từng thư mục package và dùng @import kéo file chuẩn cần thiết; ở gốc chỉ giữ những gì mọi package đều phải theo.`,
  terms: [

    ["monorepo", "một repo chứa nhiều package con"],
    ["single source of truth", "một bản duy nhất, sửa một nơi là xong"],
    ["paths frontmatter", "trường khai glob của file trong .claude/rules/"],

{ id: "cca2-029", n: 29, set: 2, scenario: 2, domain: 3, task: "3.1",
  topic: "Memory File Diagnosis", difficulty: "easy", type: "mc", ans: [1],
  q: `Two developers get different behavior from Claude Code in the same repository. One reports that Claude reliably strips console.log calls before suggesting a commit, per the team's rule; the other reports Claude leaves them in. Both are on the same commit with a clean working tree. Before you change any configuration, what is the most direct way to establish which instruction files each session actually loaded?`,

    `Run the /memory command in each session to list the memory files that are loaded.`,
    `Run git status in both checkouts to confirm that no CLAUDE.md or rule file differs between them.`,
    `Set CLAUDE_DEBUG_MEMORY=true before starting each session so Claude Code prints the resolved instruction files at startup.`,
  ],
  q_vi: `Hai developer nhận được hành vi khác nhau từ Claude Code trong cùng một repository. Một người báo rằng Claude luôn xoá các lệnh gọi console.log trước khi đề xuất commit, đúng theo quy tắc của team; người kia báo rằng Claude vẫn để nguyên chúng. Cả hai đang ở cùng một commit với working tree sạch. Trước khi bạn thay đổi bất kỳ cấu hình nào, cách trực tiếp nhất để xác định từng session thực sự đã nạp những instruction file nào là gì?`,
  opts_vi: [

    `Chạy lệnh /memory trong mỗi session để liệt kê các memory file đang được nạp.`,
    `Chạy git status ở cả hai checkout để xác nhận không có CLAUDE.md hay rule file nào khác nhau giữa chúng.`,

  why: [
    `Bảo Claude tự kể chỉ dẫn đang theo là dựa vào self-report: nó diễn giải lại bằng lời, dễ bỏ sót, và không cho bạn đường dẫn file nào đã nạp. Đúng thứ bạn cần đối chiếu thì lại thiếu.`,
    `Lệnh /memory liệt kê các memory file đang được nạp trong session, nên bạn thấy ngay một bên có thêm một file mà bên kia không có — thường là file ở ~/.claude/. Đây là bước chẩn đoán đứng trước mọi việc sửa cấu hình.`,

  terms: [

{ id: "cca2-030", n: 30, set: 2, scenario: 4, domain: 3, task: "3.2",
  topic: "Skill Tool Restriction", difficulty: "medium", type: "mc", ans: [2],
  q: `Your productivity tool ships a /map-service skill that helps engineers understand an unfamiliar service: it greps for entry points, reads the files it finds, and prints a structural summary. Twice it has done more than that — once it ran a shell command that reinstalled dependencies, once it edited a config file it had only been asked to describe. The SKILL.md already states, in bold, "This skill is read-only. Never modify files or run installs." What should you change?`,
  opts: [
    `Move the read-only warning to the very top of SKILL.md and repeat it in the description frontmatter so Claude encounters it before acting.`,
    `Add context: fork to the skill so the exploration runs in an isolated sub-agent context.`,
    `Add an allowed-tools field to the skill frontmatter listing only Read, Grep, and Glob.`,
    `Add deny rules for Bash and Edit to the project settings so those tools are unavailable in this repository.`,
  ],
  q_vi: `Công cụ productivity của bạn có sẵn một skill /map-service giúp kỹ sư hiểu một service chưa quen: nó grep tìm entry point, đọc các file tìm được, rồi in ra một bản tóm tắt cấu trúc. Đã hai lần nó làm nhiều hơn thế — một lần nó chạy một lệnh shell để cài lại dependencies, một lần nó sửa một file config mà nó chỉ được yêu cầu mô tả. SKILL.md đã ghi sẵn, in đậm, "This skill is read-only. Never modify files or run installs." Bạn nên thay đổi điều gì?`,
  opts_vi: [
    `Chuyển cảnh báo read-only lên đầu SKILL.md và lặp lại nó trong frontmatter description để Claude gặp nó trước khi hành động.`,
    `Thêm context: fork vào skill để việc khám phá chạy trong một ngữ cảnh sub-agent biệt lập.`,
    `Thêm trường allowed-tools vào frontmatter của skill, chỉ liệt kê Read, Grep, và Glob.`,
    `Thêm deny rule cho Bash và Edit vào project settings để hai tool đó không khả dụng trong repository này.`,
  ],
  why: [
    `Vẫn là chỉ dẫn ở mức prompt. SKILL.md là template prompt chứ không phải chương trình có cưỡng chế, nên "đừng sửa file" là một mong muốn — nó đã nằm sẵn trong file và đã thất bại hai lần. Nhắc to hơn, sớm hơn không tạo ra rào chắn nào.`,
    `Fork cô lập ngữ cảnh, không cô lập quyền. Sub-agent chạy trong context riêng vẫn có Bash và Edit, nên nó vẫn đủ sức cài lại dependency; bạn chỉ được ít ồn ào hơn ở hội thoại chính.`,
    `allowed-tools trong frontmatter giới hạn đúng bộ tool mà skill được dùng trong lúc chạy. Khai riêng Read, Grep, Glob thì thao tác ghi file và chạy shell không còn nằm trong tầm tay, nên tính chất chỉ-đọc trở thành ràng buộc thật thay vì lời hứa trong prompt.`,
    `Cơ chế chặn ở settings có thật và đủ mạnh, nhưng sai phạm vi: nó tắt Bash và Edit cho mọi việc trong repo, kể cả khi bạn đang thật sự cần sửa code. Ràng buộc nào thuộc về skill thì khai trong chính skill đó.`,
  ],
  concept: `allowed-tools là frontmatter của SKILL.md, hạn chế bộ tool trong suốt lúc skill chạy. Nó khác context: fork — fork xử lý ngữ cảnh, allowed-tools xử lý quyền.`,
  takeaway: `Muốn một skill thật sự chỉ-đọc thì khai allowed-tools; câu "đừng làm X" trong SKILL.md không phải cơ chế cưỡng chế, và context: fork không giới hạn quyền tool.`,
  terms: [
    ["allowed-tools", "frontmatter khai bộ tool skill được phép dùng"],
    ["enforcement", "cưỡng chế bằng cơ chế, không phụ thuộc Claude có tuân lời"],
    ["read-only skill", "skill chỉ đọc, không ghi file và không chạy lệnh"],
    ["deny rule", "luật chặn tool ở mức settings, phạm vi cả repo"],
    ["context: fork", "chạy skill trong sub-agent riêng — cô lập ngữ cảnh, không phải quyền"],
  ] },

{ id: "cca2-031", n: 31, set: 2, scenario: 4, domain: 3, task: "3.2",
  topic: "Skill Argument Hints", difficulty: "medium", type: "mc", ans: [0],
  q: `Your team's /scaffold-endpoint skill takes a resource name and an HTTP method, then generates the handler, its test, and the route registration. Engineers who did not write the skill keep invoking a bare /scaffold-endpoint with no arguments, and Claude then infers a resource name from whatever was discussed earlier in the session, producing files that have to be deleted. You want the skill itself to surface what it expects, at the moment someone invokes it without arguments. Which frontmatter change does that?`,

  opts_vi: [

    `Thêm trường required: true bên cạnh mỗi khai báo tham số trong frontmatter.`,
    `Mở rộng frontmatter description để nêu rõ hai tham số mà skill cần.`,

  why: [

    `Tham số vị trí chỉ là chỗ thay thế văn bản. Không truyền thì $1 và $2 thành chuỗi rỗng và skill vẫn chạy bình thường; không có cơ chế nào chặn lại, nên Claude vẫn tiếp tục đoán tên resource.`,
    `Frontmatter của SKILL.md không có trường required khai cho từng tham số. Không có cách đánh dấu tham số bắt buộc theo kiểu đó, nên cấu hình này đơn giản là không có hiệu lực.`,
    `description nói skill dùng để làm gì và giúp quyết định khi nào gọi nó, nhưng đó không phải chỗ hiện gợi ý tham số lúc gọi. Viết dài thêm cũng không đưa thông tin tới đúng thời điểm người ta bấm lệnh.`,

  takeaway: `Skill cần tham số mà người ta hay gọi trống thì khai argument-hint; $1 và $2 không cưỡng chế được sự hiện diện của tham số.`,

{ id: "cca2-035", n: 35, set: 2, scenario: 2, domain: 3, task: "3.4",

  q: `You used plan mode to work out a migration from your in-house HTTP client to a third-party library. The plan is approved: 45 call sites take an identical mechanical transformation, and the plan explicitly flags 3 files where retry and timeout semantics differ and the decision is still open. A teammate suggests staying in plan mode for the whole rollout "so nothing gets applied without review." How should you proceed?`,

    `Fix them strictly one at a time, re-running the script after each fix so any new failure can be attributed to the change that caused it.`,
    `Send the two entangled problems in separate messages so each fix stays small, then batch the log wording and the docstring together at the end.`,
    `Describe the batch-size and retry problems together in one detailed message so the fix accounts for their interaction, then handle the log wording and the docstring as separate independent iterations.`,
  ],
  q_vi: `Claude Code đã sinh ra một script migration dữ liệu. Review của bạn phát hiện bốn vấn đề: batch size khiến mỗi transaction vượt quá statement timeout của database, retry wrapper chạy lại toàn bộ batch nên các row đã ghi bị nhân đôi, log tiến độ in "rows" trong khi ý muốn nói "batches", và một docstring có tên tham số đã lỗi thời. Hai vấn đề đầu ràng buộc lẫn nhau — đổi batch size sẽ đổi luôn những gì mà retry phải hoàn tác. Bạn nên phản hồi việc này thế nào?`,
  opts_vi: [
    `Gửi cả bốn vấn đề trong một message để Claude có bức tranh đầy đủ và có thể xử lý mọi thứ trong một lượt mạch lạc.`,
    `Sửa nghiêm ngặt từng vấn đề một, chạy lại script sau mỗi lần sửa để bất kỳ lỗi mới nào cũng có thể quy về đúng thay đổi đã gây ra nó.`,
    `Gửi hai vấn đề ràng buộc lẫn nhau trong các message riêng để mỗi lần sửa nhỏ gọn, rồi gộp câu chữ log và docstring lại với nhau ở cuối.`,
    `Mô tả vấn đề batch size và retry cùng nhau trong một message chi tiết để cách sửa tính đến tương tác giữa chúng, rồi xử lý câu chữ log và docstring như các lượt độc lập riêng biệt.`,
  ],
  why: [
    `Gộp cả bốn thì Claude có đủ thông tin, nhưng bạn trộn hai lỗi đúng-sai về dữ liệu với hai lỗi câu chữ. Sự chú ý bị chia cho bốn việc lệch hẳn nhau về mức quan trọng, và phần khó nhất — quan hệ giữa batch size và cái mà retry phải hoàn tác — dễ bị xử lý nông. Gộp là đúng cho nhóm tương tác, không phải cho mọi thứ.`,
    `Sửa lần lượt tuyệt đối cho việc quy trách nhiệm lỗi rất rõ, nhưng nó phá đúng cặp không được tách: chọn batch size mà chưa biết retry sẽ hoàn tác thế nào (hoặc ngược lại) thường cho ra một cách sửa phải bỏ đi ở lượt sau. Sửa tuần tự là chiến lược cho các lỗi độc lập.`,
    `Cách này đảo ngược cả hai nguyên tắc: nó tách đúng cặp lỗi tương tác cần cùng nhìn một lượt, rồi lại gộp hai lỗi hoàn toàn độc lập vốn chẳng cần gộp. Hệ quả là phần quan trọng nhất bị sửa với thông tin thiếu.`,
    `Đúng. Batch size và hành vi retry ràng buộc lẫn nhau, nên phải nằm trong cùng một message chi tiết để cách sửa tính được tương tác giữa chúng. Câu chữ log và docstring không liên quan tới nhau cũng không liên quan tới cặp trên, nên xử lý thành các lượt riêng là gọn nhất và giữ mỗi lượt dễ kiểm chứng.`,
  ],
  concept: `Tiêu chí gộp hay tách không phải số lượng lỗi mà là chúng có tương tác không. Lỗi mà cách sửa ảnh hưởng lẫn nhau phải được trình bày cùng nhau trong một message chi tiết; lỗi độc lập thì lặp tuần tự từng cái cho dễ kiểm chứng.`,
  takeaway: `Lỗi có tương tác thì gộp vào một message chi tiết để cách sửa tính được ảnh hưởng chéo; lỗi độc lập thì sửa tuần tự — đừng lấy số lượng làm tiêu chí.`,
  terms: [
    ["interacting issues", "các lỗi mà cách sửa cái này đổi luôn cách sửa cái kia"],
    ["independent issues", "các lỗi không ảnh hưởng nhau, sửa riêng được"],
    ["sequential iteration", "lặp tuần tự, sửa từng vấn đề rồi kiểm lại"],
    ["statement timeout", "hạn thời gian database cho một câu lệnh trước khi bị hủy"],
    ["partial write", "ghi dở dang; retry cả batch làm phần đã ghi bị nhân đôi"],
  ] },

{ id: "cca2-037", n: 37, set: 2, scenario: 4, domain: 3, task: "3.5",
  topic: "Test-Driven Iteration", difficulty: "easy", type: "mc", ans: [1],
  q: `Your agent generates a pagination helper in a codebase nobody on the team knows well. Each round you read the code, notice something off, and describe it in prose. Three rounds in, the helper handles the happy path but keeps regressing on empty result sets and on the last partial page—a case you thought was fixed two rounds ago. What should you do to stop the refinement loop from drifting?`,
  opts: [
    `Ask the agent to re-read its own implementation and list every case it thinks might still be unhandled before you review again.`,
    `Write a test suite up front covering expected behavior, the edge cases you know about, and the performance target, then iterate by handing the agent the failing test output.`,
    `Rewrite your prose description of the requirements in more precise language and restart the loop from a clean file.`,
    `Ask the agent to add defensive guards for empty pages and partial pages so those two cases cannot regress again.`,
  ],
  q_vi: `Agent của bạn sinh ra một pagination helper trong một codebase mà không ai trong nhóm nắm rõ. Mỗi lượt bạn đọc code, nhận ra có gì đó không ổn, và mô tả bằng văn xuôi. Sau ba lượt, helper xử lý tốt happy path nhưng cứ regression ở tập kết quả rỗng và ở trang cuối chưa đầy — một ca mà bạn tưởng đã sửa xong hai lượt trước. Bạn nên làm gì để vòng lặp tinh chỉnh ngừng trôi dạt?`,
  opts_vi: [
    `Nhờ agent tự đọc lại implementation của chính nó và liệt kê mọi ca mà nó nghĩ vẫn chưa được xử lý trước khi bạn review lại.`,
    `Viết một bộ test trước, phủ hành vi mong đợi, các ca biên bạn đã biết, và mục tiêu hiệu năng, rồi lặp bằng cách đưa cho agent output test thất bại.`,
    `Viết lại mô tả yêu cầu bằng văn xuôi chính xác hơn và khởi động lại vòng lặp từ một file sạch.`,
    `Nhờ agent thêm các chốt chặn phòng vệ cho trang rỗng và trang chưa đầy để hai ca đó không thể regression lần nữa.`,
  ],
  why: [
    `Nhờ agent tự soi lại code của chính nó trong cùng ngữ cảnh thường cho ra danh sách phỏng đoán chứ không phải tín hiệu đúng-sai, và nó có xu hướng bảo vệ các lựa chọn nó vừa đưa ra. Bạn vẫn không có gì ghim lại những hành vi đã đúng để chúng khỏi hỏng ở lượt sau.`,
    `Đúng. Viết bộ test trước — phủ hành vi mong đợi, các ca biên bạn đã biết, và yêu cầu hiệu năng — biến vòng lặp từ "tôi đọc và thấy hơi sai" thành tín hiệu khách quan, lặp lại được. Sau đó bạn chỉ cần đưa output test fail: nó chỉ đúng hành vi nào sai, và các test đã xanh sẽ bắt ngay lượt sửa nào làm hỏng ca cũ.`,
    `Viết lại mô tả cho chính xác hơn thì vẫn là văn xuôi, mà bạn đã chạy ba lượt cho thấy văn xuôi bị hiểu mỗi lần một khác. Nó cũng không ghim lại hành vi đã đúng, nên vấn đề regression vẫn còn nguyên.`,
    `Vá đúng hai ca bạn vừa nhìn thấy là xử lý triệu chứng: không có bộ test nào canh, lượt sửa tiếp theo vẫn có thể làm hỏng lại chúng, và các ca biên bạn chưa nghĩ ra thì vẫn nằm ngoài tầm nhìn.`,
  ],
  concept: `Test-driven iteration đổi bản chất vòng lặp tinh chỉnh: bộ test viết trước là đặc tả thi hành được, và output test fail là phản hồi cụ thể, lặp lại được. Nó vừa nói rõ cái gì sai vừa ghim lại các hành vi đã đúng để phát hiện regression.`,
  takeaway: `Khi vòng tinh chỉnh cứ trôi và ca biên hỏng lại, hãy viết bộ test trước rồi lặp bằng cách đưa output test fail — văn xuôi chính xác hơn không ghim được hành vi đã đúng.`,
  terms: [
    ["test-driven iteration", "viết test trước rồi tinh chỉnh dựa trên test fail"],
    ["failing test output", "kết quả test thất bại, dùng làm phản hồi cụ thể cho lượt sửa sau"],
    ["regression", "hành vi từng đúng nay hỏng lại sau một lượt sửa"],
    ["happy path", "luồng thuận lợi, dữ liệu đúng như mong đợi"],
    ["partial page", "trang cuối không đủ số phần tử — ca biên kinh điển của pagination"],
  ] },

{ id: "cca2-038", n: 38, set: 2, scenario: 5, domain: 3, task: "3.6",
  topic: "CI Session Isolation", difficulty: "medium", type: "mr", ans: [1, 3],
  q: `Your CI pipeline has two Claude Code steps. Step one generates the missing unit tests for changed modules. Step two reviews those generated tests by resuming step one's session with --resume, which the team chose in order to reuse the already-loaded context. Two complaints come back from developers: step two signs off on almost everything, including tests a human reviewer rejects immediately; and the generated tests build their own inline fixtures instead of using the shared factories the repo already has, while asserting trivial getters. Which TWO changes address these complaints? (Choose TWO.)`,
  opts: [
    `Add a self-critique instruction to the step-one prompt asking Claude to list weaknesses in the tests it just wrote before it finishes.`,
    `Run step two as an independent Claude Code invocation with its own session, passing it only the diff and the review criteria instead of resuming the generating session.`,
    `Move step two to the Message Batches API so the review runs asynchronously and stops adding to pipeline wall time.`,
    `Document the testing standards, what counts as a valuable test, and the available shared fixtures in CLAUDE.md so every CI invocation picks them up.`,
    `Add --output-format json with --json-schema to step two so the pipeline can parse its verdict reliably.`,
  ],
  q_vi: `Pipeline CI của bạn có hai bước Claude Code. Bước một sinh ra các unit test còn thiếu cho những module đã thay đổi. Bước hai review các test vừa sinh bằng cách resume session của bước một với --resume, điều mà nhóm chọn để tái sử dụng ngữ cảnh đã nạp sẵn. Hai than phiền quay lại từ các developer: bước hai duyệt qua gần như mọi thứ, kể cả những test mà một người review sẽ từ chối ngay lập tức; và các test được sinh ra tự dựng fixture inline riêng thay vì dùng các factory dùng chung mà repo đã có sẵn, trong khi lại assert các getter tầm thường. HAI thay đổi nào giải quyết được các than phiền này? (Chọn HAI phương án.)`,
  opts_vi: [
    `Thêm một chỉ dẫn tự phê bình vào prompt của bước một, yêu cầu Claude liệt kê điểm yếu trong các test nó vừa viết trước khi kết thúc.`,
    `Chạy bước hai như một lần gọi Claude Code độc lập với session riêng của nó, chỉ đưa cho nó diff và tiêu chí review thay vì resume session đã sinh code.`,
    `Chuyển bước hai sang Message Batches API để việc review chạy bất đồng bộ và không còn cộng thêm vào thời gian chạy thực tế của pipeline.`,
    `Ghi lại chuẩn testing, thế nào là một test đáng giá, và các fixture dùng chung sẵn có vào CLAUDE.md để mọi lần gọi từ CI đều nhận được.`,
    `Thêm --output-format json cùng --json-schema vào bước hai để pipeline có thể parse kết luận của nó một cách đáng tin cậy.`,
  ],
  why: [
    `Tự phê bình ngay trong session vừa sinh ra code không vượt được chính cái làm nó dễ dãi: nó đã kết luận các test này ổn, và lập luận đó vẫn nằm nguyên trong ngữ cảnh. Bạn nhận thêm một đoạn tự nhận xét chứ không phải một góc nhìn mới.`,
    `Đúng. Session đã sinh code review chính nó kém hơn một instance độc lập, vì nó thấy toàn bộ lập luận biện minh cho từng lựa chọn. Chạy bước review thành một lần gọi riêng, ngữ cảnh riêng, chỉ đưa diff và tiêu chí review, cho nó đúng vị thế của người review thứ hai — điều mà --resume triệt tiêu.`,
    `Chuyển sang Message Batches API là bàn về chi phí và thời điểm, không chạm tới chất lượng review hay chất lượng test sinh ra. Với một bước trong pipeline còn phải chặn để báo kết quả, cửa sổ xử lý tới 24 giờ của batch còn làm hỏng luôn workflow.`,
    `Đúng. Fixture tự bịa và assert getter tầm thường là triệu chứng thiếu ngữ cảnh dự án: Claude không biết repo đã có factory nào và nhóm coi test thế nào là đáng viết. CLAUDE.md chính là cơ chế cấp ngữ cảnh đó cho Claude Code khi được gọi từ CI, và nó áp cho mọi lần gọi chứ không phải nhớ dán vào từng prompt.`,
    `Cặp cờ này thật và cần khi pipeline phải parse kết quả, nhưng nó giải quyết chuyện đọc được đầu ra, không giải quyết review dễ dãi hay test kém giá trị. Đầu ra parse tin cậy của một verdict sai vẫn là verdict sai.`,
  ],
  concept: `Hai gốc khác nhau, hai cách chữa khác nhau: review dễ dãi đến từ việc review chạy trong đúng session đã sinh code (session context isolation), còn test kém giá trị đến từ việc thiếu ngữ cảnh dự án, mà CLAUDE.md là cơ chế cấp ngữ cảnh cho Claude Code chạy trong CI.`,
  takeaway: `Trong CI, tách bước review thành một lần gọi độc lập chỉ nhận diff và tiêu chí, và đưa chuẩn test cùng danh sách fixture có sẵn vào CLAUDE.md — tự phê bình trong cùng session và cờ định dạng đầu ra đều không chữa hai lỗi này.`,
  terms: [
    ["--resume", "cờ tiếp tục một session cũ, kéo theo cả lập luận trước đó"],
    ["session context isolation", "cách ly ngữ cảnh session; review nên chạy trong session riêng"],
    ["shared fixtures / factories", "dữ liệu test dùng chung của repo, thay vì tự dựng inline"],
    ["valuable test criteria", "tiêu chí thế nào là test đáng viết (thay vì assert getter)"],
    ["CLAUDE.md", "nơi khai báo ngữ cảnh dự án, áp cho mọi lần gọi Claude Code kể cả từ CI"],
    ["verdict", "kết luận review mà pipeline dùng để pass/fail bước đó"],
  ] },

{ id: "cca2-039", n: 39, set: 2, scenario: 5, domain: 3, task: "3.6",
  topic: "Structured CI Output", difficulty: "hard", type: "mc", ans: [2],
  q: `Your review step already runs \`claude -p "<review prompt>" --output-format json\` and the pipeline parses the returned JSON without ever failing. Yet the step still cannot post findings as inline PR comments: the result field holds a few paragraphs of prose that mention file paths and line numbers inside sentences. You need one object per finding, each with file, line, severity, and suggested fix. What is the correct fix?`,
  opts: [
    `Keep --output-format json and add a regex post-processor that pulls file paths, line numbers, and severities out of the prose in the result field.`,
    `Drop --output-format json and have the review prompt emit a fenced JSON code block instead, then extract that block from the plain-text output.`,
    `Keep --output-format json and add --json-schema with a schema describing the findings array, so the model's own output is constrained to that shape instead of merely being wrapped in a JSON envelope.`,
    `Add a second claude -p step that reads the prose review and converts it into the findings JSON the pipeline expects.`,
  ],
  q_vi: `Bước review của bạn đã chạy claude -p "<review prompt>" --output-format json và pipeline parse JSON trả về mà không bao giờ lỗi. Thế nhưng bước này vẫn không thể đăng các finding thành comment inline trên PR: trường result chứa vài đoạn văn xuôi có nhắc đường dẫn file và số dòng lồng trong câu. Bạn cần mỗi finding là một object riêng, có đủ file, line, severity, và suggested fix. Đâu là cách sửa đúng?`,
  opts_vi: [
    `Giữ --output-format json và thêm một bộ hậu xử lý bằng regex để rút đường dẫn file, số dòng, và severity ra khỏi văn xuôi trong trường result.`,
    `Bỏ --output-format json và để prompt review xuất ra một khối code JSON có fence thay vào đó, rồi trích khối đó ra từ output văn bản thuần.`,
    `Giữ --output-format json và thêm --json-schema với một schema mô tả mảng findings, để chính output của model bị ràng buộc theo hình dạng đó thay vì chỉ được bọc trong một envelope JSON.`,
    `Thêm một bước claude -p thứ hai đọc bản review văn xuôi và chuyển nó thành JSON findings mà pipeline mong đợi.`,
  ],
  why: [
    `Regex trên văn xuôi đúng là thứ mà đầu ra có cấu trúc sinh ra để thay thế: câu chữ đổi mỗi lần chạy, một finding có thể trải nhiều câu, và phần "suggested fix" nhiều dòng thì không có dấu phân cách nào đáng tin. Bạn đổi một lỗi parse thành một lỗi im lặng: pipeline vẫn chạy nhưng bỏ sót hoặc gán sai finding.`,
    `Cách này bỏ một envelope máy đọc được đang hoạt động tốt để quay về nhờ prompt định dạng — thứ model tuân theo phần lớn số lần, không phải mọi lần. Bạn vẫn đang bới văn bản để tìm code fence, chỉ là bới ở một tầng khác.`,
    `Đúng. --output-format json quy định envelope mà CLI in ra (metadata cùng trường result), chứ không ràng buộc hình dạng của những gì model viết vào trong result — nên parse không bao giờ lỗi mà nội dung vẫn là văn xuôi. --json-schema mới ràng buộc chính đầu ra của model theo schema bạn khai, đảm bảo mỗi finding có đủ file, line, severity, suggested fix ở mọi lần chạy.`,
    `Thêm một lần gọi model nữa để dịch văn xuôi sang JSON là thêm chi phí, thêm độ trễ, và thêm một chỗ có thể trôi — trong khi một cờ trên chính lần gọi đang có đã cưỡng chế được hình dạng ngay từ đầu. Bước dịch cũng chỉ chính xác đến mức văn xuôi nó đọc được, mà văn xuôi thì đã mất thông tin.`,
  ],
  concept: `Hai cờ này làm hai việc khác nhau: --output-format json khiến CLI in ra một envelope JSON (metadata và trường result), còn --json-schema ràng buộc nội dung model sinh ra theo schema đã khai. Parse được envelope không có nghĩa nội dung bên trong đã có cấu trúc.`,
  takeaway: `Envelope JSON parse được không đồng nghĩa dữ liệu có cấu trúc — muốn từng finding có đủ trường ở mọi lần chạy thì phải khai --json-schema, đừng vá bằng regex hay thêm một lần gọi model để dịch.`,
  terms: [
    ["--output-format json", "cờ khiến CLI in ra envelope JSON (metadata + trường result)"],

    ["JSON envelope", "lớp vỏ JSON bọc kết quả; parse được vỏ không bảo đảm nội dung có cấu trúc"],

{ id: "cca2-040", n: 40, set: 2, scenario: 5, domain: 4, task: "4.1",
  topic: "Criteria vs Confidence", difficulty: "medium", type: "mc", ans: [2],
  q: `Your CI review prompt currently ends with: "Be conservative. Only report findings you are highly confident about." Three weeks later the false positive rate on style and documentation findings is essentially unchanged, and the reviews now also miss null-dereference bugs they used to catch. What change addresses the root cause?`,
  opts: [

    `Set temperature to 0 so the model's judgment about what counts as a finding stops varying between runs.`,
  ],
  q_vi: `Prompt review CI của bạn hiện đang kết thúc bằng: "Be conservative. Only report findings you are highly confident about." Ba tuần sau, tỷ lệ false positive ở các finding về style và documentation gần như không đổi, và các review giờ còn bỏ sót cả lỗi null-dereference mà trước đây vẫn bắt được. Thay đổi nào giải quyết đúng nguyên nhân gốc rễ?`,
  opts_vi: [
    `Tăng liều cho câu hedging: chỉ dẫn model chỉ báo một finding nếu nó sẵn sàng đặt cược cả danh tiếng vào đó.`,
    `Để model tự gắn một điểm confidence cho mỗi finding và loại bỏ mọi finding dưới 0.8 trước khi đăng.`,

  why: [
    `Tăng liều "hãy thận trọng" vẫn là đúng cơ chế đang thất bại, chỉ to tiếng hơn. Cụm này không nói cho mô hình biết LOẠI vấn đề nào đáng báo, nên nó siết đều lên mọi thứ — ra đúng triệu chứng bạn đang thấy: báo động giả ở style/documentation không giảm mà lỗi null-dereference thật thì bị bỏ.`,
    `Điểm tin cậy do mô hình tự gán chưa được hiệu chỉnh, nên ngưỡng 0.8 chỉ là một con số cắt trên đại lượng không đáng tin. Nó lọc ở đầu ra chứ không làm rõ được "thế nào là một finding hợp lệ" ở đầu vào, nên bản chất quyết định của mô hình vẫn mơ hồ như trước.`,
    `Thay hướng dẫn dựa trên độ tự tin bằng tiêu chí phân loại tường minh — kể tên loại vấn đề phải báo (lỗi đúng/sai, lỗ hổng bảo mật, rò rỉ tài nguyên) và loại phải bỏ qua (định dạng, sở thích đặt tên, pattern đã là quy ước của repo) — biến một phán đoán chủ quan thành phép phân loại khách quan. Precision tăng vì mô hình biết ranh giới nằm ở đâu, và lỗi thật không bị vạ lây vì tiêu chí nói rõ chúng thuộc nhóm phải báo.`,

  concept: `Hướng dẫn kiểu "be conservative" hay "chỉ báo cái nào tự tin cao" không nâng được precision, vì nó không định nghĩa vấn đề — nó chỉ nâng ngưỡng báo trên MỌI thứ, nên mất luôn cả finding đúng. Thứ nâng precision là tiêu chí phân loại cụ thể: liệt kê loại issue phải báo và loại phải bỏ qua.`,

{ id: "cca2-041", n: 41, set: 2, scenario: 5, domain: 4, task: "4.1",
  topic: "False Positive Reduction", difficulty: "hard", type: "mr", ans: [1, 3],
  q: `Your CI review posts findings in five categories. Measured false positive rates: security 7%, correctness 9%, performance 16%, naming 48%, documentation 51%. Developers have started dismissing whole review comments unread because "half of it is wrong," and the security findings are being ignored along with everything else. You need to stop the trust bleed now and also fix the underlying quality of the weak categories. Which TWO actions should you take? (Choose TWO.)`,
  opts: [
    `Add "be stricter and report only clear-cut issues" to the prompt for all five categories at once.`,
    `Temporarily disable the naming and documentation categories, running only the high-precision categories until their prompts are fixed.`,
    `Cap the review at five findings per pull request, keeping the highest-severity ones.`,
    `Rewrite the prompts for the disabled categories with explicit criteria naming which patterns count as an issue versus which are accepted conventions in this repo, each side illustrated with a concrete code example.`,
    `Keep every category posting but collapse naming and documentation findings behind a "show more" toggle so they stay out of the default view.`,
  ],
  q_vi: `CI review của bạn đăng finding theo năm category. Tỷ lệ false positive đo được: security 7%, correctness 9%, performance 16%, naming 48%, documentation 51%. Developer đã bắt đầu bỏ qua nguyên cả comment review mà không đọc vì "half of it is wrong" (nửa số đó là sai), và các finding về security cũng bị bỏ qua theo luôn. Bạn cần chặn ngay tình trạng mất niềm tin này, đồng thời sửa tận gốc chất lượng của các category yếu. Bạn nên thực hiện HAI hành động nào? (Chọn HAI phương án.)`,
  opts_vi: [
    `Thêm câu "be stricter and report only clear-cut issues" vào prompt cho cả năm category cùng một lúc.`,
    `Tạm thời tắt hai category naming và documentation, chỉ chạy các category có độ chính xác cao cho tới khi prompt của chúng được sửa xong.`,
    `Giới hạn review còn tối đa năm finding mỗi pull request, chỉ giữ lại những finding có severity cao nhất.`,
    `Viết lại prompt cho các category đã bị tắt bằng tiêu chí tường minh, nêu rõ pattern nào tính là vấn đề và pattern nào là quy ước đã được chấp nhận trong repo này, mỗi phía đều minh hoạ bằng một ví dụ code cụ thể.`,
    `Vẫn giữ tất cả category tiếp tục đăng finding nhưng gom các finding naming và documentation vào sau một nút "show more" để chúng không xuất hiện ở view mặc định.`,
  ],
  why: [
    `Siết đồng loạt cả năm category làm hỏng chính hai category đang tốt (security 7%, correctness 9%) để bù cho hai category hỏng. Ngoài ra "clear-cut" vẫn là hedging mơ hồ, nên nó cũng không sửa được naming/documentation — đánh đổi sai chiều mà chẳng được gì.`,
    `Tắt tạm naming và documentation chặn ngay dòng máu niềm tin: developer thôi gặp tỷ lệ sai ~50%, nên các finding security/correctness đúng được đọc trở lại. Đây là phần "làm ngay" — một công cụ sai một nửa còn tệ hơn không có công cụ.`,
    `Cắt còn năm finding mỗi PR giảm khối lượng nhưng không đổi TỶ LỆ sai của naming/documentation. Nếu chúng lọt vào top năm theo severity thì nhiễu vẫn nằm đó, còn finding đúng bị loại chỉ vì đứng thứ sáu. Giới hạn số lượng không phải cách nâng precision.`,
    `Viết lại prompt cho hai category bị tắt bằng tiêu chí tường minh — pattern nào tính là vấn đề, pattern nào là quy ước đã chấp nhận của repo, mỗi phía kèm ví dụ code cụ thể — là phần sửa gốc. Có ví dụ cho cả hai phía ranh giới thì mô hình phân loại nhất quán và còn áp được sang ca mới, thay vì đoán theo cảm giác.`,
    `Thu gọn sau nút "show more" chỉ dời chỗ nhiễu chứ không giảm nhiễu: finding sai vẫn được sinh ra, vẫn góp vào cảm nhận "hệ thống này hay sai", và ai bấm mở vẫn gặp đúng 50%. Nó cũng không cải thiện chất lượng của hai category yếu.`,

  concept: `Khi vài category kéo sập niềm tin vào cả hệ thống, cần hai việc song song: tắt ngay category có false positive cao để các category chính xác được tin lại, rồi sửa gốc bằng tiêu chí tường minh kèm ví dụ code cho CẢ HAI phía ranh giới trước khi bật lại. Siết đồng loạt, cắt số lượng, hay ẩn bớt đều không chạm tới tỷ lệ sai.`,

    ["accepted convention", "pattern hợp lệ theo quy ước repo — phải nằm ở phía không báo"],
    ["concrete code example", "ví dụ code cho từng phía ranh giới, giúp phân loại nhất quán"],

{ id: "cca2-042", n: 42, set: 2, scenario: 6, domain: 4, task: "4.2",
  topic: "Few-Shot Prompting", difficulty: "easy", type: "mc", ans: [0],
  q: `Your extractor pulls dosage data from clinical notes into a schema with volume_ml as a number plus a note string. The source text is often informal: "about a tablespoon", "a couple of drops", "~2-3 mL", "half the vial". Your prompt already says: "Convert informal measurements to an approximate numeric value where a reasonable conversion exists; otherwise return null and explain in note." The model behaves inconsistently — sometimes null, sometimes an oddly precise 14.79, sometimes the midpoint with an empty note. What is the most effective next step?`,
  opts: [
    `Add three or four few-shot examples covering these exact shapes of informal measurement, each showing the resulting volume_ml value (or null) and the matching note text.`,
    `Raise max_tokens so the model has more room to work through each conversion.`,
    `Change volume_ml to a free-text string so every phrasing validates against the schema.`,
    `Rewrite the instruction in stronger terms: "NEVER output a precise number for an approximate measurement."`,
  ],
  q_vi: `Bộ extractor của bạn trích dữ liệu liều lượng từ clinical notes vào một schema có volume_ml là số cộng với một chuỗi note. Văn bản nguồn thường phi chính thức: "about a tablespoon", "a couple of drops", "~2-3 mL", "half the vial". Prompt của bạn đã có sẵn câu: "Convert informal measurements to an approximate numeric value where a reasonable conversion exists; otherwise return null and explain in note." Model hành xử thất thường — lúc thì trả null, lúc thì ra một con số chính xác kỳ lạ như 14.79, lúc lại lấy giá trị giữa khoảng (midpoint) với note để trống. Bước tiếp theo nào hiệu quả nhất?`,
  opts_vi: [
    `Thêm ba đến bốn ví dụ few-shot phủ đúng các dạng đo lường phi chính thức này, mỗi ví dụ cho thấy giá trị volume_ml kết quả (hoặc null) và nội dung note tương ứng.`,
    `Tăng max_tokens để model có nhiều chỗ hơn khi xử lý từng phép chuyển đổi.`,
    `Đổi volume_ml thành một chuỗi văn bản tự do để mọi cách diễn đạt đều pass được schema.`,
    `Viết lại chỉ dẫn với giọng mạnh hơn: "NEVER output a precise number for an approximate measurement."`,
  ],
  why: [
    `Prompt đã có đúng loại hướng dẫn chi tiết đó và nó cho kết quả thất thường — đây chính là tình huống few-shot mạnh nhất. Ba đến bốn ví dụ phủ đúng các dạng đang gặp, mỗi ví dụ chỉ rõ volume_ml ra số nào hay ra null và note viết gì, cho mô hình một pattern cụ thể để noi theo thay vì tự diễn giải "reasonable conversion".`,
    `max_tokens là hạn mức token ĐẦU RA, không phải "chỗ để suy nghĩ". Đầu ra ở đây chỉ là vài trường ngắn nên nó chưa hề tới gần giới hạn. Vấn đề là ranh giới quyết định không rõ, không phải thiếu chỗ để xuất.`,
    `Đổi volume_ml sang free-text làm mọi cách viết đều pass schema, nhưng đó là bỏ luôn việc chuẩn hóa: hệ thống phía sau lại phải tự parse "about a tablespoon". Bạn đổi một lỗi thấy được thành một lỗi ẩn xuống downstream.`,
    `Một câu cấm gay gắt hơn vẫn không nói được khi nào "about a tablespoon" là chuyển được và khi nào phải trả null — ranh giới vẫn để mô hình tự đoán. Hướng dẫn dạng này đã có trong prompt và đang thất bại; viết mạnh hơn không đổi được điều đó.`,
  ],
  concept: `Khi hướng dẫn chi tiết đã có mà đầu ra vẫn thất thường trên các ca nhập nhằng (đo lường phi chính thức, ước lượng, khoảng giá trị), few-shot là kỹ thuật hiệu quả nhất: 2-4 ví dụ phủ đúng các dạng đang gặp, mỗi ví dụ cho thấy giá trị ra và ghi chú kèm theo, biến ranh giới mơ hồ thành pattern cụ thể.`,
  takeaway: `Hướng dẫn chi tiết mà đầu ra vẫn thất thường → thêm 2-4 few-shot phủ đúng các dạng nhập nhằng, mỗi ví dụ chỉ rõ giá trị ra và chỗ nào trả null. Nói mạnh hơn hay nới schema đều không định nghĩa được ranh giới.`,
  terms: [
    ["few-shot examples", "vài ví dụ mẫu trong prompt, cho thấy đầu ra đúng cho từng dạng đầu vào"],
    ["informal measurement", "cách ghi đo lường phi chính thức: khoảng, ước lượng, đơn vị dân dụng"],
    ["ambiguous-case handling", "xử lý ca nhập nhằng — chỗ few-shot có giá trị nhất"],
    ["max_tokens", "hạn mức token ĐẦU RA, không phải chỗ để mô hình suy nghĩ thêm"],
    ["null vs approximate value", "quyết định trả null hay trả một giá trị xấp xỉ"],
  ] },

{ id: "cca2-043", n: 43, set: 2, scenario: 6, domain: 4, task: "4.2",
  topic: "Few-Shot Generalization", difficulty: "hard", type: "mc", ans: [3],
  q: `Your pipeline sees more than 40 document layouts and new ones keep arriving. A teammate argues few-shot prompting is the wrong tool here: "Examples only teach the model the layouts we show it. With 40 layouts and room for a handful of examples, anything we don't demonstrate will fail anyway." How should you respond?`,

  q_vi: `Pipeline của bạn gặp hơn 40 layout tài liệu khác nhau và layout mới vẫn liên tục xuất hiện. Một đồng nghiệp cho rằng few-shot prompting là công cụ sai cho tình huống này: "Examples only teach the model the layouts we show it. With 40 layouts and room for a handful of examples, anything we don't demonstrate will fail anyway." Bạn nên phản hồi thế nào?`,
  opts_vi: [

    `Đồng ý, và tăng max_tokens cho tới khi cả 40 ví dụ vừa trong request.`,
    `Không đồng ý với tiền đề đó: ví dụ có cho thấy lý do đằng sau mỗi lần trích xuất sẽ dạy một phán đoán mà model áp dụng được sang cả những layout chưa từng gặp, vì vậy nên dồn ngân sách ví dụ có hạn vào các ca nhập nhằng khó nhất thay vì cố phủ hết mọi layout.`,

  why: [
    `Cách này coi few-shot như một bảng tra: có mẫu thì đúng, không mẫu thì sai. Thực tế ví dụ dạy phán đoán chứ không dạy khớp mẫu. Nhồi 40 ví dụ còn làm prompt phình ra, loãng chú ý, và vẫn không có gì cho layout thứ 41 xuất hiện tuần sau.`,
    `Đổi ví dụ sang một bản mô tả dài đúng 40 layout là từ bỏ chính thứ hiệu quả nhất: hướng dẫn trừu tượng cho đầu ra kém nhất quán hơn ví dụ cụ thể. Và một danh sách 40 mục vẫn chịu đúng vấn đề "không phủ được cái thứ 41" mà nó đang muốn tránh.`,
    `max_tokens giới hạn token đầu ra, không phải chỗ chứa prompt đầu vào — nên nó không phải cái cần nâng để nhét thêm ví dụ. Sâu hơn, đây vẫn là một câu trả lời về dung lượng cho một vấn đề về khái quát hóa.`,
    `Tiền đề của đồng nghiệp sai: ví dụ tốt không phải bảng tra layout. Ví dụ cho thấy LÝ DO một giá trị được đọc như vậy (vì sao lấy số ở dòng này chứ không dòng kia) dạy mô hình một phán đoán mà nó áp được sang layout chưa gặp. Vì thế hãy dồn ngân sách ví dụ ít ỏi vào các ca nhập nhằng khó nhất, chỗ phán đoán dễ lệch nhất, thay vì cố phủ hết 40 layout.`,
  ],
  concept: `Few-shot không phải bảng tra: ví dụ có kèm lý do vì sao chọn cách đọc này thay vì cách đọc kia dạy mô hình một phán đoán khái quát được sang pattern mới. Vì thế 2-4 ví dụ nhắm vào ca nhập nhằng khó nhất hiệu quả hơn việc cố liệt kê mọi biến thể.`,
  takeaway: `Few-shot dạy phán đoán, không dạy khớp mẫu — ví dụ có nêu lý do sẽ khái quát sang layout chưa gặp. Dùng ngân sách ví dụ cho ca nhập nhằng khó nhất, đừng cố phủ hết mọi biến thể.`,
  terms: [
    ["generalization to novel patterns", "áp phán đoán học từ ví dụ sang ca chưa từng thấy"],
    ["pattern matching vs judgment", "khớp mẫu đã nêu so với học một phán đoán dùng được rộng"],
    ["reasoning in examples", "ví dụ nêu lý do chọn cách đọc này — phần khiến nó khái quát được"],
    ["example budget", "số ví dụ đưa được vào prompt là hữu hạn, phải nhắm đúng chỗ"],
    ["attention dilution", "prompt phình khiến chú ý loãng, chất lượng giảm"],
