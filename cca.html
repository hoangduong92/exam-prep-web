{ id: "cca1-083", n: 83, set: 1, scenario: 6, domain: 4, task: "4.4",
  topic: "Retry Loops", difficulty: "hard", type: "mc", ans: [1],
  q: `Your validation-retry loop works well for format issues, but you notice it burns retries endlessly on a subset of documents where a required field (e.g., beneficiary_tax_id) is simply not present anywhere in the source document—the information exists only in a separate system you didn't provide. What's the correct understanding and action?`,
  opts: [
    `Increase the retry limit; with enough attempts the model will eventually locate the missing value.`,
    `Recognize retries are ineffective when the information is absent from the source; route these to a different path (e.g., flag as missing / human review) instead of retrying.`,
    `Rephrase the prompt more forcefully so the model tries harder to find the value.`,
    `Make the model infer the most likely tax ID from surrounding context to satisfy the field.`,
  ],
  q_vi: `Vòng lặp validation-retry của bạn hoạt động tốt với các vấn đề về định dạng, nhưng bạn nhận thấy nó đốt retry vô tận trên một tập con tài liệu nơi một trường required (vd beneficiary_tax_id) đơn giản là không tồn tại ở bất cứ đâu trong tài liệu nguồn — thông tin đó chỉ tồn tại trong một hệ thống riêng biệt mà bạn không cung cấp. Đâu là cách hiểu và hành động đúng?`,
  opts_vi: [
    `Tăng giới hạn retry; với đủ số lần thử, mô hình cuối cùng sẽ tìm ra giá trị bị thiếu.`,
    `Nhận ra rằng retry không hiệu quả khi thông tin vắng mặt khỏi nguồn; định tuyến các ca này sang đường khác (vd đánh dấu là thiếu / human review) thay vì tiếp tục retry.`,
    `Diễn đạt lại prompt mạnh mẽ hơn để mô hình cố gắng hơn tìm giá trị.`,
    `Bắt mô hình suy luận ra mã số thuế khả dĩ nhất từ ngữ cảnh xung quanh để thỏa mãn trường đó.`,
  ],
  why: [
    `Tăng giới hạn retry vô ích khi giá trị KHÔNG tồn tại trong nguồn — thêm bao nhiêu lần cũng không tạo ra thông tin không có ở đó. Chỉ lãng phí chi phí và thời gian.`,
    `Nhận ra retry không hiệu quả khi thông tin vắng mặt khỏi nguồn (khác lỗi định dạng) và định tuyến các ca này sang đường khác — đánh dấu thiếu hoặc chuyển human review — là hành động đúng. Retry chỉ sửa được lỗi định dạng/cấu trúc, không tạo ra dữ liệu không có.`,
    `Diễn đạt prompt 'mạnh mẽ hơn' không làm xuất hiện thông tin không có trong tài liệu. Nó còn nguy hiểm vì có thể đẩy mô hình sang bịa giá trị để 'cố tìm cho ra'.`,
    `Suy diễn tax ID từ ngữ cảnh để thỏa trường chính là fabrication — tạo dữ liệu sai có hậu quả nghiêm trọng với thông tin định danh/thuế. Tuyệt đối tránh.`,
  ],
  concept: `Giới hạn của retry: retry vô ích khi thông tin đơn giản là KHÔNG CÓ trong tài liệu nguồn (khác với lỗi định dạng/cấu trúc). Cần nhận diện ca này và định tuyến khác (đánh dấu thiếu / human review), thay vì retry vô hạn.`,
  takeaway: `Retry chỉ cứu lỗi định dạng/cấu trúc, KHÔNG cứu được khi thông tin vắng mặt khỏi nguồn. Nhận diện ca 'thiếu thật' và định tuyến (đánh dấu/human review) thay vì retry vô hạn hay bịa.`,
  terms: [
    ["limits of retry", "giới hạn retry: vô ích khi thông tin không có trong nguồn"],
    ["information absent from source", "dữ liệu không tồn tại trong tài liệu được cung cấp"],
    ["format vs missing error", "lỗi định dạng (retry được) vs thiếu dữ liệu (retry vô ích)"],
    ["human review routing", "định tuyến ca thiếu sang người xử lý"],
  ] },

{ id: "cca1-084", n: 84, set: 1, scenario: 6, domain: 4, task: "4.4",
  topic: "Validation", difficulty: "medium", type: "mc", ans: [0],
  q: `You want the extraction system to automatically flag invoices where the stated total doesn't match the sum of line items, and to catch documents that contain internally contradictory data. What extraction design surfaces these discrepancies most reliably?`,
  opts: [
    `Have the model extract both a calculated_total (summed from line items) and the stated_total, plus a conflict_detected boolean, so downstream logic can compare and flag mismatches.`,
    `Ask the model in the prompt to "make sure the totals are correct" and trust its judgment.`,
    `Only extract the stated_total and assume it's authoritative.`,
    `Reject any document where the model expresses uncertainty about the total.`,
  ],
  q_vi: `Bạn muốn hệ thống extraction tự động gắn cờ các invoice mà stated total không khớp với tổng các line item, và bắt được các tài liệu chứa dữ liệu tự mâu thuẫn nội bộ. Thiết kế extraction nào phát hiện các chênh lệch này đáng tin cậy nhất?`,
  opts_vi: [
    `Cho mô hình trích cả calculated_total (cộng từ các line item) lẫn stated_total, cộng thêm một cờ boolean conflict_detected, để logic downstream có thể so sánh và gắn cờ khi lệch nhau.`,
    `Yêu cầu mô hình trong prompt "đảm bảo các tổng là đúng" và tin vào phán đoán của nó.`,
    `Chỉ trích stated_total và coi đó là giá trị chuẩn.`,
    `Từ chối bất kỳ tài liệu nào mà mô hình thể hiện sự không chắc chắn về tổng.`,
  ],
  why: [
    `Trích cả calculated_total (cộng từ line item) và stated_total, kèm cờ conflict_detected, cho phép logic downstream so sánh và gắn cờ khi lệch hoặc khi nguồn tự mâu thuẫn. Cách này biến kiểm tra ngữ nghĩa thành trường có cấu trúc, đáng tin và tự động hóa được.`,
    `Bảo mô hình 'đảm bảo total đúng' rồi tin phán đoán của nó không tạo ra tín hiệu kiểm tra rõ ràng, đáng tin. Không có hai giá trị để so sánh thì downstream không thể tự động gắn cờ chênh lệch.`,
    `Chỉ lấy stated_total và coi là chuẩn bỏ qua chính vấn đề: stated_total có thể sai so với tổng các dòng. Không có calculated_total thì không phát hiện được lệch.`,
    `Từ chối mọi tài liệu khi mô hình 'không chắc' quá thô — nhiều tài liệu hợp lệ vẫn qua được, và điều bạn cần là PHÁT HIỆN chênh lệch số học cụ thể, không phải loại bỏ theo cảm giác không chắc.`,
  ],
  concept: `Thiết kế self-validation: trích cả calculated_total (tự cộng từ các dòng) LẪN stated_total, kèm cờ conflict_detected, để logic downstream so sánh và gắn cờ chênh lệch/mâu thuẫn — biến kiểm tra ngữ nghĩa thành dữ liệu có cấu trúc.`,
  takeaway: `Bắt lỗi ngữ nghĩa bằng self-validation có cấu trúc: trích calculated_total + stated_total + cờ conflict_detected để downstream so sánh, gắn cờ. Đừng chỉ 'tin' mô hình hay lấy một giá trị duy nhất.`,
  terms: [
    ["calculated_total vs stated_total", "tổng tự tính từ dòng so với tổng ghi trên tài liệu"],
    ["conflict_detected", "cờ báo dữ liệu nguồn tự mâu thuẫn"],
    ["self-validation flow", "luồng tự kiểm tra bằng trường có cấu trúc"],
    ["discrepancy flagging", "gắn cờ khi phát hiện chênh lệch"],
  ] },

{ id: "cca1-085", n: 85, set: 1, scenario: 6, domain: 4, task: "4.2",
  topic: "Few-Shot Prompting", difficulty: "medium", type: "mc", ans: [0],
  q: `Your extractor handles well-structured invoices fine, but on documents with varied formats—some with inline citations, some with bibliographies, some with narrative descriptions instead of tables—it frequently returns empty/null for fields that are actually present, just formatted differently. What's the most effective way to improve extraction across these varied structures?`,
  opts: [
    `Add few-shot examples demonstrating correct extraction from documents with varied structures, so the model generalizes to the different formats.`,
    `Restrict the system to only accept documents in the well-structured table format.`,
    `Increase max_tokens so the model has more room to find the fields.`,
    `Mark all the problematic fields as nullable so empty results validate cleanly.`,
  ],
  q_vi: `Extractor của bạn xử lý tốt các invoice có cấu trúc chuẩn, nhưng với các tài liệu có định dạng đa dạng — một số có citation nội dòng, một số có bibliography, một số có mô tả tường thuật thay vì bảng biểu — nó thường xuyên trả về rỗng/null cho các trường thực ra có mặt, chỉ là được định dạng khác đi. Cách hiệu quả nhất để cải thiện extraction trên các cấu trúc đa dạng này là gì?`,
  opts_vi: [
    `Thêm few-shot example minh họa cách trích xuất đúng từ các tài liệu có cấu trúc đa dạng, để mô hình khái quát hóa sang các định dạng khác nhau.`,
    `Giới hạn hệ thống chỉ chấp nhận tài liệu ở định dạng bảng có cấu trúc chuẩn.`,
    `Tăng max_tokens để mô hình có nhiều chỗ hơn tìm các trường.`,
    `Đánh dấu tất cả các trường có vấn đề là nullable để kết quả rỗng vẫn qua validation sạch sẽ.`,
  ],
  why: [
    `Thêm few-shot example minh họa trích xuất đúng từ các cấu trúc tài liệu đa dạng giúp mô hình khái quát hóa sang định dạng lạ, giảm null giả cho trường thực ra có mặt. Few-shot đặc biệt hiệu quả để dạy mô hình nhận ra cùng thông tin dưới nhiều hình thức trình bày.`,
    `Chỉ nhận tài liệu dạng bảng chuẩn né tránh vấn đề thay vì giải quyết — thực tế nguồn có nhiều định dạng và bạn cần trích được từ chúng, không phải loại bỏ chúng.`,
    `Tăng max_tokens không giúp mô hình NHẬN RA trường ở định dạng khác; vấn đề là khái quát hóa qua cấu trúc, không phải thiếu chỗ để xuất. Trường bị bỏ sót vì không được nhận diện, không vì hết token.`,
    `Đánh dấu nullable để null 'pass sạch' chỉ hợp thức hóa việc bỏ sót — dữ liệu thực ra CÓ trong tài liệu vẫn bị mất. Đây là che triệu chứng, không cải thiện độ chính xác trích xuất.`,
  ],
  concept: `Few-shot example minh họa trích xuất đúng từ tài liệu có CẤU TRÚC ĐA DẠNG (citation nội dòng vs bibliography, mô tả tường thuật vs bảng) giúp mô hình khái quát hóa sang các định dạng khác nhau — giảm việc trả null cho trường thực ra có mặt nhưng định dạng khác.`,
  takeaway: `Trích xuất kém trên tài liệu đa định dạng (citation, bibliography, tường thuật) → few-shot minh họa nhiều cấu trúc để mô hình khái quát hóa. Đừng giới hạn định dạng đầu vào hay hợp thức hóa null giả.`,
  terms: [
    ["few-shot examples", "ví dụ mẫu minh họa trích xuất từ nhiều cấu trúc"],
    ["document structure variety", "đa dạng cấu trúc tài liệu (bảng, tường thuật, citation...)"],
    ["generalization", "khái quát hóa sang định dạng chưa gặp"],
    ["false null extraction", "trả null cho trường thực ra có mặt"],
  ] },

{ id: "cca1-086", n: 86, set: 1, scenario: 6, domain: 4, task: "4.5",
  topic: "Batch Processing", difficulty: "easy", type: "mc", ans: [0],
  q: `You need to extract structured data from an archive of 5,000 historical documents for a data-warehouse backfill. There's no user waiting on the results—the backfill just needs to finish within a couple of days. You want to minimize cost. Which processing approach fits best?`,
  opts: [
    `Use the Message Batches API for its 50% cost savings, since the workload is large, non-blocking, and latency-tolerant.`,
    `Use synchronous real-time calls to get each result immediately, one document at a time.`,
    `Use synchronous calls but at higher concurrency to finish faster and cheaper.`,
    `Avoid batch because you can't correlate which result belongs to which document.`,
  ],
  q_vi: `Bạn cần trích xuất dữ liệu có cấu trúc từ một kho lưu trữ gồm 5.000 tài liệu lịch sử để backfill data warehouse. Không có người dùng nào chờ kết quả — việc backfill chỉ cần hoàn thành trong vòng vài ngày. Bạn muốn tối thiểu hóa chi phí. Cách tiếp cận xử lý nào phù hợp nhất?`,
  opts_vi: [
    `Dùng Message Batches API để tiết kiệm 50% chi phí, vì khối lượng công việc lớn, không blocking, và chịu được độ trễ.`,
    `Dùng các lời gọi synchronous thời gian thực để nhận từng kết quả ngay lập tức, mỗi lần một tài liệu.`,
    `Dùng lời gọi synchronous nhưng với concurrency cao hơn để xong nhanh hơn và rẻ hơn.`,
    `Tránh dùng batch vì bạn không thể đối chiếu kết quả nào thuộc về tài liệu nào.`,
  ],
  why: [
    `Message Batches API đúng cho khối lượng lớn, không blocking, chịu được độ trễ như backfill 5.000 tài liệu chạy trong vài ngày — nắm trọn 50% tiết kiệm chi phí. Không ai chờ kết quả tức thì nên cửa sổ xử lý tới 24 giờ hoàn toàn chấp nhận được.`,
    `Gọi synchronous từng tài liệu cho kết quả tức thì nhưng bỏ lỡ 50% tiết kiệm — vô nghĩa khi không ai chờ. Đây là tối ưu sai chiều cho khối lượng lớn không nhạy độ trễ.`,
    `Tăng concurrency synchronous giúp nhanh hơn nhưng vẫn trả giá đầy đủ mỗi request, không có mức giảm 50% của batch. Nhanh không phải mục tiêu ở đây; chi phí mới là.`,
    `Batch CÓ trường custom_id để đối chiếu kết quả với từng tài liệu — nên lý do 'không đối chiếu được' là hiểu lầm. Đây không phải rào cản dùng batch.`,
  ],
  concept: `Message Batches API (tiết kiệm 50%, xử lý tới 24 giờ, không cam kết SLA độ trễ) phù hợp cho khối lượng lớn, không chặn ai, chịu được độ trễ — đúng cho backfill 5.000 tài liệu không có người chờ.`,
  takeaway: `Khối lượng lớn, không blocking, chịu trễ (backfill) → Message Batches API để tiết kiệm 50%. custom_id lo việc đối chiếu kết quả; đừng dùng synchronous cho việc không ai chờ.`,
  terms: [
    ["Message Batches API", "API theo lô, giảm 50%, xử lý tới 24 giờ"],
    ["latency-tolerant", "chịu được độ trễ, không ai chờ tức thì"],
    ["backfill", "nạp bù dữ liệu lịch sử số lượng lớn"],
    ["custom_id", "đối chiếu kết quả batch với từng tài liệu"],
  ] },

{ id: "cca1-087", n: 87, set: 1, scenario: 6, domain: 4, task: "4.5",
  topic: "Batch Processing", difficulty: "medium", type: "mc", ans: [0],
  q: `After submitting a batch of 1,000 documents, a subset comes back failed. Investigation shows some failed because the documents exceeded the context limit, while the rest were transient errors. How should you handle the failures most efficiently?`,
  opts: [
    `Resubmit only the failed documents (identified by custom_id), chunking the ones that exceeded the context limit before resubmission.`,
    `Resubmit the entire batch of 1,000 documents from scratch to be safe.`,
    `Discard all failed documents and accept the partial results.`,
    `Switch the entire workflow to synchronous calls and reprocess everything one by one.`,
  ],
  q_vi: `Sau khi gửi một batch gồm 1.000 tài liệu, một phần trong đó trả về thất bại. Điều tra cho thấy một số thất bại vì tài liệu vượt quá giới hạn ngữ cảnh, số còn lại là lỗi tạm thời (transient). Bạn nên xử lý các thất bại này hiệu quả nhất bằng cách nào?`,
  opts_vi: [
    `Chỉ gửi lại các tài liệu thất bại (nhận diện qua custom_id), chia nhỏ (chunk) những tài liệu vượt giới hạn ngữ cảnh trước khi gửi lại.`,
    `Gửi lại toàn bộ batch 1.000 tài liệu từ đầu cho chắc ăn.`,
    `Bỏ hết các tài liệu thất bại và chấp nhận kết quả một phần.`,
    `Chuyển toàn bộ workflow sang lời gọi synchronous và xử lý lại tất cả từng cái một.`,
  ],
  why: [
    `Gửi lại chỉ các tài liệu thất bại (nhận diện qua custom_id) và chia nhỏ những tài liệu vượt giới hạn ngữ cảnh trước khi gửi lại là cách hiệu quả nhất. Nó xử lý đúng nguyên nhân từng loại lỗi mà không lãng phí xử lý lại 900+ tài liệu đã thành công.`,
    `Gửi lại toàn bộ 1.000 tài liệu lãng phí chi phí và thời gian cho những tài liệu đã thành công. custom_id cho phép khoanh vùng chính xác cái nào cần làm lại.`,
    `Vứt bỏ tài liệu thất bại chấp nhận mất dữ liệu không cần thiết — nhiều lỗi (transient, vượt ngữ cảnh) hoàn toàn khắc phục được bằng gửi lại/chia nhỏ.`,
    `Chuyển cả workflow sang synchronous và xử lý lại tất cả từng cái đánh mất tiết kiệm của batch và làm lại cả phần đã xong. Chỉ cần xử lý phần thất bại, không phải đổi cả mô hình xử lý.`,
  ],
  concept: `Xử lý lỗi batch hiệu quả: chỉ gửi lại các tài liệu THẤT BẠI (nhận diện qua custom_id), và với tài liệu vượt giới hạn ngữ cảnh thì CHUNK (chia nhỏ) trước khi gửi lại — thay vì làm lại cả lô.`,

{ id: "cca1-089", n: 89, set: 1, scenario: 6, domain: 5, task: "5.5",

  topic: "Agentic Loop Context", difficulty: "easy", type: "mc", ans: [3],
  q: `Your loop sends a request to Claude and, while stop_reason is "tool_use", executes the requested tool and issues the next request. Logs show the agent calls lookup_order with the same order ID three or four times in a row before it finally answers. Reading the code, you find that each iteration rebuilds the messages array from the original user turn plus Claude's most recent assistant turn, and the tool's return value is only written to your application log. What is the root cause?`,

{ id: "cca2-002", n: 2, set: 2, scenario: 3, domain: 1, task: "1.1",

  q: `The web search subagent runs its own agentic loop. Today it terminates when the model's text contains "research complete", or after 5 iterations, whichever comes first. In production it sometimes stops with half its assigned subtopics unsearched, and sometimes keeps searching well after it has clearly finished. Which TWO changes bring this loop in line with sound agentic loop design? (Choose TWO.)`,
  opts: [

    `Keep the iteration limit only as a runaway guardrail that raises an error and reports back to the coordinator, not as the normal way the loop ends.`,

  ],
  why: [
    `Đúng. stop_reason là tín hiệu có cấu trúc do chính API trả về, không phải suy đoán từ văn bản. Đây là cơ chế điều khiển vòng lặp chuẩn và nó chữa cả hai triệu chứng bạn thấy.`,
    `Vẫn là parsing tín hiệu ngôn ngữ tự nhiên — anti-pattern mà guide nêu tên. Thêm cụm từ chỉ đổi ranh giới đoán: model có thể nói "research complete" khi mới xong một phần, hoặc không nói câu nào trong danh sách rồi chạy mãi.`,
    `Kiểm tra sự có mặt của text là chẩn đoán sai. Claude thường vừa viết một đoạn giải thích vừa phát tool_use trong cùng một response, nên luật này sẽ cắt vòng lặp giữa việc — chính là triệu chứng bỏ sót subtopic.`,
    `Đúng. Giới hạn lặp vẫn có ích, nhưng đúng vai của nó là chặn vòng lặp chạy hoang. Khi cán mức đó thì đó là sự cố cần báo lên coordinator, chứ không phải cách kết thúc bình thường.`,
    `Hạ giới hạn xuống 3 làm việc bỏ sót subtopic tệ hơn. Ngoài ra coordinator không biết còn sót gì nếu subagent không báo lại, và mỗi lần tái gọi là thêm một chuyến round-trip cùng một prompt ngữ cảnh nữa.`,
  ],
  concept: `Vòng lặp agentic được điều khiển bởi tín hiệu có cấu trúc từ model (stop_reason), không phải bởi việc đọc chữ trong câu trả lời hay bởi một con số lặp tùy ý. Giới hạn lặp là lan can chống chạy hoang, đặt song song chứ không thay thế.`,
  takeaway: `Cho stop_reason quyết định vòng lặp, giữ iteration cap làm lan can báo lỗi. Đọc văn bản để đoán "xong chưa" là anti-pattern kinh điển.`,
  terms: [
    ["end_turn", "giá trị stop_reason nghĩa là Claude đã trả lời xong lượt này"],
    ["runaway guardrail", "lan can chặn vòng lặp chạy vô hạn, kích hoạt là báo sự cố"],
    ["natural language signal", "tín hiệu suy ra từ câu chữ model viết, không đáng tin để điều khiển luồng"],
    ["subagent", "agent con được coordinator giao một phần việc"],
    ["round-trip", "một lượt gọi API đi và về, tính vào độ trễ và chi phí"],
  ] },

{ id: "cca2-003", n: 3, set: 2, scenario: 3, domain: 1, task: "1.2",
  topic: "Dynamic Subagent Selection", difficulty: "medium", type: "mc", ans: [1],
  q: `Your coordinator runs the full pipeline for every request: web search, then document analysis, then synthesis, then report generation. For a request like "summarize the three PDFs in the shared folder," the web search subagent burns roughly 20K tokens returning material that nothing in the final report cites, and end-to-end latency nearly doubles. What is the most effective change?`,
  opts: [
    `Run the web search and document analysis subagents concurrently so the wasted search overlaps with useful work instead of adding to total latency.`,
    `Have the coordinator analyze each request's requirements up front and invoke only the subagents that request actually needs.`,
    `Let every subagent judge for itself whether the request falls in its scope and return immediately when it does not.`,
    `Cache web search results across requests so repeated searches on similar topics cost far less.`,
  ],
  q_vi: `Coordinator của bạn chạy trọn pipeline cho mọi request: tìm web, rồi phân tích tài liệu, rồi tổng hợp, rồi tạo báo cáo. Với một request kiểu "tóm tắt ba file PDF trong thư mục chia sẻ," subagent tìm web đốt khoảng 20K token để trả về tài liệu mà không có gì trong báo cáo cuối trích dẫn tới, và độ trễ end-to-end gần như tăng gấp đôi. Thay đổi nào hiệu quả nhất?`,
  opts_vi: [
    `Chạy đồng thời subagent tìm web và subagent phân tích tài liệu để việc tìm kiếm lãng phí đó chồng lên phần việc hữu ích thay vì cộng dồn vào tổng độ trễ.`,
    `Cho coordinator phân tích yêu cầu của từng request ngay từ đầu và chỉ gọi những subagent mà request đó thực sự cần.`,
    `Để mỗi subagent tự phán đoán xem request có nằm trong phạm vi của nó hay không và trả về ngay lập tức khi không.`,
    `Cache kết quả tìm web giữa các request để các lượt tìm lặp lại về chủ đề tương tự tốn ít hơn nhiều.`,
  ],
  why: [
    `Chạy song song che được phần độ trễ nhưng vẫn tốn nguyên 20K token cho việc không ai dùng. Nó xử lý triệu chứng thời gian, không xử lý việc gọi sai subagent.`,
    `Đúng. Vai của coordinator là đọc yêu cầu, phân rã, rồi chọn động subagent nào cần chạy — không phải đẩy mọi thứ qua trọn pipeline. Với một yêu cầu chỉ đọc PDF thì bỏ hẳn bước tìm web là quyết định đúng chỗ và đúng người.`,
    `Để subagent tự loại mình vẫn phải khởi tạo và trả tiền cho một lượt gọi model cho mỗi subagent không liên quan, và nó chuyển quyền quyết định phạm vi ra khỏi coordinator — làm hỏng chính chỗ quan sát và định tuyến tập trung.`,
    `Cache giúp khi cùng truy vấn lặp lại, còn ở đây truy vấn tìm web ngay từ đầu đã không cần thiết. Làm rẻ một việc vô ích không giống việc bỏ nó đi.`,
  ],
  concept: `Trong kiến trúc hub-and-spoke, coordinator không chỉ điều phối mà còn quyết định gọi ai: nó phân tích yêu cầu rồi chọn tập subagent phù hợp, thay vì luôn chạy hết pipeline.`,
  takeaway: `Pipeline cố định là chi phí cố định. Cho coordinator chọn động subagent theo yêu cầu, đừng bắt mọi request đi qua đủ bốn chặng.`,
  terms: [
    ["coordinator", "agent điều phối, giao việc và gom kết quả"],
    ["hub-and-spoke", "mô hình mọi liên lạc giữa subagent đều đi qua coordinator"],
    ["dynamic selection", "chọn subagent theo nội dung yêu cầu thay vì theo trình tự cố định"],
    ["full pipeline", "chạy hết mọi chặng bất kể yêu cầu có cần hay không"],
    ["end-to-end latency", "độ trễ tính từ lúc nhận yêu cầu đến lúc ra kết quả cuối"],
  ] },

{ id: "cca2-004", n: 4, set: 2, scenario: 3, domain: 1, task: "1.2",
  topic: "Iterative Refinement Loop", difficulty: "hard", type: "mc", ans: [0],
  q: `Every subagent reports success and reports ship on schedule, but reviewers keep finding the same class of defect: a report on "regulatory outlook for stablecoins" covers the United States in depth, gives the EU one sentence, and never mentions Asia. The coordinator's decomposition looked reasonable when it was written — the gaps only become visible once the synthesized report exists. What is the most effective change?`,
  opts: [
    `Have the coordinator evaluate the synthesis output against the report's coverage criteria, re-delegate targeted queries for the gaps it finds, and re-invoke synthesis until coverage is sufficient.`,
    `Widen the coordinator's initial decomposition so the first round of subtopics is broad enough that no major region can be left out.`,
    `Have the synthesis subagent append a self-assessed completeness score plus a list of topics it felt underinformed about, and route reports below a threshold to human review.`,
    `Run the whole pipeline a second time on the same topic and merge the two reports, since an independent second pass will land on a different set of subtopics.`,
  ],
  q_vi: `Mọi subagent đều báo cáo thành công và các báo cáo ra đúng hạn, nhưng reviewer liên tục phát hiện cùng một loại lỗi: một báo cáo về "triển vọng pháp lý đối với stablecoin" viết sâu về Hoa Kỳ, chỉ dành một câu cho EU, và không hề nhắc đến châu Á. Cách phân rã của coordinator trông hợp lý vào lúc nó được viết ra — các khoảng trống chỉ lộ ra sau khi báo cáo tổng hợp đã tồn tại. Thay đổi nào hiệu quả nhất?`,
  opts_vi: [
    `Cho coordinator đối chiếu đầu ra tổng hợp với tiêu chí phủ nội dung của báo cáo, giao lại các truy vấn nhắm đúng vào những khoảng trống nó tìm thấy, và gọi lại synthesis cho đến khi độ phủ đủ.`,
    `Mở rộng cách phân rã ban đầu của coordinator để vòng subtopic đầu tiên đủ rộng sao cho không khu vực lớn nào bị bỏ sót.`,
    `Cho subagent tổng hợp đính kèm một điểm tự đánh giá mức độ đầy đủ cùng danh sách các chủ đề nó cảm thấy thiếu thông tin, và chuyển các báo cáo dưới một ngưỡng nào đó cho con người xem lại.`,
    `Chạy lại toàn bộ pipeline lần thứ hai trên cùng chủ đề rồi gộp hai báo cáo lại, vì một lượt chạy độc lập lần hai sẽ ra một tập subtopic khác.`,
  ],
  why: [
    `Đúng. Vấn đề nằm ở chỗ khoảng trống chỉ lộ ra sau khi tổng hợp, nên chữa nó cần một vòng tinh chỉnh: coordinator đối chiếu bản tổng hợp với tiêu chí phủ, giao lại truy vấn nhắm đúng chỗ thiếu, rồi gọi synthesis lại. Đây là mẫu hình vòng lặp tinh chỉnh do coordinator điều khiển.`,
    `Mở rộng phân rã ban đầu có ích và nên làm, nhưng nó không thể đảm bảo: bạn không biết trước khoảng trống nào sẽ xuất hiện, và trải rộng vô hướng ngay từ đầu thì đổi sự thiếu sót thành sự nông. Đề đã nói rõ phân rã lúc viết ra trông hợp lý.`,
    `Điểm tự đánh giá do model tự báo nổi tiếng hiệu chỉnh kém, và cách này biến mọi lần thiếu phủ thành việc của con người thay vì để hệ thống tự lấp. Danh sách "chỗ tôi thấy thiếu thông tin" có thể hữu ích như đầu vào cho coordinator, nhưng bản thân nó không sửa được báo cáo.`,
    `Chạy lại toàn bộ pipeline tốn gấp đôi mà không nhắm vào gì cả. Với cùng chủ đề và cùng prompt phân rã, lần hai rất dễ ra đúng những subtopic thiên lệch như lần đầu, và việc ghép hai báo cáo lại thêm việc gỡ trùng lặp.`,
  ],
  concept: `Coordinator không dừng ở việc giao việc một lượt. Khi chất lượng chỉ đo được ở đầu ra cuối, nó cần đánh giá bản tổng hợp so với tiêu chí, giao lại truy vấn nhắm đúng chỗ thiếu, và gọi lại synthesis cho đến khi đủ phủ.`,
  takeaway: `Khoảng trống nội dung chỉ hiện ra sau khi tổng hợp, nên hãy đóng vòng: đánh giá đầu ra, giao lại đúng chỗ thiếu, tổng hợp lại. Đừng cố đoán hết mọi subtopic ở lần phân rã đầu.`,
  terms: [
    ["iterative refinement loop", "vòng lặp coordinator đánh giá đầu ra rồi giao lại việc cho đến khi đủ"],
    ["coverage criteria", "tiêu chí phủ nội dung dùng để đo bản tổng hợp còn thiếu gì"],
    ["re-delegate", "giao lại việc cho subagent với truy vấn nhắm đúng chỗ thiếu"],
    ["task decomposition", "việc chia chủ đề lớn thành các phần việc giao cho subagent"],
    ["poorly calibrated", "hiệu chỉnh kém — mức tự tin không khớp độ chính xác thật"],
  ] },

{ id: "cca2-005", n: 5, set: 2, scenario: 3, domain: 1, task: "1.3",
  topic: "Subagent Spawning", difficulty: "easy", type: "mc", ans: [2],
  q: `Your coordinator's system prompt describes each specialist subagent and instructs it to delegate research work. At run time the coordinator never delegates: it tries to answer research questions itself with the tools it has. Its AgentDefinition sets allowedTools to ["Read", "Grep", "WebSearch"]. What is the fix?`,
  opts: [
    `Set a coordinator-specific environment variable so the runtime turns on delegation for that agent.`,
    `Move the subagent descriptions out of the system prompt and into the user message, so the coordinator reads them as instructions for the current turn.`,
    `Add "Task" to the coordinator's allowedTools — Task is the mechanism that spawns subagents, so without it the coordinator has no way to delegate.`,
    `Remove Read, Grep, and WebSearch from the coordinator so that, having no tools of its own, it is forced to delegate.`,
  ],
  q_vi: `System prompt của coordinator mô tả từng subagent chuyên biệt và chỉ dẫn nó uỷ quyền việc research. Ở thời điểm chạy, coordinator không bao giờ uỷ quyền: nó cố tự trả lời các câu hỏi research bằng các tool nó đang có. AgentDefinition của nó đặt allowedTools là ["Read", "Grep", "WebSearch"]. Cách sửa là gì?`,
  opts_vi: [
    `Đặt một biến môi trường riêng cho coordinator để runtime bật tính năng uỷ quyền cho agent đó.`,
    `Chuyển phần mô tả subagent ra khỏi system prompt và đưa vào user message, để coordinator đọc chúng như chỉ dẫn cho lượt hiện tại.`,
    `Thêm "Task" vào allowedTools của coordinator — Task là cơ chế spawn subagent, nên thiếu nó thì coordinator không có cách nào để uỷ quyền.`,
    `Gỡ bỏ Read, Grep, và WebSearch khỏi coordinator để, do không còn tool nào của riêng mình, nó buộc phải uỷ quyền.`,
  ],
  why: [
    `Không có biến môi trường nào bật tắt việc uỷ quyền. Quyền spawn subagent được cấp qua danh sách tool của agent, không qua cấu hình môi trường.`,
    `Chỗ đặt phần mô tả không phải vấn đề. Coordinator đã đọc và hiểu chỉ dẫn uỷ quyền; nó chỉ đơn giản không có tool nào để thực hiện việc đó.`,
    `Đúng. Task là cơ chế spawn subagent, và coordinator chỉ gọi được khi "Task" nằm trong allowedTools của nó. Danh sách hiện tại chỉ có tool làm việc trực tiếp, nên hành vi bạn thấy đúng là hệ quả tất yếu.`,
    `Bỏ hết tool không sinh ra khả năng uỷ quyền; nó chỉ khiến coordinator không làm được gì cả. Thiếu Task thì dù trắng tay nó vẫn không thể gọi subagent.`,
  ],
  concept: `Subagent được sinh ra qua Task tool. Một coordinator dù có prompt uỷ quyền hoàn hảo vẫn không thể giao việc nếu "Task" không nằm trong allowedTools của nó — đây là ràng buộc cấu hình, không phải vấn đề prompt.`,
  takeaway: `Coordinator không chịu uỷ quyền thì kiểm allowedTools trước khi sửa prompt: thiếu "Task" là nó không có đường nào để spawn subagent.`,
  terms: [
    ["Task tool", "cơ chế spawn subagent trong Agent SDK"],
    ["allowedTools", "danh sách tool một agent được phép gọi"],
    ["AgentDefinition", "phần cấu hình một loại agent: mô tả, system prompt, giới hạn tool"],
    ["delegate", "giao một phần việc cho subagent thay vì tự làm"],
    ["spawn", "khởi tạo một subagent mới để chạy phần việc được giao"],
  ] },

{ id: "cca2-006", n: 6, set: 2, scenario: 3, domain: 1, task: "1.3",
  topic: "Subagent Context Passing", difficulty: "medium", type: "mr", ans: [1, 4],
  q: `Your synthesis subagent produces well-written summaries that carry no citations, and it occasionally asserts facts the web search subagent never reported. The coordinator invokes it with the prompt: "Synthesize the findings from the previous agents into a report with citations." Which TWO changes address this? (Choose TWO.)`,
  opts: [
    `Raise the synthesis subagent's context window setting so it can hold the search and analysis transcripts alongside its own reasoning.`,
    `Include the complete findings from the web search and document analysis subagents directly in the synthesis subagent's prompt, since a subagent inherits none of the coordinator's conversation history.`,
    `Add a line to the synthesis subagent's system prompt forbidding any claim that is not accompanied by a citation.`,
    `Give the synthesis subagent its own web search tool so it can look up citations for the claims it writes.`,
    `Pass the findings as structured records that keep each claim next to its source URL, document name, and page number, rather than as flattened prose.`,
  ],
  q_vi: `Subagent tổng hợp của bạn tạo ra các bản tóm tắt viết tốt nhưng không mang dẫn nguồn nào, và đôi khi nó khẳng định những sự kiện mà subagent tìm web chưa từng báo cáo. Coordinator gọi nó với prompt: "Hãy tổng hợp các phát hiện từ các agent trước thành một báo cáo có kèm dẫn nguồn." HAI thay đổi nào giải quyết được việc này? (Chọn HAI phương án.)`,
  opts_vi: [
    `Tăng cấu hình context window của subagent tổng hợp để nó có thể chứa các transcript tìm kiếm và phân tích cùng với phần suy luận của chính nó.`,
    `Đưa thẳng toàn bộ findings từ subagent tìm web và subagent phân tích tài liệu vào prompt của subagent tổng hợp, vì một subagent không thừa hưởng bất kỳ phần nào trong conversation history của coordinator.`,
    `Thêm một dòng vào system prompt của subagent tổng hợp cấm mọi khẳng định không đi kèm dẫn nguồn.`,
    `Cấp cho subagent tổng hợp tool tìm web của riêng nó để nó có thể tự tra dẫn nguồn cho các khẳng định nó viết ra.`,
    `Truyền findings dưới dạng các bản ghi có cấu trúc, giữ mỗi khẳng định đi kèm URL nguồn, tên tài liệu, và số trang, thay vì dưới dạng văn xuôi bị dồn phẳng.`,
  ],
  why: [
    `Cửa sổ ngữ cảnh không phải chỗ nghẽn: subagent chạy với ngữ cảnh cô lập nên các transcript kia chưa bao giờ vào đó, dù cửa sổ có rộng bao nhiêu. Nới cửa sổ cho một ngữ cảnh trống không thêm dữ liệu nào.`,
    `Đúng. Subagent không tự thừa hưởng conversation history của coordinator và không chia sẻ bộ nhớ giữa các lần gọi. Ngữ cảnh phải được đưa thẳng vào prompt, nếu không thì "findings from the previous agents" là một câu trỏ vào chỗ trống — và một model không có dữ liệu sẽ điền vào bằng chính nó, đúng như hiện tượng bạn thấy.`,
    `Cấm bằng chỉ dẫn không tạo ra được cái đang thiếu. Khi trong prompt không có URL hay tên tài liệu nào, luật "không có dẫn nguồn thì không viết" chỉ dẫn tới việc bịa dẫn nguồn hoặc từ chối viết.`,
    `Cấp tool tìm web cho synthesis là để nó tự đi tìm hậu kiểm cho câu nó vừa viết — tức là gán nguồn ngược, không phải bảo toàn nguồn gốc. Nó cũng lách qua coordinator, làm mất chỗ quan sát tập trung và làm kết quả khó tái lập.`,
    `Đúng. Truyền findings dưới dạng bản ghi có cấu trúc, tách phần nội dung khỏi phần metadata (URL, tên tài liệu, số trang), giữ được đường dẫn nguồn cho từng nhận định. Nếu ép hết thành văn xuôi thì thông tin gán nguồn bị trộn vào chữ và mất ngay từ bước truyền.`,
  ],
  concept: `Subagent chạy với ngữ cảnh cô lập: cái gì không nằm trong prompt của nó thì với nó là không tồn tại. Muốn báo cáo có dẫn nguồn, phải truyền findings đầy đủ và truyền dưới dạng có cấu trúc để metadata nguồn đi kèm từng nhận định.`,

{ id: "cca2-007", n: 7, set: 2, scenario: 1, domain: 1, task: "1.4",
  topic: "Structured Handoff Protocol", difficulty: "medium", type: "mc", ans: [1],
  q: `When the agent gives up on a dispute it calls escalate_to_human. Human agents pick these tickets up in a separate console that does not show the agent's conversation. Today the escalation carries only the customer's original message plus the note "unable to resolve." Human agents end up re-asking customers for details the agent already collected, and average handle time on escalated tickets is 11 minutes. What should escalate_to_human carry instead?`,
  opts: [
    `The full conversation transcript verbatim, so the human agent can read exactly what happened and reach an independent judgment.`,
    `A structured handoff summary: the verified customer ID, the root cause the agent established, the orders and amounts involved, and the recommended action.`,
    `The agent's confidence score for each resolution it considered, so the human agent can see what was already ruled out.`,
    `A short apology drafted for the customer plus a promise of a callback window, so the customer is held while the human agent works the queue.`,
  ],
  q_vi: `Khi agent từ bỏ một vụ tranh chấp, nó gọi escalate_to_human. Nhân viên con người tiếp nhận các ticket này trong một console riêng không hiển thị hội thoại của agent. Hiện tại, phần escalation chỉ mang theo tin nhắn gốc của khách hàng cộng với ghi chú "unable to resolve." Nhân viên con người rốt cuộc phải hỏi lại khách hàng những chi tiết mà agent đã thu thập, và average handle time trên các ticket bị escalate là 11 phút. escalate_to_human nên mang theo gì thay vào đó?`,
  opts_vi: [
    `Toàn bộ transcript hội thoại nguyên văn, để nhân viên con người đọc đúng những gì đã xảy ra và tự đưa ra phán đoán độc lập.`,
    `Một bản tóm tắt bàn giao có cấu trúc: customer ID đã xác minh, nguyên nhân gốc mà agent đã xác lập, các đơn hàng và số tiền liên quan, và hành động được đề xuất.`,
    `Điểm tự tin của agent cho từng hướng giải quyết nó đã cân nhắc, để nhân viên con người thấy được những gì đã bị loại trừ.`,
    `Một lời xin lỗi ngắn soạn sẵn cho khách hàng cùng lời hứa về khung giờ gọi lại, để giữ chân khách trong lúc nhân viên con người xử lý hàng đợi.`,
  ],
  why: [
    `Transcript nguyên văn tốt hơn một dòng "unable to resolve", nhưng nó đẩy toàn bộ việc đọc sang người: khối tool call, payload JSON, các nhánh đã thử rồi bỏ. Người xử lý vẫn phải tự dựng lại kết luận, nên thời gian xử lý không giảm nhiều.`,
    `Đúng. Người nhận ticket không thấy hội thoại, nên bàn giao phải mang sẵn thứ họ cần để hành động: khách là ai đã xác minh, nguyên nhân gốc agent đã dựng được, đơn hàng và số tiền liên quan, và hành động đề xuất. Đó chính là mẫu hình structured handoff, và nó xoá đúng việc hỏi lại khách.`,
    `Điểm tự tin do model tự báo hiệu chỉnh kém, và nó là siêu dữ liệu về sự do dự của agent chứ không phải dữ kiện của ca. Người xử lý vẫn thiếu customer ID, số đơn và số tiền.`,
    `Soạn lời xin lỗi và hẹn gọi lại là chăm sóc trải nghiệm khách, không phải nội dung bàn giao. Nó không đưa thêm một dữ kiện nào cho người sẽ giải quyết ca này.`,
  ],
  concept: `Escalate giữa quy trình là một cuộc bàn giao có thông tin, không phải một cú chuyển tiếp. Vì người nhận không có transcript, nội dung bàn giao phải là bản tóm tắt có cấu trúc đủ để họ hành động ngay.`,
  takeaway: `Khi escalate, hãy gửi kèm customer ID đã xác minh, nguyên nhân gốc, số tiền và đơn liên quan, cùng hành động đề xuất — người nhận không thấy hội thoại của bạn.`,
  terms: [
    ["structured handoff", "bàn giao theo khuôn có sẵn các trường người nhận cần"],

    ["transcript", "toàn văn hội thoại giữa khách và agent"],

{ id: "cca2-008", n: 8, set: 2, scenario: 1, domain: 1, task: "1.4",
  topic: "Prerequisite Gate Design", difficulty: "hard", type: "mc", ans: [3],
  q: `Your team adopted the rule "process_refund must not run until get_customer has returned a verified customer ID." The implementation intercepts every outgoing process_refund call and permits it only when the agent's most recent assistant message contains a line reading VERIFIED: <customer_id>, which the system prompt tells the agent to emit after verifying. Auditors still find refunds issued against unverified accounts. What is the most effective correction?`,
  opts: [
    `Add few-shot examples to the system prompt showing the agent emitting the VERIFIED line immediately after each get_customer call, so the marker is produced reliably.`,
    `Keep the marker check and add a second model call that reads the conversation and confirms verification really happened before the refund is released.`,
    `Keep the marker check but also require the customer to restate the order number in their own words, so the refund is grounded in something only the account holder would know.`,
    `Gate on the recorded result of the get_customer call itself: block process_refund until the session's tool-call history holds a get_customer result with a verified customer ID matching the refund target.`,
  ],
  q_vi: `Nhóm của bạn áp dụng quy tắc: process_refund không được chạy cho đến khi get_customer đã trả về một customer ID đã được xác minh. Cách triển khai chặn mọi lời gọi process_refund đi ra và chỉ cho phép khi tin nhắn assistant gần nhất của agent chứa một dòng ghi VERIFIED: <customer_id>, điều mà system prompt bảo agent phát ra sau khi đã xác minh. Auditor vẫn phát hiện các khoản hoàn tiền được phát hành cho những tài khoản chưa xác minh. Cách sửa nào hiệu quả nhất?`,
  opts_vi: [
    `Thêm few-shot examples vào system prompt cho thấy agent phát ra dòng VERIFIED ngay sau mỗi lời gọi get_customer, để marker này được tạo ra đáng tin cậy hơn.`,
    `Giữ nguyên việc kiểm tra marker và thêm một lời gọi model thứ hai đọc hội thoại và xác nhận việc xác minh thực sự đã xảy ra trước khi khoản hoàn tiền được giải phóng.`,
    `Giữ nguyên việc kiểm tra marker nhưng đồng thời yêu cầu khách hàng nhắc lại số đơn hàng bằng lời của chính họ, để khoản hoàn tiền được neo vào một thứ chỉ chủ tài khoản mới biết.`,
    `Chặn dựa trên chính kết quả đã ghi lại của lời gọi get_customer: chặn process_refund cho đến khi tool-call history của session chứa một kết quả get_customer với customer ID đã xác minh khớp với đối tượng nhận hoàn tiền.`,
  ],
  why: [
    `Few-shot làm marker xuất hiện thường xuyên hơn, nhưng vẫn là tuân thủ mang tính xác suất — và nó còn củng cố đúng lỗ hổng: cổng vẫn tin vào một dòng chữ do model sinh, nên model sinh ra dòng đó mà chưa xác minh là hoàn tiền vẫn qua.`,
    `Thêm một lời gọi model để kiểm tra là lấy một cơ chế xác suất đi kiểm một cơ chế xác suất khác. Nó tốn thêm độ trễ và chi phí, thêm một chỗ có thể sai, mà vẫn không có gì đảm bảo chắc chắn.`,
    `Bắt khách nhắc lại số đơn là một hình thức xác thực nhẹ khác, không phải cái quy tắc yêu cầu. Nó không dùng get_customer, không tạo ra customer ID đã xác minh, và vẫn để nguyên cổng đang tin vào văn bản của model.`,
    `Đúng. Chỗ sai không phải việc chặn mà là dữ liệu dùng để quyết định chặn: một dòng chữ do model tự viết. Đối chiếu với lịch sử tool call thật — get_customer đã trả về customer ID đã xác minh, và ID đó khớp đối tượng hoàn tiền — mới cho đảm bảo tất định, vì model không thể tạo ra sự kiện đó bằng cách viết ra nó.`,
  ],
  concept: `Cổng tiên quyết chỉ tất định khi điều kiện của nó đọc từ dữ kiện hệ thống ghi lại được, chứ không phải từ văn bản model sinh ra. Chặn bằng code mà lại tin vào một marker do model viết thì độ tin cậy vẫn đúng bằng độ tin cậy của prompt.`,
  takeaway: `Điều kiện của cổng phải soi vào lịch sử tool call và giá trị tool trả về, không soi vào chữ model viết. Nếu model có thể viết ra tấm vé đi qua cổng thì đó không phải cổng.`,
  terms: [

  topic: "Hook-Based Policy Enforcement", difficulty: "medium", type: "mc", ans: [2],
  q: `Company policy requires human approval for any refund above $500. Your system prompt states this limit clearly, yet audit logs show process_refund executed for amounts between $700 and $1,200 on several occasions last quarter. Once the backend issues a refund it cannot be reversed automatically. What is the most reliable way to enforce the threshold?`,

    `Kiểm tra sau khi lời gọi đã chạy là quá muộn cho một hành động không hoàn tác được: tiền đã ra khỏi hệ thống, và bạn đang xây thêm quy trình bù trừ cho một việc lẽ ra không được xảy ra. PostToolUse phù hợp để biến đổi kết quả, không phải để ngăn hành động.`,

    `Giọng điệu và sự đồng cảm là việc mô hình làm tốt và không quy về luật cứng được. Hook không có gì để kiểm ở đây, còn prompt thì đúng công cụ.`,

  ],
  concept: `Ranh giới: hook lo những gì máy móc và cần chắc chắn (chặn hành vi vi phạm, chuẩn hóa dữ liệu); prompt lo những gì cần phán đoán theo ngữ cảnh (giọng điệu, khi nào hỏi lại, cách diễn đạt).`,
  takeaway: `Trước khi viết hook, hỏi: yêu cầu này kiểm được bằng code và cần đúng 100% không? Nếu nó là chuyện phán đoán theo ngữ cảnh thì hook chỉ làm hệ thống cứng nhắc mà không chính xác hơn.`,
  terms: [
    ["hook", "đoạn mã SDK gọi tại điểm cố định trong luồng, chạy bằng code nên chắc chắn"],
    ["probabilistic compliance", "tuân thủ theo xác suất, luôn còn tỷ lệ trượt khác 0"],
    ["business rule", "quy tắc nghiệp vụ, thường phải đúng 100%"],
    ["data normalization", "đưa dữ liệu nhiều nguồn về một định dạng chung"],
    ["judgment call", "quyết định phải cân nhắc ngữ cảnh, không quy được về luật cứng"],
  ] },

{ id: "cca2-011", n: 11, set: 2, scenario: 1, domain: 1, task: "1.5",
  topic: "Hook Feedback Design", difficulty: "hard", type: "mc", ans: [1],
  q: `You deployed a hook that intercepts process_refund and blocks calls above $500 by returning the string "ERROR: blocked". No over-threshold refund has been issued since. However, transcripts now show the agent calling process_refund two or three more times with the same amount, then telling the customer that the refund system is currently down. What should you change?`,
  opts: [
    `Cap the agentic loop at a lower maximum number of turns so the repeated calls stop earlier.`,
    `Have the hook return a structured result that names the $500 approval rule, states that the call was blocked by policy rather than by a failure, and instructs the agent to call escalate_to_human with the order and refund details.`,
    `Lower the block threshold to $300 so fewer requests land near the boundary where retries happen.`,
    `Remove the hook and move the $500 rule back into the system prompt, so the agent understands why it cannot proceed.`,
  ],
  q_vi: `Bạn đã triển khai một hook chặn process_refund và ngăn các lời gọi trên $500 bằng cách trả về chuỗi "ERROR: blocked". Từ đó chưa có refund nào vượt ngưỡng được phát hành. Tuy nhiên, transcript giờ cho thấy agent gọi process_refund thêm hai ba lần nữa với cùng số tiền, rồi báo với khách hàng rằng hệ thống refund hiện đang bị lỗi. Bạn nên thay đổi điều gì?`,
  opts_vi: [
    `Giới hạn agentic loop ở một số lượt tối đa thấp hơn để các lời gọi lặp lại dừng sớm hơn.`,
    `Để hook trả về một kết quả có cấu trúc nêu rõ tên quy tắc phê duyệt $500, nói rằng lời gọi bị chặn vì chính sách chứ không phải vì lỗi, và hướng dẫn agent gọi escalate_to_human kèm chi tiết đơn hàng và refund.`,
    `Hạ ngưỡng chặn xuống $300 để ít yêu cầu rơi gần đường biên nơi xảy ra việc gọi lại hơn.`,
    `Bỏ hook và chuyển quy tắc $500 trở lại vào system prompt, để agent hiểu vì sao nó không thể tiếp tục.`,
  ],
  why: [
    `Giới hạn số lượt chỉ làm agent bỏ cuộc sớm hơn. Khách vẫn nhận một câu trả lời sai về nguyên nhân, và ca đó vẫn không được chuyển cho người xử lý.`,
    `Chốt an toàn đã hoạt động đúng; vấn đề là thông tin nó trả về. Một kết quả có nội dung rõ ràng — vi phạm luật nào, bị chặn chứ không phải hỏng, bước tiếp theo là gì — biến việc chặn thành một điểm rẽ nhánh sang luồng escalate thay vì một lỗi mờ khiến agent gọi lại.`,
    `Hạ ngưỡng không liên quan đến nguyên nhân. Nó chỉ đổi chỗ đường biên, và mọi ca bị chặn ở ngưỡng mới vẫn dẫn tới đúng vòng gọi lại đó.`,
    `Bỏ hook đúng là làm agent hiểu lý do, nhưng đánh đổi bằng chính đảm bảo bạn vừa đạt được: refund quá ngưỡng sẽ lại chạy được. Bạn không phải chọn giữa hai thứ này — hook vẫn chặn được mà vẫn nói rõ lý do.`,
  ],
  concept: `Một hook chặn tốt phải làm hai việc: ngăn hành vi vi phạm, và trả về đủ thông tin để agent biết đi đường nào tiếp. Lỗi mờ khiến agent hiểu là sự cố tạm thời và gọi lại — đúng hành vi của một agentic loop khi gặp lỗi.`,
  takeaway: `Đừng để hook trả về lỗi trống. Nói rõ luật nào chặn và luồng thay thế là gì, nếu không agent sẽ coi việc bị chặn là hệ thống hỏng.`,
  terms: [
    ["structured error response", "kết quả lỗi có nội dung rõ, để agent biết làm gì tiếp"],
    ["opaque error", "lỗi mờ, không nói được nguyên nhân hay bước tiếp theo"],
    ["retry loop", "vòng gọi lại liên tục vì agent tưởng lỗi là tạm thời"],
    ["redirect to alternative workflow", "chuyển sang luồng thay thế, ở đây là escalate cho người"],
    ["guardrail", "chốt an toàn chặn hành vi vi phạm chính sách"],
  ] },

{ id: "cca2-012", n: 12, set: 2, scenario: 5, domain: 1, task: "1.6",
  topic: "Prompt Chaining Decomposition", difficulty: "medium", type: "mc", ans: [3],
  q: `Every pull request in your pipeline must be checked for the same four things: style violations, security issues, missing test coverage, and outdated documentation. A single prompt asking for all four produces reviews where one or two aspects get thorough treatment and the rest are barely mentioned — and which aspects get the attention varies from run to run. How should you structure the review?`,
  opts: [
    `Let the agent decide at run time which aspects deserve attention on each pull request, based on what stands out to it in the diff.`,
    `Run the same combined prompt three times and report only findings that appear in at least two of the runs.`,
    `Keep the single pass but require the output to be a JSON object with one field per aspect, so no aspect can be omitted.`,
    `Use a fixed prompt chain: one dedicated pass per aspect, each with its own criteria, then assemble the four results into one review comment.`,
  ],
  q_vi: `Mọi pull request trong pipeline của bạn đều phải được kiểm tra cùng bốn thứ: vi phạm style, vấn đề bảo mật, thiếu test coverage, và tài liệu đã lỗi thời. Một prompt duy nhất yêu cầu cả bốn thứ tạo ra các review mà một hoặc hai khía cạnh được xử lý kỹ, còn lại thì hầu như không được nhắc tới — và khía cạnh nào được chú ý lại thay đổi giữa các lần chạy. Bạn nên cấu trúc review như thế nào?`,
  opts_vi: [
    `Để agent tự quyết định ngay trong lúc chạy khía cạnh nào đáng được chú ý cho từng pull request, dựa trên những gì nổi bật với nó trong diff.`,
    `Chạy cùng một prompt gộp ba lần và chỉ báo cáo những phát hiện xuất hiện trong ít nhất hai lần chạy.`,
    `Giữ nguyên một lượt duy nhất nhưng yêu cầu đầu ra là một JSON object với một trường cho mỗi khía cạnh, để không khía cạnh nào bị bỏ sót.`,
    `Dùng một prompt chain cố định: một lượt riêng cho mỗi khía cạnh, mỗi lượt có tiêu chí riêng, rồi ghép bốn kết quả lại thành một comment review duy nhất.`,
  ],
  why: [
    `Để agent tự chọn khía cạnh nào đáng xem là phân rã động — đúng cho điều tra mở, sai cho một cổng kiểm CI. Bốn khía cạnh ở đây đã biết trước và bắt buộc; để mô hình tự chọn chính là biến sự bất nhất hiện tại thành thiết kế chính thức.`,
    `Chạy ba lần rồi chỉ giữ phát hiện trùng nhau sẽ loại đúng những bug chỉ một lượt bắt được, làm giảm độ thu hồi. Cách này lọc bớt đầu ra thay vì chữa nguyên nhân là một lượt bị nhồi quá nhiều việc.`,
    `Bắt buộc có đủ bốn trường ép mô hình phải viết gì đó cho mỗi khía cạnh, nhưng không cấp thêm sự chú ý cho khía cạnh nào. Bạn sẽ đổi việc "không nhắc tới" thành "nhắc cho có" — dễ nhìn ra hơn nhưng vẫn nông như cũ.`,
    `Bốn khía cạnh biết trước và cố định là điều kiện lý tưởng cho prompt chaining: mỗi lượt một nhiệm vụ hẹp kèm tiêu chí riêng, nên mỗi khía cạnh nhận toàn bộ sự chú ý của lượt đó. Kết quả cũng lặp lại được giữa các lần chạy, điều mà cổng kiểm CI cần.`,
  ],
  concept: `Quy trình nhiều khía cạnh nhưng đoán trước được thì dùng pipeline tuần tự cố định (prompt chaining), mỗi lượt một khía cạnh. Phân rã động dành cho tác vụ mà bạn không thể liệt kê các bước từ đầu.`,
  takeaway: `Biết trước phải kiểm những gì thì đừng để mô hình tự chọn: mỗi khía cạnh một lượt riêng, có tiêu chí riêng. Đó cũng là cách duy nhất để CI cho kết quả lặp lại được.`,
  terms: [
    ["prompt chaining", "chuỗi bước prompt cố định, mỗi bước một nhiệm vụ hẹp"],
    ["fixed sequential pipeline", "pipeline tuần tự cố định, các bước biết trước"],
    ["attention dilution", "pha loãng chú ý khi nhồi quá nhiều nhiệm vụ vào một lượt"],
    ["dynamic decomposition", "phân rã động, sinh việc con theo phát hiện dọc đường"],
    ["reproducibility", "tính lặp lại, chạy lại cho cùng phạm vi kiểm tra"],
  ] },

{ id: "cca2-013", n: 13, set: 2, scenario: 5, domain: 1, task: "1.6",
  topic: "Cross-File Integration Pass", difficulty: "hard", type: "mc", ans: [0],
  q: `Your review now runs one analysis pass per changed file, which fixed the uneven depth problem. Developers report a new gap: when a function signature changes in one file and a caller in another file is updated inconsistently, no pass flags it — each file looks internally correct on its own. What should you add?`,
  opts: [
    `An integration pass that runs after the per-file passes and examines only what crosses file boundaries in this change set: call sites, shared types, and data flow between the changed files.`,
    `The full repository in the context of every per-file pass, so each pass can see all call sites of anything it touches.`,
    `A return to one single pass over all changed files, since splitting the review is what created the cross-file blind spot.`,
    `Parallel execution of the per-file passes with their findings merged, so contradictions between files surface in the merged output.`,
  ],
  q_vi: `Review của bạn giờ chạy một lượt phân tích cho mỗi file đã đổi, điều này đã khắc phục vấn đề độ sâu không đồng đều. Các developer báo cáo một lỗ hổng mới: khi chữ ký hàm đổi ở một file và nơi gọi hàm đó ở file khác được cập nhật không nhất quán, không lượt nào gắn cờ nó — mỗi file tự nó trông đúng. Bạn nên thêm gì?`,
  opts_vi: [
    `Một lượt tích hợp chạy sau các lượt theo file, chỉ xét những gì vượt qua ranh giới file trong tập thay đổi này: chỗ gọi hàm, type dùng chung, và luồng dữ liệu giữa các file đã đổi.`,
    `Đưa toàn bộ repository vào context của mọi lượt theo file, để mỗi lượt có thể thấy mọi chỗ gọi của bất cứ thứ gì nó đụng tới.`,
    `Quay về một lượt duy nhất cho tất cả file đã đổi, vì việc chia nhỏ review chính là thứ tạo ra điểm mù xuyên file.`,
    `Chạy song song các lượt theo file rồi gộp phát hiện của chúng lại, để các mâu thuẫn giữa các file lộ ra trong đầu ra đã gộp.`,
  ],
  why: [
    `Lỗi này chỉ tồn tại ở khoảng giữa các file, nên phải có một lượt mà đối tượng phân tích chính là các mối nối: chỗ gọi hàm, type dùng chung, luồng dữ liệu qua ranh giới file. Vì lượt này chỉ xét phần giao nhau của tập file đã đổi, nó vẫn hẹp và không quay về tình trạng nhồi mọi thứ vào một lượt.`,
    `Nhồi cả repository vào mỗi lượt kéo trở lại đúng vấn đề mà việc chia lượt vừa giải quyết, chỉ ở mức nặng hơn. Nó cũng làm mỗi lượt mất tiêu điểm: file đang xét bị chìm giữa hàng nghìn file không liên quan.`,
    `Quay về một lượt duy nhất là đổi một điểm mù lấy một điểm mù khác — bạn được cái nhìn xuyên file nhưng mất lại độ sâu đồng đều đã đạt được. Hai mối quan tâm này nên nằm ở hai lượt khác nhau, không tranh nhau trong một lượt.`,
    `Chạy song song chỉ đổi thời gian thực thi, không đổi thứ mỗi lượt nhìn thấy. Trộn kết quả sau đó không tạo ra phân tích xuyên file, vì không lượt nào từng nhìn cả hai phía của mối nối để biết chúng lệch nhau.`,
  ],
  concept: `Phân rã tốt thì mỗi lượt có một đối tượng phân tích rõ ràng. Lượt theo file bắt lỗi cục bộ; lỗi xuyên file cần một lượt riêng lấy chính các mối nối giữa các file đã đổi làm đối tượng.`,
  takeaway: `Chia theo file rồi thì phải có thêm một lượt xét phần giao nhau, nếu không lỗi nằm giữa hai file sẽ không thuộc phạm vi của bất kỳ lượt nào.`,
  terms: [
    ["cross-file issue", "lỗi chỉ lộ ra khi xét nhiều file cùng lúc"],
    ["per-file pass", "lượt phân tích riêng cho từng file"],
    ["integration pass", "lượt riêng xét tương tác giữa các file đã đổi"],
    ["call site", "chỗ gọi hàm, nơi đổi chữ ký hàm gây vỡ"],
    ["blind spot", "điểm mù mà cách phân rã hiện tại không nhìn tới"],
  ] },

{ id: "cca2-014", n: 14, set: 2, scenario: 4, domain: 1, task: "1.6",
  topic: "Adaptive Decomposition Signals", difficulty: "easy", type: "mc", ans: [2],
  q: `Your team is writing internal guidance on when the productivity agent should build an adaptive investigation plan — one that generates its next subtasks from what it just found — instead of following a sequence of steps fixed in advance. Which signal most reliably indicates the adaptive approach is the right choice?`,
  opts: [
    `The task will take many tool calls and a long wall-clock time to finish.`,
    `The task involves reading a large number of files.`,
    `The subtasks cannot be listed in advance, because what each step finds determines what needs to be examined next.`,
    `The task requires more than one model call to complete.`,
  ],
  q_vi: `Nhóm của bạn đang viết hướng dẫn nội bộ về việc khi nào productivity agent nên xây dựng một adaptive investigation plan — một kế hoạch sinh ra các việc con tiếp theo từ chính những gì nó vừa phát hiện — thay vì đi theo một chuỗi bước cố định từ trước. Tín hiệu nào cho biết đáng tin cậy nhất rằng cách tiếp cận thích ứng là lựa chọn đúng?`,
  opts_vi: [
    `Tác vụ sẽ cần nhiều lời gọi công cụ và mất nhiều thời gian thực để hoàn thành.`,
    `Tác vụ liên quan đến việc đọc một số lượng lớn file.`,
    `Các việc con không thể liệt kê được từ trước, vì những gì mỗi bước phát hiện sẽ quyết định điều gì cần xem xét tiếp theo.`,
    `Tác vụ cần nhiều hơn một lời gọi mô hình để hoàn thành.`,
  ],
  why: [
    `Dài và tốn nhiều lời gọi không nói gì về việc bạn có liệt kê được các bước từ đầu hay không. Một pipeline cố định vẫn có thể rất dài mà vẫn hoàn toàn đoán trước được.`,
    `Số lượng file lớn là dấu hiệu bạn cần chia nhỏ, nhưng chia theo cách nào thì nó không trả lời. Quét 500 file với cùng một bộ tiêu chí là việc đoán trước được và hợp với lượt cố định.`,
    `Đây chính là điều kiện phân biệt: khi bước sau phụ thuộc vào phát hiện của bước trước, bạn không thể viết ra danh sách việc con từ đầu, nên kế hoạch buộc phải sinh dần theo phát hiện.`,
    `Gần như mọi tác vụ không tầm thường đều cần nhiều lời gọi mô hình. Tiêu chí này không loại được gì nên không giúp bạn chọn giữa hai cách phân rã.`,
  ],
  concept: `Câu hỏi quyết định là: bạn có liệt kê được các việc con ngay từ đầu hay không. Liệt kê được thì dùng chuỗi bước cố định; không liệt kê được vì việc con phụ thuộc phát hiện dọc đường thì dùng kế hoạch thích ứng.`,
  takeaway: `Chọn cách phân rã theo việc có liệt kê được việc con từ đầu hay không, chứ không theo tác vụ dài hay ngắn, nhiều file hay ít file.`,
  terms: [
    ["adaptive investigation plan", "kế hoạch điều tra tự điều chỉnh theo phát hiện từng bước"],
    ["subtask", "việc con được tách ra từ việc lớn"],
    ["open-ended task", "tác vụ mở, chưa rõ phạm vi ngay từ đầu"],
    ["up front", "quyết ngay từ đầu, trước khi bắt tay làm"],
    ["predictable workflow", "quy trình đoán trước được, hợp với các bước cố định"],
  ] },

{ id: "cca2-015", n: 15, set: 2, scenario: 4, domain: 1, task: "1.7",
  topic: "Named Session Resumption", difficulty: "medium", type: "mc", ans: [1],
  q: `An engineer spent an afternoon having the agent map an unfamiliar billing service: module boundaries, the main classes, and how an invoice moves through the system. They stopped for the day. The next morning they want to keep going with the same investigation. Nothing in the repository changed overnight. What is the most efficient way to continue?`,
  opts: [
    `Start a fresh session and paste in a written summary of yesterday's findings before asking the next question.`,
    `Resume the prior conversation with --resume and its session name, since yesterday's analysis is still valid.`,
    `Start a fresh session and have the agent re-explore the service, so today's answers rest on files it has just read itself.`,
    `Fork the prior session, so this morning's work stays isolated from yesterday's analysis.`,
  ],
  q_vi: `Một kỹ sư đã dành cả buổi chiều để agent lập bản đồ một billing service chưa quen thuộc: ranh giới module, các class chính, và cách một invoice di chuyển qua hệ thống. Họ dừng lại để nghỉ ngày hôm đó. Sáng hôm sau họ muốn tiếp tục cuộc điều tra tương tự. Không có gì trong repository thay đổi qua đêm. Đâu là cách hiệu quả nhất để tiếp tục?`,
  opts_vi: [
    `Bắt đầu một session mới và dán vào một bản tóm tắt viết tay các phát hiện của ngày hôm qua trước khi đặt câu hỏi tiếp theo.`,

    `Khám phá lại từ đầu là bỏ đi cả buổi chiều làm việc để lấy lại chính thứ mình đã có. Sự cẩn thận này chỉ đáng khi bạn có lý do nghi ngờ ngữ cảnh cũ, mà tình huống đã nói rõ là không.`,

{ id: "cca2-016", n: 16, set: 2, scenario: 4, domain: 1, task: "1.7",
  topic: "Targeted Re-analysis on Resume", difficulty: "medium", type: "mc", ans: [3],
  q: `You are about to resume a named session in which the agent analyzed 40 files of a legacy service. Since that session ended you refactored 3 of those files; the other 37 are untouched and the earlier findings about them still hold. What should your first message in the resumed session do?`,
  opts: [
    `Say nothing about the refactor — the agent re-reads files when it needs them, so it will pick up the new versions on its own.`,
    `Say that the codebase has changed and ask the agent to re-explore the whole service from the beginning, to be safe.`,
    `Restrict your next questions to the 37 untouched files, so the outdated analysis of the refactored ones never comes into play.`,
    `Name the 3 files you changed and what changed in them, ask the agent to re-read those, and state that the rest of its earlier analysis still reflects the current code.`,
  ],
  q_vi: `Bạn sắp mở lại một named session trong đó agent đã phân tích 40 file của một legacy service. Kể từ khi session đó kết thúc, bạn đã refactor 3 trong số các file đó; 37 file còn lại không bị đụng tới và các phát hiện trước đó về chúng vẫn còn đúng. Tin nhắn đầu tiên của bạn trong session được mở lại nên làm gì?`,
  opts_vi: [
    `Không nói gì về việc refactor — agent sẽ tự đọc lại file khi cần, nên nó sẽ tự lấy được phiên bản mới.`,
    `Nói rằng codebase đã thay đổi và yêu cầu agent khám phá lại toàn bộ service từ đầu, cho chắc.`,
    `Giới hạn các câu hỏi tiếp theo của bạn vào 37 file không bị đụng tới, để phân tích đã lỗi thời của các file đã refactor không bao giờ được dùng đến.`,
    `Nêu tên 3 file bạn đã thay đổi và những gì đã đổi trong chúng, yêu cầu agent đọc lại các file đó, và khẳng định rằng phần còn lại của phân tích trước đó vẫn phản ánh đúng code hiện tại.`,
  ],
  why: [
    `Agent không tự biết file trên đĩa đã đổi. Nó đang suy luận trên nội dung đã nạp vào ngữ cảnh từ phiên trước, và sẽ tiếp tục dùng phiên bản cũ đó cho tới khi có lý do đọc lại.`,
    `Khám phá lại toàn bộ vì 3 trên 40 file đổi là ném đi 37 phần phân tích vẫn còn đúng. "Cho chắc" ở đây tốn kém mà không mua thêm được độ chính xác nào.`,
    `Né các file đã đổi không sửa được ngữ cảnh lệch, chỉ hoãn nó lại. Đến lúc câu hỏi nào chạm tới phần liên quan, agent vẫn lấy phiên bản cũ ra dùng.`,
    `Nói rõ file nào đổi và đổi gì cho agent biết chính xác phần nào cần đọc lại, đồng thời khẳng định phần còn lại vẫn dùng được. Bạn khoanh vùng việc phân tích lại vào đúng chỗ lệch mà không phải trả giá cho một lượt khám phá lại toàn bộ.`,
  ],
  concept: `Mở lại phiên không đồng bộ ngữ cảnh với đĩa. Trách nhiệm nói cho agent biết file nào đã đổi là của bạn, và nói cụ thể thì bạn khoanh được việc đọc lại vào đúng phần lệch.`,
  takeaway: `Mở lại phiên sau khi sửa code thì mở đầu bằng danh sách file đã đổi kèm nội dung đổi. Nói cụ thể để phân tích lại có khoanh vùng, thay vì im lặng hay bắt làm lại tất cả.`,
  terms: [
    ["stale analysis", "phân tích đã cũ vì file thay đổi sau đó"],
    ["targeted re-analysis", "chỉ phân tích lại đúng phần đã đổi"],
    ["resumed session", "phiên được mở lại để tiếp tục"],
    ["context window", "phần mô hình đang thấy, không tự cập nhật theo file trên đĩa"],
    ["file system state", "trạng thái file thật trên đĩa, khác với thứ đã nạp vào ngữ cảnh"],

{ id: "cca2-017", n: 17, set: 2, scenario: 3, domain: 2, task: "2.1",
  topic: "Tool Description Overlap", difficulty: "medium", type: "mc", ans: [2],
  q: `Your research system exposes two tools to the document analysis subagent: analyze_content, which parses the raw HTML your web search subagent collects, and analyze_document, which parses uploaded PDF and DOCX files. Their descriptions read "Analyzes content and returns key information" and "Analyzes a document and returns key information". Logs show that in about 40% of runs the subagent passes scraped HTML into analyze_document, which returns malformed output that the synthesis subagent then treats as valid findings. What is the most effective fix?`,
  opts: [
    `Leave both tools as they are and add a system prompt rule listing which tool applies to which source type.`,
    `Merge both tools into a single analyze tool with a source_type enum parameter, and let the model set the enum on each call.`,
    `Rename analyze_content to extract_web_results, and rewrite both descriptions to state the exact input each accepts, an example input, and an explicit boundary saying which tool to use instead.`,
    `Add a validation step that inspects each call's payload and rejects the call when the payload format does not match the tool it was sent to.`,
  ],
  q_vi: `Hệ thống nghiên cứu của bạn cấp cho document analysis subagent hai tool: analyze_content, dùng để phân tích raw HTML mà web search subagent thu thập được, và analyze_document, dùng để phân tích file PDF và DOCX được tải lên. Mô tả của hai tool này lần lượt là "Analyzes content and returns key information" và "Analyzes a document and returns key information". Log cho thấy trong khoảng 40% số lần chạy, subagent đưa HTML đã scrape vào analyze_document, khiến tool này trả về output sai định dạng mà synthesis subagent sau đó lại coi là kết quả hợp lệ. Cách sửa nào hiệu quả nhất?`,
  opts_vi: [

    `Gộp hai tool thành một tool analyze duy nhất với tham số enum source_type, để model tự đặt giá trị enum ở mỗi lần gọi.`,
    `Đổi tên analyze_content thành extract_web_results, và viết lại cả hai mô tả để nêu rõ định dạng đầu vào mỗi tool nhận, một ví dụ đầu vào cụ thể, và một ranh giới rõ ràng nói khi nào nên dùng tool kia thay vì tool này.`,

{ id: "cca2-018", n: 18, set: 2, scenario: 1, domain: 2, task: "2.1",
  topic: "System Prompt Interference", difficulty: "hard", type: "mc", ans: [0],
  q: `You rewrote all four tool descriptions for your support agent, and overall tool selection improved. One failure remains: whenever a customer message contains the word "refund", the agent calls process_refund before ever calling lookup_order — including for messages like "what is your refund policy?" and "did my refund go through yet?". Nothing in the tool descriptions suggests this behavior. Reviewing your configuration, you find this line in the system prompt: "When a customer mentions a refund, use process_refund to resolve the issue promptly." What is the most effective correction?`,
  opts: [
    `Rewrite that system prompt line so it describes the decision instead of naming a tool: verify the order and its refund eligibility first, then decide whether a refund is warranted.`,
    `Keep the system prompt line and add "do not call this tool for policy questions or status checks" to the process_refund description.`,
    `Keep the system prompt line and add few-shot examples showing refund policy questions being answered without any tool call.`,
    `Set tool_choice to "auto" so the model is free to choose a tool other than the one the system prompt names.`,
  ],
  q_vi: `Bạn đã viết lại cả bốn mô tả tool cho support agent, và nhìn chung việc chọn tool đã tốt hơn. Nhưng còn một lỗi: bất cứ khi nào tin nhắn của khách hàng chứa từ "refund", agent gọi process_refund trước khi kịp gọi lookup_order — kể cả với những tin nhắn như "what is your refund policy?" và "did my refund go through yet?". Không có gì trong các mô tả tool gợi ý hành vi này. Xem lại cấu hình, bạn thấy dòng sau trong system prompt: "When a customer mentions a refund, use process_refund to resolve the issue promptly." Cách sửa nào hiệu quả nhất?`,
  opts_vi: [
    `Viết lại dòng đó trong system prompt để nó mô tả quyết định cần đưa ra thay vì nêu tên một tool: kiểm tra đơn hàng và điều kiện đủ để hoàn tiền trước, rồi mới quyết định có nên hoàn tiền hay không.`,
    `Giữ nguyên dòng system prompt và thêm "do not call this tool for policy questions or status checks" vào mô tả của process_refund.`,
    `Giữ nguyên dòng system prompt và thêm các ví dụ few-shot cho thấy câu hỏi về chính sách hoàn tiền được trả lời mà không cần gọi tool nào.`,
    `Đặt tool_choice thành "auto" để model được tự do chọn một tool khác thay vì tool mà system prompt nêu tên.`,
  ],
  why: [
    `Một câu chỉ dẫn đặt từ khoá "refund" cạnh tên tool process_refund tạo ra liên kết ngoài ý muốn, và chỉ dẫn trong system prompt thường thắng mô tả tool. Viết lại thành mô tả quyết định — kiểm tra đơn hàng và điều kiện hoàn tiền trước, rồi mới xét có hoàn hay không — bỏ đúng cái mapping từ khoá sang tool và trả việc chọn tool về cho các mô tả bạn vừa sửa.`,
    `Thêm mệnh đề cấm vào mô tả process_refund biến mô tả tool thành đối thủ của system prompt, và bên thắng thường là chỉ dẫn. Bạn cũng đang chồng ngoại lệ lên tool thay vì bỏ nguyên nhân, nên mỗi cách khách hỏi mới lại cần thêm một ngoại lệ.`,
    `Few-shot có thể kéo hành vi về đúng phần nào, nhưng bạn đang trả token để chống lại chính chỉ dẫn của mình, vì câu kích hoạt theo từ khoá vẫn còn nguyên. Bạn cũng sẽ cần ví dụ cho từng cách diễn đạt khác nhau của khách.`,
    `"auto" đã là hành vi mặc định, và vấn đề không phải model bị khoá vào một tool. Model đang chọn tự do — nó chọn sai vì system prompt bảo nó chọn thế. Đổi cấu hình này không thay đổi gì.`,

  concept: `Cách diễn đạt trong system prompt nhạy với từ khoá: một chỉ dẫn gắn từ khoá với tên tool có thể ghi đè cả những mô tả tool viết tốt. Khi tool selection còn sai sau khi đã sửa mô tả, hãy soi lại system prompt.`,
  takeaway: `Đừng viết chỉ dẫn dạng "thấy từ X thì gọi tool Y". Hãy mô tả quyết định cần đưa ra và để mô tả tool làm việc chọn tool.`,
