<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện đề CCA-F — Claude Certified Architect: Foundations</title>

<meta name="theme-color" content="#1a1614">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luyện đề">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</head>
<body>
<style>
:root{
  --bg:#1a1614; --surface:#241f1c; --surface2:#2e2825; --line:#3a322e;
  --ink:#f2ece6; --muted:#a89c92; --faint:#7a6f66;
  --accent:#d97757; --accent2:#c45c3a; --accentGlow:rgba(217,119,87,.18);
  --ok:#7faa6f; --okBg:rgba(127,170,111,.12); --okLine:rgba(127,170,111,.4);
  --bad:#cf6a5a; --badBg:rgba(207,106,90,.1); --badLine:rgba(207,106,90,.38);
  --warn:#d4a24e;
  --easy:#7faa6f; --med:#d4a24e; --hard:#cf6a5a;
  --radius:14px; --radius-sm:9px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Be Vietnam Pro",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased}
body{padding:0;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:24px 18px 80px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}
code{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.86em;color:#e6b89c}

/* HEADER */
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px}
h1{font-size:1.35rem;font-weight:750;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:22px}

/* CARD */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.card h2{font-size:1.05rem;font-weight:700;margin-bottom:14px;letter-spacing:-.01em}
.card h2 .em{color:var(--accent)}

/* HOME options */
.opt-row{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0 4px}
.chip{padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:.9rem;font-weight:550;transition:.15s;user-select:none}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip.on{background:var(--accentGlow);border-color:var(--accent);color:var(--accent)}
.lbl{font-size:.82rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:650;margin:16px 0 7px}
.lbl:first-child{margin-top:0}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font-size:.92rem}
.sw{width:42px;height:24px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);position:relative;transition:.18s;flex:none}
.sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--faint);top:2px;left:2px;transition:.18s}
.sw.on{background:var(--accentGlow);border-color:var(--accent)}
.sw.on::after{left:21px;background:var(--accent)}
.tg-note{font-size:.8rem;color:var(--faint);margin:4px 0 0 52px;line-height:1.5}
.count-note{color:var(--faint);font-size:.86rem;margin-top:14px}
.start-btn{width:100%;margin-top:20px;padding:15px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:1.02rem;transition:.15s;box-shadow:0 6px 18px var(--accentGlow)}
.start-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.start-btn:active{transform:translateY(0)}
.start-btn:disabled{opacity:.5;cursor:default;transform:none}

/* resume banner */
.resume{border:1px solid var(--accent);background:var(--accentGlow);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.resume .rt{flex:1;min-width:200px;font-size:.92rem}
.resume button{padding:9px 15px;border-radius:7px;font-weight:650;font-size:.88rem;border:1px solid var(--accent);color:var(--accent)}
.resume button.go{background:var(--accent);color:#fff;border-color:var(--accent)}

/* scenario brief */
.brief{border:1px solid var(--line);background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:14px;overflow:hidden}
.brief-h{display:flex;gap:9px;align-items:center;width:100%;text-align:left;padding:11px 14px;font-size:.86rem;font-weight:650;color:var(--muted);transition:.13s}
.brief-h:hover{color:var(--ink)}
.brief-h .arr{margin-left:auto;color:var(--faint);transition:.2s;font-size:.75rem}
.brief-h.open .arr{transform:rotate(90deg)}
.brief-b{max-height:0;overflow:hidden;transition:max-height .3s ease;font-size:.9rem;line-height:1.62;color:var(--muted)}
.brief-b.open{max-height:600px;padding:0 14px 13px}
.brief-b b{color:var(--ink);font-weight:600}

/* blueprint */
.bp-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.bp-row .nm{flex:1;font-size:.9rem;font-weight:550}
.bp-row .bar{flex:none;width:190px;height:9px;border-radius:999px;background:var(--surface2);overflow:hidden;position:relative}
.bp-row .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bp-row .bar>u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.75}
.bp-row .vv{flex:none;width:96px;text-align:right;font-size:.83rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bp-legend{font-size:.8rem;color:var(--faint);line-height:1.55;margin-top:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.fact{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px}
.fact .fk{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:650}
.fact .fv{font-size:.95rem;font-weight:650;margin-top:2px}
.oos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.oos span{font-size:.8rem;color:var(--faint);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

/* QUIZ */
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.progress{flex:1;height:7px;background:var(--surface2);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s ease}
.qcount{font-size:.86rem;color:var(--muted);font-weight:600;white-space:nowrap}
.flagbtn{font-size:.84rem;color:var(--faint);padding:5px 10px;border-radius:7px;border:1px solid var(--line);transition:.15s;white-space:nowrap}
.flagbtn:hover{color:var(--ink);border-color:var(--faint)}
.flagbtn.on{color:var(--warn);border-color:var(--warn);background:rgba(212,162,78,.1)}

.badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.badge{font-size:.74rem;font-weight:650;padding:4px 10px;border-radius:999px;letter-spacing:.02em}
.badge.sc{background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.badge.dm{background:var(--surface2);border:1px solid var(--faint);color:var(--ink)}
.badge.tp{background:var(--accentGlow);color:var(--accent)}
.badge.df{border:1px solid currentColor}
.badge.easy{color:var(--easy)} .badge.medium{color:var(--med)} .badge.hard{color:var(--hard)}
.badge.mr{background:rgba(212,162,78,.14);border:1px solid var(--warn);color:var(--warn)}

.qtext{font-size:1.06rem;line-height:1.65;margin-bottom:8px;font-weight:500}
.pickhint{font-size:.84rem;color:var(--warn);font-weight:650;margin-bottom:12px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--surface2);transition:.13s;text-align:left;width:100%}
.choice:hover:not(.locked){border-color:var(--faint);background:#332c28}
.choice.sel{border-color:var(--accent);background:var(--accentGlow)}
.choice .key{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:750;font-size:.86rem;color:var(--muted);transition:.13s}
.choice.mr .key{border-radius:5px}
.choice.sel .key{background:var(--accent);color:#fff;border-color:var(--accent)}
.choice .ctext{flex:1;font-size:.96rem;line-height:1.55;padding-top:2px}
.choice.locked{cursor:default}
.choice.correct{border-color:var(--okLine);background:var(--okBg)}
.choice.correct .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.choice.wrong{border-color:var(--badLine);background:var(--badBg)}
.choice.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice .mark{flex:none;font-weight:800;font-size:1.05rem;align-self:center}
.choice.correct .mark{color:var(--ok)} .choice.wrong .mark{color:var(--bad)}

/* explanation */
.expl{margin-top:18px;border-top:1px solid var(--line);padding-top:18px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict{display:flex;align-items:center;gap:9px;font-weight:750;font-size:1rem;margin-bottom:14px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.sec-h{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:7px}
.concept{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:13px 15px;font-size:.95rem;line-height:1.6}
.ana{display:flex;flex-direction:column;gap:8px}
.ana-row{display:flex;gap:11px;padding:11px 13px;border-radius:var(--radius-sm);border:1px solid var(--line);font-size:.91rem;line-height:1.55;background:var(--surface2)}
.ana-row.t{border-color:var(--okLine);background:var(--okBg)}
.ana-row.f{border-color:var(--badLine);background:var(--badBg)}
.ana-row .ak{flex:none;font-weight:800;width:20px}
.ana-row.t .ak{color:var(--ok)} .ana-row.f .ak{color:var(--bad)}
.ana-row .av{flex:1}
.ana-row .mk{flex:none;font-weight:800}
.ana-row.t .mk{color:var(--ok)} .ana-row.f .mk{color:var(--bad)}
.take{background:linear-gradient(135deg,rgba(217,119,87,.13),rgba(196,92,58,.07));border:1px solid var(--accent);border-radius:var(--radius-sm);padding:13px 15px;font-size:.95rem;line-height:1.6;display:flex;gap:10px}
.take .ti{flex:none;font-size:1.1rem}
.trans-q{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;font-size:.93rem;line-height:1.62;margin-bottom:8px}
.terms{display:flex;flex-direction:column;gap:6px}
.term{font-size:.88rem;line-height:1.5;color:var(--muted)}
.term b{color:#e6b89c;font-weight:650;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:.85rem}
.taskref{font-size:.83rem;color:var(--faint);line-height:1.55}
.taskref b{color:var(--muted);font-weight:650}

/* ghi chú của người dùng */
.notebox{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.note-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:650;margin-bottom:8px}
.note-saved{text-transform:none;letter-spacing:0;font-weight:550;color:var(--ok);font-size:.8rem;opacity:0;transition:opacity .2s}
.note-saved.show{opacity:1}
.noteinput{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--ink);
  font-family:inherit;font-size:.92rem;line-height:1.6;padding:11px 13px;resize:vertical;min-height:64px;transition:border-color .15s}
.noteinput:focus{outline:none;border-color:var(--accent)}
.noteinput::placeholder{color:var(--faint)}
.rev-note{background:linear-gradient(135deg,rgba(217,119,87,.10),rgba(196,92,58,.05));border:1px solid var(--accent);
  border-radius:var(--radius-sm);padding:11px 14px;font-size:.92rem;line-height:1.6;white-space:pre-wrap}

/* xuất ghi chú */
.act-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:var(--radius-sm);
  border:1px solid var(--accent);color:var(--accent);background:var(--accentGlow);font-weight:650;font-size:.9rem;transition:.13s}
.act-btn:hover{filter:brightness(1.1)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;max-width:640px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.modal-h{font-size:1.05rem;font-weight:700;margin-bottom:6px}
.modal-sub{color:var(--muted);font-size:.86rem;line-height:1.55;margin-bottom:14px}
.modal-sub b{color:var(--ink)}
.modal-acts{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:12px}
.modal-ta{flex:1;min-height:200px;width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);
  color:var(--ink);font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;line-height:1.5;padding:12px;resize:vertical}

/* nav */
.nav{display:flex;gap:10px;margin-top:20px}
.nav button{flex:1;padding:13px;border-radius:var(--radius-sm);font-weight:650;font-size:.96rem;border:1px solid var(--line);background:var(--surface2);color:var(--ink);transition:.14s}
.nav button:hover:not(:disabled){border-color:var(--faint);background:#332c28}
.nav button:disabled{opacity:.35;cursor:default}
.nav .primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 5px 16px var(--accentGlow)}
.nav .primary:hover:not(:disabled){filter:brightness(1.07)}
.keys{text-align:center;color:var(--faint);font-size:.78rem;margin-top:12px}
.keys kbd{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:inherit;font-size:.95em}

/* RESULTS */
.score-hero{text-align:center;padding:10px 0 4px}
.score-ring{width:140px;height:140px;margin:0 auto 16px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .pct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.score-ring .pct b{font-size:2.1rem;font-weight:800;letter-spacing:-.02em}
.score-ring .pct span{display:block;font-size:.82rem;color:var(--muted);margin-top:-2px}
.score-msg{font-size:1.05rem;font-weight:650;margin-bottom:4px}
.score-sub{color:var(--muted);font-size:.92rem}
.caveat{border:1px solid var(--warn);background:rgba(212,162,78,.09);border-radius:var(--radius-sm);padding:12px 14px;font-size:.86rem;line-height:1.6;color:var(--muted);margin-top:16px}
.caveat b{color:var(--warn)}
.brk-h{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;margin:20px 0 10px}
.brk{display:flex;flex-direction:column;gap:9px}
.brk-row{display:flex;align-items:center;gap:12px}
.brk-row .nm{flex:none;width:200px;font-size:.9rem;color:var(--ink);font-weight:550}
.brk-row .bar{flex:1;height:9px;border-radius:999px;background:var(--surface2);overflow:hidden}
.brk-row .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.brk-row .vv{flex:none;width:62px;text-align:right;font-size:.85rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.res-actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.res-actions button{padding:14px;border-radius:var(--radius-sm);font-weight:700;font-size:1rem;transition:.14s}
.res-actions .primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 5px 16px var(--accentGlow)}
.res-actions .primary:hover{filter:brightness(1.07);transform:translateY(-1px)}
.res-actions .ghost{border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.res-actions .ghost:hover{border-color:var(--faint)}
.res-actions .ghost:disabled{opacity:.4;cursor:default}

/* history */
.hist{display:flex;flex-direction:column;gap:8px}
.hist-row{display:flex;gap:11px;align-items:center;padding:10px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface2);font-size:.87rem}
.hist-row .hp{flex:none;width:46px;font-weight:750;font-variant-numeric:tabular-nums}
.hist-row .hd{flex:1;color:var(--muted)}
.hist-row .hn{flex:none;color:var(--faint);font-size:.82rem}

/* review list */
.rev{display:flex;flex-direction:column;gap:10px}
.rev-item{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.rev-head{display:flex;gap:11px;align-items:center;padding:13px 15px;width:100%;text-align:left;transition:.13s}
.rev-head:hover{background:var(--surface2)}
.rev-head .rn{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-weight:750;font-size:.8rem}
.rev-head .rn.ok{background:var(--okBg);color:var(--ok);border:1px solid var(--okLine)}
.rev-head .rn.no{background:var(--badBg);color:var(--bad);border:1px solid var(--badLine)}
.rev-head .rq{flex:1;font-size:.9rem;line-height:1.45;color:var(--ink)}
.rev-head .rc{flex:none;font-size:.8rem;color:var(--muted)}
.rev-head .arr{flex:none;color:var(--faint);transition:.2s;font-size:.8rem}
.rev-head.open .arr{transform:rotate(90deg)}
.rev-body{padding:0 15px;max-height:0;overflow:hidden;transition:max-height .3s ease}
.rev-body.open{max-height:4000px;padding:4px 15px 16px}
.rev-mini{font-size:.78rem;color:var(--faint);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em;font-weight:650}

.foot{text-align:center;color:var(--faint);font-size:.82rem;margin-top:30px;line-height:1.6}
@media(max-width:560px){
  .wrap{padding:18px 13px 70px}
  .brk-row .nm{width:120px;font-size:.84rem}
  .bp-row .bar{width:110px}
  .card{padding:17px}
  h1{font-size:1.18rem}
}
</style>

<div class="wrap">
  <div class="top">
    <div class="logo">✻</div>
    <h1>Luyện đề CCA-F</h1>
  </div>
  <p class="sub" id="sub"></p>

  <!-- ============ HOME ============ -->
  <div id="home">
    <div id="resume-slot"></div>

    <div class="card">
      <h2>⚙️ <span class="em">Thiết lập</span> bài luyện</h2>

      <div class="lbl">Bộ đề</div>
      <div class="opt-row" id="set-row"></div>

      <div class="lbl">Chế độ</div>
      <div class="opt-row" id="mode-row">
        <button class="chip on" data-mode="practice">Luyện tập (phản hồi ngay)</button>
        <button class="chip" data-mode="exam">Thi thử (chấm cuối bài)</button>
      </div>

      <div class="lbl">Scenario</div>
      <div class="opt-row" id="scope-row"></div>

      <div class="lbl">Domain</div>
      <div class="opt-row" id="dom-row"></div>

      <div class="lbl">Độ khó</div>
      <div class="opt-row" id="diff-row">
        <button class="chip on" data-diff="all">Mọi mức</button>
        <button class="chip" data-diff="easy">Dễ</button>
        <button class="chip" data-diff="medium">Trung bình</button>
        <button class="chip" data-diff="hard">Khó</button>
      </div>

      <div class="toggle" id="shuffle-tog">
        <div class="sw on" id="shuffle-sw"></div>
        <span>Xáo trộn thứ tự câu hỏi</span>
      </div>
      <div class="toggle" id="shufopt-tog">
        <div class="sw on" id="shufopt-sw"></div>
        <span>Xáo trộn thứ tự phương án</span>
      </div>
      <div class="tg-note" id="shufopt-note"></div>

      <p class="count-note" id="count-note"></p>
      <button class="start-btn" id="start-btn">Bắt đầu →</button>

  topic: "Escalation Decisions", difficulty: "medium", type: "mc", ans: [0],
  q: `Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates straightforward cases (standard damage replacements with photo evidence) while attempting to autonomously handle complex situations requiring policy exceptions. What's the most effective way to improve escalation calibration?`,
  opts: [
    `Add explicit escalation criteria to your system prompt with few-shot examples demonstrating when to escalate versus resolve autonomously.`,
    `Have the agent self-report a confidence score (1-10) before each response and automatically route requests to humans when confidence falls below a threshold.`,
    `Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent begins processing.`,
    `Implement sentiment analysis to detect customer frustration levels and automatically escalate when negative sentiment exceeds a threshold.`,
  ],
  q_vi: `Agent của bạn đạt tỷ lệ giải quyết ngay lần liên hệ đầu (first-contact resolution) là 55%, thấp hơn nhiều so với mục tiêu 80%. Log cho thấy nó escalate các ca đơn giản (đổi hàng do hư hỏng tiêu chuẩn kèm bằng chứng ảnh) trong khi lại cố tự xử lý các tình huống phức tạp cần ngoại lệ chính sách. Cách nào hiệu quả nhất để cải thiện việc hiệu chỉnh escalation?`,
  opts_vi: [
    `Thêm tiêu chí escalate rõ ràng vào system prompt kèm few-shot examples minh họa khi nào nên escalate so với khi nào tự xử lý.`,
    `Yêu cầu agent tự báo cáo một điểm tự tin (confidence score, thang 1-10) trước mỗi phản hồi và tự động chuyển yêu cầu cho con người khi điểm tự tin thấp hơn một ngưỡng.`,
    `Triển khai một mô hình phân loại riêng được huấn luyện trên các ticket lịch sử để dự đoán yêu cầu nào cần escalate trước khi agent chính bắt đầu xử lý.`,
    `Triển khai phân tích cảm xúc (sentiment analysis) để phát hiện mức độ bực bội của khách hàng và tự động escalate khi cảm xúc tiêu cực vượt quá một ngưỡng.`,
  ],
  why: [
    `Thêm tiêu chí escalate rõ ràng kèm few-shot giải quyết trực tiếp nguyên nhân gốc — ranh giới quyết định không rõ. Can thiệp đầu tiên tương xứng và hiệu quả nhất, dạy agent chính xác khi nào escalate mà không cần thêm hạ tầng.`,
    `Điểm tự tin do LLM tự báo cáo nổi tiếng là hiệu chỉnh kém (poorly calibrated). Log đã cho thấy agent tự tin sai trên ca phức tạp và quá thận trọng với ca đơn giản — con số tự đánh giá sẽ lặp lại đúng sự hiệu chỉnh sai đó.`,
    `Mô hình phân loại riêng là over-engineered, đòi hỏi dữ liệu gán nhãn và hạ tầng ML trong khi cách đơn giản hơn (tối ưu prompt) chưa được thử. Thêm độ phức tạp và độ trễ không cần thiết.`,
    `Sentiment analysis phát hiện sự bực bội, không phải độ phức tạp của ca — giải quyết một vấn đề khác hẳn. Ca đơn giản với khách bình tĩnh vẫn bị escalate, ca phức tạp với khách lịch sự vẫn bị tự xử lý.`,
  ],
  concept: `Khi ranh giới quyết định (escalate hay tự xử lý) không rõ ràng, can thiệp đầu tiên tương xứng nhất là làm rõ tiêu chí bằng prompt với ví dụ, trước khi thêm hạ tầng phức tạp.`,
  takeaway: `Thử tối ưu prompt (tiêu chí rõ ràng + ví dụ) trước khi xây hạ tầng ML; đừng tin điểm tự tin do LLM tự báo cáo vì nó hiệu chỉnh kém.`,
  terms: [
    ["escalation calibration", "hiệu chỉnh quyết định chuyển cho con người"],
    ["escalation criteria", "tiêu chí xác định khi nào cần escalate"],
    ["confidence score", "điểm tự tin do mô hình tự báo cáo"],
    ["poorly calibrated", "hiệu chỉnh kém (tự tin không khớp độ chính xác thực)"],
    ["sentiment analysis", "phân tích cảm xúc văn bản"],
  ] },

{ id: "cca1-004", n: 4, set: 1, scenario: 1, domain: 2, task: "2.1",
  topic: "Tool Selection Reliability", difficulty: "hard", type: "mc", ans: [1],
  q: `Your agent handles single-concern requests with 94% accuracy. However, when customers include multiple concerns in one message (e.g., "I need a refund for order #1234 and also want to update my shipping address for order #5678"), tool selection accuracy drops to 58%. The agent typically addresses only one concern or mixes up parameters. What's the most effective approach to improve reliability for multi-concern requests?`,
  opts: [
    `Implement a preprocessing layer that uses a separate model call to decompose multi-concern messages into individual requests, process each independently, then combine the results.`,
    `Add few-shot examples to your prompt demonstrating the correct reasoning and tool sequence for multi-concern requests.`,
    `Consolidate related tools into fewer, more general-purpose tools.`,
    `Implement response validation that detects incomplete responses and automatically re-prompts the agent to address any missed concerns.`,
  ],
  q_vi: `Agent của bạn xử lý các yêu cầu chỉ có một mối quan tâm (single-concern) với độ chính xác 94%. Tuy nhiên, khi khách hàng đề cập nhiều mối quan tâm trong một tin nhắn (ví dụ: "Tôi cần hoàn tiền cho đơn #1234 và cũng muốn cập nhật địa chỉ giao hàng cho đơn #5678"), độ chính xác chọn công cụ giảm xuống 58%. Agent thường chỉ xử lý một mối quan tâm hoặc trộn lẫn tham số. Cách tiếp cận nào hiệu quả nhất để cải thiện độ tin cậy cho các yêu cầu nhiều mối quan tâm?`,
  opts_vi: [
    `Triển khai một lớp tiền xử lý dùng một lời gọi mô hình riêng để phân rã tin nhắn nhiều mối quan tâm thành các yêu cầu riêng lẻ, xử lý độc lập từng yêu cầu, rồi kết hợp kết quả.`,
    `Thêm few-shot examples vào prompt minh họa lập luận đúng và trình tự gọi công cụ đúng cho các yêu cầu nhiều mối quan tâm.`,
    `Gộp các công cụ liên quan thành ít công cụ hơn, mang tính đa dụng hơn.`,
    `Triển khai việc kiểm tra phản hồi (response validation) để phát hiện phản hồi chưa đầy đủ và tự động nhắc lại (re-prompt) agent để xử lý các mối quan tâm còn bị bỏ sót.`,
  ],
  why: [
    `Dùng một lời gọi mô hình riêng để phân rã làm tăng độ trễ, độ phức tạp và chi phí không cần thiết, trong khi agent đã hiểu tốt ca đơn lẻ. Over-engineered khi hướng dẫn cấp prompt đơn giản hơn có thể lấp khoảng trống.`,
    `Thêm few-shot minh họa lập luận và trình tự gọi công cụ đúng cho yêu cầu nhiều mối quan tâm là hiệu quả nhất, vì agent đã xử lý tốt từng mối quan tâm riêng lẻ ở 94%. Kỹ thuật rẻ, đã chứng minh, giải quyết trực tiếp việc không phân rã và định tuyến tham số đúng.`,
    `Gộp công cụ là chẩn đoán sai vấn đề, vì 94% trên ca đơn lẻ cho thấy việc chọn/thiết kế công cụ không phải vấn đề. Vấn đề ở việc không nhận diện và xử lý riêng từng mối quan tâm.`,
    `Phát hiện rồi nhắc lại (re-prompt) là chiến lược phản ứng (reactive), chỉ xử lý sau khi đã xảy ra và không ngăn được việc trộn lẫn tham số. Cách phòng ngừa (preventive) dạy agent xử lý đúng ngay từ đầu hiệu quả hơn.`,
  ],
  concept: `Khi agent đã làm tốt ca đơn lẻ (94%), vấn đề không phải ở việc hiểu công cụ mà ở mẫu hình xử lý nhiều mối quan tâm — few-shot examples là cách rẻ, đã được chứng minh để dạy mẫu hình đó.`,
  takeaway: `Độ chính xác cao trên ca đơn lẻ chứng tỏ agent hiểu công cụ — khoảng trống ở mẫu hình; hãy dạy mẫu hình bằng few-shot trước khi thêm hạ tầng.`,
  terms: [
    ["single-concern request", "yêu cầu chỉ có một mối quan tâm"],
    ["multi-concern request", "yêu cầu chứa nhiều mối quan tâm trong một tin nhắn"],
    ["decompose", "phân rã yêu cầu thành các phần độc lập"],
    ["reactive vs preventive", "phản ứng (sau khi xảy ra) so với phòng ngừa (ngăn từ đầu)"],
    ["parameter mixing", "trộn lẫn tham số giữa các yêu cầu"],
  ] },

{ id: "cca1-005", n: 5, set: 1, scenario: 1, domain: 5, task: "5.2",
  topic: "Escalation Decisions", difficulty: "hard", type: "mc", ans: [1],
  q: `After calling get_customer and lookup_order, the agent has retrieved all available system data but faces uncertainty. Which situation represents the most appropriate trigger for calling escalate_to_human?`,
  opts: [
    `The customer's message mentions both a billing question and a product return. The agent should escalate so a human can coordinate handling both issues in a single interaction.`,
    `The customer requests a price match against a competitor. Your policies allow adjustments for price drops on your own site within 14 days but are silent on competitor pricing. The agent should escalate for policy interpretation.`,
    `The customer wants to cancel an order that shipped yesterday, with delivery scheduled for tomorrow. The agent should escalate because the customer might change their mind once they receive the package.`,
    `The customer claims they never received their order, but tracking shows it was delivered and signed for at their address three days ago. The agent should escalate because presenting contradictory evidence might damage the customer relationship.`,
  ],
  q_vi: `Sau khi gọi get_customer và lookup_order, agent đã lấy được toàn bộ dữ liệu hệ thống sẵn có nhưng vẫn gặp sự không chắc chắn. Tình huống nào là điều kiện kích hoạt phù hợp nhất để gọi escalate_to_human?`,
  opts_vi: [
    `Tin nhắn của khách hàng đề cập cả câu hỏi về thanh toán lẫn việc trả hàng. Agent nên escalate để con người có thể điều phối xử lý cả hai vấn đề trong một lần tương tác.`,
    `Khách hàng yêu cầu điều chỉnh giá bằng với đối thủ cạnh tranh (price match). Chính sách của bạn cho phép điều chỉnh khi giá giảm trên chính website của bạn trong vòng 14 ngày nhưng không đề cập đến giá của đối thủ. Agent nên escalate để con người diễn giải chính sách.`,
    `Khách hàng muốn hủy một đơn hàng đã được gửi đi hôm qua, dự kiến giao vào ngày mai. Agent nên escalate vì khách hàng có thể đổi ý sau khi nhận được gói hàng.`,
    `Khách hàng khẳng định chưa bao giờ nhận được đơn hàng, nhưng thông tin tracking cho thấy đơn đã được giao và ký nhận tại địa chỉ của họ ba ngày trước. Agent nên escalate vì việc trình bày bằng chứng mâu thuẫn có thể làm tổn hại mối quan hệ với khách hàng.`,
  ],
  why: [
    `Xử lý nhiều vấn đề không cần escalate, vì agent có thể giải quyết tuần tự từng chủ đề trong cùng một tương tác bằng các công cụ và chính sách sẵn có.`,
    `Đây là khoảng trống chính sách thực sự: chính sách bao phủ giảm giá trên website nhưng im lặng về so giá đối thủ. Agent không thể bịa ra chính sách và phải escalate để con người phán đoán cách diễn giải hoặc mở rộng quy tắc.`,
    `Escalate dựa trên suy đoán rằng khách có thể đổi ý không phải tiêu chí hợp lệ; agent nên xử lý yêu cầu hiện tại đã nêu rõ thay vì trì hoãn dựa trên ý định giả định trong tương lai.`,
    `Dù có thông tin mâu thuẫn, agent có dữ liệu tracking thực tế để chia sẻ theo quy trình chuẩn; escalate để né việc trình bày bằng chứng phản ánh sự né tránh cảm xúc (emotional avoidance) chứ không phải nhu cầu vận hành.`,
  ],
  concept: `Tiêu chí escalate hợp lệ là khi có khoảng trống chính sách thực sự (genuine policy gap) cần con người diễn giải — không phải vì né tránh cảm xúc, suy đoán ý định tương lai, hay vì yêu cầu có nhiều phần.`,
  takeaway: `Chỉ escalate khi có khoảng trống chính sách thực sự cần phán đoán con người — không escalate vì né tránh, suy đoán, hay vì yêu cầu nhiều phần.`,
  terms: [
    ["escalate_to_human", "công cụ chuyển ca cho nhân viên con người"],
    ["genuine policy gap", "khoảng trống chính sách thực sự (chính sách không quy định)"],
    ["policy interpretation", "diễn giải/mở rộng chính sách"],
    ["emotional avoidance", "né tránh vì lý do cảm xúc thay vì nhu cầu vận hành"],
    ["operational necessity", "nhu cầu vận hành thực sự"],
  ] },

{ id: "cca1-006", n: 6, set: 1, scenario: 1, domain: 1, task: "1.1",
  topic: "Agentic Loop Fundamentals", difficulty: "easy", type: "mc", ans: [0],
  q: `You're implementing the agentic loop. After each API call to Claude, you need to determine whether to continue the loop (execute tools and call Claude again) or stop (present the final response). What determines this decision?`,
  opts: [
    `Check the stop_reason field in Claude's response—continue when it equals "tool_use" and stop when it equals "end_turn".`,
    `Set a maximum iteration count (e.g., 10 calls) and stop when reached, regardless of whether Claude indicates more work is needed.`,
    `Parse Claude's response text for phrases like "I've completed" or "Is there anything else?"—these natural language signals indicate the task is finished.`,
    `Check whether the response includes any assistant text content—if Claude generated explanatory text, the loop should end.`,
  ],
  q_vi: `Bạn đang triển khai agentic loop. Sau mỗi lời gọi API đến Claude, bạn cần xác định có nên tiếp tục vòng lặp (thực thi công cụ rồi gọi lại Claude) hay dừng lại (đưa ra phản hồi cuối cùng). Điều gì quyết định lựa chọn này?`,
  opts_vi: [
    `Kiểm tra trường stop_reason trong phản hồi của Claude — tiếp tục khi nó bằng "tool_use" và dừng khi nó bằng "end_turn".`,
    `Đặt một số vòng lặp tối đa (ví dụ 10 lần gọi) và dừng khi đạt đến giới hạn đó, bất kể Claude có báo hiệu còn việc cần làm hay không.`,
    `Phân tích văn bản phản hồi của Claude để tìm các cụm từ như "I've completed" hoặc "Is there anything else?" — các tín hiệu ngôn ngữ tự nhiên này cho biết nhiệm vụ đã hoàn tất.`,
    `Kiểm tra xem phản hồi có chứa nội dung văn bản của assistant hay không — nếu Claude tạo ra văn bản giải thích, vòng lặp nên kết thúc.`,
  ],
  why: [
    `stop_reason là tín hiệu có cấu trúc: 'tool_use' cho biết Claude muốn thực thi công cụ và nhận kết quả, còn 'end_turn' cho biết Claude đã hoàn tất và vòng lặp nên dừng.`,
    `Số vòng lặp tối đa là lan can an toàn (safety guardrail) hữu ích để tránh vòng lặp vô hạn, nhưng không phải cơ chế chính. Vòng lặp nên được điều khiển bởi tín hiệu rõ ràng của Claude, không phải giới hạn lặp tùy ý.`,
    `Parse cụm từ ngôn ngữ tự nhiên là không đáng tin và mong manh, vì Claude có thể dùng cách diễn đạt khác. API đã cung cấp stop_reason có cấu trúc dành riêng cho mục đích này.`,
    `Claude thường tạo cả văn bản giải thích lẫn yêu cầu gọi công cụ trong cùng phản hồi. Sự hiện diện của văn bản không có nghĩa nhiệm vụ đã xong.`,
  ],
  concept: `Trường stop_reason là tín hiệu có cấu trúc, rõ ràng của Claude để điều khiển vòng lặp agentic — đây mới là cơ chế điều khiển chính, không phải parse văn bản hay đếm số vòng.`,
  takeaway: `Điều khiển vòng lặp agentic bằng tín hiệu có cấu trúc stop_reason (tool_use = tiếp tục, end_turn = dừng), không bằng đếm vòng hay parse văn bản.`,
  terms: [
    ["agentic loop", "vòng lặp agent (gọi Claude → chạy công cụ → gọi lại)"],
    ["stop_reason", "trường trong phản hồi API cho biết lý do dừng"],
    ["tool_use", "giá trị stop_reason báo Claude muốn gọi công cụ"],
    ["end_turn", "giá trị stop_reason báo Claude đã hoàn tất lượt"],
    ["safety guardrail", "lan can an toàn (vd giới hạn số vòng tối đa)"],
  ] },

{ id: "cca1-007", n: 7, set: 1, scenario: 1, domain: 2, task: "2.1",
  topic: "Tool Selection Reliability", difficulty: "easy", type: "mc", ans: [0],
  q: `In testing, you notice the agent frequently calls get_customer when users ask about order status, even though lookup_order would be more appropriate. What should you examine first to address this issue?`,
  opts: [
    `Review tool descriptions to ensure they clearly distinguish each tool's purpose`,
    `Add few-shot examples covering every possible order-related query pattern to the system prompt`,
    `Implement a pre-processing classifier that detects order queries and routes directly to lookup_order`,
    `Reduce the number of tools available to the agent to simplify selection`,
  ],
  q_vi: `Trong quá trình kiểm thử, bạn nhận thấy agent thường gọi get_customer khi người dùng hỏi về tình trạng đơn hàng, mặc dù lookup_order sẽ phù hợp hơn. Bạn nên xem xét điều gì đầu tiên để giải quyết vấn đề này?`,
  opts_vi: [
    `Xem lại mô tả công cụ để đảm bảo chúng phân biệt rõ ràng mục đích của từng công cụ`,
    `Thêm vào system prompt các few-shot examples bao phủ mọi mẫu truy vấn liên quan đến đơn hàng có thể có`,
    `Triển khai một bộ phân loại tiền xử lý (pre-processing classifier) để phát hiện truy vấn về đơn hàng và định tuyến trực tiếp đến lookup_order`,
    `Giảm số lượng công cụ khả dụng cho agent để đơn giản hóa việc lựa chọn`,
  ],
  why: [
    `Mô tả công cụ là đầu vào chính mô hình dùng để quyết định gọi công cụ nào. Khi chọn sai liên tục, bước chẩn đoán đầu tiên là kiểm tra mô tả có phân biệt rõ mục đích và quy định khi nào dùng mỗi cái hay không.`,
    `Thêm few-shot bao phủ MỌI mẫu truy vấn là bất khả thi và xử lý triệu chứng thay vì nguyên nhân gốc — vốn nhiều khả năng là mô tả mơ hồ hoặc chồng lấp.`,
    `Xây classifier tiền xử lý riêng là over-engineered, bỏ qua khả năng chọn công cụ tự nhiên của agent thay vì sửa chính định nghĩa công cụ.`,
    `Giảm số công cụ hy sinh chức năng cần thiết thay vì giải quyết nguyên nhân gốc, mà gốc rễ nhiều khả năng là mô tả không rõ ràng.`,
  ],
  concept: `Mô tả công cụ là đầu vào chính mô hình dùng để chọn công cụ; khi chọn sai liên tục, bước chẩn đoán đầu tiên luôn là kiểm tra mô tả công cụ có phân biệt rõ mục đích không.`,
  takeaway: `Bước chẩn đoán đầu tiên cho lỗi chọn công cụ luôn là xem lại mô tả công cụ — đó là đầu vào chính của mô hình.`,
  terms: [

    ["pre-processing classifier", "bộ phân loại tiền xử lý (định tuyến trước khi gọi mô hình)"],
    ["symptoms vs root cause", "triệu chứng so với nguyên nhân gốc"],

{ id: "cca1-008", n: 8, set: 1, scenario: 1, domain: 1, task: "1.4",
  topic: "Multi-step Workflow Orchestration", difficulty: "medium", type: "mc", ans: [1],
  q: `For simple requests like "refund order #1234", your agent succeeds in 3-4 tool calls with 91% resolution. For complex requests like "I've been charged twice, my discount didn't apply, and I want to cancel", the agent averages 12+ tool calls with only 54% resolution—often investigating concerns sequentially and gathering redundant customer data for each one. What's the most effective change?`,
  opts: [
    `Add explicit verification gates between steps requiring the agent to checkpoint after resolving each concern before moving to the next.`,
    `Decompose the request into distinct concerns, then investigate each in parallel using shared customer context before synthesizing a resolution.`,
    `Add few-shot examples demonstrating ideal tool call sequences for various multi-part billing scenarios to your system prompt.`,
    `Reduce the number of available tools by consolidating get_customer, lookup_order, and billing-related lookups into a single investigate_issue tool.`,
  ],
  q_vi: `Với các yêu cầu đơn giản như "hoàn tiền đơn #1234", agent của bạn thành công chỉ với 3-4 lần gọi công cụ, đạt tỷ lệ giải quyết 91%. Với các yêu cầu phức tạp như "Tôi bị tính phí hai lần, giảm giá của tôi không được áp dụng, và tôi muốn hủy đơn", agent trung bình cần hơn 12 lần gọi công cụ mà chỉ đạt tỷ lệ giải quyết 54% — thường điều tra từng mối quan tâm tuần tự và thu thập dữ liệu khách hàng dư thừa cho mỗi mối quan tâm. Thay đổi nào hiệu quả nhất?`,
  opts_vi: [
    `Thêm các cổng xác minh (verification gates) rõ ràng giữa các bước, yêu cầu agent checkpoint sau khi giải quyết mỗi mối quan tâm trước khi chuyển sang mối tiếp theo.`,
    `Phân rã yêu cầu thành các mối quan tâm riêng biệt, sau đó điều tra song song từng mối bằng ngữ cảnh khách hàng dùng chung, trước khi tổng hợp thành một giải pháp.`,
    `Thêm vào system prompt các few-shot examples minh họa trình tự gọi công cụ lý tưởng cho các kịch bản thanh toán nhiều phần khác nhau.`,
    `Giảm số lượng công cụ khả dụng bằng cách gộp get_customer, lookup_order, và các công cụ tra cứu liên quan đến thanh toán thành một công cụ duy nhất investigate_issue.`,
  ],
  why: [
    `Thêm cổng xác minh giữa các bước tuần tự thực ra làm vấn đề tệ hơn bằng cách củng cố chính mẫu hình tuần tự và thêm chi phí, thay vì giải quyết việc thu thập dữ liệu dư thừa.`,
    `Phân rã thành các mối quan tâm riêng rồi điều tra song song với ngữ cảnh dùng chung giải quyết trực tiếp cả hai vấn đề: loại bỏ lấy dữ liệu trùng lặp và giảm tổng số lời gọi bằng cách song song hóa trước khi tổng hợp.`,
    `Few-shot có thể cải thiện chút ít cho kịch bản đã biết, nhưng không giải quyết hệ thống các vấn đề cấu trúc về thu thập ngữ cảnh dư thừa hay điều tra tuần tự, và không khái quát tốt cho tổ hợp mới.`,
    `Gộp công cụ thành một công cụ điều tra che mất các phân biệt chức năng hữu ích và không giải quyết vấn đề mẫu hình nền tảng là xử lý tuần tự và thu thập dư thừa.`,
  ],
  concept: `Mẫu hình 'phân rã - song song hóa - tổng hợp' với ngữ cảnh khách hàng dùng chung khắc phục trực tiếp cả hai vấn đề: điều tra tuần tự gây nhiều lời gọi và thu thập dữ liệu khách hàng dư thừa.`,
  takeaway: `Với yêu cầu phức tạp nhiều phần, hãy phân rã rồi điều tra song song với ngữ cảnh dùng chung để cắt giảm dư thừa và số lời gọi.`,
  terms: [
    ["decompose-parallelize-synthesize", "phân rã, điều tra song song, rồi tổng hợp"],
    ["shared customer context", "ngữ cảnh khách hàng dùng chung giữa các điều tra"],
    ["sequential investigation", "điều tra tuần tự (nối tiếp)"],
    ["redundant data gathering", "thu thập dữ liệu dư thừa/lặp lại"],
    ["verification gates", "cổng xác minh giữa các bước"],
  ] },

{ id: "cca1-009", n: 9, set: 1, scenario: 1, domain: 1, task: "1.3",
  topic: "Parallel Tool Execution", difficulty: "medium", type: "mc", ans: [0],
  q: `Production metrics show your agent averages 4+ API round-trips per resolution. Analysis reveals Claude frequently requests get_customer and lookup_order in separate sequential turns even when both are needed upfront. What's the most effective way to reduce round-trips?`,
  opts: [
    `Prompt Claude to batch tool requests per turn, and return all tool results together before the next API call.`,
    `Implement speculative execution that automatically calls likely-needed tools alongside any requested tool, returning all results regardless of what was requested.`,
    `Create composite tools like get_customer_with_orders that bundle common lookup combinations into single calls.`,
    `Increase max_tokens to give Claude more space to plan ahead and naturally batch its tool requests.`,
  ],
  q_vi: `Số liệu production cho thấy agent của bạn trung bình cần hơn 4 lượt qua lại API (round-trips) cho mỗi lần giải quyết. Phân tích cho thấy Claude thường yêu cầu get_customer và lookup_order trong các lượt tuần tự riêng biệt, ngay cả khi cả hai đều cần thiết ngay từ đầu. Cách nào hiệu quả nhất để giảm số lượt qua lại?`,
  opts_vi: [
    `Nhắc Claude gom (batch) các yêu cầu công cụ trong mỗi lượt, và trả tất cả kết quả công cụ cùng nhau trước khi thực hiện lời gọi API tiếp theo.`,
    `Triển khai thực thi suy đoán (speculative execution) tự động gọi các công cụ có khả năng cần đến cùng với bất kỳ công cụ nào được yêu cầu, trả về tất cả kết quả bất kể điều gì đã được yêu cầu.`,
    `Tạo các công cụ tổng hợp (composite tools) như get_customer_with_orders để gói các tổ hợp tra cứu thường gặp thành một lời gọi duy nhất.`,
    `Tăng max_tokens để cho Claude nhiều không gian hơn nhằm lập kế hoạch trước và tự nhiên gom các yêu cầu công cụ của nó.`,
  ],
  why: [
    `Nhắc Claude gom các yêu cầu công cụ liên quan trong một lượt rồi trả tất cả kết quả cùng nhau tận dụng khả năng gốc của Claude. Hiệu quả nhất vì giải quyết trực tiếp mẫu hình gọi tuần tự với thay đổi kiến trúc tối thiểu.`,
    `Thực thi suy đoán các công cụ không được yêu cầu rõ ràng lãng phí tài nguyên, thêm độ phức tạp, và có thể trả về kết quả không liên quan hoặc gây nhiễu, không khớp với lập luận thực tế của Claude.`,
    `Composite tools làm giảm tính linh hoạt và tăng gánh nặng bảo trì vì phải tạo công cụ gói mới cho mỗi tổ hợp, mà không giải quyết nguyên nhân gốc — Claude vốn đã hỗ trợ yêu cầu nhiều công cụ mỗi lượt.`,
    `Tăng max_tokens chỉ ảnh hưởng đến độ dài tối đa của đầu ra, không ảnh hưởng việc Claude có gom nhiều yêu cầu công cụ trong một lượt hay không.`,
  ],
  concept: `Claude có khả năng gốc (native) yêu cầu nhiều công cụ trong một phản hồi; chỉ cần nhắc Claude gom (batch) các lời gọi liên quan và trả tất cả kết quả cùng lúc là tận dụng được khả năng đó với thay đổi kiến trúc tối thiểu.`,
  takeaway: `Để giảm số lượt API, hãy nhắc Claude gom (batch) các lời gọi công cụ song song trong một lượt — tận dụng khả năng gốc, không cần composite tools hay tăng max_tokens.`,
  terms: [
    ["API round-trips", "số lượt qua lại với API (mỗi lượt là một lời gọi)"],
    ["batch tool requests", "gom nhiều yêu cầu công cụ vào một lượt"],
    ["parallel tool execution", "thực thi công cụ song song"],
    ["speculative execution", "thực thi suy đoán (gọi trước công cụ có thể cần)"],
    ["composite tools", "công cụ tổng hợp gói nhiều lời gọi"],
  ] },

{ id: "cca1-010", n: 10, set: 1, scenario: 1, domain: 2, task: "2.1",
  topic: "Tool Selection Reliability", difficulty: "medium", type: "mc", ans: [0],
  q: `When customers include "account" in messages, the agent calls get_customer first 78% of the time. When customers phrase similar requests without "account", it calls lookup_order first 93% of the time. The tool descriptions are well-written and unambiguous. What is the most likely root cause of this discrepancy?`,
  opts: [
    `The system prompt contains keyword-sensitive instructions that steer behavior based on terms like "account," creating unintended tool selection patterns`,
    `The tool descriptions need additional negative examples specifying when NOT to use each tool to prevent this keyword-triggered confusion`,
    `The model requires more training data on multi-concept messages and should be fine-tuned on examples that include both account and order language`,
    `The model's base training creates associations between "account" terminology and customer-related operations that override the tool descriptions`,
  ],
  q_vi: `Khi tin nhắn của khách hàng chứa từ "account", agent gọi get_customer trước trong 78% trường hợp. Khi khách hàng diễn đạt yêu cầu tương tự nhưng không có từ "account", agent gọi lookup_order trước trong 93% trường hợp. Mô tả công cụ được viết tốt và không mơ hồ. Nguyên nhân gốc nhiều khả năng nhất của sự chênh lệch này là gì?`,
  opts_vi: [
    `System prompt chứa các chỉ dẫn nhạy với từ khóa, hướng hành vi dựa trên các từ như "account," tạo ra các mẫu hình chọn công cụ ngoài ý muốn`,
    `Mô tả công cụ cần thêm các ví dụ phủ định chỉ rõ khi nào KHÔNG nên dùng từng công cụ để ngăn sự nhầm lẫn do từ khóa gây ra này`,
    `Mô hình cần thêm dữ liệu huấn luyện về các tin nhắn đa khái niệm và nên được fine-tune trên các ví dụ chứa cả ngôn ngữ về account lẫn order`,
    `Quá trình huấn luyện gốc của mô hình tạo ra các liên kết giữa thuật ngữ "account" và các thao tác liên quan đến khách hàng, ghi đè lên mô tả công cụ`,
  ],
  why: [
    `Mẫu hình bị kích hoạt bởi từ khóa (78% vs 93%) gợi ý mạnh có logic định tuyến tường minh trong system prompt phản ứng với từ 'account'. Vì mô tả công cụ đã rõ ràng, sự chênh lệch chỉ về phía chỉ dẫn cấp prompt tạo hành vi lệch hướng.`,
    `Thêm ví dụ phủ định mâu thuẫn với tiền đề rằng mô tả vốn đã viết tốt và rõ ràng. Vấn đề ở chỉ dẫn trong system prompt ghi đè việc chọn đúng dựa trên từ khóa.`,
    `Fine-tuning là bất khả thi và không tương xứng khi mẫu kích hoạt bởi từ khóa gợi ý một sửa chữa đơn giản cấp prompt. Mô hình chọn đúng 93% khi không có từ khóa, cho thấy không cần thêm dữ liệu.`,
    `Liên kết huấn luyện gốc khó là nguyên nhân vì mô hình chọn đúng 93% khi không có 'account', chứng tỏ nó hiểu đúng ý người dùng. Thay đổi đột ngột phụ thuộc từ khóa chỉ về phía chỉ dẫn tường minh trong prompt.`,
  ],
  concept: `Một mẫu hình hệ thống bị kích hoạt bởi một từ khóa cụ thể (78% so với 93%) chỉ ra logic định tuyến tường minh trong system prompt, chứ không phải vấn đề mô tả công cụ hay giới hạn của mô hình.`,
  takeaway: `Mẫu hành vi đột ngột, phụ thuộc một từ khóa cụ thể là dấu hiệu của logic định tuyến trong system prompt, không phải lỗi mô tả công cụ hay giới hạn mô hình.`,
  terms: [
    ["keyword-sensitive instructions", "chỉ dẫn nhạy với từ khóa trong prompt"],
    ["unintended steering", "hướng hành vi lệch ngoài ý muốn"],
    ["negative examples", "ví dụ chỉ ra khi nào KHÔNG dùng công cụ"],
    ["fine-tuning", "huấn luyện tinh chỉnh mô hình trên dữ liệu bổ sung"],
    ["base training associations", "liên kết hình thành từ huấn luyện gốc"],
  ] },

{ id: "cca1-011", n: 11, set: 1, scenario: 1, domain: 1, task: "1.5",
  topic: "Agent SDK Hook Patterns", difficulty: "medium", type: "mc", ans: [0],
  q: `Production logs reveal the agent misinterprets data from your MCP tools: Unix timestamps from get_customer, ISO 8601 dates from lookup_order, and numeric status codes (1=pending, 2=shipped). Some tools are third-party MCP servers you cannot modify. What's the most maintainable approach to normalize data formats?`,
  opts: [
    `Use a PostToolUse hook to intercept tool results and apply formatting transformations before agent processing`,
    `Add detailed format documentation to your system prompt explaining each tool's data conventions`,
    `Modify tools you control to return human-readable formats; create wrapper tools for third-party tools`,
    `Create a normalize_data tool that the agent calls after each data retrieval to transform values`,
  ],
  q_vi: `Log production cho thấy agent diễn giải sai dữ liệu từ các công cụ MCP của bạn: Unix timestamp từ get_customer, ngày ISO 8601 từ lookup_order, và mã trạng thái dạng số (1=pending, 2=shipped). Một số công cụ là MCP server của bên thứ ba mà bạn không thể sửa đổi. Cách tiếp cận nào dễ bảo trì nhất để chuẩn hóa định dạng dữ liệu?`,
  opts_vi: [
    `Dùng một PostToolUse hook để chặn kết quả công cụ và áp dụng biến đổi định dạng trước khi agent xử lý`,
    `Thêm tài liệu định dạng chi tiết vào system prompt giải thích quy ước dữ liệu của từng công cụ`,
    `Sửa các công cụ bạn kiểm soát để trả về định dạng dễ đọc; tạo các wrapper tools cho các công cụ của bên thứ ba`,
    `Tạo một công cụ normalize_data mà agent gọi sau mỗi lần lấy dữ liệu để biến đổi các giá trị`,
  ],
  why: [
    `PostToolUse hook cho một điểm tập trung, tất định để chặn và chuẩn hóa mọi đầu ra công cụ — kể cả từ MCP bên thứ ba — trước khi agent xử lý. Dễ bảo trì nhất vì áp dụng biến đổi đồng đều bằng code.`,
    `Thêm tài liệu vào prompt dựa vào việc LLM diễn giải và chuyển đổi định dạng đúng một cách xác suất, không đáng tin cho biến đổi tất định. Mong manh, agent vẫn có thể hiểu sai.`,
    `Sửa công cụ bạn kiểm soát trong khi bọc công cụ bên thứ ba tạo ra hai chiến lược khác nhau, dẫn đến kiến trúc không nhất quán và khó bảo trì hơn.`,
    `Yêu cầu agent gọi công cụ chuẩn hóa riêng sau mỗi lần lấy dữ liệu làm tăng gấp đôi số lời gọi và phụ thuộc vào việc agent nhớ gọi. Mong manh vì agent có thể quên.`,
  ],
  concept: `PostToolUse hook cho một điểm tập trung, tất định để chuẩn hóa dữ liệu đồng đều trên tất cả công cụ (kể cả công cụ bên thứ ba không sửa được), thay vì dựa vào diễn giải xác suất của LLM hay hành vi của agent.`,
  takeaway: `Dùng PostToolUse hook để chuẩn hóa dữ liệu tập trung, tất định và đồng đều — kể cả với công cụ bên thứ ba — thay vì dựa vào prompt hay hành vi agent.`,
  terms: [
    ["PostToolUse hook", "hook chạy sau khi công cụ trả kết quả, để biến đổi đầu ra"],
    ["normalize data formats", "chuẩn hóa định dạng dữ liệu"],
    ["Unix timestamp", "mốc thời gian dạng số giây từ 1970"],
    ["ISO 8601", "định dạng ngày giờ chuẩn quốc tế"],
    ["wrapper tool", "công cụ bọc quanh công cụ khác để biến đổi đầu ra"],
  ] },

{ id: "cca1-012", n: 12, set: 1, scenario: 1, domain: 2, task: "2.1",
  topic: "Tool Selection Reliability", difficulty: "medium", type: "mc", ans: [1],
  q: `The agent sometimes selects get_customer when lookup_order would be more appropriate, particularly for ambiguous requests like "I need help with my recent purchase." You decide to add few-shot examples to your system prompt. Which approach will most effectively address this issue?`,
  opts: [
    `Add 10-15 examples of clear, unambiguous requests that demonstrate correct tool selection for each tool's typical use cases.`,
    `Add 4-6 examples targeting ambiguous scenarios, each showing reasoning for why one tool was chosen over plausible alternatives.`,
    `Add examples grouped by tool—all get_customer scenarios together, then all lookup_order scenarios.`,
    `Add explicit "use when" and "do not use when" guidelines in each tool's description covering the ambiguous cases.`,
  ],
  q_vi: `Agent đôi khi chọn get_customer trong khi lookup_order sẽ phù hợp hơn, đặc biệt với các yêu cầu mơ hồ như "Tôi cần trợ giúp về lần mua hàng gần đây của tôi." Bạn quyết định thêm few-shot examples vào system prompt. Cách tiếp cận nào sẽ giải quyết vấn đề này hiệu quả nhất?`,
  opts_vi: [
    `Thêm 10-15 ví dụ về các yêu cầu rõ ràng, không mơ hồ, minh họa việc chọn công cụ đúng cho các trường hợp sử dụng điển hình của mỗi công cụ.`,
    `Thêm 4-6 ví dụ nhắm vào các kịch bản mơ hồ, mỗi ví dụ thể hiện lập luận vì sao một công cụ được chọn thay vì các lựa chọn khả dĩ khác.`,
    `Thêm các ví dụ được nhóm theo công cụ — tất cả kịch bản get_customer đi cùng nhau, sau đó đến tất cả kịch bản lookup_order.`,
    `Thêm hướng dẫn "dùng khi" và "không dùng khi" rõ ràng vào mô tả của mỗi công cụ, bao phủ các ca mơ hồ.`,
  ],
  why: [

    `Nhắm few-shot vào đúng các kịch bản mơ hồ nơi lỗi xảy ra, kèm lập luận về lý do chọn công cụ này thay vì kia, dạy trực tiếp mô hình quá trình ra quyết định so sánh cho ca biên. Ví dụ minh họa lập luận tốt hơn quy tắc khai báo.`,
    `Nhóm theo công cụ khuyến khích học các tình huống tách biệt, không dạy được lập luận so sánh khi nào chọn cái nào cho yêu cầu mơ hồ. Cần đối chiếu chúng thay vì trình bày riêng rẽ.`,
    `Hướng dẫn 'dùng khi/không dùng khi' có thể giúp, nhưng quy tắc khai báo tĩnh kém hiệu quả hơn ví dụ minh họa trong việc dạy lập luận ca biên tinh tế.`,

{ id: "cca1-013", n: 13, set: 1, scenario: 1, domain: 4, task: "4.6",
  topic: "Self-Evaluation Patterns", difficulty: "medium", type: "mc", ans: [0],
  q: `When your agent resolves complex cases (billing disputes or multi-order returns), customer satisfaction is 15% lower than for simple cases—even when the resolution is technically correct. The agent provides accurate resolutions but inconsistently explains the reasoning: sometimes omitting policy details, other times missing timeline info or next steps. The specific context gaps vary by case. You want to improve quality without adding human review. Which approach is most effective?`,
  opts: [
    `Add a self-critique step where the agent evaluates its draft response for completeness—ensuring it addresses the customer's concern, includes relevant context, and anticipates follow-up questions.`,
    `Implement few-shot examples in the system prompt showing complete resolution explanations for five common complex case types, demonstrating how to include policy context, timelines, and next steps.`,
    `Increase the model tier from Haiku to Sonnet for complex cases, routing based on detected case complexity.`,
    `Add a confirmation step where the agent asks "Does this fully address your concern?" before closing, letting customers request additional information if needed.`,
  ],
  q_vi: `Khi agent của bạn giải quyết các ca phức tạp (tranh chấp thanh toán hoặc trả hàng nhiều đơn), điểm hài lòng khách hàng thấp hơn 15% so với các ca đơn giản — ngay cả khi giải pháp về mặt kỹ thuật là đúng. Agent đưa ra giải pháp chính xác nhưng giải thích lập luận không nhất quán: đôi khi bỏ sót chi tiết chính sách, đôi khi thiếu thông tin mốc thời gian hoặc bước tiếp theo. Các khoảng trống ngữ cảnh cụ thể thay đổi theo từng ca. Bạn muốn cải thiện chất lượng mà không thêm bước con người review. Cách tiếp cận nào hiệu quả nhất?`,
  opts_vi: [
    `Thêm một bước tự phê bình (self-critique) trong đó agent đánh giá bản nháp phản hồi của mình về tính đầy đủ — đảm bảo nó giải quyết mối quan tâm của khách hàng, bao gồm ngữ cảnh liên quan, và dự đoán trước các câu hỏi tiếp theo.`,
    `Triển khai few-shot examples trong system prompt thể hiện các giải thích giải pháp đầy đủ cho năm loại ca phức tạp thường gặp, minh họa cách đưa vào ngữ cảnh chính sách, mốc thời gian, và bước tiếp theo.`,
    `Nâng tầng mô hình từ Haiku lên Sonnet cho các ca phức tạp, định tuyến dựa trên độ phức tạp của ca được phát hiện.`,
    `Thêm một bước xác nhận trong đó agent hỏi "Điều này đã giải quyết đầy đủ mối quan tâm của bạn chưa?" trước khi đóng ca, cho phép khách hàng yêu cầu thêm thông tin nếu cần.`,
  ],
  why: [
    `Bước tự phê bình (evaluator-optimizer) giải quyết trực tiếp nguyên nhân gốc là tính đầy đủ thiếu nhất quán, bằng cách cho agent tự đánh giá bản nháp theo tiêu chí cụ thể (ngữ cảnh chính sách, mốc thời gian, bước tiếp theo). Bắt được các khoảng trống đặc thù từng ca.`,
    `Few-shot minh họa cấu trúc lý tưởng nhưng không thể bao phủ đầy đủ các khoảng trống biến thiên cao khác nhau theo từng ca. Hợp với mẫu hình nhất quán hơn là các thiếu sót đa dạng.`,
    `Nâng tầng mô hình không giải quyết vấn đề cấu trúc, vì agent vốn đã đưa ra giải pháp đúng — vấn đề là việc đưa ngữ cảnh thiếu nhất quán, không phải thiếu năng lực lập luận.`,
    `Thêm bước xác nhận đẩy gánh nặng phát hiện thông tin thiếu sang khách thay vì chủ động cải thiện. Tăng ma sát cho khách, nhiều khả năng càng hại điểm hài lòng.`,
  ],
  concept: `Bước tự phê bình (self-critique / mẫu evaluator-optimizer) cho agent tự đánh giá bản nháp theo tiêu chí cụ thể, bắt được các khoảng trống ngữ cảnh thay đổi theo từng ca — đúng nguyên nhân gốc là việc giải thích thiếu nhất quán.`,
  takeaway: `Khi khoảng trống thay đổi theo từng ca, hãy dùng bước tự phê bình (evaluator-optimizer) để agent tự kiểm tra tính đầy đủ — hiệu quả hơn few-shot, nâng tầng mô hình, hay đẩy việc cho khách.`,
  terms: [

    ["model tier", "tầng mô hình (Haiku/Sonnet/Opus)"],
    ["customer satisfaction score", "điểm hài lòng khách hàng"],

{ id: "cca1-014", n: 14, set: 1, scenario: 1, domain: 5, task: "5.1",
  topic: "Conversation Context Management", difficulty: "hard", type: "mc", ans: [0],
  q: `Your support agent uses progressive summarization—when context reaches 70% capacity, older turns are summarized while recent ones remain verbatim. Customers reference specific amounts ("the 15% discount I mentioned"), but the agent responds with incorrect values. These details were stated 20+ turns ago and got condensed into vague summaries like "discussed promotional pricing." What's the most effective fix?`,
  opts: [
    `Extract transactional facts (amounts, dates, order numbers) into a persistent "case facts" block included in each prompt, outside the summarized history.`,
    `Revise the summarization prompt to explicitly preserve all numerical values, percentages, dates, and customer-stated expectations verbatim.`,
    `Increase the summarization threshold from 70% to 85% capacity so conversations have more room before summarization triggers.`,
    `Store full conversation history externally and implement retrieval to search it when the agent detects reference phrases like "as I mentioned."`,
  ],
  q_vi: `Agent hỗ trợ của bạn dùng progressive summarization — khi ngữ cảnh đạt 70% dung lượng, các lượt cũ hơn được tóm tắt trong khi các lượt gần đây vẫn giữ nguyên văn (verbatim). Khách hàng nhắc lại các con số cụ thể ("mức giảm giá 15% tôi đã đề cập"), nhưng agent phản hồi với các giá trị sai. Các chi tiết này đã được nêu từ hơn 20 lượt trước và bị cô đọng thành các bản tóm tắt mơ hồ như "đã thảo luận về giá khuyến mãi." Cách khắc phục nào hiệu quả nhất?`,
  opts_vi: [
    `Trích xuất các sự kiện giao dịch (số tiền, ngày, mã đơn) vào một khối "case facts" bền vững, được đưa vào mỗi prompt, nằm ngoài lịch sử đã tóm tắt.`,
    `Sửa lại prompt tóm tắt để yêu cầu rõ ràng bảo toàn nguyên văn tất cả giá trị số, phần trăm, ngày tháng, và các kỳ vọng do khách hàng nêu.`,
    `Tăng ngưỡng tóm tắt từ 70% lên 85% dung lượng để hội thoại có nhiều không gian hơn trước khi việc tóm tắt được kích hoạt.`,
    `Lưu trữ toàn bộ lịch sử hội thoại ở bên ngoài và triển khai truy hồi (retrieval) để tìm kiếm trong đó khi agent phát hiện các cụm từ tham chiếu như "như tôi đã đề cập."`,
  ],
  why: [
    `Trích xuất sự kiện giao dịch (số tiền, ngày, mã đơn) vào khối 'case facts' bền vững giải quyết nguyên nhân gốc: tóm tắt vốn làm mất mát chi tiết. Giữ thông tin trong khối có cấu trúc ngoài lịch sử tóm tắt, luôn sẵn có đáng tin trong mọi prompt.`,
    `Sửa prompt tóm tắt để bảo toàn giá trị số nghe hợp lý nhưng không đáng tin — LLM không tuân thủ nhất quán dưới áp lực ngữ cảnh. Bạn không thể 'prompt để thoát khỏi' sự mất mát thông tin nền tảng.`,
    `Nâng ngưỡng 70%→85% chỉ trì hoãn thời điểm tóm tắt chứ không giải quyết vấn đề cơ bản. Hội thoại dài hơn rồi vẫn kích hoạt tóm tắt và mất chi tiết.`,
    `Lưu lịch sử ra ngoài và truy hồi khi phát hiện cụm tham chiếu là over-engineered và mong manh, vì phát hiện khi nào khách nhắc lại là không đáng tin. Thất bại khi agent chủ động dùng giá trị sai mà khách không tham chiếu lại.`,
  ],
  concept: `Tóm tắt vốn dĩ làm mất mát (lossy) các chi tiết chính xác; trích xuất các sự kiện giao dịch vào một khối 'case facts' bền vững, nằm ngoài lịch sử bị tóm tắt, bảo toàn thông tin quan trọng một cách đáng tin trong mọi prompt.`,
  takeaway: `Tóm tắt luôn làm mất chi tiết chính xác — hãy trích xuất sự kiện then chốt vào một khối bền vững ngoài lịch sử tóm tắt, đừng cố 'prompt để thoát khỏi' sự mất mát đó.`,
  terms: [
    ["progressive summarization", "tóm tắt lũy tiến (tóm tắt lượt cũ khi ngữ cảnh đầy)"],
    ["lossy", "gây mất mát thông tin"],
    ["case facts block", "khối sự kiện vụ việc bền vững, đưa vào mọi prompt"],
    ["verbatim", "giữ nguyên văn, không tóm tắt"],
    ["retrieval", "truy hồi thông tin từ kho lưu ngoài"],
  ] },

{ id: "cca1-015", n: 15, set: 1, scenario: 1, domain: 2, task: "2.2",
  topic: "Ambiguous Result Handling", difficulty: "medium", type: "mc", ans: [0],
  q: `Your get_customer tool returns all matches when searching by name. Claude currently picks the customer with the most recent order when multiple results are returned, but production data shows this causes 15% of multi-match cases to proceed with the wrong customer account. How should you address this?`,
  opts: [
    `Instruct Claude to ask for an additional identifier (email, phone, or order number) when get_customer returns multiple matches, before taking any customer-specific action.`,
    `Modify get_customer to return only the single most likely match based on a ranking algorithm, simplifying Claude's decision by eliminating ambiguous results.`,
    `Add few-shot examples showing Claude how to use conversational context (products mentioned, dates referenced) to infer the correct customer without requiring clarification.`,
    `Implement a confidence scoring system that proceeds automatically above 85% confidence and prompts for clarification below that threshold.`,
  ],
  q_vi: `Công cụ get_customer của bạn trả về mọi kết quả khớp khi tìm kiếm theo tên. Hiện tại Claude chọn khách hàng có đơn hàng gần đây nhất khi có nhiều kết quả được trả về, nhưng dữ liệu production cho thấy điều này khiến 15% các ca nhiều kết quả khớp bị tiến hành nhầm với tài khoản khách hàng sai. Bạn nên xử lý vấn đề này như thế nào?`,
  opts_vi: [
    `Chỉ dẫn Claude hỏi thêm một định danh bổ sung (email, số điện thoại, hoặc mã đơn) khi get_customer trả về nhiều kết quả khớp, trước khi thực hiện bất kỳ thao tác nào dành riêng cho khách hàng đó.`,
    `Sửa get_customer để chỉ trả về một kết quả khớp khả dĩ nhất duy nhất dựa trên thuật toán xếp hạng, đơn giản hóa quyết định của Claude bằng cách loại bỏ các kết quả mơ hồ.`,
    `Thêm few-shot examples cho Claude thấy cách dùng ngữ cảnh hội thoại (sản phẩm được nhắc đến, ngày tháng được tham chiếu) để suy ra khách hàng đúng mà không cần yêu cầu làm rõ.`,
    `Triển khai một hệ thống chấm điểm tự tin (confidence scoring) tự động tiến hành khi điểm tự tin trên 85% và yêu cầu làm rõ khi dưới ngưỡng đó.`,
  ],
  why: [
    `Hỏi người dùng một định danh bổ sung (email, SĐT, mã đơn) là cách đáng tin nhất để phân biệt nhiều kết quả khớp, vì người dùng biết chắc danh tính của họ. Một lượt thêm là cái giá nhỏ để loại bỏ tỷ lệ lỗi 15%.`,
    `Sửa công cụ để chỉ trả về một đoán-tốt-nhất che giấu sự mơ hồ khỏi Claude, tước đi khả năng nhận biết và xử lý ca nhiều khách trùng tên. Loại bỏ tính minh bạch khi thuật toán xếp hạng sai.`,
    `Dựa vào manh mối ngữ cảnh để suy ra khách đúng là không đáng tin, vì tín hiệu có thể vắng mặt, mơ hồ hoặc gây hiểu lầm. Đổi một dạng đoán này lấy dạng đoán khác.`,
    `Ngưỡng tự tin tùy ý khó hiệu chỉnh chính xác và vẫn cho phép lỗi mỗi khi điểm tự tin cao một cách sai lệch. Không đảm bảo nhận diện đúng khách, khác với hỏi thẳng người dùng.`,
  ],
  concept: `Khi kết quả công cụ mơ hồ (nhiều kết quả khớp), hỏi người dùng một định danh phân biệt là cách đáng tin nhất, vì người dùng biết chắc chắn danh tính của chính họ — một lượt hội thoại thêm là cái giá nhỏ để tránh tỷ lệ lỗi 15%.`,
  takeaway: `Khi kết quả mơ hồ với nhiều kết quả khớp, hãy hỏi người dùng một định danh phân biệt — họ biết chắc danh tính của mình; đừng giấu sự mơ hồ hay dựa vào suy luận/ngưỡng tự tin.`,

{ id: "cca1-032", n: 32, set: 1, scenario: 2, domain: 3, task: "3.4",
  topic: "Plan Mode vs Direct Execution", difficulty: "easy", type: "mc", ans: [0],
  q: `You've been assigned to restructure the team's monolithic application into microservices. This will involve changes across dozens of files and requires decisions about service boundaries and module dependencies. Which approach should you take?`,
  opts: [
    `Enter plan mode to explore the codebase, understand dependencies, and design an implementation approach before making changes.`,

  q_vi: `Bạn được giao nhiệm vụ tái cấu trúc ứng dụng monolithic của nhóm thành microservices. Việc này sẽ liên quan đến thay đổi trên hàng chục file và đòi hỏi quyết định về ranh giới service (service boundaries) và phụ thuộc module. Bạn nên tiếp cận theo cách nào?`,

    `Bắt đầu bằng direct execution và thực hiện thay đổi từng phần, để việc triển khai tự bộc lộ ranh giới service tự nhiên.`,

{ id: "cca1-033", n: 33, set: 1, scenario: 2, domain: 3, task: "3.3",
  topic: "Path-Specific Rule Configuration", difficulty: "medium", type: "mc", ans: [0],
  q: `Your codebase has distinct areas with different conventions: React components use functional style with hooks, API handlers use async/await, and database models follow a repository pattern. Test files are spread throughout alongside the code they test (e.g., Button.test.tsx next to Button.tsx), and you want all tests to follow the same conventions regardless of location. What's the most maintainable way to ensure Claude automatically applies the correct conventions?`,
  opts: [
    `Create rule files in .claude/rules/ with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths`,

    `Place a separate CLAUDE.md file in each subdirectory containing that area's specific conventions`,
  ],
  q_vi: `Codebase của bạn có các khu vực riêng biệt với quy ước khác nhau: React component dùng functional style với hooks, API handler dùng async/await, và database model theo repository pattern. File test rải khắp bên cạnh code mà chúng kiểm thử (vd Button.test.tsx nằm cạnh Button.tsx), và bạn muốn mọi test tuân theo cùng quy ước bất kể vị trí. Cách nào dễ bảo trì nhất để đảm bảo Claude tự động áp dụng đúng quy ước?`,
  opts_vi: [
    `Tạo rule file trong .claude/rules/ với YAML frontmatter chỉ định glob pattern để áp dụng quy ước có điều kiện dựa trên đường dẫn file`,
    `Gom tất cả quy ước vào file CLAUDE.md gốc dưới các header cho từng khu vực, dựa vào Claude tự suy luận section nào áp dụng`,
    `Tạo skill trong .claude/skills/ cho từng loại code, đưa quy ước liên quan vào file SKILL.md của chúng`,

  ],
  why: [
    `Dùng rule file trong .claude/rules/ với glob pattern (vd **/*.test.tsx, src/api/**/*.ts) cho phép quy ước được áp dụng tự động và xác định theo đường dẫn file, bất kể vị trí. Dễ bảo trì nhất vì xử lý được mối quan tâm cắt ngang (cross-cutting) như file test rải khắp.`,

    `Đặt CLAUDE.md riêng trong từng thư mục con chỉ hợp với quy ước theo thư mục, không xử lý hiệu quả file test nằm cạnh source ở nhiều thư mục — phải lặp lại quy ước test ở mọi thư mục.`,

  terms: [

{ id: "cca1-034", n: 34, set: 1, scenario: 2, domain: 5, task: "5.4",
  topic: "Subagent Delegation Strategy", difficulty: "medium", type: "mc", ans: [0],
  q: `You're adding error handling wrappers across a 120-file codebase. The task has three phases: (1) discovering all API call locations, (2) designing the error handling approach collaboratively, and (3) implementing wrappers consistently. During Phase 1, Claude generates verbose output listing hundreds of call sites. Your context window is filling rapidly. What's the most effective approach to complete this while maintaining implementation consistency?`,
  opts: [
    `Use the Explore subagent for Phase 1 to isolate verbose output and return a summary, then continue Phases 2-3 in the main conversation.`,
    `Continue all phases in the main conversation, using /compact periodically to reduce context usage.`,
    `Define your error handling pattern in CLAUDE.md, then process files in batches across multiple sessions, relying on the shared memory file for consistency.`,
    `Switch to headless mode with --continue, passing explicit context summaries between batch invocations.`,
  ],
  q_vi: `Bạn đang thêm error handling wrapper trên toàn bộ codebase gồm 120 file. Tác vụ có ba giai đoạn: (1) khám phá mọi vị trí gọi API, (2) thiết kế cách tiếp cận xử lý lỗi một cách cộng tác, và (3) triển khai wrapper nhất quán. Trong Phase 1, Claude sinh ra output dài dòng liệt kê hàng trăm call site. Context window của bạn đang lấp đầy nhanh chóng. Cách tiếp cận nào hiệu quả nhất để hoàn thành việc này trong khi vẫn giữ tính nhất quán khi triển khai?`,
  opts_vi: [
    `Dùng Explore subagent cho Phase 1 để cô lập output dài dòng và trả về bản tóm tắt, sau đó tiếp tục Phase 2-3 trong hội thoại chính.`,
    `Tiếp tục cả ba giai đoạn trong hội thoại chính, dùng /compact định kỳ để giảm mức sử dụng context.`,
    `Định nghĩa pattern xử lý lỗi trong CLAUDE.md, sau đó xử lý file theo từng batch qua nhiều session, dựa vào file memory dùng chung để đảm bảo nhất quán.`,
    `Chuyển sang headless mode với --continue, truyền tóm tắt ngữ cảnh rõ ràng giữa các lần gọi theo batch.`,
  ],
  why: [
    `Dùng Explore subagent cho Phase 1 cô lập output khám phá dài dòng trong context riêng, chỉ trả về tóm tắt ngắn gọn cho hội thoại chính. Giữ nguyên context window chính cho phase thiết kế cộng tác và triển khai nhất quán — nơi context giữ lại có giá trị nhất.`,
    `/compact giải phóng không gian nhưng là nén có mất mát (lossy), có thể loại bỏ chi tiết pattern và edge case quan trọng phát hiện ở Phase 1, làm suy yếu tính nhất quán cho Phase 2-3.`,
    `Chia việc qua nhiều session làm mất ngữ cảnh trong-session về quyết định tinh tế và edge case; riêng CLAUDE.md không đủ ghi lại toàn bộ lý do chi tiết cần cho 120 file.`,
    `Headless mode với --continue thiết kế cho tự động hóa chứ không phải làm việc cộng tác tương tác, và thủ công truyền tóm tắt giữa các lần gọi tạo gánh nặng mà subagent vốn xử lý tự động hơn.`,
  ],
  concept: `Explore subagent được thiết kế cho tác vụ sinh ra output dài dòng mà bạn không cần giữ lại — nó cô lập output trong context riêng và chỉ trả về bản tóm tắt ngắn gọn cho cuộc hội thoại chính.`,
  takeaway: `Output khám phá dài dòng không cần giữ lại → giao cho Explore subagent; giữ phần cần ngữ cảnh lặp (thiết kế, triển khai) ở hội thoại chính.`,
  terms: [
    ["Explore subagent", "subagent chuyên khám phá, trả về tóm tắt"],
    ["context window", "cửa sổ ngữ cảnh, dung lượng có hạn"],
    ["/compact", "nén lịch sử hội thoại (có mất mát)"],

{ id: "cca1-038", n: 38, set: 1, scenario: 2, domain: 3, task: "3.2",

  q: `You're creating a custom /explore-alternatives skill used to brainstorm and evaluate different implementation approaches. Developers report that after running this skill, Claude's subsequent responses are influenced by the exploration discussion—sometimes referencing abandoned approaches or maintaining exploratory context that confuses actual implementation work. What's the most effective way to configure this skill?`,

  opts_vi: [
    `Thêm context: fork vào frontmatter của skill.`,
    `Tách skill thành hai skill riêng biệt — /explore-start và /explore-end — để phân định thời điểm ngữ cảnh khám phá nên bị loại bỏ.`,
    `Tạo skill trong ~/.claude/skills/ thay vì .claude/skills/.`,

  why: [
