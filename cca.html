{ id: "cca2-044", n: 44, set: 2, scenario: 6, domain: 4, task: "4.3",
  topic: "Format Normalization", difficulty: "medium", type: "mc", ans: [1],
  q: `Your extraction tool's input schema declares issue_date as a date string and amount as a number, enforced through tool_use. JSON syntax errors are gone, but two problems remain: documents that write "03/04/26" come back as March 4 from some calls and April 3 from others, and amounts written "$1,204.50" or "1.204,50 EUR" arrive with the decimal point in the wrong place. What is the right fix?`,
  opts: [
    `Loosen the schema so issue_date and amount are free-text strings, and normalize the values in downstream code.`,
    `Keep the strict schema and add explicit format normalization rules to the prompt: state which locale convention to assume for numeric dates (and to return unclear when the document gives no clue), and state that currency symbols and thousands separators are stripped with the currency code captured in its own field.`,
    `Drop tool_use and go back to text output with a post-parser that recognizes every date and currency format you have seen.`,
    `Tighten the schema further, since a schema that pins the date format and the numeric type is the correct place to express how ambiguous source formats should be read.`,
  ],
  q_vi: `Schema đầu vào của tool trích xuất khai báo issue_date là một date string và amount là một number, được ép buộc thông qua tool_use. Lỗi cú pháp JSON đã hết, nhưng còn hai vấn đề: tài liệu ghi "03/04/26" thì có lúc trả về là March 4, có lúc lại trả về April 3 tuỳ lần gọi, và các khoản tiền ghi "$1,204.50" hoặc "1.204,50 EUR" thì đến nơi bị đặt sai vị trí dấu thập phân. Cách sửa đúng là gì?`,
  opts_vi: [
    `Nới lỏng schema để issue_date và amount trở thành chuỗi văn bản tự do, rồi chuẩn hoá giá trị ở code downstream.`,
    `Giữ nguyên schema strict và thêm vào prompt các quy tắc chuẩn hoá định dạng tường minh: nói rõ nên giả định theo quy ước vùng (locale convention) nào cho ngày dạng số (và trả về unclear khi tài liệu không cho manh mối gì), và nói rõ phải bỏ ký hiệu tiền tệ cùng dấu phân cách nghìn, đồng thời ghi mã tiền tệ vào một trường riêng.`,
    `Bỏ tool_use và quay lại xuất ra text, dùng một post-parser nhận diện mọi định dạng ngày và tiền tệ mà bạn từng gặp.`,
    `Siết schema chặt hơn nữa, vì một schema đã cố định định dạng ngày và kiểu số chính là chỗ đúng để diễn đạt cách đọc các định dạng nguồn nhập nhằng.`,
  ],
  why: [
    `Đưa hai trường về free-text làm schema thôi phàn nàn, nhưng việc chuẩn hóa chỉ bị đẩy sang code phía sau — nơi bạn còn ít thông tin hơn mô hình, vì code không nhìn thấy phần còn lại của tài liệu để biết "03/04/26" theo quy ước nào. Bạn mất luôn lớp schema đang bảo vệ mình mà chẳng giải quyết được nhập nhằng.`,
    `Đây là chỗ hai lớp bổ sung cho nhau: schema strict lo HÌNH DẠNG và kiểu của đầu ra, còn quy tắc chuẩn hóa trong prompt lo cách ĐỌC nguồn không nhất quán. Nói rõ quy ước ngày cần giả định (và cho phép trả unclear khi tài liệu không có căn cứ), nói rõ phải bỏ ký hiệu tiền tệ cùng dấu phân cách nghìn và ghi mã tiền tệ vào trường riêng — mô hình hết phải tự đoán, mà schema vẫn chặn đầu ra méo.`,
    `Bỏ tool_use là đánh đổi ngược: bạn nhận lại toàn bộ lỗi cú pháp JSON vừa diệt xong, để giải quyết một vấn đề mà tool_use chưa bao giờ hứa giải quyết. Post-parser cũng không phá được nhập nhằng 03/04 vì nó không có ngữ cảnh tài liệu để biết chọn quy ước nào.`,
    `Schema ràng buộc hình dạng và kiểu của ĐẦU RA, nó không nói được cách diễn giải ĐẦU VÀO. Không có cấu hình schema nào phân xử được "03/04/26" là tháng ba hay tháng tư, vì cả hai cách đọc đều tạo ra một date string hợp lệ. Siết thêm không chạm tới lớp đang lỗi.`,
  ],
  concept: `tool_use với schema strict đảm bảo đầu ra đúng hình dạng, nhưng cách DIỄN GIẢI nguồn không nhất quán (ngày dạng số nhập nhằng, dấu phân cách nghìn, ký hiệu tiền tệ) là việc của prompt. Đặt quy tắc chuẩn hóa định dạng trong prompt SONG SONG với schema strict — hai lớp giải hai vấn đề khác nhau.`,
  takeaway: `Schema lo hình dạng đầu ra, prompt lo cách đọc đầu vào. Nguồn viết định dạng lộn xộn → thêm quy tắc chuẩn hóa tường minh vào prompt và giữ schema strict; đừng nới schema hay bỏ tool_use.`,
  terms: [
    ["format normalization rules", "quy tắc trong prompt nói rõ cách đọc định dạng nguồn lộn xộn"],
    ["locale convention", "quy ước theo vùng, quyết định 03/04 là ngày 3 tháng 4 hay 4 tháng 3"],
    ["thousands separator", "dấu phân cách nghìn — dấu phẩy hay dấu chấm tùy vùng"],
    ["strict schema", "cưỡng chế hình dạng và kiểu đầu ra, không diễn giải đầu vào"],
    ["unclear value", "giá trị dành cho ca không có căn cứ để quyết, thay vì đoán bừa"],
  ] },

{ id: "cca2-045", n: 45, set: 2, scenario: 6, domain: 4, task: "4.3",
  topic: "Structured Output", difficulty: "medium", type: "mc", ans: [2],
  q: `Your intake stream mixes four extractable document types (each with its own extraction tool) with documents that are not extractable at all: blank scanned pages, email cover notes, signature-only fax sheets. You run tool_choice: "any" over the four extraction tools, and unextractable documents come back as an extraction full of nulls. Downstream needs to tell "nothing to extract, and here is why" apart from "a real document whose optional fields happen to be empty." What should you change?`,
  opts: [
    `Switch to tool_choice: "auto" so the model can answer in plain text for unextractable documents, and detect that case by checking for stop_reason "end_turn".`,
    `Keep the four tools and tool_choice: "any", and treat any result whose fields are all null as unextractable.`,
    `Register a fifth tool, report_unextractable, with its own schema (a reason enum plus a detail string) and keep tool_choice: "any" so every document ends in exactly one structured tool call.`,
    `Force tool_choice: {"type": "tool", "name": "classify_document"} on every request, then have your own code issue a second request with whichever extraction tool it picked.`,
  ],
  q_vi: `Luồng tài liệu đầu vào của bạn trộn lẫn bốn loại tài liệu trích xuất được (mỗi loại có tool trích xuất riêng) với những tài liệu hoàn toàn không trích xuất được: trang scan trắng, thư kèm email (cover note), tờ fax chỉ có chữ ký. Bạn chạy tool_choice: "any" trên bốn tool trích xuất đó, và các tài liệu không trích xuất được trả về một kết quả trích xuất toàn null. Downstream cần phân biệt được "không có gì để trích, và đây là lý do" với "một tài liệu thật mà các trường optional của nó tình cờ trống". Bạn nên thay đổi gì?`,
  opts_vi: [
    `Chuyển sang tool_choice: "auto" để model có thể trả lời bằng text thuần cho các tài liệu không trích xuất được, và nhận diện ca đó bằng cách kiểm tra stop_reason "end_turn".`,
    `Giữ nguyên bốn tool và tool_choice: "any", rồi coi bất kỳ kết quả nào có mọi trường đều null là không trích xuất được.`,
    `Đăng ký một tool thứ năm, report_unextractable, với schema riêng của nó (một enum lý do cộng một chuỗi mô tả chi tiết) và giữ nguyên tool_choice: "any" để mọi tài liệu đều kết thúc bằng đúng một lời gọi tool có cấu trúc.`,
    `Ép tool_choice: {"type": "tool", "name": "classify_document"} trên mọi request, rồi để code của bạn tự gửi một request thứ hai với bất kỳ tool trích xuất nào đã được chọn.`,
  ],
  why: [
    `Chuyển sang "auto" mở lại cửa cho đầu ra text tự do đúng ở nhóm tài liệu mà bạn cần dữ liệu máy đọc nhất. stop_reason "end_turn" chỉ cho biết mô hình đã không gọi tool, chứ không đưa cho bạn LÝ DO ở dạng có cấu trúc — bạn lại phải parse văn xuôi, đúng thứ mà tool_use ra đời để tránh.`,
    `Suy ra "không trích được" từ việc mọi trường đều null gộp hai tình huống khác hẳn nhau vào một tín hiệu: một trang trắng và một hóa đơn thật có các trường optional tình cờ trống trông y như nhau. Đây chính là phân biệt mà đề bài nói downstream đang cần.`,
    `Thêm report_unextractable thành tool thứ năm, có schema riêng (enum lý do kèm chuỗi mô tả), rồi giữ tool_choice: "any": mô hình buộc phải gọi đúng một tool, nên mọi tài liệu đều kết thúc bằng một lời gọi có cấu trúc — hoặc một bản trích, hoặc một bản ghi "không có gì để trích" kèm lý do máy đọc được. Ca âm tính trở thành một schema hạng nhất thay vì một suy diễn.`,
    `Ép classify_document rồi tự gọi lần hai là mẫu routing dùng được, nhưng nó thêm một vòng request cho mọi tài liệu mà vẫn chưa trả lời câu hỏi: bạn vẫn cần một chỗ có cấu trúc để ghi lý do tài liệu không trích được. Nó cũng bỏ mất khả năng mô hình chọn ngay schema khớp trong cùng một lượt.`,
  ],
  concept: `Khi luồng đầu vào có cả ca "không có gì để trích", hãy biến ca âm tính thành một tool riêng có schema (lý do + mô tả) và giữ tool_choice: "any". Như vậy mọi tài liệu đều kết thúc bằng một lời gọi tool có cấu trúc: đừng để mô hình rơi về text tự do, cũng đừng suy diễn từ một kết quả toàn null.`,
  takeaway: `Ca "không trích được" cũng cần schema riêng: thêm một tool báo lý do và giữ tool_choice: "any". Suy diễn từ kết quả toàn null thì lẫn với tài liệu thật có trường trống; quay về "auto" thì lại phải parse văn xuôi.`,
  terms: [
    ["tool_choice: \"any\"", "buộc gọi một tool, mô hình tự chọn tool nào — không bao giờ trả text"],
    ["tool_choice: \"auto\"", "mô hình được quyền không gọi tool và trả text hội thoại"],
    ["negative case as a tool", "biến ca không trích được thành một tool có schema riêng"],
    ["stop_reason", "lý do lượt kết thúc: \"tool_use\" khi gọi tool, \"end_turn\" khi trả text"],
    ["all-null result", "kết quả toàn null — tín hiệu nhập nhằng, lẫn trang trắng với trường optional trống"],
  ] },

);

{ id: "cca2-046", n: 46, set: 2, scenario: 6, domain: 4, task: "4.4",
  topic: "Retry Triage", difficulty: "hard", type: "mr", ans: [0, 2],
  q: `Your extraction pipeline retries once with error feedback whenever validation fails, and your bill shows a large share of retries that never succeed. You decide to keep in the retry path only the failures where resending the document, the failed extraction, and the specific validation error has a real chance of fixing the output; everything else gets flagged for human handling instead. Which TWO failure types belong in the retry path? (Choose TWO.)`,
  opts: [
    `An extracted invoice_date came back as "March 3rd, 2025" while the schema requires ISO 8601, and the date is printed plainly on the document.`,
    `The required beneficiary_tax_id appears nowhere in the submitted document; it lives only in a vendor master system that was never sent to the model.`,
    `The shipping address was written into the billing_address field and the real billing address was dropped, while both addresses appear labelled on the document.`,
    `The invoice's printed total genuinely disagrees with the sum of its own printed line items, and the extraction captured both numbers faithfully.`,
    `Three required fields live on a page of a scanned fax that is too degraded to read, so no legible value exists in the source at all.`,
  ],
  q_vi: `Pipeline trích xuất của bạn tự động retry một lần kèm error feedback mỗi khi validation thất bại, và hóa đơn cho thấy phần lớn các lần retry đó không bao giờ thành công. Bạn quyết định chỉ giữ lại trong retry path những ca thất bại mà việc gửi lại tài liệu, kết quả trích xuất bị lỗi, và lỗi validation cụ thể có cơ hội thực sự sửa được đầu ra; mọi trường hợp còn lại sẽ được gắn cờ để con người xử lý. HAI loại thất bại nào thuộc về retry path? (Chọn HAI phương án.)`,
  opts_vi: [
    `Trường invoice_date được trích xuất ra là "March 3rd, 2025" trong khi schema yêu cầu định dạng ISO 8601, và ngày này được in rõ ràng trên tài liệu.`,
    `Trường beneficiary_tax_id bắt buộc không xuất hiện ở bất cứ đâu trong tài liệu đã gửi; nó chỉ tồn tại trong một hệ thống vendor master chưa từng được gửi cho mô hình.`,
    `Địa chỉ giao hàng bị ghi nhầm vào trường billing_address và địa chỉ thanh toán thật đã bị bỏ sót, trong khi cả hai địa chỉ đều xuất hiện có nhãn rõ ràng trên tài liệu.`,
    `Tổng tiền in trên hóa đơn thực sự không khớp với tổng các dòng chi tiết cũng được in trên chính hóa đơn đó, và việc trích xuất đã ghi lại trung thực cả hai con số.`,
    `Ba trường bắt buộc nằm trên một trang fax scan đã quá mờ để đọc được, nên hoàn toàn không có giá trị nào đọc được trong nguồn.`,
  ],
  why: [
    `Đúng. Giá trị có mặt rõ ràng trong tài liệu, chỉ sai định dạng. Gửi lại kèm lỗi cụ thể ("trường này phải theo ISO 8601") chỉ đúng chỗ cần chỉnh, và mô hình có đủ dữ liệu để chỉnh. Đây là ca retry ăn tiền nhất.`,
    `Thông tin không tồn tại trong tài liệu đã gửi. Retry bao nhiêu lần cũng không tạo ra được dữ liệu không có ở đó, và ép cố sẽ đẩy mô hình sang bịa một mã số thuế trông hợp lý. Ca này phải đi đường khác: đánh dấu thiếu, hoặc nối thêm nguồn dữ liệu.`,
    `Đúng. Đây là lỗi cấu trúc đầu ra: cả hai địa chỉ đều có trong nguồn và có nhãn, mô hình chỉ xếp sai trường. Lỗi validation cụ thể ("giá trị ở billing_address là địa chỉ giao hàng") cho mô hình biết chính xác phải đổi chỗ gì, nên retry sửa được.`,
    `Mô hình đã trích ĐÚNG những gì tài liệu ghi — cái mâu thuẫn nằm ở bản thân tài liệu nguồn. Retry sẽ trả về cùng hai con số đó, vì không có gì để sửa ở phía trích xuất. Ca này cần cờ báo mâu thuẫn và người xử lý, không phải retry.`,
    `Nguồn không đọc được nghĩa là thông tin coi như vắng mặt, giống ca dữ liệu nằm ở hệ thống khác. Không có tín hiệu nào để mô hình sửa, nên mọi lần gửi lại đều là tiền bỏ đi. Cần quét lại tài liệu hoặc chuyển người xử lý.`,
  ],
  concept: `Retry kèm phản hồi lỗi chỉ chữa được lỗi ĐỊNH DẠNG và lỗi CẤU TRÚC ĐẦU RA, và chỉ khi thông tin thật sự có mặt trong nguồn. Khi thông tin vắng mặt (ở hệ thống khác, hoặc nguồn không đọc được) hoặc khi bản thân nguồn tự mâu thuẫn, mô hình không có gì để sửa nên retry chỉ lặp lại kết quả cũ.`,
  takeaway: `Trước khi retry, hỏi một câu: dữ liệu cần thiết có nằm trong tài liệu đã gửi hay không. Có mà sai định dạng/sai trường thì retry sửa được; không có, hoặc nguồn tự mâu thuẫn, thì phải đổi đường xử lý.`,
  terms: [
    ["structural output error", "mô hình xếp giá trị vào sai trường — sửa được nếu giá trị vẫn có trong nguồn"],
    ["information absent from source", "thông tin không tồn tại trong tài liệu đã gửi — retry không tạo ra được"],
    ["source-level contradiction", "bản thân tài liệu nguồn tự mâu thuẫn, không phải mô hình trích sai"],
    ["error feedback", "gửi kèm lỗi validation cụ thể để mô hình biết phải chỉnh chỗ nào"],
    ["wasted retry", "lần gửi lại chắc chắn thất bại — chỉ tốn tiền và thời gian"],
  ] },

{ id: "cca2-047", n: 47, set: 2, scenario: 5, domain: 4, task: "4.4",
  topic: "Feedback Loop Design", difficulty: "medium", type: "mc", ans: [3],
  q: `Your CI review posts each finding as a structured record containing file, line, severity, and message. Developers dismiss roughly 40% of findings. You want to learn systematically which kinds of code the reviewer keeps misjudging, so you can rewrite the criteria for exactly those cases. What change to the finding schema best supports that analysis?`,
  opts: [
    `Add a reviewer_confidence score between 0 and 1 to every finding, then study how confidence correlates with dismissal.`,
    `Add a free-text dismissal_reason that the developer fills in when closing a finding, and read through the reasons each sprint.`,
    `Leave the schema alone and instead sample 50 dismissed findings each month for a manual read-through.`,
    `Add a detected_pattern field recording the code construct that triggered each finding, so dismissals can be aggregated by construct.`,
  ],
  q_vi: `CI review của bạn đăng mỗi finding dưới dạng một bản ghi có cấu trúc gồm file, line, severity, và message. Developer dismiss (bác bỏ) khoảng 40% số finding. Bạn muốn tìm hiểu một cách hệ thống xem reviewer đang liên tục đánh giá sai loại code nào, để có thể viết lại tiêu chí đúng cho chính những ca đó. Thay đổi nào cho schema của finding hỗ trợ tốt nhất cho việc phân tích đó?`,
  opts_vi: [
    `Thêm một điểm reviewer_confidence từ 0 đến 1 cho mỗi finding, rồi nghiên cứu xem điểm tự tin đó tương quan thế nào với việc bị dismiss.`,
    `Thêm một trường dismissal_reason dạng văn bản tự do để developer điền khi đóng một finding, rồi đọc qua các lý do đó mỗi sprint.`,
    `Giữ nguyên schema và thay vào đó lấy mẫu 50 finding bị dismiss mỗi tháng để đọc tay.`,
    `Thêm một trường detected_pattern ghi lại cấu trúc code (construct) đã kích hoạt mỗi finding, để có thể gộp nhóm các lần dismiss theo construct.`,
  ],
  why: [
    `Điểm tự tin do mô hình tự khai vốn hiệu chỉnh kém, và ngay cả khi tương quan tốt nó cũng chỉ cho bạn một ngưỡng lọc. Nó không nói được LOẠI code nào đang bị flag oan, nên bạn vẫn không biết phải sửa tiêu chí nào trong prompt.`,
    `Lý do dạng văn bản tự do phụ thuộc vào việc developer chịu điền, và mỗi người diễn đạt một kiểu nên không gộp nhóm để đếm được. Nó cũng đẩy việc sang người dùng, trong khi chính hệ thống review đã biết nó bắt vào cấu trúc code nào.`,
    `Đọc tay 50 ca cho bạn vài câu chuyện lẻ, không cho bạn tỷ lệ. Không có trường để nhóm, bạn không biết một dạng code nào đó chiếm 5% hay 50% số finding bị bỏ, tức là không biết nên ưu tiên sửa gì.`,
    `Đúng. Thêm detected_pattern ghi lại cấu trúc code đã kích hoạt finding biến việc phân tích thành một truy vấn gộp nhóm: bạn thấy ngay dạng nào bị dismiss nhiều nhất, rồi sửa đúng tiêu chí cho dạng đó. Trường này do chính bộ review điền nên không phụ thuộc thiện chí của developer.`,
  ],
  concept: `Vòng phản hồi cần dữ liệu gộp nhóm được. Thêm trường detected_pattern (cấu trúc code đã kích hoạt finding) vào bản ghi có cấu trúc cho phép thống kê các dạng bị dismiss, từ đó biết chính xác tiêu chí nào đang sinh báo động giả.`,
  takeaway: `Muốn biết prompt sai ở đâu, hãy làm cho nguyên nhân trở thành một TRƯỜNG có cấu trúc: detected_pattern cho phép nhóm dismiss theo dạng code. Điểm tự tin, lý do văn bản tự do hay đọc tay đều không cho bạn con số để ưu tiên.`,
  terms: [
    ["detected_pattern", "trường ghi cấu trúc code đã kích hoạt finding, để gộp nhóm và đếm"],
    ["dismissal", "developer đóng finding vì cho rằng nó không đúng"],
    ["false positive pattern", "một dạng code cứ bị flag oan lặp lại"],
    ["feedback loop", "đo kết quả thật rồi sửa prompt theo dữ liệu, không theo cảm giác"],
    ["self-reported confidence", "điểm tin cậy do mô hình tự khai — hiệu chỉnh kém"],
  ] },

{ id: "cca2-048", n: 48, set: 2, scenario: 6, domain: 4, task: "4.5",
  topic: "Batch Scheduling", difficulty: "hard", type: "mc", ans: [1],
  q: `Documents arrive from customers throughout the day. Your contract promises each document is processed within 36 hours of arrival. You want the Message Batches API for the 50% saving, knowing it can take up to 24 hours with no latency SLA. You want the fewest submissions per day that still honours the 36-hour promise in the worst case. Which schedule do you choose?`,
  opts: [
    `Submit once every 24 hours; a document that just missed a submission waits 24 hours, and batches usually finish within a few hours anyway.`,
    `Submit every 12 hours; worst case a document waits 12 hours for the next submission plus 24 hours of processing, which still lands inside 36 hours.`,
    `Submit once every 36 hours, since the 24-hour processing window happens inside the 36-hour promise you made.`,
    `Keep one batch permanently open and append each document as it arrives, so no document ever waits for a submission window.`,
  ],
  q_vi: `Tài liệu từ khách hàng đến trong suốt cả ngày. Hợp đồng của bạn cam kết mỗi tài liệu được xử lý trong vòng 36 giờ kể từ lúc đến. Bạn muốn dùng Message Batches API để được giảm 50% chi phí, dù biết nó có thể mất tới 24 giờ và không có latency SLA. Bạn muốn số lần submit mỗi ngày là ít nhất mà vẫn giữ đúng cam kết 36 giờ trong ca xấu nhất. Bạn chọn lịch gửi nào?`,
  opts_vi: [
    `Submit mỗi 24 giờ một lần; một tài liệu vừa lỡ một đợt submit sẽ phải chờ 24 giờ, nhưng dù sao batch cũng thường xong trong vài giờ.`,
    `Submit mỗi 12 giờ một lần; ca xấu nhất là một tài liệu chờ 12 giờ tới đợt submit tiếp theo cộng 24 giờ xử lý, vẫn nằm trong 36 giờ.`,
    `Submit mỗi 36 giờ một lần, vì cửa sổ xử lý 24 giờ nằm gọn trong cam kết 36 giờ bạn đã đưa ra.`,
    `Giữ một batch luôn mở và thêm từng tài liệu vào ngay khi nó đến, để không tài liệu nào phải chờ tới cửa sổ submit.`,
  ],
  why: [
    `Ca xấu nhất ở đây là 24 giờ chờ cộng 24 giờ xử lý, tức 48 giờ — vỡ cam kết 36 giờ. Lập luận "thường xong sau vài giờ" chính là điều không được phép dựa vào: Message Batches API không cam kết SLA độ trễ, nên kế hoạch phải tính theo mức tối đa 24 giờ.`,
    `Đúng. Công thức là cửa sổ gom cộng thời gian xử lý tối đa phải nhỏ hơn hoặc bằng SLA: 12 + 24 = 36. Cửa sổ 12 giờ là cửa sổ DÀI NHẤT còn thỏa, nên cũng là số lần gửi ít nhất mỗi ngày — hai lần.`,
    `Đây là nhầm chỗ 36 giờ. Con số đó tính cho MỘT tài liệu kể từ lúc nó đến, không phải chu kỳ gửi batch. Tài liệu đến ngay sau một lần gửi sẽ chờ tới 36 giờ mới được gửi, rồi cộng thêm tới 24 giờ xử lý — tới 60 giờ.`,
    `Một batch khi đã gửi là một tập request cố định; không có cơ chế giữ batch "mở" rồi thêm tài liệu vào lô đang xử lý. Muốn gom tài liệu mới thì phải tạo batch mới, nên bài toán cửa sổ gom vẫn còn nguyên.`,
  ],
  concept: `Bài toán tần suất gửi batch có một công thức: cửa sổ gom + thời gian xử lý tối đa (24 giờ) phải nhỏ hơn hoặc bằng SLA. Với SLA 36 giờ, cửa sổ gom tối đa là 12 giờ. Luôn tính theo mức TỐI ĐA, vì batch không cam kết độ trễ.`,
  takeaway: `Tính tần suất submit theo ca xấu nhất: cửa sổ gom + 24 giờ xử lý ≤ SLA. SLA 36 giờ → gửi mỗi 12 giờ. Đừng lấy "thường nhanh hơn" làm cơ sở, và đừng nhầm SLA của một tài liệu với chu kỳ gửi lô.`,
  terms: [
    ["submission window", "khoảng thời gian gom tài liệu giữa hai lần gửi batch"],
    ["worst case", "ca xấu nhất: tài liệu đến ngay sau khi vừa gửi một batch"],
    ["latency SLA", "cam kết thời gian trả kết quả; Message Batches API không có"],
    ["24-hour processing window", "batch có thể mất tới 24 giờ mới xong"],
    ["typical vs guaranteed", "thường nhanh khác với được bảo đảm — chỉ lên kế hoạch theo cái được bảo đảm"],
  ] },

{ id: "cca2-049", n: 49, set: 2, scenario: 6, domain: 4, task: "4.5",
  topic: "Batch Preparation", difficulty: "easy", type: "mc", ans: [2],
  q: `You have just written a new extraction prompt and schema for a 40,000-document archive that you plan to push through the Message Batches API. A full run takes most of a day to come back, and every resubmission is billed again. What should you do before submitting the whole archive?`,
  opts: [
    `Submit all 40,000 right away; with the 50% batch discount, even one full resubmission still costs less than processing the archive synchronously.`,
    `Split the archive into 40 batches of 1,000 and submit all of them at once, so any failure stays contained to a smaller batch.`,
    `Run the prompt on a small representative sample first, refine it against what fails, then submit the full archive.`,
    `Submit the full archive and turn on automatic retry for the batch, so failed documents are reprocessed without your involvement.`,
  ],
  q_vi: `Bạn vừa viết xong một prompt trích xuất và schema mới cho một kho lưu trữ 40.000 tài liệu mà bạn định đẩy qua Message Batches API. Một lần chạy đầy đủ mất gần trọn một ngày mới có kết quả trả về, và mỗi lần gửi lại đều bị tính phí lại từ đầu. Bạn nên làm gì trước khi submit toàn bộ kho lưu trữ?`,
  opts_vi: [
    `Submit ngay cả 40.000 tài liệu; với mức giảm 50% của batch, dù có phải gửi lại toàn bộ một lần thì vẫn rẻ hơn xử lý đồng bộ (synchronously) cả kho lưu trữ.`,
    `Chia kho lưu trữ thành 40 batch, mỗi batch 1.000 tài liệu, rồi submit tất cả cùng lúc, để mọi thất bại chỉ khoanh vùng trong một batch nhỏ hơn.`,
    `Chạy thử prompt trên một mẫu nhỏ nhưng đại diện trước, tinh chỉnh dựa trên những gì thất bại, rồi mới submit toàn bộ kho lưu trữ.`,
    `Submit toàn bộ kho lưu trữ và bật tự động retry cho batch, để các tài liệu thất bại được xử lý lại mà không cần bạn can thiệp.`,
  ],
  why: [
    `Chi phí không phải thứ duy nhất bạn trả. Một lần chạy lại toàn bộ vừa nhân đôi tiền vừa mất thêm gần một ngày, và nếu prompt có lỗi hệ thống thì tỷ lệ thất bại sẽ cao trên khắp archive chứ không vài tài liệu lẻ.`,
    `Chia nhỏ giúp khoanh vùng thất bại nhưng vẫn chạy CÙNG một prompt chưa được tinh chỉnh trên cả 40.000 tài liệu — cùng một lỗi sẽ xuất hiện đều ở mọi lô. Nó không làm tăng tỷ lệ đúng ngay lần đầu, tức là không giải quyết việc bạn đang lo.`,
    `Đúng. Tinh chỉnh prompt trên một mẫu nhỏ nhưng đại diện trước khi chạy lô lớn là cách tối đa hóa tỷ lệ đúng ngay lần đầu và cắt các vòng gửi lại tốn kém. Mỗi vòng sửa trên mẫu tính bằng phút, còn mỗi vòng sửa trên lô lớn tính bằng gần một ngày.`,
    `Message Batches API không có tùy chọn tự động gửi lại request thất bại — bạn tự tìm chúng qua custom_id rồi gửi lại lô mới. Và dù có, gửi lại cùng một prompt lỗi cũng không sửa được nguyên nhân.`,
  ],
  concept: `Trước khi đẩy khối lượng lớn qua batch, hãy tinh chỉnh prompt trên một mẫu nhỏ đại diện. Vòng lặp sửa lỗi trên mẫu rẻ và nhanh; trên lô lớn thì mỗi vòng mất tới một ngày và bị tính phí lại toàn bộ.`,
  takeaway: `Batch lớn thì mỗi vòng sai rất đắt — chạy mẫu nhỏ đại diện, sửa prompt cho sạch, rồi mới submit toàn bộ. Chia nhỏ lô hay trông chờ "tự retry" đều không làm tăng tỷ lệ đúng lần đầu.`,
  terms: [
    ["representative sample", "mẫu nhỏ nhưng phủ được các dạng tài liệu thật"],
    ["first-pass success rate", "tỷ lệ đúng ngay lần chạy đầu"],
    ["iteration cost", "chi phí mỗi vòng sửa — trên lô lớn là gần một ngày và tính phí lại"],
    ["resubmission", "gửi lại các request thất bại, bị tính phí lần nữa"],
    ["custom_id", "định danh để biết request nào thất bại mà gửi lại"],
  ] },

{ id: "cca2-050", n: 50, set: 2, scenario: 5, domain: 4, task: "4.6",
  topic: "Independent Review Instance", difficulty: "medium", type: "mc", ans: [0],
  q: `In your pipeline, one job has Claude Code implement small tickets and a later job runs the review. To save tokens, the review job currently resumes the generating session by name and asks it to review its own diff. Those reviews come back approving almost every time, yet human reviewers still find real bugs. How should you wire the review job instead?`,
  opts: [
    `Start a fresh Claude Code invocation for the review, passing only the diff and the review criteria, with no access to the generation session.`,
    `Keep resuming the session but prepend a strict instruction to be adversarial and to assume the diff contains at least one bug.`,
    `Keep resuming the session and enable extended thinking on the review turn so the model deliberates longer before approving.`,
    `Resume the session twice and report only the findings that both review turns agree on.`,
  ],
  q_vi: `Trong pipeline của bạn, một job cho Claude Code triển khai các ticket nhỏ, và một job sau đó chạy review. Để tiết kiệm token, job review hiện tại resume lại đúng session đã sinh code (theo tên) và yêu cầu nó tự review diff của chính mình. Các lần review đó gần như luôn trả về approve, nhưng người review vẫn tìm thấy bug thật. Bạn nên nối lại job review như thế nào?`,
  opts_vi: [
    `Khởi động một invocation Claude Code hoàn toàn mới cho việc review, chỉ truyền vào diff và tiêu chí review, không cho truy cập vào session đã sinh code.`,
    `Vẫn resume session đó nhưng thêm vào đầu một chỉ dẫn nghiêm ngặt yêu cầu phải khắt khe (adversarial) và giả định diff chắc chắn chứa ít nhất một bug.`,
    `Vẫn resume session đó và bật extended thinking cho lượt review, để mô hình suy nghĩ lâu hơn trước khi approve.`,
    `Resume session đó hai lần và chỉ báo cáo những phát hiện mà cả hai lượt review đều đồng thuận.`,
  ],
  why: [
    `Đúng. Giá trị của review nằm ở chỗ người review KHÔNG mang theo lập luận lúc sinh code. Một invocation mới chỉ nhận diff và tiêu chí sẽ đọc code như người ngoài, nên sẵn sàng chất vấn những quyết định mà phiên sinh đã tự hợp lý hóa. Diff cộng tiêu chí là đủ ngữ cảnh để review.`,
    `Vẫn ở trong cùng phiên nên vẫn mang nguyên lập luận lúc sinh; "hãy khắt khe" là một ràng buộc mềm, không xóa được ngữ cảnh khiến mô hình bảo vệ lựa chọn của chính nó. Yêu cầu "phải có ít nhất một bug" còn dễ đẩy sang bịa ra vấn đề cho đủ chỉ tiêu.`,
    `Thêm thời gian suy nghĩ vẫn là suy nghĩ trên cùng tiền đề đã kết luận là đúng. Hạn chế của self-review không phải thiếu thời gian cân nhắc mà là thiếu một góc nhìn không bị ràng buộc bởi lập luận trước đó.`,
    `Hai lượt review trong cùng một phiên chia sẻ cùng ngữ cảnh nên sai theo cùng một hướng — đồng thuận ở đây không phải bằng chứng. Tệ hơn, chỉ báo cáo phần trùng nhau sẽ loại bỏ đúng những bug chỉ bắt được không thường xuyên.`,
  ],
  concept: `Session context isolation: phiên vừa sinh code giữ nguyên lập luận lúc sinh, nên nó review chính nó kém hơn hẳn một instance độc lập. Cách sửa nằm ở cách nối pipeline — chạy review bằng một invocation mới chỉ nhận diff và tiêu chí — chứ không ở việc thêm chỉ dẫn vào phiên cũ.`,
  takeaway: `Đừng resume phiên đã sinh code để nó tự review. Chạy một invocation mới chỉ với diff + tiêu chí; chỉ dẫn khắt khe, thêm thời gian suy nghĩ hay lấy đồng thuận trong cùng phiên đều không tạo ra được sự độc lập.`,
  terms: [
    ["session resumption", "tiếp tục một phiên cũ, mang theo toàn bộ lập luận trước đó"],
    ["session context isolation", "tách ngữ cảnh: phiên review không được thấy lập luận lúc sinh code"],

{ id: "cca2-051", n: 51, set: 2, scenario: 5, domain: 4, task: "4.6",
  topic: "Multi-Pass Review", difficulty: "medium", type: "mc", ans: [3],
  q: `You already split large pull request reviews into one focused pass per changed file, and per-file feedback is now consistently deep and no longer self-contradictory. Then a regression ships: one file renamed a response field while two other files in the same pull request still read the old name. Each file was correct in isolation. What should you add to the review architecture?`,
  opts: [
    `Give every per-file pass the full pull request diff as background, so each pass can see the other files while focusing on its own.`,
    `Return to a single pass over all files, since per-file passes are structurally blind to this class of bug.`,
    `Add a rule to the review prompt requiring each per-file pass to flag any field rename as a potential breaking change.`,
    `Add a separate integration pass whose only job is cross-file data flow: how values produced in one file are consumed in the others.`,
  ],
  q_vi: `Bạn đã chia việc review các pull request lớn thành một pass tập trung riêng cho mỗi file thay đổi, và feedback theo từng file giờ đã nhất quán sâu sắc, không còn tự mâu thuẫn nữa. Rồi một regression vẫn lọt ra: một file đã đổi tên một trường response, trong khi hai file khác trong cùng pull request đó vẫn đọc theo tên cũ. Mỗi file, xét riêng lẻ, đều đúng. Bạn nên thêm gì vào kiến trúc review?`,
  opts_vi: [
    `Cho mỗi pass theo file toàn bộ diff của pull request làm nền, để mỗi pass có thể thấy các file khác trong khi vẫn tập trung vào file của mình.`,
    `Quay lại dùng một pass duy nhất cho toàn bộ các file, vì các pass theo từng file về bản chất cấu trúc bị mù trước loại bug này.`,
    `Thêm một quy tắc vào review prompt yêu cầu mỗi pass theo file phải gắn cờ mọi trường hợp đổi tên trường là một breaking change tiềm ẩn.`,
    `Thêm một pass tích hợp (integration pass) riêng biệt mà nhiệm vụ duy nhất là soi luồng dữ liệu xuyên file (cross-file data flow): các giá trị được sinh ra ở file này được tiêu thụ ở các file khác như thế nào.`,
  ],
  why: [
    `Nhồi toàn bộ diff vào từng pass là quay lại chính đầu vào lớn đã gây pha loãng chú ý, và làm mất thứ bạn vừa đạt được là độ sâu nhất quán. Nó còn khiến nhiều pass cùng báo một vấn đề, tạo ra trùng lặp mà trước đó bạn đã xử lý xong.`,
    `Quay về một pass duy nhất là bỏ luôn phần đã cải thiện — đó chính là cấu hình từng cho ra feedback nông và tự mâu thuẫn. Vấn đề không phải chia pass là sai, mà là còn thiếu một loại pass.`,
    `Một pass chỉ thấy một file không biết ai đang đọc trường đó, nên nó chỉ có thể cảnh báo chung chung: gắn cờ mọi lần đổi tên, kể cả đổi tên nội bộ hoàn toàn an toàn, mà vẫn không khẳng định được có chỗ nào thực sự bị vỡ. Đây là đổi một loại báo động giả lấy một loại khác.`,
    `Đúng. Kiến trúc nhiều pass gồm HAI loại pass khác nhau: pass cục bộ theo từng file, cộng một pass tích hợp riêng soi luồng dữ liệu xuyên file. Lỗi đổi tên trường chỉ hiện ra khi so nơi sinh giá trị với nơi tiêu thụ, nên cần một pass có đúng nhiệm vụ đó.`,
  ],
  concept: `Review nhiều pass không chỉ là "chia nhỏ": nó gồm các pass cục bộ theo từng file để bắt lỗi trong file, CỘNG một pass tích hợp riêng để bắt lỗi chỉ tồn tại giữa các file (luồng dữ liệu, hợp đồng giữa nơi sinh và nơi dùng giá trị).`,
  takeaway: `Chia pass theo file bắt lỗi cục bộ nhưng cố ý mù với lỗi xuyên file — thêm một pass tích hợp chuyên soi luồng dữ liệu giữa các file. Đừng nhồi cả diff vào mọi pass, cũng đừng quay về một pass duy nhất.`,
  terms: [
    ["per-file pass", "pass phân tích cục bộ trong phạm vi một file"],

  ] },

  topic: "Extended Session Context", difficulty: "easy", type: "mc", ans: [1],
  q: `You have spent two hours in one Claude Code session mapping an unfamiliar 400-file service. Most of the context window is now raw Grep output, directory listings, and full file reads from the discovery work. The understanding built so far is still correct, and you have several more questions about the same service. What is the most appropriate next step?`,

{ id: "cca2-053", n: 53, set: 2, scenario: 4, domain: 5, task: "5.4",
  topic: "Phase Handoff Context", difficulty: "medium", type: "mc", ans: [2],
  q: `Your agent explores a legacy service in two phases. Phase 1 maps the module layout and settles which layer owns persistence. Phase 2 spawns four subagents, one per module, to generate scaffolding. The Phase 2 output is inconsistent: two subagents put database calls in the service layer, one puts them in the controller, and one invents its own repository pattern. Every subagent ran without error, and the Phase 1 mapping was correct. What is the most effective fix?`,
  opts: [
    `Have the main agent re-run each subagent's task itself after Phase 2 finishes, rewriting whatever does not match the intended layering.`,
    `Let the four Phase 2 subagents exchange messages while they work so they can converge on one persistence approach.`,
    `Summarize the Phase 1 findings, including the persistence-layer decision, and inject that summary into each subagent's initial context when spawning Phase 2.`,
    `Pass the complete Phase 1 transcript to every Phase 2 subagent so that nothing discovered during exploration is lost.`,
  ],
  q_vi: `Agent của bạn khám phá một service cũ theo hai pha. Phase 1 lập bản đồ cách bố trí module và chốt layer nào sở hữu persistence. Phase 2 spawn bốn subagent, mỗi subagent phụ trách một module, để sinh scaffolding. Đầu ra của Phase 2 không nhất quán: hai subagent đặt các lệnh gọi cơ sở dữ liệu trong service layer, một subagent đặt trong controller, và một subagent tự nghĩ ra repository pattern của riêng nó. Mọi subagent đều chạy không lỗi, và bản đồ của Phase 1 là chính xác. Cách sửa hiệu quả nhất là gì?`,
  opts_vi: [
    `Để main agent tự chạy lại việc của từng subagent sau khi Phase 2 kết thúc, viết lại bất cứ chỗ nào không khớp với cách phân lớp dự định.`,
    `Để bốn subagent của Phase 2 trao đổi message với nhau trong lúc làm việc để chúng có thể hội tụ về một cách tiếp cận persistence.`,
    `Tóm tắt các phát hiện của Phase 1, bao gồm cả quyết định về persistence layer, và tiêm bản tóm tắt đó vào ngữ cảnh khởi tạo của từng subagent khi spawn Phase 2.`,
    `Truyền toàn bộ transcript của Phase 1 cho mọi subagent của Phase 2 để không phát hiện nào trong quá trình khám phá bị mất.`,

  why: [
    `Sửa lại sau khi xong là làm hai lần cùng một việc, và main agent phải đọc hết đầu ra của bốn subagent — đúng thứ mà việc tách subagent định tránh. Nó chữa triệu chứng chứ không cấp cho subagent thông tin chúng đang thiếu.`,
    `Cho các subagent tự thương lượng với nhau khiến kết quả phụ thuộc vào việc ai nói trước và ai chịu nhường, không tất định và khó gỡ lỗi. Quyết định kiến trúc đã có sẵn từ Phase 1 rồi; việc của bạn là truyền nó xuống, không phải để bốn agent bàn lại.`,
    `Đúng. Mỗi subagent khởi động với ngữ cảnh riêng, nên nếu bạn không đưa quyết định của Phase 1 vào ngữ cảnh khởi tạo thì chúng buộc phải tự đoán chỗ đặt truy vấn cơ sở dữ liệu — và bốn cái đoán ra bốn kiểu. Tóm tắt phát hiện của pha trước rồi tiêm vào lúc spawn là cách chuyển giao giữa các pha mà guide chỉ ra.`,
    `Đưa nguyên transcript thì thông tin có đủ nhưng ngữ cảnh mỗi subagent lại ngập đầu ra khám phá thô, phá luôn lý do tách subagent. Quyết định cần truyền chỉ nằm trong vài dòng; hãy truyền vài dòng đó.`,

  takeaway: `Subagent không thấy được những gì pha trước đã kết luận. Muốn kết quả nhất quán, hãy tóm tắt quyết định của pha trước và tiêm vào ngữ cảnh khởi tạo khi spawn — bản tóm tắt, không phải cả transcript.`,

{ id: "cca2-054", n: 54, set: 2, scenario: 4, domain: 5, task: "5.4",
  topic: "Crash Recovery State", difficulty: "hard", type: "mr", ans: [1, 3],
  q: `Your exploration tool runs for 40 minutes on a large monorepo: a coordinator drives several subagents that map modules, trace call graphs, and record findings. The machine sleeps at minute 35, the process dies, and the engineer has to start the whole exploration over. You need exploration that resumes instead of restarting. Which TWO design changes best enable recovery without repeating completed work? (Choose TWO.)`,
  opts: [
    `Raise the coordinator's timeout so long explorations are less likely to be cut off before they finish.`,
    `Have each agent export its findings as structured state to a known location as it completes each unit of work, not only at the end of the run.`,
    `Log every tool call and its full output to a file so the run can be replayed command by command after a crash.`,
    `Have the coordinator load a manifest of the exported agent state on resume and inject the recovered findings into the agents' prompts.`,
    `Keep the entire exploration in one long-running session and rely on its in-memory conversation history so nothing needs to be written to disk.`,
  ],
  q_vi: `Công cụ khám phá của bạn chạy 40 phút trên một monorepo lớn: một coordinator điều phối nhiều subagent để lập bản đồ module, truy vết call graph, và ghi lại phát hiện. Máy vào chế độ ngủ ở phút 35, tiến trình chết, và kỹ sư phải bắt đầu lại toàn bộ quá trình khám phá từ đầu. Bạn cần một quy trình khám phá có thể resume thay vì phải khởi động lại. Hai thay đổi thiết kế nào giúp phục hồi tốt nhất mà không lặp lại công việc đã hoàn thành? (Chọn HAI phương án.)`,
  opts_vi: [
    `Tăng timeout của coordinator để các đợt khám phá dài ít khả năng bị cắt ngang trước khi xong.`,
    `Để mỗi agent xuất phát hiện của nó thành trạng thái có cấu trúc ra một vị trí đã biết ngay sau khi hoàn thành từng đơn vị công việc, chứ không chỉ ở cuối run.`,
    `Ghi log mọi lệnh gọi tool và toàn bộ đầu ra của nó ra file để run có thể được replay lại từng lệnh một sau khi crash.`,
    `Để coordinator nạp một manifest chứa trạng thái agent đã xuất khi resume, và tiêm các phát hiện đã phục hồi vào prompt của các agent.`,
    `Giữ toàn bộ quá trình khám phá trong một session chạy liên tục và dựa vào lịch sử hội thoại trong bộ nhớ của nó, để không cần ghi gì ra đĩa.`,
  ],
  why: [
    `Timeout dài hơn không liên quan: tiến trình bị giết vì máy ngủ, không phải vì hết thời gian chờ. Việc đã làm vẫn mất sạch trong lần crash tiếp theo.`,
    `Đúng. Ghi trạng thái có cấu trúc ra vị trí đã biết sau từng đơn vị công việc là điều kiện cần: nếu chỉ ghi ở cuối run thì crash ở phút 35 vẫn mất hết. Ghi tăng dần biến công việc đã hoàn thành thành thứ tồn tại độc lập với tiến trình.`,
    `Nhật ký replay vừa dài dòng vừa sai bản chất: phát lại từng lệnh là chạy lại đúng phần việc bạn muốn khỏi phải làm lại, và đầu ra thô sẽ nhồi lại ngữ cảnh. Bạn cần trạng thái đã chưng cất, không cần băng ghi hình.`,
    `Đúng. Có file trạng thái mà không ai đọc thì vô nghĩa. Coordinator phải nạp manifest lúc resume và tiêm phát hiện đã phục hồi vào prompt của các agent, để chúng tiếp tục từ chỗ dở thay vì khám phá lại.`,
    `Lịch sử hội thoại nằm trong bộ nhớ tiến trình sẽ chết cùng tiến trình. Chính giả định "không cần ghi ra đĩa" là nguyên nhân bạn đang phải làm lại 35 phút.`,
  ],
  concept: `Bền hoá trạng thái có cấu trúc để phục hồi sau crash: agent xuất trạng thái tăng dần ra vị trí đã biết, coordinator nạp manifest lúc resume và tiêm lại vào prompt.`,
  takeaway: `Phục hồi sau crash cần đủ hai nửa: ghi trạng thái tăng dần ra ngoài tiến trình, và nạp lại nó khi resume. Thiếu nửa nào thì lần crash sau bạn vẫn khám phá lại từ đầu.`,
  terms: [
    ["manifest", "bản kê trạng thái đã xuất, coordinator đọc khi resume"],
    ["state export", "xuất trạng thái có cấu trúc ra vị trí đã biết"],
    ["crash recovery", "phục hồi sau khi tiến trình chết giữa đường"],

{ id: "cca2-055", n: 55, set: 2, scenario: 1, domain: 5, task: "5.1",
  topic: "Tool Output Trimming", difficulty: "medium", type: "mc", ans: [3],
  q: `Your support agent handles conversations covering several issues at once. Each lookup_order call returns 40+ fields — carrier scan events, warehouse codes, tax breakdowns — but only about five matter for a return decision: order ID, purchase date, item status, amount paid, and return-window state. After six or seven lookups the context is dominated by order payloads, and the agent starts losing track of issues raised earlier in the same conversation. What is the most effective fix?`,
  opts: [
    `Summarize the whole conversation, order payloads included, once context passes a threshold so everything older becomes compact.`,
    `Write each full order payload to a scratchpad file and have the agent re-read the file whenever it needs an order detail.`,
    `Ask the customer to restate the order details for each issue so the agent does not have to keep them in context.`,
    `Trim each lookup_order result to the return-relevant fields before it enters context, and keep those extracted values in a persistent case-facts block.`,
  ],
  q_vi: `Support agent của bạn xử lý các hội thoại bao gồm nhiều vấn đề cùng lúc. Mỗi lệnh gọi lookup_order trả về hơn 40 trường — sự kiện quét của đơn vị vận chuyển, mã kho, bảng phân tách thuế — nhưng chỉ khoảng năm trường thực sự quan trọng cho quyết định đổi trả: mã đơn hàng, ngày mua, trạng thái mặt hàng, số tiền đã thanh toán, và trạng thái thời hạn đổi trả. Sau sáu hay bảy lượt tra cứu, ngữ cảnh bị chi phối bởi các order payload, và agent bắt đầu mất dấu những vấn đề đã nêu ra trước đó trong cùng hội thoại. Cách sửa hiệu quả nhất là gì?`,
  opts_vi: [
    `Tóm tắt toàn bộ hội thoại, bao gồm cả các order payload, mỗi khi ngữ cảnh vượt một ngưỡng, để mọi thứ cũ hơn trở nên gọn lại.`,
    `Ghi từng order payload đầy đủ ra một file scratchpad và để agent đọc lại file đó mỗi khi cần một chi tiết đơn hàng.`,
    `Yêu cầu khách hàng nhắc lại chi tiết đơn hàng cho từng vấn đề để agent không phải giữ chúng trong ngữ cảnh.`,
    `Tỉa mỗi kết quả lookup_order xuống các trường liên quan đến đổi trả trước khi nó vào ngữ cảnh, và giữ các giá trị đã trích xuất đó trong một khối case facts bền.`,
  ],
  why: [
    `Tóm tắt lũy tiến áp lên cả payload sẽ nghiền đúng những thứ không được phép mờ đi: số tiền, ngày mua, mã đơn. Kết quả là agent nói sai con số khách vừa nhắc — nén sai chỗ chứ không phải giảm nhiễu.`,
    `Đẩy payload ra file thì ngữ cảnh gọn hơn, nhưng bạn mua điều đó bằng một lượt đọc file mỗi lần cần một chi tiết, trong một hội thoại đang chạy trực tiếp với khách. Khi chỉ có năm trường thực sự cần, lưu cả payload rồi tra lại là vòng vo không cần thiết.`,
    `Bắt khách nhắc lại dữ liệu mà hệ thống đang giữ là chuyển gánh nặng sang khách và làm hỏng trải nghiệm. Nó cũng không giải quyết gốc: mỗi lần tra cứu mới vẫn bơm 40 trường vào ngữ cảnh.`,
    `Đúng. Tỉa đầu ra tool xuống các trường liên quan ngay trước khi nó vào ngữ cảnh chặn được sự phình token ngay tại nguồn, còn khối case facts giữ các sự kiện giao dịch tồn tại độc lập với phần hội thoại bị tóm tắt. Hai kỹ thuật này bù nhau: một cái giảm rác vào, một cái bảo vệ dữ kiện quan trọng.`,
  ],
  concept: `Tỉa đầu ra tool tại nguồn cộng với khối case facts bền: giảm token do tool sinh ra và bảo vệ các sự kiện giao dịch khỏi bị tóm tắt làm mờ.`,
  takeaway: `Đầu ra tool tiêu tốn token không tỉ lệ với giá trị của nó. Hãy tỉa xuống các trường thực sự cần trước khi nó vào ngữ cảnh, và giữ số liệu giao dịch trong khối case facts nằm ngoài phần bị tóm tắt.`,
  terms: [
    ["case facts block", "khối dữ kiện vụ việc, chèn vào mỗi prompt, không bị tóm tắt"],
    ["tool output trimming", "tỉa đầu ra tool xuống các trường liên quan trước khi vào ngữ cảnh"],
    ["payload", "khối dữ liệu tool trả về"],
    ["transactional facts", "sự kiện giao dịch: số tiền, ngày, mã đơn, trạng thái"],
    ["progressive summarization", "tóm tắt lũy tiến phần hội thoại cũ"],
    ["multi-issue session", "hội thoại chứa nhiều vấn đề song song"],
  ] },

{ id: "cca2-056", n: 56, set: 2, scenario: 1, domain: 5, task: "5.2",
  topic: "Ambiguity Resolution", difficulty: "easy", type: "mc", ans: [0],
  q: `A customer writes "I need to return the jacket I bought last month" from an email address registered to a family plan. get_customer returns three matching customer records, each with recent orders. What should the agent do?`,
  opts: [
    `Ask the customer for one more identifier — an order number, the shipping ZIP code, or the last four digits of the card used — before going further.`,
    `Pick the record whose most recent jacket purchase is closest to last month, since that is the likeliest match, and state the assumption in the reply.`,
    `Call escalate_to_human right away, because resolving which customer is which is outside the agent's scope.`,
    `Call lookup_order for all three records and process the return for whichever order contains a jacket.`,
  ],
  q_vi: `Một khách hàng nhắn: 'Tôi cần trả lại áo khoác tôi đã mua tháng trước' từ một địa chỉ email đăng ký theo gói gia đình. get_customer trả về ba bản ghi khách hàng khớp yêu cầu, mỗi bản ghi đều có các đơn hàng gần đây. Agent nên làm gì?`,
  opts_vi: [
    `Hỏi khách hàng thêm một định danh nữa — mã đơn hàng, mã ZIP nơi giao hàng, hoặc bốn số cuối của thẻ đã dùng — trước khi làm gì tiếp.`,
    `Chọn bản ghi có lần mua áo khoác gần nhất với mốc "tháng trước" nhất, vì đó là khả năng khớp cao nhất, và nêu rõ giả định đó trong câu trả lời.`,
    `Gọi escalate_to_human ngay lập tức, vì việc xác định đúng khách hàng nào nằm ngoài phạm vi của agent.`,
    `Gọi lookup_order cho cả ba bản ghi và xử lý việc đổi trả cho bất kỳ đơn hàng nào có chứa áo khoác.`,
  ],
  why: [
    `Đúng. Khi tool trả về nhiều bản ghi khớp, cách xử lý đúng là hỏi thêm một định danh để thu hẹp, chứ không tự chọn. Câu hỏi rất nhẹ với khách và loại bỏ hoàn toàn rủi ro tác động lên tài khoản của người khác.`,
    `Chọn theo suy đoán "khớp nhất" chính là anti-pattern mà guide nêu tên. Ba người trong một gia đình hoàn toàn có thể mua áo khoác cùng tháng, và ghi chú giả định trong câu trả lời không cứu được việc bạn vừa hoàn tiền vào tài khoản sai.`,
    `Nhiều bản ghi khớp không phải lý do chuyển cho người. Nhập nhằng này giải quyết được bằng một câu hỏi, và escalate ở đây làm hạ tỉ lệ giải quyết ngay lần đầu mà không đổi lại được gì.`,
    `Tra cả ba đơn rồi xử lý cái nào có áo khoác là hành động dựa trên phỏng đoán về danh tính, chỉ đúng tình cờ nếu duy nhất một bản ghi có áo khoác. Nó cũng đọc dữ liệu đơn hàng của những khách chưa được xác định là người đang nhắn.`,
  ],
  concept: `Xử lý nhập nhằng khi tool trả về nhiều bản ghi khớp: hỏi thêm định danh để thu hẹp, thay vì chọn theo suy đoán hay escalate ngay.`,
  takeaway: `Nhiều bản ghi khớp là tín hiệu phải hỏi thêm định danh, không phải tín hiệu để tự chọn hay để chuyển cho người. Hãy dành escalate cho lỗ hổng chính sách, cho yêu cầu gặp người, và cho lúc thật sự không tiến thêm được.`,
  terms: [
    ["multiple matches", "tool trả về nhiều bản ghi cùng khớp yêu cầu"],
    ["additional identifier", "định danh bổ sung: mã đơn, ZIP, bốn số cuối thẻ"],
    ["heuristic selection", "tự chọn theo phỏng đoán khả năng cao nhất"],
    ["escalation trigger", "điều kiện đáng chuyển cho người xử lý"],
    ["first-contact resolution", "giải quyết ngay trong lần liên hệ đầu"],
  ] },

{ id: "cca2-057", n: 57, set: 2, scenario: 3, domain: 5, task: "5.3",
  topic: "Partial Result Reporting", difficulty: "medium", type: "mc", ans: [1],
  q: `The document analysis subagent processes a 200-page industry PDF in which 60 pages in the middle fail to parse. It returns the findings it did extract with status "success" and nothing else. The synthesis agent treats that as a full reading of the document, and the final report presents the document as completely reviewed. Where should the fix go, and what should it be?`,
  opts: [
    `In the synthesis agent: instruct it to assume every incoming finding may be incomplete and to hedge its conclusions accordingly.`,
    `In the document analysis subagent: return a partial-success result stating which pages parsed, which failed and why, alongside the extracted findings, so the coordinator can decide whether to retry or annotate the gap.`,
    `In the coordinator: re-run the document analysis subagent from scratch whenever a subagent reports anything other than an explicit failure.`,
    `In the document analysis subagent: raise an exception on the first unparseable page so a partial reading can never be mistaken for a complete one.`,
  ],
  q_vi: `Subagent phân tích tài liệu xử lý một file PDF ngành 200 trang, trong đó 60 trang ở giữa không parse được. Nó trả về những phát hiện mà nó trích xuất được kèm trạng thái "success" và không có gì khác. Synthesis agent coi đó là đã đọc trọn vẹn tài liệu, và báo cáo cuối cùng trình bày tài liệu như thể đã được rà soát hoàn toàn. Chỗ cần sửa nằm ở đâu, và nên sửa như thế nào?`,
  opts_vi: [
    `Ở synthesis agent: chỉ thị nó giả định mọi phát hiện nhận vào có thể không đầy đủ và rào trước các kết luận của mình cho phù hợp.`,
    `Ở subagent phân tích tài liệu: trả về một kết quả thành công một phần, nêu rõ những trang nào parse được, những trang nào thất bại và vì sao, cùng với các phát hiện đã trích xuất, để coordinator có thể quyết định thử lại hay ghi chú lỗ hổng.`,
    `Ở coordinator: chạy lại từ đầu subagent phân tích tài liệu bất cứ khi nào một subagent báo cáo bất kỳ điều gì khác một thất bại rõ ràng.`,
    `Ở subagent phân tích tài liệu: ném ngoại lệ ngay tại trang không parse được đầu tiên để một kết quả đọc một phần không bao giờ bị nhầm là đã đọc trọn vẹn.`,
  ],
  why: [
    `Bắt synthesis rào trước mọi kết luận là dán một lớp bất định lên toàn bộ báo cáo, kể cả những phát hiện thực sự có nguồn đầy đủ. Nó cũng không khôi phục được thông tin đang thiếu: synthesis vẫn không biết chỗ nào thiếu và thiếu bao nhiêu.`,
    `Đúng. Lỗi nằm ở chỗ subagent gọi kết quả một phần là "success", nên mọi tầng phía sau tin rằng tài liệu đã được đọc hết. Trả về trạng thái một phần kèm phạm vi đọc được, phần thất bại và lý do vừa giữ được 140 trang có ích, vừa cho coordinator đủ dữ kiện để chọn giữa thử lại bằng cách khác hay ghi nhận lỗ hổng bao phủ.`,
    `Chạy lại từ đầu mỗi khi trạng thái không phải lỗi rõ ràng vừa tốn kém vừa không cứu được ca này: subagent báo "success", nên điều kiện đó không hề kích hoạt. Vấn đề là chất lượng thông tin trong báo cáo trạng thái, không phải số lần thử.`,
    `Ném ngoại lệ ở trang lỗi đầu tiên đúng ở chỗ không còn giả thành công, nhưng đổi lấy việc bỏ đi 140 trang đã đọc được. Kiểu tất-cả-hoặc-không-gì này biến một lỗi cục bộ thành mất trắng cả tài liệu.`,
  ],
  concept: `Báo cáo kết quả một phần trung thực: phân biệt thành công toàn phần, thành công một phần kèm phạm vi, và thất bại — để cấp điều phối quyết định thử lại hay ghi nhận lỗ hổng.`,
  takeaway: `Gắn nhãn "success" cho kết quả một phần là làm giả thành công ở mức âm thầm nhất, vì mọi tầng sau đều tin là đã đủ. Hãy trả về phạm vi đọc được, phần thất bại và lý do, đồng thời giữ lại phần đã làm được.`,
  terms: [
    ["partial success", "thành công một phần, kèm phạm vi đã làm được"],
    ["coverage gap", "lỗ hổng bao phủ trong dữ liệu đã đọc"],
    ["silent success", "báo thành công dù kết quả thiếu — che lỗi khỏi cấp trên"],
    ["all-or-nothing", "tất cả hoặc không gì: một lỗi cục bộ làm mất cả phần đã có"],
    ["retry decision", "quyết định thử lại, thuộc về coordinator chứ không phải subagent"],
  ] },

{ id: "cca2-058", n: 58, set: 2, scenario: 6, domain: 5, task: "5.5",
  topic: "Sampling for Drift", difficulty: "medium", type: "mc", ans: [2],
  q: `You have automated the high-confidence tier of your extraction pipeline: anything above the confidence threshold now goes straight to the backend with no human review, and reviewers only see low-confidence and flagged items. Six months later, vendors are periodically redesigning their invoice layouts, and you need to know whether new error patterns are appearing inside the auto-approved tier. What is the most effective ongoing check?`,
  opts: [
    `Track the share of extractions that land above the threshold over time and investigate whenever that share drops.`,
    `Re-extract every auto-approved document a second time and flag any case where the two runs disagree.`,
    `Review a rolling random sample of auto-approved extractions, stratified by document type and vendor, and measure the error rate within each stratum.`,
    `Rely on downstream corrections: whenever the backend team fixes a wrong value, log it as a labeled error and recompute accuracy from those logs.`,
  ],
  q_vi: `Bạn đã tự động hoá tầng tự tin cao của pipeline trích xuất: bất cứ gì vượt ngưỡng tự tin giờ đi thẳng tới backend mà không qua người kiểm, và người kiểm chỉ thấy các mục tự tin thấp và các mục bị gắn cờ. Sáu tháng sau, các vendor định kỳ thiết kế lại layout hoá đơn của họ, và bạn cần biết liệu có mẫu hình lỗi mới nào đang xuất hiện bên trong tầng đã tự động hay không. Cách kiểm tra liên tục hiệu quả nhất là gì?`,
  opts_vi: [
    `Theo dõi tỉ lệ các lượt trích xuất vượt ngưỡng theo thời gian và điều tra bất cứ khi nào tỉ lệ đó giảm.`,
    `Trích xuất lại mỗi tài liệu đã tự động duyệt một lần nữa và gắn cờ bất kỳ trường hợp nào hai lượt chạy không khớp nhau.`,
    `Rà soát một mẫu ngẫu nhiên liên tục gồm các lượt trích xuất đã tự động duyệt, phân tầng theo loại tài liệu và theo vendor, rồi đo tỉ lệ lỗi trong từng tầng.`,
    `Dựa vào các sửa lỗi ở khâu sau: mỗi khi đội backend sửa một giá trị sai, ghi nó lại thành một lỗi có nhãn và tính lại độ chính xác từ các log đó.`,
  ],
  why: [
    `Tỉ lệ vượt ngưỡng là chỉ số thông lượng, không phải chỉ số độ chính xác. Một layout mới hoàn toàn có thể khiến model trích sai mà vẫn tự tin, nên tỉ lệ vượt ngưỡng giữ nguyên trong khi lỗi tăng — bạn theo dõi đúng cái không báo động.`,
    `Trích hai lần rồi so sánh bắt được sự bất ổn định, nhưng lỗi hệ thống do layout mới thường lặp lại giống nhau ở cả hai lượt, nên hai lượt sẽ đồng thuận và cùng sai. Nó cũng nhân đôi chi phí toàn bộ tầng tự động.`,
    `Đúng. Lấy mẫu ngẫu nhiên phân tầng theo loại tài liệu và theo nhà cung cấp là cách đo được tỉ lệ lỗi thật trong chính tầng đã tự động, và là cách phát hiện mẫu hình lỗi mới. Phân tầng quan trọng vì con số gộp có thể đẹp trong khi một nhà cung cấp vừa đổi layout thì tệ hẳn.`,
    `Chỉ đếm lỗi được người khác phát hiện là mẫu lệch: bạn chỉ thấy những sai sót đủ lộ để phía sau nhận ra, còn sai lặng lẽ thì không bao giờ vào thống kê. Độ chính xác tính từ tập lệch đó nghe cao hơn thực tế.`,
  ],
  concept: `Lấy mẫu ngẫu nhiên phân tầng trên tầng trích xuất tự tin cao: đo tỉ lệ lỗi liên tục và phát hiện mẫu hình lỗi mới theo từng loại tài liệu, thay vì tin vào chỉ số gộp hay lỗi được báo lên.`,
  takeaway: `Tầng đã tự động vẫn phải được đo, và phải đo bằng mẫu ngẫu nhiên phân tầng theo loại tài liệu. Chỉ số gộp và lỗi do phía sau phát hiện đều che mất chỗ vừa xuống cấp.`,
  terms: [
    ["stratified random sampling", "lấy mẫu ngẫu nhiên phân tầng theo nhóm cần so sánh"],
    ["stratum", "một tầng mẫu, ví dụ một loại tài liệu hoặc một nhà cung cấp"],
    ["confidence threshold", "ngưỡng tự tin để bỏ qua bước người kiểm"],
    ["novel error pattern", "mẫu hình lỗi mới xuất hiện khi dữ liệu đầu vào đổi"],
    ["biased sample", "mẫu lệch, chỉ chứa những ca đã bị ai đó phát hiện"],
  ] },

{ id: "cca2-059", n: 59, set: 2, scenario: 3, domain: 5, task: "5.6",
  topic: "Claim-Source Mapping", difficulty: "medium", type: "mc", ans: [0],
