/* ═══════════ trạng thái ═══════════ */
const LS = "cca-console-v1";
const LETTERS = ["A","B","C","D","E"];
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };

const DEF_CFG = { set:"all", mode:"practice", scope:"all", dom:"all", diff:"all", shuffle:true, shufopt:true };
let cfg = { ...DEF_CFG };
let hist = [];      // [{t, pct, c, n, label}]
let state = null;   // {list:[{id,perm}], idx, answers:{id:[origIdx]}, flags:[], checked:[]}
let notes = {};     // {qid: "ghi chú"} — theo id câu, sống độc lập với từng lượt luyện

function save(){
  try {
    localStorage.setItem(LS, JSON.stringify({
      cfg, hist, notes,
      live: state ? {
        list: state.list, idx: state.idx, answers: state.answers,
        flags: [...state.flags], checked: [...state.checked], mode: cfg.mode,
      } : null,
    }));
  } catch(e){ /* chế độ riêng tư chặn localStorage — app vẫn chạy, chỉ không lưu */ }
}
function load(){
  try {
    const raw = localStorage.getItem(LS);
    if(!raw) return null;
    const o = JSON.parse(raw);
    if(o.cfg) cfg = { ...DEF_CFG, ...o.cfg };
    if(Array.isArray(o.hist)) hist = o.hist;
    if(o.notes && typeof o.notes === "object") notes = o.notes;
    return o.live || null;
  } catch(e){ return null; }
}

const SETS = [...new Set(BANK.map(q => q.set))].sort((a,b) => a-b);
const byId = new Map(BANK.map(q => [q.id, q]));

/* ═══════════ tiện ích ═══════════ */
function shuffleArr(a){
  a = [...a];
  for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
const sameSet = (a,b) => a.length === b.length && [...a].sort((x,y)=>x-y).every((v,i) => v === [...b].sort((x,y)=>x-y)[i]);
const pctOf = (c,t) => t ? Math.round(c/t*100) : 0;
const scLabel = s => `S${s} · ${SCENARIOS[s] ? SCENARIOS[s].vi : "?"}`;

/* ═══════════ trang chủ ═══════════ */
$("sub").textContent = `${EXAM.name} — ${BANK.length} câu trong ${SETS.length} bộ đề, dịch đề + giải thích tiếng Việt`;

function chipRow(rowId, key, items){
  const row = $(rowId);
  row.innerHTML = items.map(it =>
    `<button class="chip${String(cfg[key]) === String(it.v) ? " on" : ""}" data-v="${esc(it.v)}">${esc(it.t)}</button>`).join("");
  row.onclick = e => {
    const b = e.target.closest(".chip"); if(!b) return;
    [...row.children].forEach(c => c.classList.remove("on"));
    b.classList.add("on");
    cfg[key] = b.dataset.v;
    if(key === "scope" || key === "set") renderBrief();
    updateCount(); save();
  };
}
function buildRows(){
  chipRow("set-row","set",[{v:"all",t:`Tất cả (${BANK.length})`},
    ...SETS.map(s => ({ v:String(s), t:`Bộ ${s} (${BANK.filter(q=>q.set===s).length})` }))]);
  chipRow("mode-row","mode",[{v:"practice",t:"Luyện tập (phản hồi ngay)"},{v:"exam",t:"Thi thử (chấm cuối bài)"}]);
  chipRow("scope-row","scope",[{v:"all",t:"Tất cả scenario"},
    ...Object.keys(SCENARIOS).map(s => ({ v:s, t:`S${s} · ${SCENARIOS[s].vi}` }))]);
  chipRow("dom-row","dom",[{v:"all",t:"Mọi domain"},
    ...Object.keys(DOMAINS).map(d => ({ v:d, t:`D${d} · ${DOMAINS[d].vi} (${DOMAINS[d].w}%)` }))]);
  chipRow("diff-row","diff",[{v:"all",t:"Mọi mức"},{v:"easy",t:"Dễ"},{v:"medium",t:"Trung bình"},{v:"hard",t:"Khó"}]);
}

function tog(togId, swId, key, note){
  $(swId).classList.toggle("on", !!cfg[key]);
  $(togId).onclick = () => { cfg[key] = !cfg[key]; $(swId).classList.toggle("on", cfg[key]); if(note) note(); save(); };
}

function filtered(){
  return BANK.filter(q => {
    if(cfg.set !== "all" && String(q.set) !== String(cfg.set)) return false;
    if(cfg.scope !== "all" && String(q.scenario) !== String(cfg.scope)) return false;
    if(cfg.dom !== "all" && String(q.domain) !== String(cfg.dom)) return false;
    if(cfg.diff !== "all" && q.difficulty !== cfg.diff) return false;
    return true;
  });
}
function updateCount(){
  const n = filtered().length;
  $("count-note").textContent = `${n} câu khớp lựa chọn của bạn.`;
  $("start-btn").disabled = n === 0;
}
function shufoptNote(){
  $("shufopt-note").textContent = cfg.shufopt
    ? "Đang bật. Bộ 1 có 77% đáp án nằm ở vị trí A — tắt cái này là bạn luyện phản xạ bấm A, không phải luyện kiến thức."
    : "⚠ Đang tắt. Bộ 1 có 77% đáp án đúng ở vị trí A. Bạn sẽ đạt ~77% mà không cần đọc đề.";
}

/* ═══════════ blueprint ═══════════ */
function renderBlueprint(){
  $("facts").innerHTML = [
    ["Mã đề", EXAM.code], ["Số câu", EXAM.items], ["Thời gian", EXAM.minutes + " phút"],
    ["Điểm đậu", `${EXAM.passScaled} / ${EXAM.scaleMax}`], ["Cấu trúc", EXAM.structure],
    ["Hiệu lực", EXAM.validity],
  ].map(([k,v]) => `<div class="fact"><div class="fk">${esc(k)}</div><div class="fv">${esc(v)}</div></div>`).join("");

  const pool = BANK.filter(q => cfg.set === "all" || String(q.set) === String(cfg.set));
  const tot = pool.length || 1;
  $("bp-domains").innerHTML = Object.keys(DOMAINS).map(d => {
    const n = pool.filter(q => String(q.domain) === d).length;
    const have = n/tot*100, want = DOMAINS[d].w;
    const off = Math.abs(have-want) >= 5;
    return `<div class="bp-row">
      <span class="nm">D${d} · ${esc(DOMAINS[d].vi)}</span>
      <span class="bar"><i style="width:${Math.min(100,have)}%"></i><u style="left:${want}%"></u></span>
      <span class="vv"${off?' style="color:var(--warn)"':''}>${n} câu · ${Math.round(have)}%</span>
    </div>`;
  }).join("");

  const gaps = Object.keys(DOMAINS).map(d => {
    const n = pool.filter(q => String(q.domain) === d).length;
    return { d, diff: Math.round(n/tot*100) - DOMAINS[d].w };
  }).filter(g => Math.abs(g.diff) >= 5);
  $("bp-legend").innerHTML = gaps.length
    ? "Lệch ≥5 điểm phần trăm so với đề thật: " + gaps.map(g =>
        `<b>D${g.d} ${g.diff > 0 ? "thừa +" + g.diff : "thiếu " + g.diff}</b>`).join(", ") +
      ". Điểm luyện tập ở bộ này không suy ra được điểm thi."
    : "Phân bố khớp trọng số đề thật (lệch dưới 5 điểm phần trăm ở mọi domain).";

  $("oos").innerHTML = OUT_OF_SCOPE.map(t => `<span>${esc(t)}</span>`).join("");
}

function renderHist(){
  renderNotesCard();
  const c = $("hist-card");
  if(!hist.length){ c.classList.add("hidden"); return; }
  c.classList.remove("hidden");
  c.innerHTML = `<h2>📈 <span class="em">Lần làm</span> trước</h2><div class="hist">` +
    hist.slice(-12).reverse().map(h => {
      const col = h.pct >= 75 ? "var(--ok)" : h.pct >= 60 ? "var(--warn)" : "var(--bad)";
      return `<div class="hist-row"><span class="hp" style="color:${col}">${h.pct}%</span>` +
        `<span class="hd">${esc(h.label)}</span><span class="hn">${h.c}/${h.n} · ${esc(h.t)}</span></div>`;
    }).join("") + `</div>`;
}

/* ═══════════ ghi chú: gom & xuất ═══════════ */
function noteEntries(){
  return Object.keys(notes).filter(id => (notes[id] || "").trim())
    .map(id => ({ id, q: byId.get(id), text: notes[id] }))
    .sort((a, b) => (a.q && b.q) ? ((a.q.set - b.q.set) || (a.q.n - b.q.n)) : (a.q ? -1 : b.q ? 1 : 0));
}
function renderNotesCard(){
  const c = $("notes-card");
  const es = noteEntries();
  if(!es.length){ c.classList.add("hidden"); return; }
  c.classList.remove("hidden");
  c.innerHTML = `<h2>📝 <span class="em">Ghi chú</span> của tôi</h2>` +
    `<div class="count-note">Bạn đã ghi chú ở <b>${es.length}</b> câu. Xuất ra để lưu lại hoặc chuyển sang máy khác.</div>` +
    `<div style="margin-top:14px"><button class="act-btn" id="notes-export">📤 Xuất ghi chú</button></div>`;
  $("notes-export").onclick = exportNotes;
}
function buildNotesText(){
  const es = noteEntries();
  const stamp = new Date().toISOString().slice(0,16).replace("T"," ");
  let out = `GHI CHÚ LUYỆN ĐỀ — ${EXAM.name}\n`;
  out += `Xuất lúc: ${stamp} · ${es.length} câu có ghi chú\n`;
  out += "=".repeat(52) + "\n\n";
  for(const e of es){
    const q = e.q;
    if(q){
      out += `● Câu ${q.n} · Bộ ${q.set} · D${q.domain} · S${q.scenario}   [${e.id}]\n`;
      out += `Đề: ${q.q}\n`;
      if(q.q_vi) out += `Dịch: ${q.q_vi}\n`;
    } else {
      out += `● [${e.id}]  (câu này không còn trong ngân hàng hiện tại)\n`;
    }
    out += `📝 Ghi chú: ${e.text}\n\n`;
    out += "-".repeat(44) + "\n\n";
  }
  out += `<!-- cca-notes-json: ${JSON.stringify(notes)} -->\n`;
  return out;
}
function exportNotes(){
  const es = noteEntries();
  if(!es.length) return;
  const text = buildNotesText();
  const filename = `ghi-chu-cca-f-${new Date().toISOString().slice(0,10)}.txt`;

  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">
    <div class="modal-h">📤 Xuất ${es.length} ghi chú</div>
    <div class="modal-sub">Trên <b>iPhone</b>: bấm <b>Chia sẻ</b> → lưu vào Ghi chú/Files hoặc AirDrop sang máy khác. Trên <b>máy tính</b>: bấm <b>Tải file</b>. Hoặc <b>Sao chép</b> rồi dán đi đâu tuỳ ý.</div>
    <div class="modal-acts">
      <button class="act-btn" id="m-share">📱 Chia sẻ</button>
      <button class="act-btn" id="m-copy">📋 Sao chép</button>
      <button class="act-btn" id="m-dl">💾 Tải file</button>
      <button id="m-close" style="margin-left:auto;color:var(--faint);text-decoration:underline">Đóng</button>
    </div>
    <textarea class="modal-ta" readonly></textarea>
  </div>`;
  document.body.appendChild(bg);
  const ta = bg.querySelector(".modal-ta"); ta.value = text;
  const close = () => bg.remove();
  bg.addEventListener("mousedown", e => { if(e.target === bg) close(); });
  $("m-close").onclick = close;

  const shareBtn = $("m-share");
  if(navigator.share){
    shareBtn.onclick = async () => {
      try {
        const file = new File([text], filename, { type: "text/plain" });
        if(navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: filename });
        else await navigator.share({ title: filename, text });
      } catch(e){ /* user huỷ */ }
    };
  } else shareBtn.style.display = "none";

  $("m-copy").onclick = async () => {
    const btn = $("m-copy"), old = btn.textContent;
    try { await navigator.clipboard.writeText(text); }
    catch(e){ ta.focus(); ta.select(); try { document.execCommand("copy"); } catch(_){} }
    btn.textContent = "✓ Đã sao chép"; setTimeout(() => btn.textContent = old, 1600);
  };
  $("m-dl").onclick = () => {
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  };
}

function renderResume(live){
  const slot = $("resume-slot");
  if(!live || !live.list || !live.list.length){ slot.innerHTML = ""; return; }
  const done = Object.keys(live.answers || {}).length;
  slot.innerHTML = `<div class="resume">
    <span class="rt">Còn một bài đang làm giữa dở: <b>câu ${live.idx+1}/${live.list.length}</b>, đã trả lời ${done} câu.</span>
    <button class="go" id="rs-go">Tiếp tục</button>
    <button id="rs-drop">Bỏ</button></div>`;
  $("rs-go").onclick = () => {
    cfg.mode = live.mode || cfg.mode;
    state = { list: live.list, idx: live.idx, answers: live.answers,
              flags: new Set(live.flags || []), checked: new Set(live.checked || []) };
    show("quiz"); render();
  };
  $("rs-drop").onclick = () => { slot.innerHTML = ""; state = null; save(); };
}

/* ═══════════ scenario brief ═══════════ */
function briefHtml(s){
  const sc = SCENARIOS[s]; if(!sc) return "";
  return `<div class="brief"><button class="brief-h" data-b="1">
      <span>📄 Ngữ cảnh S${s} — ${esc(sc.name)}</span><span class="arr">▶</span></button>
    <div class="brief-b"><b>${esc(sc.vi)}.</b> ${esc(sc.brief)}<br><br>
      Domain chính: ${sc.domains.map(d => "D" + d + " " + esc(DOMAINS[d].vi)).join(" · ")}</div></div>`;
}
function wireBrief(root){
  root.querySelectorAll(".brief-h").forEach(h => {
    h.onclick = () => {
      const b = h.nextElementSibling;
      h.classList.toggle("open", b.classList.toggle("open"));
    };
  });
}
function renderBrief(){
  const slot = $("home-foot");
  slot.innerHTML = cfg.scope !== "all"
    ? `Tiến độ được lưu trong trình duyệt này. Nguồn blueprint: Exam Guide ${esc(EXAM.guideVersion)}.`
    : `Tiến độ được lưu trong trình duyệt này. Nguồn blueprint: Exam Guide ${esc(EXAM.guideVersion)}.`;
  renderBlueprint();
}

/* ═══════════ bắt đầu ═══════════ */
function makeView(q){
  const idx = q.opts.map((_,i) => i);
  return { id: q.id, perm: cfg.shufopt ? shuffleArr(idx) : idx };
}
function start(){
  let list = filtered();
  if(!list.length) return;
  list = cfg.shuffle ? shuffleArr(list) : [...list].sort((a,b) => a.set - b.set || a.n - b.n);
  state = { list: list.map(makeView), idx:0, answers:{}, flags:new Set(), checked:new Set() };
  show("quiz"); render(); save();
}
function show(which){
  ["home","quiz","results"].forEach(id => $(id).classList.toggle("hidden", id !== which));
  window.scrollTo(0,0);
}
const curView = () => state.list[state.idx];
const curQ = () => byId.get(curView().id);

/* ═══════════ render câu hỏi ═══════════ */
function render(){
  const v = curView(), q = curQ(), total = state.list.length;
  $("pbar").style.width = ((state.idx+1)/total*100) + "%";
  $("qcount").textContent = `Câu ${state.idx+1}/${total}`;
  $("flagbtn").classList.toggle("on", state.flags.has(q.id));

  $("brief-slot").innerHTML = briefHtml(q.scenario);
  wireBrief($("brief-slot"));

  $("badges").innerHTML =
    `<span class="badge sc">${esc(scLabel(q.scenario))}</span>` +
    `<span class="badge dm">D${q.domain}${q.task ? " · " + esc(q.task) : ""}</span>` +
    `<span class="badge tp">${esc(q.topic)}</span>` +
    `<span class="badge df ${q.difficulty}">${esc(DIFF_VI[q.difficulty] || q.difficulty)}</span>` +
    (q.type === "mr" ? `<span class="badge mr">Chọn ${q.ans.length}</span>` : "");

  // số phương án thay đổi theo câu (mr có 5), nên dòng phím tắt phải theo câu
  $("keys").innerHTML =
    `<kbd>1</kbd>–<kbd>${v.perm.length}</kbd> chọn · <kbd>Enter</kbd> ${q.type === "mr" ? "kiểm tra" : "kiểm tra / tiếp"}` +
    ` · <kbd>←</kbd><kbd>→</kbd> chuyển câu · <kbd>F</kbd> đánh dấu`;

  $("qtext").textContent = q.q;
  const hint = $("pickhint");
  hint.classList.toggle("hidden", q.type !== "mr");
  if(q.type === "mr") hint.textContent = `⚑ Câu nhiều đáp án — chọn đúng ${q.ans.length} phương án.`;

  const isChecked = state.checked.has(q.id);
  const picked = state.answers[q.id] || [];
  const ch = $("choices"); ch.innerHTML = "";

  v.perm.forEach((orig, disp) => {
    const b = document.createElement("button");
    b.className = "choice" + (q.type === "mr" ? " mr" : "");
    let mark = "";
    if(picked.includes(orig)) b.classList.add("sel");
    if(isChecked){
      b.classList.add("locked");
      if(q.ans.includes(orig)){ b.classList.add("correct"); mark = "✓"; }
      else if(picked.includes(orig)){ b.classList.add("wrong"); mark = "✗"; }
    }
    b.innerHTML = `<span class="key">${LETTERS[disp]}</span><span class="ctext">${esc(q.opts[orig])}</span>` +
      (mark ? `<span class="mark">${mark}</span>` : "");
    if(!isChecked) b.onclick = () => pick(orig);
    ch.appendChild(b);
  });

  if(isChecked) renderExpl(q, v, picked); else $("expl").innerHTML = "";

  const ni = $("noteinput"); if(ni) ni.value = notes[q.id] || "";
  const ns = $("note-saved"); if(ns) ns.classList.remove("show");

  $("prev").disabled = state.idx === 0;
  const last = state.idx === total-1, practice = cfg.mode === "practice";
  const check = $("check"), next = $("next");
  if(practice && !isChecked){
    check.classList.remove("hidden");
    check.disabled = !picked.length;
    next.classList.add("hidden");
  } else {
    check.classList.add("hidden");
    next.classList.remove("hidden");
    next.textContent = last ? "Xem kết quả →" : "Tiếp →";
  }
}

function pick(orig){
  const q = curQ();
  const cur = state.answers[q.id] || [];
  if(q.type === "mr"){
    state.answers[q.id] = cur.includes(orig) ? cur.filter(x => x !== orig) : [...cur, orig];
  } else {
    state.answers[q.id] = [orig];
  }
  render(); save();
}

function anaRows(q, v, picked){
  return v.perm.map((orig, disp) => {
    const good = q.ans.includes(orig);
    return `<div class="ana-row ${good ? "t" : "f"}"><span class="ak">${LETTERS[disp]}</span>` +
      `<span class="av">${esc(q.why[orig])}</span><span class="mk">${good ? "✓" : "✗"}</span></div>`;
  }).join("");
}
function transHtml(q, v){
  if(!q.q_vi) return "";
  let h = `<div class="sec-h">🌐 Dịch đề &amp; phương án</div><div class="trans-q">${esc(q.q_vi)}</div>`;
  if(Array.isArray(q.opts_vi) && q.opts_vi.length){
    h += `<div class="ana">` + v.perm.map((orig, disp) => {
      const good = q.ans.includes(orig);
      return `<div class="ana-row${good ? " t" : ""}"><span class="ak">${LETTERS[disp]}</span>` +
        `<span class="av">${esc(q.opts_vi[orig])}</span>` + (good ? `<span class="mk">✓</span>` : "") + `</div>`;
    }).join("") + `</div>`;
  }
  return h;
}
function termsHtml(q){
  if(!q.terms || !q.terms.length) return "";
  return `<div class="sec-h">📖 Thuật ngữ Anh–Việt</div><div class="terms">` +
    q.terms.map(t => `<div class="term"><b>${esc(t[0])}</b> — ${esc(t[1])}</div>`).join("") + `</div>`;
}
function renderExpl(q, v, picked){
  const ok = sameSet(picked, q.ans);
  const keys = v.perm.map((orig,disp) => q.ans.includes(orig) ? LETTERS[disp] : null).filter(Boolean);
  let h = `<div class="expl">`;
  h += `<div class="verdict ${ok ? "ok" : "no"}">${ok ? "✓ Chính xác" : "✗ Chưa đúng"} — Đáp án đúng: ${keys.join(" + ")}</div>`;
  h += transHtml(q, v);
  h += `<div class="sec-h">🎯 Khái niệm trọng tâm</div><div class="concept">${esc(q.concept)}</div>`;
  h += `<div class="sec-h">🔍 Phân tích từng phương án</div><div class="ana">${anaRows(q,v,picked)}</div>`;
  h += `<div class="sec-h">💡 Điểm mấu chốt</div><div class="take"><span class="ti">💡</span><span>${esc(q.takeaway)}</span></div>`;
  h += termsHtml(q);
  if(q.task && TASKS[q.task])
    h += `<div class="sec-h">🎓 Mục trong blueprint</div><div class="taskref"><b>D${q.domain} · Task ${esc(q.task)}</b> — ${esc(TASKS[q.task])}</div>`;
  h += `</div>`;
  $("expl").innerHTML = h;
}

/* ═══════════ điều hướng ═══════════ */
$("check").onclick = () => {
  const q = curQ();
  if(!(state.answers[q.id] || []).length) return;
  state.checked.add(q.id); render(); save();
};
$("next").onclick = () => {
  if(state.idx === state.list.length-1) finish();
  else { state.idx++; render(); save(); }
};
$("prev").onclick = () => { if(state.idx > 0){ state.idx--; render(); save(); } };

let noteTimer = null;
$("noteinput").addEventListener("input", function(){
  if(!state) return;
  const id = curQ().id, val = this.value;
  if(val.trim()) notes[id] = val; else delete notes[id];
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => {
    save();
    const ns = $("note-saved");
    if(ns){ ns.classList.add("show"); setTimeout(() => ns.classList.remove("show"), 1400); }
  }, 400);
});
$("flagbtn").onclick = () => {
  const id = curQ().id;
  if(state.flags.has(id)) state.flags.delete(id); else state.flags.add(id);
  render(); save();
};
$("quit").onclick = finish;
$("start-btn").onclick = start;

document.addEventListener("keydown", e => {
  if($("quiz").classList.contains("hidden") || !state) return;
  if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const q = curQ(), v = curView();
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= v.perm.length && !state.checked.has(q.id)){ pick(v.perm[n-1]); e.preventDefault(); return; }
  if(e.key === "Enter"){
    if(!$("check").classList.contains("hidden") && !$("check").disabled) $("check").click();
    else if(!$("next").classList.contains("hidden")) $("next").click();
    e.preventDefault(); return;
  }
  if(e.key === "ArrowRight" && !$("next").classList.contains("hidden")){ $("next").click(); e.preventDefault(); }
  if(e.key === "ArrowLeft" && !$("prev").disabled){ $("prev").click(); e.preventDefault(); }
  if(e.key === "f" || e.key === "F"){ $("flagbtn").click(); e.preventDefault(); }
});

/* ═══════════ kết quả ═══════════ */
function brkRow(name,c,t){
  return `<div class="brk-row"><span class="nm">${esc(name)}</span>` +
    `<span class="bar"><i style="width:${pctOf(c,t)}%"></i></span>` +
    `<span class="vv">${c}/${t}</span></div>`;
}
function finish(){
  const views = state.list;
  const qs = views.map(v => byId.get(v.id));
  const isOk = q => sameSet(state.answers[q.id] || [], q.ans);
  const answered = qs.filter(q => (state.answers[q.id] || []).length);
  const correct = qs.filter(isOk);
  const pct = pctOf(correct.length, qs.length);

  const group = key => {
    const m = {};
    qs.forEach(q => { const k = q[key]; (m[k] ??= {c:0,t:0}); m[k].t++; if(isOk(q)) m[k].c++; });
    return m;
  };
  const byDom = group("domain"), byScene = group("scenario"), byDiff = group("difficulty");

  let msg, sub;
  if(pct >= 90){ msg = "Xuất sắc 🎉"; sub = "Bạn đang nắm chắc phần lớn nội dung."; }
  else if(pct >= 75){ msg = "Rất tốt 👍"; sub = "Ôn lại các câu sai là ổn."; }
  else if(pct >= 60){ msg = "Khá ổn"; sub = "Còn vài khái niệm cần củng cố."; }
  else { msg = "Cần ôn thêm"; sub = "Đọc kỹ phần giải thích các câu sai bên dưới."; }

  const r = 2*Math.PI*60, off = r*(1-pct/100);
  const ring = pct >= 75 ? "var(--ok)" : pct >= 60 ? "var(--warn)" : "var(--bad)";

  let h = `<div class="card score-hero">
    <div class="score-ring"><svg width="140" height="140">
      <circle cx="70" cy="70" r="60" fill="none" stroke="var(--surface2)" stroke-width="11"/>
      <circle cx="70" cy="70" r="60" fill="none" stroke="${ring}" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="${r}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s ease"/>
    </svg><div class="pct"><b>${pct}%</b><span>${correct.length}/${qs.length} đúng</span></div></div>
    <div class="score-msg">${msg}</div>
    <div class="score-sub">${sub}${answered.length < qs.length ? ` · ${qs.length-answered.length} câu bỏ qua` : ""}</div>
    <div class="caveat"><b>Con số này không phải điểm thi.</b> Đề thật chấm theo thang scaled ${EXAM.scaleMin}–${EXAM.scaleMax}
      với mốc đậu ${EXAM.passScaled}, và ${EXAM.passScaled} scaled <b>không</b> bằng ${Math.round(EXAM.passScaled/EXAM.scaleMax*100)}% số câu đúng —
      thang scaled còn cân theo độ khó của từng đề. Không ai ngoài Pearson quy đổi được. Dùng % ở đây để
      biết mình yếu domain nào, đừng dùng để đoán đậu hay trượt.</div>
  </div>`;

  h += `<div class="card"><div class="brk-h">Theo domain — so với trọng số đề thật</div><div class="brk">`;
  Object.keys(DOMAINS).forEach(d => {
    const o = byDom[d]; if(!o) return;
    h += brkRow(`D${d} · ${DOMAINS[d].vi} (${DOMAINS[d].w}%)`, o.c, o.t);
  });
  h += `</div><div class="brk-h">Theo scenario</div><div class="brk">`;
  Object.keys(byScene).sort((a,b) => a-b).forEach(s => h += brkRow(scLabel(s), byScene[s].c, byScene[s].t));
  h += `</div><div class="brk-h">Theo độ khó</div><div class="brk">`;
  ["easy","medium","hard"].forEach(d => { if(byDiff[d]) h += brkRow(DIFF_VI[d], byDiff[d].c, byDiff[d].t); });
  h += `</div></div>`;

  const wrong = qs.filter(q => (state.answers[q.id]||[]).length && !isOk(q));
  const skipped = qs.filter(q => !(state.answers[q.id]||[]).length);
  const flagged = qs.filter(q => state.flags.has(q.id) && !wrong.includes(q) && !skipped.includes(q));
  const toReview = [...wrong, ...skipped, ...flagged];

  h += toReview.length
    ? `<div class="card"><div class="brk-h">Ôn lại ${toReview.length} câu (sai / bỏ qua / đánh dấu)</div><div class="rev" id="rev"></div></div>`
    : `<div class="card" style="text-align:center;color:var(--ok);font-weight:650">✓ Đúng tất cả các câu.</div>`;

  h += `<div class="res-actions">
    <button class="primary" id="again">Làm lại bộ câu này</button>
    <button class="ghost" id="redowrong"${toReview.length ? "" : " disabled"}>Chỉ luyện ${toReview.length} câu cần ôn</button>
    <button class="ghost" id="gohome">Về trang thiết lập</button></div>`;

  $("results").innerHTML = h; show("results");

  if(toReview.length){
    const rev = $("rev");
    toReview.forEach(q => {
      const v = views.find(x => x.id === q.id);
      const picked = state.answers[q.id] || [];
      const keys = v.perm.map((o,d) => q.ans.includes(o) ? LETTERS[d] : null).filter(Boolean).join("+");
      const mine = picked.length ? picked.map(o => LETTERS[v.perm.indexOf(o)]).sort().join("+") : null;
      const item = document.createElement("div");
      item.className = "rev-item";
      item.innerHTML = `<button class="rev-head">
          <span class="rn no">${mine ? "✗" : "–"}</span>
          <span class="rq">${esc(q.q.slice(0,95))}${q.q.length > 95 ? "…" : ""}</span>
          <span class="rc">${mine ? "Bạn: " + mine : "Bỏ qua"} · Đúng: ${keys}</span>
          <span class="arr">▶</span></button><div class="rev-body"></div>`;
      const head = item.querySelector(".rev-head"), body = item.querySelector(".rev-body");
      head.onclick = () => {
        const open = body.classList.toggle("open");
        head.classList.toggle("open", open);
        if(open && !body.dataset.done){ body.innerHTML = reviewBody(q,v,picked); body.dataset.done = "1"; }
      };
      rev.appendChild(item);
    });
  }

  $("again").onclick = () => {
    state = { list: cfg.shuffle ? shuffleArr(views) : views, idx:0, answers:{}, flags:new Set(), checked:new Set() };
    show("quiz"); render(); save();
  };
  const rw = $("redowrong");
  if(rw && toReview.length) rw.onclick = () => {
    const nl = toReview.map(q => views.find(v => v.id === q.id));
    state = { list: cfg.shuffle ? shuffleArr(nl) : nl, idx:0, answers:{}, flags:new Set(), checked:new Set() };
    show("quiz"); render(); save();
  };
  $("gohome").onclick = () => { state = null; show("home"); renderResume(null); renderHist(); renderBlueprint(); save(); };

  const label = [
    cfg.set === "all" ? "mọi bộ" : "bộ " + cfg.set,
    cfg.scope === "all" ? null : "S" + cfg.scope,
    cfg.dom === "all" ? null : "D" + cfg.dom,
    cfg.diff === "all" ? null : DIFF_VI[cfg.diff],
    cfg.mode === "exam" ? "thi thử" : null,
  ].filter(Boolean).join(" · ");
  hist.push({ t: new Date().toISOString().slice(0,16).replace("T"," "), pct, c: correct.length, n: qs.length, label });
  if(hist.length > 60) hist = hist.slice(-60);
  state = null; save(); renderHist();
}

function reviewBody(q, v, picked){
  let h = `<div class="rev-mini">Đề bài đầy đủ</div><div style="font-size:.92rem;line-height:1.6;margin-bottom:6px">${esc(q.q)}</div>`;
  h += `<div class="rev-mini">Các phương án</div><div class="ana">`;
  v.perm.forEach((orig, disp) => {
    const good = q.ans.includes(orig), mine = picked.includes(orig);
    const cls = good ? "t" : (mine ? "f" : "");
    const mk = good ? "✓" : (mine ? "✗" : "");
    h += `<div class="ana-row ${cls}"><span class="ak">${LETTERS[disp]}</span><span class="av">${esc(q.opts[orig])}</span>` +
      (mk ? `<span class="mk">${mk}</span>` : "") + `</div>`;
  });
  h += `</div>`;
  h += transHtml(q, v).replace(/sec-h/g, "rev-mini");
  h += `<div class="rev-mini">🎯 Khái niệm</div><div class="concept">${esc(q.concept)}</div>`;
  h += `<div class="rev-mini">🔍 Phân tích</div><div class="ana">${anaRows(q,v,picked)}</div>`;
  h += `<div class="rev-mini">💡 Mấu chốt</div><div class="take"><span class="ti">💡</span><span>${esc(q.takeaway)}</span></div>`;
  h += termsHtml(q).replace(/sec-h/g, "rev-mini");
  if(notes[q.id] && notes[q.id].trim())
    h += `<div class="rev-mini">📝 Ghi chú của tôi</div><div class="rev-note">${esc(notes[q.id])}</div>`;
  return h;
}

const live = load();
buildRows();
tog("shuffle-tog","shuffle-sw","shuffle");
