  why: [
    `Chia review thành các pass tập trung theo từng file giải quyết trực tiếp attention dilution, đảm bảo độ sâu nhất quán và bắt được vấn đề cục bộ đáng tin. Một pass riêng cho integration xử lý các mối quan tâm xuyên file như luồng dữ liệu và phụ thuộc giữa các file.`,
    `Bắt developer chia nhỏ PR đẩy gánh nặng sang quy trình phát triển mà không cải thiện cách phân tích của hệ thống review. Đây là lách bằng quy trình chứ không phải giải pháp kỹ thuật; thay đổi logic xuyên file đôi khi vẫn cần review cùng nhau.`,

  concept: `Nguyên nhân gốc là 'pha loãng sự chú ý' (attention dilution) khi xử lý quá nhiều file cùng lúc. Chia review thành các pass tập trung — phân tích từng file, rồi một pass riêng cho integration — giải quyết trực tiếp vấn đề này.`,
  takeaway: `Phân rã tác vụ thành các pass tập trung chống lại attention dilution; context window lớn hơn không cứu được vấn đề chất lượng chú ý ('lost in the middle').`,
  terms: [
    ["single-pass review", "review một lượt toàn bộ file cùng lúc"],
    ["attention dilution", "pha loãng sự chú ý khi đầu vào quá lớn/nhiều"],
    ["lost in the middle", "mô hình bỏ sót thông tin nằm ở giữa ngữ cảnh dài"],
    ["recall", "độ thu hồi, tỷ lệ vấn đề thật được phát hiện"],
    ["integration-focused pass", "lượt review tập trung vào tương tác xuyên file"],
  ] },

{ id: "cca1-049", n: 49, set: 1, scenario: 5, domain: 4, task: "4.5",
  topic: "Batch Processing", difficulty: "easy", type: "mc", ans: [0],
  q: `Your CI/CD system performs three types of Claude-powered analysis: (1) quick style checks on each PR that block merging until complete, (2) comprehensive security audits of the entire codebase run weekly, and (3) test case generation triggered nightly for recently-modified modules. The Message Batches API offers 50% cost savings but can take up to 24 hours to process. You want to optimize API costs while maintaining acceptable developer experience. Which combination correctly matches each task to its API approach?`,
  opts: [
    `Use synchronous calls for PR style checks; use the Message Batches API for weekly security audits and nightly test generation.`,
    `Use the Message Batches API for all three tasks to maximize the 50% cost savings, and configure the pipeline to poll for batch completion.`,
    `Use synchronous calls for PR style checks and nightly test generation; use Message Batches API only for weekly security audits.`,
    `Use synchronous calls for all three tasks for consistent response times, and rely on prompt caching to reduce costs across all workloads.`,
  ],
  q_vi: `Hệ thống CI/CD của bạn thực hiện ba loại phân tích chạy bằng Claude: (1) style check nhanh trên mỗi PR, chặn merge cho đến khi hoàn tất, (2) security audit toàn diện cho toàn bộ codebase chạy hàng tuần, và (3) sinh test case được kích hoạt hàng đêm cho các module vừa sửa đổi. Message Batches API mang lại mức tiết kiệm chi phí 50% nhưng có thể mất tới 24 giờ để xử lý. Bạn muốn tối ưu chi phí API trong khi vẫn giữ trải nghiệm chấp nhận được cho developer. Tổ hợp nào khớp đúng từng tác vụ với cách gọi API phù hợp?`,
  opts_vi: [
    `Dùng lệnh gọi synchronous cho PR style check; dùng Message Batches API cho security audit hàng tuần và sinh test hàng đêm.`,
    `Dùng Message Batches API cho cả ba tác vụ để tối đa hóa mức tiết kiệm 50%, và cấu hình pipeline để poll trạng thái hoàn tất của batch.`,
    `Dùng lệnh gọi synchronous cho PR style check và sinh test hàng đêm; chỉ dùng Message Batches API cho security audit hàng tuần.`,
    `Dùng lệnh gọi synchronous cho cả ba tác vụ để có thời gian phản hồi nhất quán, và dựa vào prompt caching để giảm chi phí trên mọi khối lượng công việc.`,
  ],
  why: [
    `Đúng. PR style check chặn developer và cần phản hồi tức thì qua synchronous, trong khi security audit hàng tuần và test generation hàng đêm là tác vụ theo lịch, timeline linh hoạt, dễ chịu được cửa sổ xử lý tới 24 giờ của batch — nắm trọn 50% tiết kiệm trên cả hai.`,
    `Dùng batch cho cả ba sẽ gây trễ không chấp nhận được cho PR style check vốn chặn merge và cần phản hồi tức thì. Dù tối đa hóa tiết kiệm, thời gian tới 24 giờ khiến nó không phù hợp với workflow nhạy độ trễ và chặn developer.`,
    `Tuy đúng khi dùng synchronous cho PR check, cách này lại bỏ lỡ 50% tiết kiệm trên test generation hàng đêm vốn chạy theo lịch và hoàn toàn chịu được thời gian xử lý batch. Không có lý do trả giá đầy đủ cho tác vụ không cần kết quả tức thì.`,
    `Dùng synchronous cho cả ba bỏ lỡ khoản tiết kiệm 50% đáng kể từ batch cho các khối lượng theo lịch, không nhạy độ trễ. Prompt caching hữu ích nhưng không mang lại mức giảm tương đương và không thay thế được tiết kiệm từ batch.`,
  ],
  concept: `Khớp cách gọi API với yêu cầu độ trễ: tác vụ blocking developer cần phản hồi tức thì (synchronous), còn tác vụ theo lịch (hàng tuần, hàng đêm) chịu được tới 24 giờ xử lý nên dùng batch để tiết kiệm chi phí.`,
  takeaway: `Tác vụ chặn developer → synchronous; tác vụ theo lịch chịu trễ → batch để tiết kiệm 50%; prompt caching không thay thế được tiết kiệm của batch.`,
  terms: [
    ["synchronous call", "gọi đồng bộ, trả kết quả tức thì"],
    ["style check", "kiểm tra phong cách code, ở đây chặn merge"],
    ["security audit", "kiểm toán bảo mật toàn codebase"],
    ["prompt caching", "bộ nhớ đệm prompt, giảm chi phí nhưng không bằng batch"],
    ["latency-sensitive", "nhạy cảm với độ trễ"],
  ] },

{ id: "cca1-050", n: 50, set: 1, scenario: 5, domain: 4, task: "4.5",
  topic: "Batch Processing", difficulty: "hard", type: "mc", ans: [1],
  q: `The code review component works iteratively: Claude analyzes a changed file, then may request related files (imports, base classes, tests) via tool calling to understand context before providing final feedback. Your application defines a tool that lets Claude request file contents; Claude invokes this tool, receives results, and continues its analysis. You're evaluating batch processing to reduce API costs. What is the primary technical constraint when considering batch processing for this workflow?`,
  opts: [
    `The batch API doesn't support tool definitions in request parameters.`,
    `The asynchronous model prevents executing tools mid-request and returning results for Claude to continue analysis.`,
    `Batch processing lacks request correlation identifiers for matching outputs to input requests.`,
    `Batch processing latency of up to 24 hours is too slow for pull request feedback, though the workflow could otherwise function.`,
  ],
  q_vi: `Thành phần code review hoạt động theo kiểu lặp: Claude phân tích một file đã thay đổi, sau đó có thể yêu cầu các file liên quan (import, base class, test) thông qua tool calling để hiểu ngữ cảnh trước khi đưa ra phản hồi cuối cùng. Ứng dụng của bạn định nghĩa một tool cho phép Claude yêu cầu nội dung file; Claude gọi tool này, nhận kết quả, rồi tiếp tục phân tích. Bạn đang đánh giá batch processing để giảm chi phí API. Ràng buộc kỹ thuật chính khi cân nhắc batch processing cho workflow này là gì?`,
  opts_vi: [
    `Batch API không hỗ trợ định nghĩa tool trong tham số request.`,
    `Mô hình bất đồng bộ ngăn việc thực thi tool giữa chừng request và trả kết quả về để Claude tiếp tục phân tích.`,
    `Batch processing thiếu định danh đối chiếu request để khớp đầu ra với đầu vào.`,
    `Độ trễ tới 24 giờ của batch processing quá chậm cho phản hồi pull request, dù nếu không tính điều đó thì workflow vẫn có thể hoạt động bình thường.`,
  ],
  why: [
    `Batch API hỗ trợ đầy đủ định nghĩa tool trong tham số request và có thể sinh phản hồi tool use. Đây không phải ràng buộc của batch processing.`,
    `Đúng. Mô hình bất đồng bộ 'fire-and-forget' của batch nghĩa là không có cơ chế chặn một tool call giữa chừng request, thực thi tool, rồi trả kết quả về cho Claude tiếp tục. Điều này phá vỡ tận gốc workflow tool-calling lặp vốn cần nhiều vòng gọi và phản hồi tool trong cùng một tương tác logic.`,
    `Batch cung cấp trường custom_id cho mỗi request, đóng vai trò định danh đối chiếu để khớp đầu ra với đầu vào. Đây không phải hạn chế của batch API.`,
    `Tuy độ trễ tới 24 giờ là mối lo thực tế, khẳng định 'workflow vẫn có thể hoạt động ngoài ra' là sai. Hạn chế kiến trúc cốt lõi là batch không thể hỗ trợ vòng lặp tool-calling — bất kể kết quả trả về nhanh đến đâu.`,
  ],
  concept: `Batch API hỗ trợ định nghĩa tool và sinh ra tool call, nhưng mô hình bất đồng bộ 'fire-and-forget' của nó không cho phép thực thi tool giữa chừng request rồi trả kết quả về để Claude tiếp tục — điều này phá vỡ workflow tool-calling lặp.`,
  takeaway: `Batch là bất đồng bộ 'fire-and-forget' — không thể thực thi tool giữa chừng, nên không dùng được cho workflow tool-calling lặp, dù có hỗ trợ định nghĩa tool và custom_id.`,
  terms: [
    ["tool calling", "cơ chế Claude gọi công cụ bên ngoài để lấy thêm dữ liệu"],
    ["asynchronous fire-and-forget", "gửi request rồi không tương tác giữa chừng cho đến khi xong"],
    ["iterative workflow", "workflow lặp, cần nhiều vòng gọi tool và phản hồi"],
    ["mid-request", "giữa chừng một request đang xử lý"],
    ["custom_id", "định danh đối chiếu request/kết quả trong batch"],
  ] },

{ id: "cca1-051", n: 51, set: 1, scenario: 5, domain: 3, task: "3.6",
  topic: "Context Provision", difficulty: "easy", type: "mc", ans: [0],
  q: `Your automated review generates test case suggestions for each PR. When reviewing a PR that adds course completion tracking, Claude suggests 10 test cases but developer feedback indicates 6 duplicate scenarios already covered in the existing test suite. What change would most effectively reduce duplicate suggestions?`,
  opts: [
    `Include the existing test file in the context so Claude can identify what scenarios are already covered`,
    `Add instructions directing Claude to focus exclusively on edge cases and error conditions rather than successful paths`,
    `Implement post-processing that filters suggestions whose descriptions match keywords from existing test names`,
    `Reduce requested suggestions from 10 to 5, assuming Claude will prioritize the most valuable cases first`,
  ],
  q_vi: `Review tự động của bạn sinh ra các đề xuất test case cho mỗi PR. Khi review một PR bổ sung tính năng theo dõi hoàn thành khóa học (course completion tracking), Claude đề xuất 10 test case nhưng phản hồi từ developer cho thấy 6 kịch bản trong số đó trùng với những gì đã được phủ trong bộ test hiện có. Thay đổi nào sẽ hiệu quả nhất trong việc giảm các đề xuất trùng lặp?`,
  opts_vi: [
    `Đưa file test hiện có vào ngữ cảnh để Claude có thể xác định những kịch bản nào đã được phủ`,
    `Thêm hướng dẫn yêu cầu Claude chỉ tập trung vào edge case và error condition thay vì các luồng thành công`,
    `Triển khai post-processing để lọc các đề xuất có mô tả khớp từ khóa với tên các test hiện có`,
    `Giảm số lượng đề xuất yêu cầu từ 10 xuống 5, với giả định rằng Claude sẽ ưu tiên các case giá trị nhất trước`,
  ],
  why: [
    `Đưa file test hiện có vào ngữ cảnh giải quyết trực tiếp nguyên nhân gốc của trùng lặp: Claude chỉ tránh đề xuất kịch bản đã được phủ nếu nó biết test nào đang tồn tại. Điều này cho Claude thông tin cần thiết để suy luận đề xuất nào thực sự mới và có giá trị.`,
    `Giới hạn đề xuất chỉ vào edge case và error condition không giải quyết trùng lặp, vì test hiện có có thể đã phủ chính những cái đó. Không biết bộ test hiện tại, Claude vẫn không có cách nào tránh đề xuất kịch bản đã được test.`,
    `Dùng keyword matching để lọc là mong manh, bỏ sót các test tương đương ngữ nghĩa nhưng mô tả bằng từ ngữ khác. Cách post-processing này xử lý triệu chứng thay vì nguyên nhân gốc và không đáng tin trong thực tế.`,
    `Giảm số lượng đề xuất không cung cấp thông tin nào về kịch bản đã phủ, nên Claude không có cơ sở ưu tiên case không trùng. Giả định sai rằng ít đề xuất hơn thì độc đáo hơn — thực tế các đề xuất hiển nhiên nhất lại thường là cái đã có.`,
  ],
  concept: `LLM chỉ suy luận được dựa trên thông tin có trong ngữ cảnh. Không biết test nào đã tồn tại thì Claude không thể tránh đề xuất trùng. Đưa file test hiện có vào ngữ cảnh giải quyết trực tiếp nguyên nhân gốc.`,
  takeaway: `LLM chỉ suy luận trên thông tin trong ngữ cảnh — muốn nó tránh trùng lặp, hãy cung cấp ngữ cảnh về những gì đã tồn tại, đừng lọc bằng keyword hay cắt số lượng.`,
  terms: [
    ["context", "ngữ cảnh, thông tin LLM dựa vào để suy luận"],
    ["existing test suite", "bộ test hiện có"],
    ["edge case", "trường hợp biên"],
    ["keyword matching", "so khớp từ khóa, cách lọc mong manh"],
    ["semantically equivalent", "tương đương về ngữ nghĩa dù từ ngữ khác nhau"],
  ] },

{ id: "cca1-052", n: 52, set: 1, scenario: 5, domain: 3, task: "3.6",
  topic: "CI/CD Integration", difficulty: "medium", type: "mc", ans: [0],
  q: `After an initial automated review generates 12 findings, a developer pushes new commits to address the issues. When the review runs again, it produces 8 findings—but developers report that 5 duplicate earlier comments on code that was already fixed in the new commits. What's the most effective way to eliminate this redundant feedback while maintaining thorough analysis?`,
  opts: [
    `Include prior review findings in context, instructing Claude to only report new or still-unaddressed issues.`,
    `Restrict the review scope to only files modified in the most recent push, excluding files from earlier commits.`,
    `Add a post-processing filter that removes findings matching previous file paths and issue descriptions before posting comments.`,
    `Run reviews only on initial PR creation and final pre-merge state, skipping intermediate commits.`,
  ],
  q_vi: `Sau khi review tự động lần đầu sinh ra 12 finding, developer push các commit mới để xử lý các vấn đề đó. Khi review chạy lại lần nữa, nó sinh ra 8 finding — nhưng developer báo cáo rằng 5 trong số đó trùng với comment trước đó trên đoạn code đã được sửa trong các commit mới. Đâu là cách hiệu quả nhất để loại bỏ phản hồi dư thừa này trong khi vẫn giữ được phân tích kỹ lưỡng?`,
  opts_vi: [
    `Đưa các finding của lần review trước vào ngữ cảnh, hướng dẫn Claude chỉ báo cáo vấn đề mới hoặc vấn đề vẫn chưa được xử lý.`,
    `Giới hạn phạm vi review chỉ vào các file được sửa trong lần push gần nhất, loại trừ file từ các commit trước đó.`,
    `Thêm một bộ lọc post-processing loại bỏ các finding khớp với đường dẫn file và mô tả vấn đề trước đó trước khi đăng comment.`,
    `Chỉ chạy review lúc tạo PR ban đầu và ở trạng thái pre-merge cuối cùng, bỏ qua các commit ở giữa.`,
  ],
  why: [
    `Đưa các finding của lần review trước vào ngữ cảnh cho phép Claude phân biệt thông minh giữa vấn đề mới và vấn đề đã giải quyết bởi các commit gần đây. Cách này giữ được phân tích kỹ lưỡng đồng thời tận dụng khả năng suy luận của Claude để tránh phản hồi dư thừa trên code đã sửa.`,
    `Giới hạn phạm vi chỉ vào file mới sửa hy sinh tính kỹ lưỡng, vì thay đổi ở một file có thể tạo ra hoặc ảnh hưởng vấn đề ở file khác không sửa trực tiếp. Cách này đánh đổi chất lượng phân tích lấy việc khử trùng lặp — không lý tưởng.`,
    `Bộ lọc post-processing dựa trên so khớp đường dẫn và mô tả vấn đề là mong manh, vì comment do LLM sinh ra thay đổi từ ngữ qua mỗi lần chạy. Nó cũng không thể xác định về ngữ nghĩa rằng một vấn đề đã thực sự được giải quyết hay chỉ diễn đạt khác đi.`,
    `Chỉ chạy review lúc tạo PR và pre-merge cuối loại bỏ vòng phản hồi liên tục — yếu tố làm cho review tích hợp CI/CD giá trị. Cách này né tránh vấn đề thay vì giải quyết, và developer mất lợi ích của phản hồi review lặp trong quá trình phát triển.`,
  ],
  concept: `Đưa các finding của lần review trước vào ngữ cảnh giúp Claude suy luận thông minh xem vấn đề nào thực sự mới hay đã được xử lý, thay vì flag lại mù quáng — vừa khử trùng lặp vừa giữ độ phân tích kỹ lưỡng.`,
  takeaway: `Cung cấp finding trước đó làm ngữ cảnh để Claude suy luận cái gì đã sửa — đừng giới hạn phạm vi (mất kỹ lưỡng), lọc theo pattern (mong manh), hay bỏ commit (mất phản hồi liên tục).`,
  terms: [
    ["findings", "các phát hiện/vấn đề được review báo cáo"],
    ["redundant feedback", "phản hồi dư thừa, trùng lặp"],
    ["review scope", "phạm vi review"],
    ["post-processing filter", "bộ lọc hậu xử lý, mong manh khi dựa trên so khớp văn bản"],
    ["continuous feedback loop", "vòng phản hồi liên tục trong CI/CD"],
  ] },

{ id: "cca1-053", n: 53, set: 1, scenario: 5, domain: 4, task: "4.6",
  topic: "Multi-Instance Verification", difficulty: "medium", type: "mc", ans: [0],
  q: `Your team uses Claude Code to generate code suggestions, but you notice a pattern: subtle issues—performance optimizations that break edge cases, cleanups that change behavior unexpectedly—only surface when a different team member reviews the PR. Claude's reasoning during generation shows it considered these cases but concluded its approach was correct. Which approach directly addresses the root cause of this self-review limitation?`,
  opts: [
    `Have a second, independent Claude Code instance review the changes without seeing the generator's reasoning.`,
    `Add explicit self-review instructions to the generation prompt, asking Claude to critique its own suggestions before finalizing output.`,
    `Enable extended thinking mode for the generation pass, allowing more thorough deliberation before producing suggestions.`,
    `Include comprehensive test files and documentation in the prompt context so Claude better understands expected behavior during generation.`,
  ],
  q_vi: `Đội của bạn dùng Claude Code để sinh đề xuất code, nhưng bạn nhận thấy một pattern: các vấn đề tinh vi — tối ưu hiệu năng làm hỏng edge case, dọn dẹp code làm thay đổi hành vi ngoài ý muốn — chỉ lộ ra khi một thành viên khác trong đội review PR. Lập luận của Claude trong lúc sinh code cho thấy nó đã cân nhắc các case này nhưng kết luận rằng cách làm của nó là đúng. Cách tiếp cận nào giải quyết trực tiếp nguyên nhân gốc của hạn chế tự review này?`,
  opts_vi: [
    `Dùng một instance Claude Code thứ hai, độc lập, để review các thay đổi mà không thấy lập luận của bộ sinh.`,
    `Thêm hướng dẫn tự review tường minh vào prompt sinh code, yêu cầu Claude tự phê bình đề xuất của chính mình trước khi chốt đầu ra.`,
    `Bật extended thinking mode cho pass sinh code, cho phép cân nhắc kỹ lưỡng hơn trước khi đưa ra đề xuất.`,
    `Đưa các file test và tài liệu toàn diện vào ngữ cảnh prompt để Claude hiểu rõ hơn hành vi kỳ vọng trong lúc sinh code.`,
  ],
  why: [
    `Dùng instance Claude Code thứ hai, độc lập, không truy cập lập luận của bộ sinh, giải quyết trực tiếp nguyên nhân gốc bằng cách loại bỏ confirmation bias. Góc nhìn tươi mới này phản chiếu lợi ích của peer review giữa người, nơi một thành viên khác bắt được vấn đề mà tác giả gốc đã tự biện minh bỏ qua.`,
    `Yêu cầu Claude tự phê bình trong cùng ngữ cảnh không giải quyết nguyên nhân gốc, vì chính confirmation bias đã khiến nó kết luận cách làm là đúng sẽ tiếp tục tồn tại. Đề bài nêu rõ Claude đã cân nhắc các case này, nên tự phê bình thêm nhiều khả năng đi đến cùng kết luận.`,
    `Bật extended thinking cho thêm thời gian cân nhắc, nhưng đề bài nêu rõ Claude đã cân nhắc các edge case và kết luận cách làm là đúng. Thêm thời gian suy nghĩ không giải quyết được hạn chế cốt lõi của tự review nơi mô hình đã tự hợp lý hóa quyết định.`,
    `Cung cấp thêm ngữ cảnh như test file và tài liệu cải thiện chất lượng đầu vào, nhưng đề bài nêu rõ lập luận của Claude đã cân nhắc các case này mà vẫn kết luận đúng. Vấn đề không phải thiếu thông tin mà là điểm mù của tự review mà thêm ngữ cảnh không sửa được.`,
  ],
  concept: `LLM mắc thiên kiến xác nhận (confirmation bias) khi tự review công việc của chính mình trong cùng một ngữ cảnh. Dùng một instance Claude thứ hai, độc lập, không thấy lập luận của bộ sinh, đánh giá từ góc nhìn tươi mới — giống peer review của con người.`,
  takeaway: `Để bắt điểm mù tự review, dùng instance độc lập thứ hai không thấy lập luận của bộ sinh — tự phê bình, thêm thinking, hay thêm ngữ cảnh đều không vượt qua được confirmation bias trong cùng ngữ cảnh.`,
  terms: [
    ["independent Claude instance", "một phiên Claude độc lập, ngữ cảnh riêng"],
    ["confirmation bias", "thiên kiến xác nhận, xu hướng bảo vệ kết luận của chính mình"],
    ["self-review blind spot", "điểm mù khi tự review công việc mình"],
    ["peer review", "review chéo bởi người/tác nhân khác"],
    ["extended thinking mode", "chế độ suy nghĩ mở rộng, cho thêm thời gian cân nhắc"],
  ] },

{ id: "cca1-054", n: 54, set: 1, scenario: 5, domain: 4, task: "4.1",
  topic: "Classification Consistency", difficulty: "medium", type: "mc", ans: [0],
  q: `Your automated code review system shows inconsistent severity ratings—similar issues like null pointer risks receive "critical" severity in some PRs but only "medium" in others. Developer trust is declining because teams can't predict which findings require immediate attention. What's the most effective way to improve severity consistency?`,
  opts: [
    `Include explicit severity criteria in your prompt with concrete code examples for each severity level`,
    `Add a CLAUDE.md file that lists issue types and their default severities, instructing Claude to reference this mapping when assigning ratings`,
    `Request that Claude include its reasoning for each severity assignment, then use that reasoning to manually calibrate and adjust ratings during review`,
    `Modify the prompt to ask Claude to rate severity relative to other issues in the same PR, so the most severe issue is always marked critical and others rated proportionally`,
  ],
  q_vi: `Hệ thống code review tự động của bạn cho thấy mức severity bất nhất — các vấn đề tương tự như rủi ro null pointer nhận severity "critical" ở một số PR nhưng chỉ "medium" ở PR khác. Niềm tin của developer đang suy giảm vì các đội không thể đoán trước finding nào cần xử lý ngay lập tức. Đâu là cách hiệu quả nhất để cải thiện tính nhất quán của severity?`,
  opts_vi: [
    `Đưa tiêu chí severity tường minh vào prompt kèm ví dụ code cụ thể cho từng mức severity`,
    `Thêm một file CLAUDE.md liệt kê các loại vấn đề và severity mặc định tương ứng, hướng dẫn Claude tham chiếu ánh xạ này khi gán rating`,
    `Yêu cầu Claude kèm lập luận cho mỗi lần gán severity, rồi dùng lập luận đó để thủ công hiệu chỉnh và điều chỉnh rating trong lúc review`,
    `Sửa prompt để yêu cầu Claude chấm severity tương đối so với các vấn đề khác trong cùng PR, sao cho vấn đề nghiêm trọng nhất luôn được đánh critical và các vấn đề còn lại được chấm theo tỷ lệ`,
  ],
  why: [
    `Đưa tiêu chí severity tường minh kèm ví dụ code cụ thể giải quyết trực tiếp nguyên nhân gốc của bất nhất bằng cách loại bỏ mơ hồ về ý nghĩa của mỗi mức. Đây là kỹ thuật prompt engineering đã được chứng minh, cho mô hình điểm tham chiếu rõ ràng để phân loại, dẫn đến gán severity đáng tin và dễ đoán hơn.`,
    `Một ánh xạ tĩnh loại-vấn-đề-sang-severity làm mất ngữ cảnh quan trọng, vì cùng loại vấn đề (vd null pointer risk) có thể đáng severity khác nhau tùy code path, mức phơi bày, hay tính trọng yếu của thành phần. Cách cứng nhắc này đơn giản hóa quá mức và có thể dẫn đến đánh giá sai.`,
    `Yêu cầu lập luận rồi thủ công hiệu chỉnh lại rating đẩy gánh nặng sang người review, đánh bại mục đích của review tự động và không scale được. Dù minh bạch lập luận có giá trị, nó không trực tiếp giải quyết vấn đề nhất quán trong chính hệ thống tự động.`,
    `Chấm severity tương đối so với các vấn đề khác trong cùng PR nghĩa là một vấn đề nhỏ duy nhất sẽ bị đánh 'critical' nếu là phát hiện duy nhất, còn vấn đề thực sự critical có thể bị hạ cấp nếu có nhiều vấn đề nghiêm trọng. Cách tương đối này gây càng nhiều bất nhất hơn.`,
  ],
  concept: `Nguyên nhân bất nhất là sự mơ hồ trong cách hiểu mỗi mức severity. Tiêu chí severity tường minh kèm ví dụ code cụ thể cho từng mức loại bỏ mơ hồ — một kỹ thuật prompt engineering đã được kiểm chứng để cải thiện độ tin cậy phân loại.`,
  takeaway: `Để phân loại nhất quán, định nghĩa tiêu chí tuyệt đối tường minh kèm ví dụ cụ thể — đừng dùng ánh xạ cứng (mất ngữ cảnh), hiệu chỉnh thủ công (không scale), hay chấm tương đối (gây bất nhất).`,
  terms: [
    ["severity rating", "mức độ nghiêm trọng được gán cho finding"],
    ["explicit criteria", "tiêu chí tường minh, rõ ràng"],
    ["concrete code examples", "ví dụ code cụ thể minh họa từng mức"],
    ["prompt engineering", "kỹ thuật thiết kế prompt"],
    ["absolute vs relative rating", "chấm theo chuẩn tuyệt đối thay vì so sánh tương đối"],
  ] },

{ id: "cca1-055", n: 55, set: 1, scenario: 5, domain: 4, task: "4.3",
  topic: "Structured Output", difficulty: "medium", type: "mc", ans: [1],
  q: `Your CI pipeline runs the Claude Code CLI (with --print mode) using CLAUDE.md to provide project context for code reviews, and developers generally find the reviews insightful. However, they report that integrating findings into your workflow is difficult—Claude produces narrative paragraphs that must be manually copied into PR comments. Your team wants to automatically post each finding as a separate inline PR comment at the relevant code location, which requires structured data with file path, line number, severity, and suggested fix. What's the most effective approach?`,
  opts: [
    `Add a "Review Output Format" section to CLAUDE.md with examples showing structured findings, so Claude learns the expected format from project context.`,
    `Use CLI flags --output-format json and --json-schema to enforce structured findings, then parse output to post inline comments via the GitHub API.`,
    `Include explicit formatting instructions in your review prompt requiring each finding to follow a parseable template like [FILE:path] [LINE:n] [SEVERITY:level] ...`,
    `Keep the narrative review format but add a summarization step that uses Claude to generate a structured JSON summary of the findings.`,
  ],
  q_vi: `Pipeline CI của bạn chạy Claude Code CLI (ở chế độ --print) dùng CLAUDE.md để cung cấp ngữ cảnh dự án cho code review, và nhìn chung developer thấy các review này sâu sắc, hữu ích. Tuy nhiên, họ báo cáo rằng việc tích hợp finding vào workflow rất khó khăn — Claude sinh ra các đoạn văn tường thuật (narrative) phải copy thủ công vào PR comment. Đội của bạn muốn tự động đăng mỗi finding thành một inline PR comment riêng biệt tại đúng vị trí code liên quan, việc này đòi hỏi dữ liệu có cấu trúc gồm file path, line number, severity, và đề xuất sửa. Đâu là cách tiếp cận hiệu quả nhất?`,
  opts_vi: [
    `Thêm một mục "Review Output Format" vào CLAUDE.md kèm ví dụ minh họa finding có cấu trúc, để Claude học định dạng mong muốn từ ngữ cảnh dự án.`,
    `Dùng các cờ CLI --output-format json và --json-schema để cưỡng chế finding có cấu trúc, sau đó parse đầu ra để đăng inline comment qua GitHub API.`,
    `Đưa hướng dẫn định dạng tường minh vào prompt review, yêu cầu mỗi finding tuân theo một template parse được như [FILE:path] [LINE:n] [SEVERITY:level] ...`,
    `Giữ định dạng review narrative nhưng thêm một bước tóm tắt dùng Claude để sinh một bản tóm tắt JSON có cấu trúc của các finding.`,
  ],
  why: [
    `Thêm ví dụ định dạng vào CLAUDE.md dựa vào hướng dẫn định dạng kiểu prompt — thứ LLM tuân theo không nhất quán. Không đáng tin cho pipeline tự động vốn yêu cầu các trường có cấu trúc cụ thể (file path, line number, severity) phải hiện diện và parse được mỗi lần.`,
    `Dùng --output-format json cùng --json-schema cưỡng chế đầu ra có cấu trúc ở cấp CLI, đảm bảo JSON đúng định dạng với các trường bắt buộc có thể parse tin cậy và đăng thành inline comment qua GitHub API. Hiệu quả nhất vì tận dụng năng lực CLI gốc được thiết kế chính xác cho việc cưỡng chế đầu ra có cấu trúc.`,
    `Đưa hướng dẫn định dạng tường minh vào prompt để sinh template parse được là cách prompt-engineering mà LLM có thể tuân theo không nhất quán, đôi khi lệch khỏi định dạng. Với pipeline cần parse đáng tin để đăng inline comment, cách này mong manh hơn dùng cờ CLI cưỡng chế.`,
    `Thêm một lần gọi LLM thứ hai để tóm tắt narrative thành JSON tạo độ phức tạp không cần thiết, chi phí phụ và một điểm hỏng tiềm tàng nữa. Vấn đề giải quyết trực tiếp và đáng tin hơn bằng cưỡng chế đầu ra có cấu trúc ngay trong lần gọi CLI ban đầu bằng cờ có sẵn.`,
  ],
  concept: `Claude Code CLI hỗ trợ --output-format json cùng --json-schema để cưỡng chế đầu ra có cấu trúc đúng định dạng, đảm bảo JSON hợp lệ có thể parse tin cậy cho tự động hóa — vượt trội so với định dạng dựa trên prompt mà LLM tuân theo không nhất quán.`,
  takeaway: `Khi tự động hóa cần đầu ra parse được tin cậy, cưỡng chế cấu trúc bằng cờ CLI gốc (--output-format json + --json-schema) thay vì dựa vào prompt hay thêm lần gọi LLM.`,
  terms: [
    ["structured output", "đầu ra có cấu trúc, dạng máy đọc được"],
    ["--output-format json", "cờ CLI yêu cầu đầu ra JSON"],
    ["--json-schema", "cờ cưỡng chế JSON theo schema định nghĩa trước"],
    ["inline PR comment", "comment gắn trực tiếp tại dòng code trong PR"],
    ["GitHub API", "API để đăng comment lên PR tự động"],
  ] },

{ id: "cca1-056", n: 56, set: 1, scenario: 5, domain: 4, task: "4.1",
  topic: "Prompt Specificity", difficulty: "medium", type: "mc", ans: [0],
  q: `Your automated review analyzes comments and docstrings. The current prompt instructs Claude to "check that comments are accurate and up-to-date." Findings frequently flag acceptable patterns (TODO markers, straightforward descriptions) while missing comments that describe behavior the code no longer implements. What change addresses the root cause of this inconsistent analysis?`,
  opts: [
    `Specify explicit criteria: flag comments only when their claimed behavior contradicts actual code behavior`,
    `Add few-shot examples of misleading comments to help the model recognize similar patterns in the codebase`,
    `Filter out TODO, FIXME, and descriptive comment patterns before analysis to reduce noise`,
    `Include git blame data so Claude can identify comments that predate recent code modifications`,
  ],
  q_vi: `Review tự động của bạn phân tích comment và docstring. Prompt hiện tại hướng dẫn Claude "check that comments are accurate and up-to-date" (kiểm tra xem comment có chính xác và cập nhật không). Các finding thường xuyên flag những pattern chấp nhận được (TODO marker, mô tả đơn giản) trong khi lại bỏ sót các comment mô tả hành vi mà code không còn thực thi nữa. Thay đổi nào giải quyết nguyên nhân gốc của phân tích bất nhất này?`,
  opts_vi: [
    `Chỉ rõ tiêu chí tường minh: chỉ flag comment khi hành vi mà nó tuyên bố mâu thuẫn với hành vi thực tế của code`,
    `Thêm few-shot example về các comment gây hiểu lầm để giúp mô hình nhận diện pattern tương tự trong codebase`,
    `Lọc bỏ các pattern comment TODO, FIXME và mô tả trước khi phân tích để giảm nhiễu`,
    `Đưa dữ liệu git blame vào để Claude có thể xác định các comment có trước những lần sửa code gần đây`,
  ],
  why: [
    `Chỉ rõ tiêu chí tường minh — chỉ flag comment khi hành vi nó tuyên bố mâu thuẫn với hành vi thực tế của code — giải quyết trực tiếp nguyên nhân gốc bằng cách thay hướng dẫn mơ hồ bằng định nghĩa chính xác. Điều này loại bỏ cả false positive trên pattern chấp nhận được lẫn false negative trên comment thực sự gây hiểu lầm.`,
    `Tuy few-shot example về comment gây hiểu lầm có thể giúp nhận diện pattern tương tự, cách này không tổng quát hóa tốt sang các loại mâu thuẫn mới lạ — vì nó dựa vào pattern-matching thay vì định nghĩa tiêu chí nền tảng mà mô hình cần áp dụng.`,
    `Lọc bỏ TODO, FIXME và comment mô tả trước khi phân tích chỉ xử lý một triệu chứng (false positive) trong khi hoàn toàn bỏ qua vấn đề false negative là bỏ sót các comment mô tả hành vi mà code không còn thực thi nữa.`,
    `Đưa dữ liệu git blame cung cấp ngữ cảnh thời gian, nhưng tuổi comment một mình không quyết định độ chính xác — comment cũ vẫn có thể đúng và comment mới vẫn có thể sai — nên cách này không định nghĩa được điều gì thực sự nên bị flag.`,
  ],
  concept: `Nguyên nhân gốc là cụm 'accurate and up-to-date' thiếu định nghĩa thế nào là vấn đề. Tiêu chí tường minh — chỉ flag khi hành vi mà comment tuyên bố mâu thuẫn với hành vi thực tế của code — định nghĩa rõ mục tiêu cần bắt.`,
  takeaway: `Khi prompt mơ hồ ('accurate and up-to-date'), hãy định nghĩa tiêu chí ngữ nghĩa tường minh (mâu thuẫn comment vs hành vi code) — đây mới là gốc, không phải few-shot, lọc, hay dữ liệu thời gian.`,
  terms: [
    ["explicit criteria", "tiêu chí tường minh thay cho hướng dẫn mơ hồ"],
    ["false positive", "báo động giả (flag cái không phải vấn đề)"],
    ["false negative", "bỏ sót (không flag cái thực sự là vấn đề)"],
    ["few-shot examples", "vài ví dụ mẫu trong prompt; dựa vào pattern-matching"],
    ["semantic contradiction", "mâu thuẫn về ngữ nghĩa giữa comment và code"],
  ] },

{ id: "cca1-057", n: 57, set: 1, scenario: 5, domain: 4, task: "4.5",
  topic: "Batch Processing", difficulty: "easy", type: "mc", ans: [1],
  q: `Your CI pipeline includes two Claude-powered code review modes: a pre-merge-commit hook that blocks PR merging until complete, and "deep analysis" that runs overnight, polls for batch completion, then posts detailed suggestions to the PR. You want to reduce API costs using the Message Batches API, which offers 50% cost savings but requires polling and may take up to 24 hours to complete. Which mode should use batch processing?`,
  opts: [
    `Pre-merge-commit hook only`,
    `Deep analysis only`,
    `Both modes`,
    `Neither mode`,
  ],
  q_vi: `Pipeline CI của bạn có hai chế độ code review chạy bằng Claude: một pre-merge-commit hook chặn việc merge PR cho đến khi hoàn tất, và "deep analysis" chạy qua đêm, poll để kiểm tra batch hoàn tất, rồi đăng các đề xuất chi tiết lên PR. Bạn muốn giảm chi phí API bằng cách dùng Message Batches API, thứ mang lại mức tiết kiệm 50% chi phí nhưng đòi hỏi polling và có thể mất tới 24 giờ để hoàn tất. Chế độ nào nên dùng batch processing?`,
  opts_vi: [
    `Chỉ pre-merge-commit hook`,
    `Chỉ deep analysis`,
    `Cả hai chế độ`,
    `Không chế độ nào`,
  ],
  why: [
    `Dùng batch cho pre-merge-commit hook không phù hợp vì nó chặn merge PR và yêu cầu hoàn thành kịp thời, không tương thích với độ trễ tới 24 giờ và việc thiếu cam kết thời gian của batch. Gây trễ không chấp nhận được trong quy trình phát triển.`,
    `Deep analysis là ứng viên lý tưởng cho batch vì nó vốn đã chạy qua đêm, chịu được độ trễ, và dùng mô hình polling để kiểm tra hoàn thành trước khi đăng kết quả — khớp hoàn hảo với thiết kế bất đồng bộ, dựa trên poll của batch đồng thời nắm 50% tiết kiệm chi phí.`,
    `Áp batch cho cả hai sẽ phá workflow pre-merge-commit hook, vì nó cần kết quả gần như tức thì để gỡ chặn merge, mà batch không thể đảm bảo hoàn thành kịp thời. Dù deep analysis hưởng lợi, bản chất blocking của pre-merge hook khiến nó không tương thích.`,
    `Tránh batch hoàn toàn lãng phí cơ hội tiết kiệm 50% chi phí cho khối lượng deep analysis — vốn chịu được độ trễ và đã thiết kế quanh mẫu polling bất đồng bộ, ăn khớp hoàn hảo với batch.`,
  ],
  concept: `Deep analysis chạy qua đêm, không cần kết quả tức thì, nên hợp với độ trễ tới 24 giờ của batch để đổi lấy 50% tiết kiệm. Message Batches API hoạt động bất đồng bộ: gửi request, poll trạng thái, rồi lấy kết quả từ file JSONL — không có callback — khớp hoàn hảo với job qua đêm.`,
  takeaway: `Chỉ tác vụ qua đêm chịu được độ trễ (deep analysis) mới nên dùng batch; tác vụ blocking merge (pre-merge hook) phải dùng synchronous vì batch không cam kết thời gian.`,
  terms: [
    ["pre-merge-commit hook", "hook chặn merge PR đến khi review xong"],
    ["deep analysis", "phân tích sâu chạy qua đêm, chịu được trễ"],
    ["polling", "hỏi định kỳ trạng thái batch để biết đã xong chưa"],
    ["JSONL", "định dạng file kết quả batch (mỗi dòng một JSON)"],

{ id: "cca1-058", n: 58, set: 1, scenario: 5, domain: 4, task: "4.1",
  topic: "False Positive Reduction", difficulty: "medium", type: "mc", ans: [0],
  q: `Analysis of your automated code review shows significant variation in false positive rates across finding categories. Security and correctness findings have an 8% false positive rate, performance findings have 18%, style and naming findings have 52%, and documentation findings have 48%. Developer surveys indicate growing distrust—many have started dismissing findings without review because "half are wrong." The high false positive categories are undermining confidence in the accurate categories. What approach best restores developer trust while improving the system?`,
  opts: [
    `Temporarily disable high false positive categories (style, naming, documentation) and run only high-precision categories while improving prompts.`,
    `Apply a uniform strictness reduction across all categories to bring the overall false positive rate to an acceptable level.`,
    `Keep all categories but display a confidence score with each finding, letting developers decide which to investigate.`,
    `Keep all categories enabled while adding few-shot examples to improve each category's accuracy over the coming weeks.`,
  ],
  q_vi: `Phân tích code review tự động của bạn cho thấy tỷ lệ false positive dao động đáng kể giữa các category finding. Finding về security và correctness có tỷ lệ false positive 8%, finding về performance là 18%, finding về style và naming là 52%, và finding về documentation là 48%. Khảo sát developer cho thấy niềm tin đang suy giảm dần — nhiều người đã bắt đầu bỏ qua finding mà không xem xét vì "một nửa là sai." Các category có tỷ lệ false positive cao đang làm xói mòn niềm tin vào cả các category chính xác. Cách tiếp cận nào khôi phục niềm tin của developer tốt nhất trong khi vẫn cải thiện hệ thống?`,
  opts_vi: [
    `Tạm thời tắt các category có tỷ lệ false positive cao (style, naming, documentation) và chỉ chạy các category có độ chính xác cao trong lúc cải thiện prompt.`,
    `Áp dụng một mức giảm độ nghiêm ngặt đồng đều trên mọi category để đưa tỷ lệ false positive tổng thể về mức chấp nhận được.`,
    `Giữ tất cả category nhưng hiển thị một confidence score cùng mỗi finding, để developer tự quyết định cái nào cần điều tra.`,
    `Giữ tất cả category được bật trong khi thêm few-shot example để cải thiện độ chính xác của từng category trong các tuần tới.`,
  ],
  why: [
    `Tạm thời tắt các category có false positive cao (style, naming, documentation) lập tức ngăn xói mòn niềm tin bằng cách loại bỏ nhiễu khiến developer bỏ qua mọi finding, đồng thời bảo toàn giá trị của các category độ chính xác cao như security và correctness. Cho thời gian cải thiện prompt trước khi bật lại, xây dựng lại niềm tin qua độ chính xác đã chứng minh.`,
    `Áp giảm độ nghiêm ngặt đồng đều trên mọi category sẽ làm suy giảm các category vốn đã chính xác (như security 8% false positive) để bù cho category hỏng — hy sinh giá trị thực mà không thực sự giải quyết được vấn đề niềm tin ở bất kỳ category nào.`,
    `Hiển thị confidence score đẩy gánh nặng đánh giá sang developer mà không thực sự giảm nhiễu, và những developer đã mất niềm tin vào hệ thống cũng khó tin vào điểm tin cậy tự báo của chính nó.`,
    `Dù cải thiện prompt bằng few-shot giải quyết nguyên nhân gốc, việc giữ tất cả category bật trong suốt quá trình kéo dài hàng tuần cho phép niềm tin tiếp tục xói mòn khi developer vẫn gặp tỷ lệ false positive ~50% — vốn đã khiến họ bỏ qua finding mà không xem.`,
  ],
  concept: `Tạm tắt các category có false positive cao (style, naming, documentation) lập tức chặn xói mòn niềm tin trong khi vẫn giữ giá trị của các category chính xác (security, correctness). Một công cụ cho 50% lời khuyên sai còn tệ hơn không có công cụ.`,
  takeaway: `Khi nhiễu từ category xấu phá niềm tin vào category tốt, hãy lập tức tắt category xấu (giữ category chính xác) — đừng giảm đồng đều, đẩy gánh nặng cho dev, hay chờ cải thiện dần trong khi niềm tin tiếp tục mất.`,
  terms: [
    ["false positive rate", "tỷ lệ báo động giả của một category"],
    ["high-precision categories", "category độ chính xác cao (security, correctness)"],
    ["trust erosion", "sự xói mòn niềm tin của developer"],
    ["uniform strictness reduction", "giảm độ nghiêm ngặt đồng đều (gây hại category tốt)"],
    ["confidence score", "điểm tin cậy tự báo của hệ thống"],
  ] },

{ id: "cca1-059", n: 59, set: 1, scenario: 5, domain: 4, task: "4.2",
  topic: "Few-Shot Prompting", difficulty: "medium", type: "mc", ans: [1],
  q: `Your automated reviews identify valid issues but developers report the feedback isn't actionable. Findings say things like "complex ticket allocation logic" or "potential null pointer" without specifying what to change. When you add detailed instructions like "always include specific fix suggestions," the model still produces inconsistent output—sometimes detailed, sometimes vague. What prompting technique would most reliably produce consistently actionable feedback?`,
  opts: [
    `Further refine the instructions with more explicit requirements for each part of the feedback format (location, issue, severity, suggested fix)`,
    `Add 3-4 few-shot examples showing the exact format you want: issue identified, code location, specific fix suggestion`,
    `Implement a two-pass approach where one prompt identifies issues and a second prompt generates fixes, allowing specialization`,
    `Expand the context window to include more of the surrounding codebase so the model has sufficient information to suggest specific fixes`,
  ],
  q_vi: `Review tự động của bạn xác định đúng các vấn đề thật sự nhưng developer báo cáo rằng phản hồi không mang tính hành động (actionable). Các finding viết những câu như "complex ticket allocation logic" hay "potential null pointer" mà không nói rõ cần sửa gì. Khi bạn thêm hướng dẫn chi tiết như "always include specific fix suggestions" (luôn kèm đề xuất sửa cụ thể), mô hình vẫn cho đầu ra bất nhất — đôi khi chi tiết, đôi khi mơ hồ. Kỹ thuật prompting nào sẽ đáng tin cậy nhất để tạo ra phản hồi actionable một cách nhất quán?`,
  opts_vi: [
    `Tinh chỉnh thêm hướng dẫn với các yêu cầu tường minh hơn cho từng phần của định dạng phản hồi (vị trí, vấn đề, severity, đề xuất sửa)`,
    `Thêm 3-4 few-shot example thể hiện đúng định dạng bạn muốn: vấn đề được xác định, vị trí code, đề xuất sửa cụ thể`,
    `Triển khai cách two-pass, trong đó một prompt xác định vấn đề và một prompt thứ hai sinh cách sửa, cho phép mỗi prompt chuyên môn hóa`,
    `Mở rộng context window để bao gồm nhiều hơn phần codebase xung quanh, giúp mô hình có đủ thông tin để đề xuất cách sửa cụ thể`,
  ],
  why: [
    `Đề bài đã mô tả việc thêm hướng dẫn chi tiết nhưng thất bại trong việc tạo đầu ra nhất quán, nên tinh chỉnh thêm hướng dẫn chỉ lặp lại cùng cách làm thất bại. Yêu cầu tường minh hơn vẫn chỉ là hướng dẫn trừu tượng — thứ mô hình tuân theo kém tin cậy hơn ví dụ cụ thể.`,
    `Few-shot example là kỹ thuật hiệu quả nhất để đạt định dạng đầu ra nhất quán khi hướng dẫn đơn thuần cho kết quả thất thường. Cung cấp 3-4 ví dụ thể hiện đúng định dạng mong muốn (vấn đề, vị trí, cách sửa cụ thể) cho mô hình một pattern cụ thể để noi theo — đáng tin hơn hướng dẫn trừu tượng.`,
    `Cách two-pass thêm độ phức tạp kiến trúc mà không trực tiếp giải quyết vấn đề cốt lõi là định dạng đầu ra không nhất quán. Dù chuyên môn hóa có thể hữu ích, nó không giải quyết vì sao mô hình đôi khi cho phản hồi mơ hồ thay vì đề xuất actionable.`,
    `Mở rộng context window chẩn đoán sai vấn đề — mô hình đã đôi khi tạo ra phản hồi chi tiết, actionable với ngữ cảnh hiện tại, cho thấy thiếu thông tin không phải nguyên nhân gốc. Vấn đề thực sự là bất nhất về định dạng, thứ mà thêm ngữ cảnh không giải quyết.`,
  ],
  concept: `Few-shot example là kỹ thuật hiệu quả nhất để đạt định dạng đầu ra nhất quán khi hướng dẫn đơn thuần cho kết quả thất thường. Đề bài đã cho thấy việc tinh chỉnh hướng dẫn thất bại; ví dụ cụ thể cho mô hình một pattern rõ ràng để noi theo.`,
  takeaway: `Khi hướng dẫn trừu tượng cho định dạng thất thường, dùng few-shot example để cho mô hình một pattern cụ thể noi theo — đáng tin hơn việc tinh chỉnh hướng dẫn, thêm pass, hay thêm ngữ cảnh.`,
  terms: [
    ["actionable feedback", "phản hồi mang tính hành động, nói rõ cần sửa gì"],
    ["few-shot examples", "vài ví dụ mẫu thể hiện đúng định dạng mong muốn"],
    ["abstract instructions", "hướng dẫn trừu tượng (mô hình tuân theo kém tin cậy)"],
    ["format inconsistency", "bất nhất về định dạng đầu ra"],
    ["two-pass approach", "cách hai lượt (xác định vấn đề / sinh cách sửa riêng)"],
  ] },

{ id: "cca1-060", n: 60, set: 1, scenario: 5, domain: 4, task: "4.1",
  topic: "False Positive Reduction", difficulty: "hard", type: "mc", ans: [1],
  q: `Your automated code review averages 15 findings per pull request, with developers reporting a 40% false positive rate. The bottleneck is investigation time: developers must click into each finding to read Claude's reasoning before deciding whether to address or dismiss it. Your CLAUDE.md already contains comprehensive rules for acceptable patterns, and stakeholders have rejected any approach that filters findings before developer review. What change would best address the investigation time bottleneck?`,
  opts: [
    `Configure Claude to only surface findings it assesses as high confidence, filtering out uncertain flags before developers see them`,
    `Require Claude to include its reasoning and confidence assessment inline with each finding`,
    `Add a post-processor that analyzes finding patterns and automatically suppresses those matching historical false positive signatures`,
    `Categorize findings as "blocking issues" versus "suggestions" with tiered review requirements`,
  ],
  q_vi: `Code review tự động của bạn trung bình sinh ra 15 finding trên mỗi pull request, với tỷ lệ false positive mà developer báo cáo là 40%. Nút thắt nằm ở thời gian điều tra: developer phải click vào từng finding để đọc lập luận của Claude trước khi quyết định xử lý hay bỏ qua. CLAUDE.md của bạn đã có sẵn các quy tắc toàn diện cho các pattern chấp nhận được, và các stakeholder đã từ chối bất kỳ cách tiếp cận nào lọc bớt finding trước khi developer review. Thay đổi nào sẽ giải quyết tốt nhất nút thắt thời gian điều tra này?`,
  opts_vi: [
    `Cấu hình Claude chỉ hiển thị các finding mà nó đánh giá là độ tin cậy cao, lọc bỏ các flag không chắc chắn trước khi developer thấy chúng`,
    `Yêu cầu Claude kèm lập luận và đánh giá độ tin cậy hiển thị ngay inline cùng mỗi finding`,
    `Thêm một post-processor phân tích pattern của finding và tự động ức chế các finding khớp với 'chữ ký' false positive lịch sử`,
    `Phân loại finding thành "blocking issues" và "suggestions" với các yêu cầu review theo tầng`,
  ],
  why: [
    `Lọc bỏ các finding độ tin cậy thấp trước khi developer thấy vi phạm trực tiếp ràng buộc của stakeholder rằng không được lọc finding trước khi developer review. Cách này giảm số lượng finding nhưng bị cấm tường minh bởi yêu cầu đã nêu.`,
    `Đưa lập luận và đánh giá độ tin cậy hiển thị inline cùng mỗi finding giải quyết trực tiếp nút thắt thời gian điều tra, cho phép developer đánh giá nhanh mà không phải click vào từng cái riêng lẻ. Cách này tôn trọng ràng buộc không lọc, vì mọi finding vẫn hiển thị trong khi làm cho việc triage nhanh hơn đáng kể.`,
    `Tự động ức chế các finding khớp với 'chữ ký' false positive lịch sử là một dạng lọc trước khi developer review nữa — thứ stakeholder đã từ chối tường minh. Dù dùng pattern matching dựa trên dữ liệu, nó vẫn gỡ finding khỏi tầm nhìn của developer.`,
    `Phân loại finding thành các tầng (blocking vs suggestion) tổ chức lại workflow nhưng không giảm vấn đề cốt lõi là thời gian điều tra, vì developer vẫn phải click vào từng finding để hiểu lập luận trước khi quyết định. Thêm cấu trúc mà không chạm tới nguyên nhân gốc của nút thắt.`,
  ],
  concept: `Đưa lập luận và đánh giá độ tin cậy hiển thị trực tiếp (inline) cùng mỗi finding giải quyết đúng nút thắt (thời gian điều tra do phải click vào từng finding), đồng thời tôn trọng ràng buộc không được lọc finding trước khi developer review.`,
  takeaway: `Khi nút thắt là thời gian điều tra và bị cấm lọc finding, hãy đưa lập luận + độ tin cậy inline để triage nhanh ngay tại chỗ — mọi phương án lọc/ức chế đều vi phạm ràng buộc, còn phân tầng không giảm thời gian click.`,
  terms: [
    ["investigation time bottleneck", "nút thắt thời gian điều tra từng finding"],
    ["inline reasoning", "lập luận hiển thị ngay cạnh finding, không phải click vào"],
    ["confidence assessment", "đánh giá độ tin cậy của finding"],
    ["triage", "phân loại nhanh để quyết định xử lý hay bỏ"],
    ["stakeholder constraint", "ràng buộc từ bên liên quan (cấm lọc trước review)"],
  ] },

);

  ],
  why: [
    `Đặt phone_number và tax_id là optional (nullable) cho phép mô hình trả null khi thông tin không có, thay vì bịa giá trị để thỏa trường required. Đây là cách sửa gốc: chính ràng buộc 'required' đang ép mô hình fabricate.`,
    `Giữ required và thêm 'đừng bịa' tạo mâu thuẫn: schema buộc phải có giá trị nhưng prompt cấm bịa. Mô hình vẫn có xu hướng thỏa ràng buộc cấu trúc bằng cách điền giá trị trông hợp lý.`,
    `Giảm temperature không gỡ được mâu thuẫn cấu trúc — trường required vẫn đòi giá trị. Nhiệt độ thấp có thể khiến giá trị bịa 'nhất quán' hơn chứ không loại bỏ việc bịa.`,
    `Tách thành hai lời gọi làm phức tạp pipeline mà không giải quyết vấn đề gốc: nếu trường vẫn required trong lời gọi thứ hai, mô hình vẫn bịa. Vấn đề là tính required, không phải số lời gọi.`,
  ],
  concept: `Khi tài liệu nguồn có thể KHÔNG chứa một thông tin, hãy thiết kế trường đó là optional (nullable). Ép trường required buộc mô hình 'bịa' giá trị để thỏa schema. Cho phép null loại bỏ áp lực bịa đặt.`,
  takeaway: `Trường mà nguồn có thể không chứa → thiết kế optional/nullable để mô hình trả null thay vì bịa. Ép required chính là nguyên nhân gây fabrication.`,
  terms: [
    ["nullable/optional field", "trường cho phép null khi nguồn không có dữ liệu"],
    ["required field", "trường bắt buộc — ép mô hình bịa nếu nguồn thiếu"],
    ["fabrication/hallucination", "bịa giá trị trông hợp lý để thỏa schema"],
    ["schema design", "thiết kế lược đồ phản ánh đúng thực tế dữ liệu"],
  ] },

{ id: "cca1-078", n: 78, set: 1, scenario: 6, domain: 4, task: "4.4",
  topic: "Validation", difficulty: "hard", type: "mc", ans: [1],
  q: `After switching to tool_use with a strict JSON schema, your pipeline no longer sees any JSON syntax errors. However, downstream you still find invoices where the extracted line_items don't sum to the extracted total, and occasionally a value lands in the wrong field. What's the accurate assessment of the situation?`,
  opts: [
    `The strict schema is misconfigured; a correctly configured schema would also catch the summation and field-placement errors.`,
    `Strict schemas via tool_use eliminate syntax errors but not semantic errors; you need semantic validation (e.g., checking line items sum to total) beyond the schema.`,
    `These are syntax errors that the schema should have caught; enabling strict mode more aggressively will fix them.`,
    `Retrying the extraction with the same schema will resolve the summation and placement issues.`,
  ],
  q_vi: `Sau khi chuyển sang tool_use với JSON schema strict, pipeline của bạn không còn gặp lỗi cú pháp JSON nào nữa. Tuy nhiên, ở downstream bạn vẫn thấy các invoice mà line_items được trích không cộng ra đúng total được trích, và đôi khi một giá trị bị đặt vào nhầm trường. Đánh giá nào chính xác về tình huống này?`,
  opts_vi: [
    `Schema strict đang cấu hình sai; một schema được cấu hình đúng sẽ bắt được cả lỗi tính tổng và lỗi đặt sai trường.`,
    `Schema strict qua tool_use loại bỏ lỗi cú pháp nhưng không loại bỏ lỗi ngữ nghĩa; bạn cần thêm semantic validation (vd kiểm tra line items cộng ra đúng total) ngoài schema.`,
    `Đây là các lỗi cú pháp mà schema lẽ ra phải bắt được; bật strict mode mạnh hơn nữa sẽ khắc phục được.`,
    `Retry lại extraction với cùng schema sẽ giải quyết được vấn đề tính tổng và đặt sai trường.`,
  ],
  why: [
    `Không có cấu hình schema JSON nào bắt được lỗi ngữ nghĩa như 'các dòng phải cộng ra total' — schema kiểm tra kiểu và cấu trúc, không kiểm tra quan hệ số học giữa các giá trị. Đây không phải vấn đề cấu hình sai.`,
    `Schema strict qua tool_use loại bỏ lỗi cú pháp nhưng không ngăn lỗi ngữ nghĩa (line item không cộng ra total, giá trị đặt nhầm trường). Cần lớp validation ngữ nghĩa riêng, vd kiểm tra tổng các dòng khớp total, để bắt các lỗi này ngoài schema.`,
    `Đây KHÔNG phải lỗi cú pháp — JSON hoàn toàn hợp lệ. 'Strict mode mạnh hơn' không thể bắt lỗi ngữ nghĩa vì bản chất schema không xét quan hệ giá trị.`,
    `Retry với cùng schema có thể tình cờ đúng lần này nhưng không phải chiến lược đáng tin cho lỗi ngữ nghĩa; cần kiểm tra ngữ nghĩa tường minh để phát hiện và xử lý một cách hệ thống.`,
  ],
  concept: `Schema strict qua tool_use loại bỏ lỗi CÚ PHÁP (JSON hỏng) nhưng KHÔNG ngăn được lỗi NGỮ NGHĨA (line item không cộng ra total, giá trị vào nhầm trường). Cần thêm validation ngữ nghĩa ngoài schema.`,
  takeaway: `tool_use + strict schema diệt lỗi CÚ PHÁP, không diệt lỗi NGỮ NGHĨA (tổng không khớp, sai trường). Phải thêm validation ngữ nghĩa riêng ngoài schema.`,
  terms: [
    ["syntax error", "lỗi cú pháp JSON — bị tool_use loại bỏ"],
    ["semantic error", "lỗi ngữ nghĩa — giá trị sai quan hệ, sai trường"],
    ["strict schema", "schema cưỡng chế cấu trúc/kiểu, không xét quan hệ giá trị"],
    ["semantic validation", "kiểm tra ngữ nghĩa (vd tổng dòng = total)"],
  ] },

{ id: "cca1-079", n: 79, set: 1, scenario: 6, domain: 4, task: "4.3",
  topic: "Structured Output", difficulty: "medium", type: "mc", ans: [0],
  q: `Your system ingests a stream of documents that could be any of several types (invoice, receipt, purchase order, contract), each with its own extraction schema. You've defined one extraction tool per type. You want to guarantee the model always calls one of the extraction tools (never returns plain conversational text), while letting it choose the right one for each document. Which tool_choice setting fits?`,
  opts: [
    `tool_choice: "any" — forces the model to call a tool but lets it choose which extraction tool matches the document.`,
    `tool_choice: "auto" — lets the model decide whether to call a tool at all.`,
    `tool_choice: {"type": "tool", "name": "extract_invoice"} — forces the invoice tool every time.`,
    `tool_choice: "none" — return text and parse it into the right schema afterward.`,
  ],
  q_vi: `Hệ thống của bạn nhận một luồng tài liệu có thể thuộc nhiều loại khác nhau (invoice, receipt, purchase order, contract), mỗi loại có schema extraction riêng. Bạn đã định nghĩa một extraction tool cho mỗi loại. Bạn muốn đảm bảo mô hình luôn gọi một trong các extraction tool (không bao giờ trả về text hội thoại thuần túy), đồng thời để nó tự chọn tool phù hợp cho từng tài liệu. Cấu hình tool_choice nào phù hợp?`,
  opts_vi: [
    `tool_choice: "any" — buộc mô hình phải gọi một tool nhưng để nó tự chọn extraction tool nào khớp với tài liệu.`,
    `tool_choice: "auto" — để mô hình tự quyết định có gọi tool hay không.`,
    `tool_choice: {"type": "tool", "name": "extract_invoice"} — buộc gọi tool invoice mỗi lần.`,
    `tool_choice: "none" — trả về text rồi parse sau vào đúng schema.`,
  ],
  why: [
    `tool_choice: "any" buộc mô hình phải gọi một công cụ (đảm bảo luôn có đầu ra có cấu trúc, không trả text) trong khi vẫn để nó chọn extraction tool khớp với loại tài liệu. Đúng chính xác cho luồng nhiều loại tài liệu chưa biết trước.`,
    `tool_choice: "auto" cho phép mô hình quyết định có gọi công cụ hay không — nghĩa là nó có thể trả text hội thoại thay vì gọi extraction tool, phá vỡ yêu cầu 'luôn có đầu ra có cấu trúc'.`,
    `Ép cứng extract_invoice mỗi lần sẽ chạy nhầm schema cho receipt/PO/contract. Yêu cầu là để mô hình CHỌN đúng công cụ theo loại tài liệu, không phải cố định một loại.`,
    `tool_choice: "none" trả text rồi parse sau chính là quay lại vấn đề đầu ra không có cấu trúc, dễ lỗi cú pháp — trái với mục tiêu đảm bảo cấu trúc.`,
  ],
  concept: `tool_choice: "any" buộc mô hình PHẢI gọi một công cụ (không trả text hội thoại) nhưng vẫn để nó TỰ CHỌN công cụ nào — đúng khi có nhiều schema và loại tài liệu chưa biết trước.`,
  takeaway: `Nhiều schema + loại tài liệu chưa biết, cần luôn có đầu ra có cấu trúc → tool_choice: "any" (bắt gọi công cụ, để mô hình chọn công cụ đúng). "auto" có thể trả text; ép tên cố định thì sai loại.`,
  terms: [
    ["tool_choice: any", "bắt buộc gọi một công cụ, mô hình tự chọn công cụ nào"],
    ["tool_choice: auto", "mô hình tự quyết có gọi công cụ hay không (có thể trả text)"],
    ["forced tool selection", "ép gọi một công cụ tên cụ thể"],
    ["multi-schema extraction", "trích xuất với nhiều schema theo loại tài liệu"],
  ] },

{ id: "cca1-080", n: 80, set: 1, scenario: 6, domain: 4, task: "4.3",
  topic: "Structured Output", difficulty: "medium", type: "mc", ans: [0],
  q: `Your enrichment pipeline must always extract document metadata (issuer, date, document_id) FIRST, because later enrichment steps depend on those values. You want to guarantee the metadata extraction tool runs before anything else on the first turn. Which approach is correct?`,
  opts: [
    `Force the specific tool with tool_choice: {"type": "tool", "name": "extract_metadata"} on the first turn, then process subsequent steps in follow-up turns.`,
    `Use tool_choice: "any" and hope the model picks extract_metadata first.`,
    `Put "always extract metadata first" in the system prompt and use tool_choice: "auto".`,
    `Define one giant tool that does metadata and enrichment together in a single call.`,
  ],
  q_vi: `Pipeline enrichment của bạn luôn phải trích metadata tài liệu (issuer, date, document_id) TRƯỚC TIÊN, vì các bước enrichment sau đó phụ thuộc vào các giá trị này. Bạn muốn đảm bảo metadata extraction tool chạy trước bất cứ điều gì khác ở lượt đầu tiên. Cách tiếp cận nào đúng?`,
  opts_vi: [
    `Ép công cụ cụ thể bằng tool_choice: {"type": "tool", "name": "extract_metadata"} ở lượt đầu, sau đó xử lý các bước tiếp theo ở các lượt sau.`,
    `Dùng tool_choice: "any" và hy vọng mô hình chọn extract_metadata trước.`,
    `Đưa "luôn trích metadata trước" vào system prompt và dùng tool_choice: "auto".`,
    `Định nghĩa một tool khổng lồ duy nhất làm cả metadata lẫn enrichment trong một lời gọi.`,
  ],
  why: [
    `Ép công cụ cụ thể bằng tool_choice: {"type":"tool","name":"extract_metadata"} ở lượt đầu bảo đảm metadata được trích trước, sau đó các bước enrichment phụ thuộc xử lý ở lượt tiếp. Đây là cách đúng để đảm bảo THỨ TỰ chạy công cụ một cách xác định.`,
    `tool_choice: "any" bắt gọi một công cụ nhưng không đảm bảo đó là extract_metadata — mô hình có thể chọn công cụ khác trước. 'Hy vọng nó chọn đúng' không phải đảm bảo.`,
    `Prompt 'luôn trích metadata trước' + "auto" dựa vào tuân thủ xác suất và cho phép mô hình bỏ gọi công cụ. Không đảm bảo thứ tự xác định cần thiết cho phụ thuộc.`,
    `Gộp metadata và enrichment vào một công cụ khổng lồ đánh mất khả năng đảm bảo metadata xong TRƯỚC khi enrichment dùng nó, và làm schema cồng kềnh khó bảo trì.`,
  ],
  concept: `Khi cần đảm bảo một công cụ CỤ THỂ chạy trước (extract_metadata trước enrichment), dùng forced tool selection tool_choice: {"type":"tool","name":"..."} ở lượt đầu, rồi xử lý các bước sau ở lượt tiếp theo.`,
  takeaway: `Đảm bảo một công cụ cụ thể chạy trước (metadata trước enrichment) → forced tool selection ở lượt đầu, xử lý bước sau ở lượt tiếp. "any" không đảm bảo đúng công cụ; prompt+"auto" chỉ là xác suất.`,
  terms: [
    ["forced tool selection", "ép gọi công cụ tên cụ thể: {type:tool,name:...}"],
    ["extraction ordering", "đảm bảo thứ tự các bước trích xuất"],
    ["enrichment", "bước làm giàu dữ liệu, phụ thuộc metadata"],
    ["follow-up turns", "các lượt tiếp theo để xử lý bước phụ thuộc"],
  ] },

{ id: "cca1-081", n: 81, set: 1, scenario: 6, domain: 4, task: "4.3",
  topic: "Schema Design", difficulty: "medium", type: "mc", ans: [0],
  q: `Your category field is an enum: [electronics, apparel, food, furniture]. In production you hit two recurring problems: some products genuinely belong to categories not in your list, and some documents are too ambiguous to categorize confidently. The model is forced to pick a wrong enum value in both cases. What schema design best handles this?`,
  opts: [
    `Add an "other" enum value paired with a detail string field for novel categories, and an "unclear" value for genuinely ambiguous cases.`,
    `Expand the enum to list every conceivable product category so nothing is ever missing.`,
    `Remove the enum constraint and let category be a free-text string.`,
    `Keep the four values and instruct the model to pick the closest match in the prompt.`,
  ],
  q_vi: `Trường category của bạn là một enum: [electronics, apparel, food, furniture]. Trong production bạn gặp hai vấn đề lặp lại: một số sản phẩm thực sự thuộc về danh mục không có trong danh sách, và một số tài liệu quá mơ hồ để phân loại một cách chắc chắn. Trong cả hai trường hợp, mô hình bị buộc phải chọn một giá trị enum sai. Thiết kế schema nào xử lý điều này tốt nhất?`,
  opts_vi: [
    `Thêm giá trị enum "other" đi kèm trường detail string cho các danh mục mới lạ, và giá trị "unclear" cho các ca thực sự mơ hồ.`,
    `Mở rộng enum để liệt kê mọi danh mục sản phẩm có thể hình dung được, để không bao giờ thiếu.`,
    `Bỏ ràng buộc enum và để category là một chuỗi free-text.`,
    `Giữ nguyên bốn giá trị và chỉ dẫn mô hình chọn giá trị gần đúng nhất trong prompt.`,
  ],
  why: [
    `Thêm "other" kèm trường detail string cho danh mục mới lạ, và "unclear" cho ca mơ hồ, cho mô hình lối thoát trung thực thay vì buộc chọn sai. Đây là mẫu thiết kế enum mở rộng được, vừa giữ tính có cấu trúc vừa xử lý được ca ngoài danh sách và ca không chắc.`,
    `Liệt kê 'mọi danh mục có thể' là bất khả thi và mong manh — luôn có danh mục mới xuất hiện, và enum khổng lồ khó bảo trì. Nó cũng không giải quyết ca mơ hồ (không chắc thuộc loại nào).`,
    `Bỏ enum về free-text mất tính chuẩn hóa, gây phân mảnh giá trị (vd 'food' vs 'Food' vs 'groceries') và phá vỡ tích hợp downstream vốn trông cậy vào tập giá trị cố định.`,
    `Giữ 4 giá trị và bảo 'chọn gần nhất' vẫn ép gán nhãn SAI cho sản phẩm ngoài danh sách và cho ca mơ hồ — đúng vấn đề đang gặp. Nó không tạo được đường thoát trung thực.`,
  ],
  concept: `Enum mở rộng được: thêm giá trị "other" + trường detail string cho danh mục mới lạ, và "unclear" cho ca thực sự mơ hồ. Cách này tránh ép mô hình chọn sai khi giá trị đúng không nằm trong danh sách hoặc khi không đủ chắc.`,
  takeaway: `Enum nên mở rộng được: "other"+detail cho ca mới lạ và "unclear" cho ca mơ hồ — cho mô hình lối thoát trung thực thay vì ép chọn sai. Đừng liệt kê vô tận hay bỏ về free-text.`,
  terms: [
    ["enum field", "trường giá trị rời rạc cố định"],
    ["\"other\" + detail pattern", "giá trị other kèm mô tả tự do cho ca mới"],
    ["\"unclear\" value", "giá trị cho ca thực sự mơ hồ"],
    ["extensible categorization", "phân loại mở rộng được, không ép chọn sai"],
  ] },

{ id: "cca1-082", n: 82, set: 1, scenario: 6, domain: 4, task: "4.4",
  topic: "Retry Loops", difficulty: "medium", type: "mc", ans: [0],
  q: `Your extraction occasionally fails Pydantic validation—e.g., a date comes back as "March 3rd" instead of ISO 8601, or an amount includes a currency symbol. You want a retry strategy that maximizes the chance the model corrects itself. What's the most effective retry design?`,
  opts: [
    `On retry, send a follow-up request that includes the original document, the failed extraction, and the specific validation error(s) so the model can self-correct.`,
    `On retry, resend the exact same prompt unchanged and hope for a better roll.`,
    `On retry, switch to a larger model without providing the error details.`,
    `On retry, strip validation entirely so the extraction always "passes."`,
  ],
  q_vi: `Extraction của bạn thỉnh thoảng không qua được Pydantic validation — ví dụ một ngày tháng trả về là "March 3rd" thay vì ISO 8601, hoặc một khoản tiền có kèm ký hiệu tiền tệ. Bạn muốn một chiến lược retry tối đa hóa khả năng mô hình tự sửa. Thiết kế retry nào hiệu quả nhất?`,
  opts_vi: [
    `Khi retry, gửi một request tiếp theo kèm tài liệu gốc, bản trích xuất thất bại, và (các) lỗi validation cụ thể để mô hình có thể tự sửa.`,
    `Khi retry, gửi lại đúng nguyên prompt không đổi và hy vọng lần này may mắn hơn.`,
    `Khi retry, chuyển sang một mô hình lớn hơn mà không cung cấp chi tiết lỗi.`,
    `Khi retry, bỏ hẳn validation để extraction luôn luôn "pass."`,
  ],
  why: [
    `Gửi lại kèm tài liệu gốc, bản trích thất bại và lỗi validation cụ thể cho phép mô hình tự sửa đúng chỗ (vd định dạng lại ngày sang ISO 8601, bỏ ký hiệu tiền tệ). Cung cấp lỗi cụ thể là yếu tố quyết định để retry hiệu quả thay vì đoán mù.`,
    `Gửi lại y hệt prompt không kèm phản hồi lỗi chỉ trông chờ may rủi — mô hình không biết nó đã sai gì nên khả năng lặp lại cùng lỗi cao. Retry cần tín hiệu sửa lỗi.`,
    `Đổi sang mô hình lớn hơn mà không đưa chi tiết lỗi bỏ lỡ tín hiệu quan trọng nhất; ngay cả mô hình mạnh cũng cần biết lỗi cụ thể để định dạng lại đúng. Đây là lỗi định dạng, không phải thiếu năng lực.`,
    `Bỏ validation để 'luôn pass' che giấu vấn đề và đẩy dữ liệu bẩn (ngày sai định dạng, số kèm ký hiệu) xuống downstream — phá vỡ chính mục tiêu độ chính xác.`,
  ],
  concept: `Retry-with-error-feedback: khi validation thất bại, gửi lời gọi tiếp theo kèm TÀI LIỆU GỐC + BẢN TRÍCH LỖI + LỖI VALIDATION CỤ THỂ, để mô hình tự sửa. Đưa lỗi cụ thể vào là chìa khóa dẫn mô hình tới đúng chỗ cần chỉnh.`,
  takeaway: `Retry hiệu quả = gửi lại kèm tài liệu gốc + bản trích lỗi + lỗi validation cụ thể để mô hình tự sửa. Gửi lại y hệt hay bỏ validation đều không dẫn tới sửa đúng.`,
  terms: [

    ["ISO 8601", "chuẩn định dạng ngày giờ"],
