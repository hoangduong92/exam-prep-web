<script>
(function () {
  var D = JSON.parse(document.getElementById("lockdata").textContent);
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var toB64 = function (u8) { var s = ""; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); };
  var f = document.getElementById("f"), pw = document.getElementById("pw"), go = document.getElementById("go"), msg = document.getElementById("msg");
  function store(k) { try { if (k) localStorage.setItem("aws-lock-key", k); else localStorage.removeItem("aws-lock-key"); } catch (e) {} }
  function stored() { try { return localStorage.getItem("aws-lock-key"); } catch (e) { return null; } }
  async function open(raw) {
    var key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.iv) }, key, b64(D.ct));
    var html = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open(); document.write(html); document.close();
  }
  async function derive(password) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode("exam-prep-web/aws-lock/v1"), iterations: 310000 }, base, 256);
    return new Uint8Array(bits);
  }
  f.addEventListener("submit", async function (e) {
    e.preventDefault();
    go.disabled = true; msg.textContent = ""; go.textContent = "Đang mở…";
    try { var raw = await derive(pw.value); await open(raw); store(toB64(raw)); }
    catch (err) { go.disabled = false; go.textContent = "Mở khoá"; msg.textContent = "Sai mật khẩu. Thử lại."; pw.select(); }
  });
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    f.hidden = false; go.disabled = true; msg.textContent = "Trình duyệt này quá cũ để mở trang. Hãy cập nhật iOS/trình duyệt.";
    return;
  }
  var k = stored();
  if (k) open(b64(k)).catch(function () { store(null); f.hidden = false; });
  else f.hidden = false;
})();
</script>
